<div id="Log4NetViewer" class="Log4NetViewer" style="height: 100%;">
    <img src="cl.gif" alt="" onload="onLog4NetViewerLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="buttonsContainer">
            <div class="topButton label" id="logfileLbl" style="float: left; margin: 0px 5px; position: relative; top: 12px;"></div>
            <div class="topButton" id="logfileCombo" style="float: left; margin: 5px 2.5px;"></div>
            <div class="topButton" id="btnRefresh" style="float:left;margin: 5px 2.5px;"></div>
            <div class="topButton" id="btnAdd" style="float:left;margin: 5px 2.5px;"></div>
            <div class="topButton label" id="logfilterLbl" style="float: left; margin: 0px 5px; position: relative; top: 12px;"></div>
            <div class="topButton" id="logfilterCombo" style="width: 120px; float: left; margin: 5px 2.5px;"></div>
            <div class="topButton" id="bestfitbtn" style="float:left;margin: 5px 2.5px;"></div>
            <div class="topButton" id="selectLastBtn" style="float:left; margin: 5px 2.5px;"></div>
            <div class="topButton" id="selectFirstBtn" style="float:left; margin: 5px 2.5px;"></div>
            <div class="topButton" id="selectAllBtn" style="float:left; margin: 5px 2.5px;"></div>
            <div class="topButton" id="copySelectedBtn" style="float:left; margin: 5px 2.5px;"></div>
        </div>

        <div id="noDataDiv" style='display:none; position: absolute; top: 50%; left: 50%; z-index: 999; transform: translateX(-50%); font-size: 2em; opacity: 0.8;'></div>
        <div id="maingrid">

        </div>

    <script>
        function onLog4NetViewerLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var deregisterListenerActiveLanguage;
            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (deregisterListener)
                    deregisterListener();
            });

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");
            var mainContainer = thisPage.find("#mainContainer");
            var fileComboDiv = thisPage.find("#logfileCombo");
            var scrollingOptions = {
                mode: webKitRenderCorrection ? "standard" : "virtual"
            };

            var parameters = JSON.parse(paratt);

            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
            if (scope.biOS || (isMobile.Android() && parameters.bFitInWindow)) {
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }

            var customFonts = [parameters.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            if (parameters.Background)
                thisPage.css("background", parameters.Background.Color);
            var container = thisPage.find("#maingrid");
            var noDataDiv = thisPage.find("#noDataDiv");
            var buttonsContainer = thisPage.find("#buttonsContainer");
            var topBarHelper = topBarButtonsHelper(true, buttonsContainer, parameters);
            var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var lastRowKey = 0;
            var currentLoggers = [];
            var bSingleLineStructure = false;
            var bLog4NetFormat = false;
            var bFirstLoading = true;

            var horizontalAlignment = parameters.HorizontalContentAlignment == 0 || parameters.HorizontalContentAlignment == 3 ? "left" : (parameters.HorizontalContentAlignment == 2 ? "right" : "center");
            var verticalAlignment = parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "top" : parameters.VerticalContentAlignment == 2 ? "bottom" : "center";
            var btnRefreshDiv = thisPage.find("#btnRefresh");
            var btnAddDiv = thisPage.find("#btnAdd");
            var selectLastBtnDiv = thisPage.find("#selectLastBtn");
            var selectFirstBtnDiv = thisPage.find("#selectFirstBtn");
            var selectAllBtnDiv = thisPage.find("#selectAllBtn");
            var copySelectedBtnDiv = thisPage.find("#copySelectedBtn");
            var bestfitbtnDiv = thisPage.find("#bestfitbtn");
            var logfileLbl = thisPage.find("#logfileLbl");
            var logfilterLbl = thisPage.find("#logfilterLbl");
            var translationPrefix = "_LogViewer_";

            var commandButtons = [];

            var fontOptions = {
                "font-family": parameters.FontFamily,
                "font-size": parameters.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.FontWeight)
            };
            var buttonsContainerNoLabels = buttonsContainer.find(".topButton:not('.label')");

            var inlineOptions;
            var foregroundOptions = "";
            var thisParentId = thisParent.attr("id");
            var styleID = buildStyleID(thisPage, thisParentId, parameters.screenName);
            var myStyleSelector = "#" + thisParentId + ".Log4NetViewer";

            if (parameters.Foreground.Color)
                foregroundOptions = myStyleSelector + " tr.dx-data-row td, " + myStyleSelector + " #buttonsContainer div, " + myStyleSelector + " .dx-header-row>td { color: " + getSolidColor(parameters.Foreground) + "; }";

            var translations = scope.setTranslations("LogViewer", [
                {
                    id: "Fit",
                    stringSuffix: "BestFit",
                    defValue: "Best Fit Columns"
                },
                {
                    id: "Ref",
                    stringSuffix: "RefreshData",
                    defValue: "Refresh"
                },
                {
                    id: "ForceNewLog",
                    stringSuffix: "ForceNewLog",
                    defValue: "Force New Log"
                },
                {
                    id: "SelectLast",
                    stringSuffix: "SelectLast",
                    defValue: "Select Last"
                },
                {
                    id: "SelectFirst",
                    stringSuffix: "SelectFirst",
                    defValue: "Select First"
                },
                {
                    id: "SelectAll",
                    stringSuffix: "SelectAll",
                    defValue: "Select All"
                },
                {
                    id: "CopyRows",
                    stringSuffix: "CopyRows",
                    defValue: "Copy Rows"
                },
                {
                    id: "LogFileLabel",
                    stringSuffix: "LogFile",
                    defValue: "LogFile : "
                },
                {
                    id: "LogFilterLabel",
                    stringSuffix: "Loggers",
                    defValue: "LogFilter : "
                }
            ]);

            var btnRefresh;
            var btnForceNew;
            var selectLastBtn;
            var selectFirstBtn;
            var selectAllBtn;
            var copySelectedBtn;
            var logfileCombo;
            var logFilterCombo;
            var dataGrid;

            var fileComboItems = [];

            var filterComboItems = [
                i18next.t1("AllLoggers")
            ];

            var bLogFileChanging;
            var dataGridOptions = {
                showBorders: true,
                columnResizingMode: "widget",
                disabled: thisParent.hasClass(disabledClass),
                width: "100%",
                editing: {
                    editEnabled: false,
                    editMode: 'row',
                    insertEnabled: false,
                    removeEnabled: false
                },
                allowColumnReordering: true,
                allowColumnResizing: true,
                searchPanel: { visible: true },
                onInitialized: function (e) {
                    setTimeout(function () {
                        var el = e.component.element();
                        $(el).height(thisParent.height() - buttonsContainer.height() - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
                    }, 1);
                },
                focusedRowEnabled: true,
                keyExpr: "Item",
                onContentReady: function (e) {
                    var el = $(e.component.element());
                    if (bFirstLoading) {
                        bFirstLoading = false;
                    }

                    if (parameters.Background) {
                        el.find(".dx-toolbar").css("background", parameters.Background.Color);
                        el.find(".dx-datagrid").css("background", parameters.Background.Color);
                    }
                    e.component.beginUpdate();
                    for (i = 0; i < e.component.columnCount(); i++) {
                        var bIsVisible = !bSingleLineStructure || (e.component.columnOption(i, "dataField") == "Item" || e.component.columnOption(i, "dataField") == "Message");
                        if (bSingleLineStructure && e.component.columnOption(i, "dataField") == "Item")
                            e.component.columnOption(i, "width", "auto");
                        e.component.columnOption(i, "visible", bIsVisible);
                    }
                    e.component.option("loadPanel.enabled", false);
                    e.component.option("visible", true);
                    if (bLogFileChanging) {
                        bLogFileChanging = false;
                        try { e.component.getScrollable().scrollTo(0); } catch { }
                    }
                    e.component.endUpdate();
                    checkEnableDisableButtons();
                },
                onRowPrepared: function (e) {
                    e.rowElement.children("td").css({
                        "text-align": horizontalAlignment,
                        "vertical-align": verticalAlignment
                    });
                },
                onSelectionChanged: function (e) {
                    copySelectedBtn.option("disabled", e.selectedRowKeys.length == 0 || thisParent.hasClass(disabledClass));
                },
                selection: {
                    mode: "multiple"
                },
                scrolling: scrollingOptions,
                paging: {
                    pageSize: 50
                },
                filterRow: {
                    visible: false
                },
                loadPanel: {
                    enabled: true
                },
                noDataText: ""
            };

            var mutateFunc = function () {
                dynamicFontElements.push(...topBarHelper.styleButtons());

                btnRefresh = btnRefreshDiv.dxButton({
                    icon: "images/toolbox/refresh.svg",
                    hint: translations.Ref(),
                    disabled: true,
                    onClick: function (e) {
                        dataGrid.deselectAll();
                        dataGrid.option("scrolling.mode", "virtual");
                        pollData();
                    }
                }).dxButton("instance");

                btnForceNew = btnAddDiv.dxButton({
                    icon: "images/toolbox/piu.svg",
                    hint: translations.ForceNewLog(),
                    disabled: true,
                    onClick: function (e) {
                        $(commandButtons).each(function (i, el) { el.option("disabled", true); });
                        var logFileName = logfileCombo ? logfileCombo.option("value") : fileComboItems[0];
                        scope.corehubconnection.invoke("NewLogFile", parameters.screenId, logFileName)
                            .then((ret) => {
                                pollData();
                            })
                            .catch(err => {
                                $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                                console.error(err.toString());
                                scope.$broadcast(onError, { ex: err, value: errorText });
                            });
                    }
                }).dxButton("instance");

                selectLastBtn = selectLastBtnDiv.dxButton({
                    text: translations.SelectLast(),
                    hint: translations.SelectLast(),
                    disabled: true,
                    onClick: function (e) {
                        if (dataGrid && lastRowKey > 0) {
                            dataGrid.option("focusedRowKey", lastRowKey);
                            dataGrid.selectRows([lastRowKey], false);
                            dataGrid.getScrollable().scrollToElement(dataGrid.getRowElement(dataGrid.getRowIndexByKey(lastRowKey)));
                        }
                    }
                }).dxButton("instance");

                selectFirstBtn = selectFirstBtnDiv.dxButton({
                    text: translations.SelectFirst(),
                    hint: translations.SelectFirst(),
                    disabled: true,
                    onClick: function (e) {
                        if (dataGrid) {
                            dataGrid.option("focusedRowKey", 1);
                            dataGrid.selectRows([1], false);
                        }
                    }
                }).dxButton("instance");

                selectAllBtn = selectAllBtnDiv.dxButton({
                    text: translations.SelectAll(),
                    hint: translations.SelectAll(),
                    disabled: true,
                    onClick: function (e) {
                        if (dataGrid) {
                            dataGrid.option("scrolling.mode", "standard");
                            dataGrid.selectAll();
                        }
                    }
                }).dxButton("instance");

                copySelectedBtn = copySelectedBtnDiv.dxButton({
                    text: translations.CopyRows(),
                    hint: translations.CopyRows(),
                    disabled: true,
                    onClick: function (e) {
                        var rowData = dataGrid.getSelectedRowsData();
                        if (rowData.length > 0)
                            rowCopy(rowData);
                    }
                }).dxButton("instance");


                setFontStyle();

                logfileLbl.text(translations.LogFileLabel());
                logfilterLbl.text(translations.LogFilterLabel());
                noDataDiv.text(i18next.t("NoDataText"));

                if (parameters.Background)
                    buttonsContainerNoLabels.css("background", parameters.Background.Color);
                if (parameters.ToolbarBackground)
                    buttonsContainer.css("background", parameters.ToolbarBackground.Color);

                logfileCombo = fileComboDiv.dxSelectBox({
                    items: fileComboItems,
                    value: fileComboItems[0],
                    onInitialized: function (e) {
                        commandButtons.push(e.component);
                        dynamicFontElements.push(e.component.element());
                        fastdom.mutate(function () {
                            styleInnerComboItems(e.component.element());
                        });
                    },
                    onValueChanged: function (data) {
                        pollData();
                    }
                }).dxSelectBox("instance");

                logFilterCombo = thisPage.find("#logfilterCombo").dxSelectBox({
                    items: filterComboItems,
                    value: filterComboItems[0],
                    onInitialized: function (e) {
                        commandButtons.push(e.component);
                        dynamicFontElements.push(e.component.element());
                        fastdom.mutate(function () {
                            styleInnerComboItems(e.component.element());
                        });
                    },
                    onValueChanged: function (data) {
                        if (dataGrid) {
                            var items = logFilterCombo.getDataSource().items();
                            var currentLoggerIndex = items.indexOf(data.value) - 1;
                            if (currentLoggerIndex >= 0)
                                dataGrid.filter(["Logger", "=", currentLoggers[currentLoggerIndex]]);
                            else
                                dataGrid.clearFilter();
                        }
                    }
                }).dxSelectBox("instance");

                var bestfitbtn = bestfitbtnDiv.dxButton({
                    text: translations.Fit(),
                    hint: translations.Fit(),
                    type: "normal",
                    onContentReady: function (e) {
                        topBarHelper.setHeight($(e.component.element()));
                    },
                    onClick: function (e) {
                        for (var i = 0; i < dataGrid.columnCount(); i++) {
                            if (dataGrid.columnOption(i, 'visible')) {
                                dataGrid.columnOption(i, 'width', 'auto');
                            }
                        }
                        dataGrid.option("columnAutoWidth", true);
                        dataGrid.repaint();
                    }
                }).dxButton("instance");

                Array.prototype.push.apply(commandButtons, [bestfitbtn, btnRefresh, btnForceNew, selectLastBtn, selectFirstBtn, selectAllBtn, copySelectedBtn]);
                $(commandButtons).each(function (i, el) { el.option("disabled", true); });
                
                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                dataGrid = container.dxDataGrid(dataGridOptions).dxDataGrid("instance");

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {

                    jQuery.each(parameters.GridLayout, function (index, item) {
                        let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                        dataGrid.columnOption(index, 'caption', i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix)));
                    });
                    dataGrid.option("columns", loadColumns());

                    logfileLbl.text(translations.LogFileLabel());
                    logfilterLbl.text(translations.LogFilterLabel());
                    noDataDiv.text(i18next.t("NoDataText"));

                    if (logFilterCombo) {
                        var selectedIndex = logFilterCombo.option("items").indexOf(logFilterCombo.option("displayValue"));
                        filterComboItems = [i18next.t1("AllLoggers")];
                        $.each(currentLoggers, function (index, item) {
                            filterComboItems.push(i18next.t1(item));
                        });
                        logFilterCombo.option("items", filterComboItems);
                        logFilterCombo.option("value", filterComboItems[Math.max(0, selectedIndex)]);
                    }
                    
                    btnRefresh.option({ "hint": translations.Ref() });
                    btnForceNew.option({ "hint": translations.ForceNewLog() });
                    selectLastBtn.option({ "hint": translations.SelectLast(), "text": translations.SelectLast() });
                    selectFirstBtn.option({ "hint": translations.SelectFirst(), "text": translations.SelectFirst() });
                    selectAllBtn.option({ "hint": translations.SelectAll(), "text": translations.SelectAll() });
                    copySelectedBtn.option({ "hint": translations.CopyRows(), "text": translations.CopyRows() });
                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        for (var cssProp in fontOpts)
                            fontOptions[cssProp] = fontOpts[cssProp];
                        setFontStyle();
                    }
                });

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                }

                initLogViewer();
                $(thisParent).bind(disabledClassEvent, function () {
                    dataGrid.option("disabled", thisParent.hasClass(disabledClass));
                    checkEnableDisableButtons();
                });
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function loadColumns() {
                var cols = [];
                jQuery.each(parameters.GridLayout, function (index, item) {
                    var actWidth = parseFloat(item.ActualWidth, 10);
                    let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                    let colCaption = i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix));
                    var col = { dataField: item.FieldName, name: "col" + index, caption: colCaption, allowEditing: false };
                    if (!isNaN(actWidth))
                        col["width"] = item.ActualWidth;
                    if (item.ColumnTag == "EventTime" || item.ColumnTag == "EventUtcTime") {
                        col["format"] = "longTime";
                        col["customizeText"] = function (cellInfo) {
                            var newValue = cellInfo.value;
                            try {
                                var date = moment(cellInfo.value.getTime() + timezoneOffset).toDate();
                                newValue = date.toLocaleTimeString().replace(/(\d*:\d*:\d*)(:\d*)/, "$1");
                            }
                            finally {
                                return newValue;
                            }
                        };
                    }
                    if (item.FieldName == "TimeStamp" && bLog4NetFormat) {
                        col["customizeText"] = function (cellInfo) {
                            var newValue = cellInfo.value;
                            try {
                                newValue = moment.unix(cellInfo.value).format("L LTS");
                            }
                            finally {
                                return newValue.toString();
                            }
                        };
                    }
                    setColumnOrdering(item, col);
                    cols.push(col);
                });
                return cols;
            }

            function initLogViewer() {
                scope.corehubconnection.invoke("InitLogViewer", parameters.screenId)
                    .then((ret) => {
                        logfileCombo.option({
                            "items": ret,
                            "value": ret[0]
                        });
                        let maxTextSize = 0;
                        $(logfileCombo.option("items")).each(function (i, el) {
                            maxTextSize = Math.max(maxTextSize, getTextWidth(el, fileComboDiv[0]))
                        });
                        if (maxTextSize > 0)
                            fileComboDiv.css("width", maxTextSize + fileComboDiv.find(".dx-texteditor-buttons-container:first").width() + parseFloat(fileComboDiv.find(".dx-texteditor-input:first").css("padding-left"))*2);
                    })
                    .catch(err => {

                        console.error(err.toString());
                        dataGrid.option("loadPanel.enabled", false);
                        var errorText = i18next.t1('ErrorGettingLogs') + err.toString();
                        scope.$broadcast(onError, { ex: err, value: errorText });

                        $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                    });
            }

            function pollData() {

                scope.busyVisible = true;
                scope.$apply();

                $(commandButtons).each(function (i, el) { el.option("disabled", true); });
                dataGrid.option("loadPanel.enabled", true);
                noDataDiv.hide();
                dataGrid.option("visible", false);

                var logFileName = logfileCombo ? logfileCombo.option("value") : fileComboItems[0];
                scope.corehubconnection.invoke("GetLogFile", parameters.screenId, logFileName)
                    .then((ret) => {
                        bSingleLineStructure = ret.SingleLineStructure;
                        bLog4NetFormat = ret.Schema == "log4net";
                        dataGrid.option("columns", loadColumns());
                        bLogFileChanging = true;
                        dataGrid.option("dataSource", ret.Items);
                        lastRowKey = ret.Items.length == 0 ? 0 : ret.Items[ret.Items.length - 1].Item;
                        currentLoggers = ret.Loggers;
                        filterComboItems = [i18next.t1("AllLoggers")];
                        $.each(ret.Loggers, function (index, item) {
                            filterComboItems.push(i18next.t1(item));
                        });
                        logFilterCombo.option("items", filterComboItems);
                        if (ret.Items.length == 0)
                            noDataDiv.show();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        dataGrid.option("loadPanel.enabled", false);
                        var errorText = i18next.t1('ErrorReadingLogFile') + err.toString();
                        scope.$broadcast(onError, { ex: err, value: errorText });

                        checkEnableDisableButtons();
                    })
                    .finally(() => {
                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function checkEnableDisableButtons() {
                $(commandButtons).each(function (i, el) {
                    var disabled = thisParent.hasClass(disabledClass);
                    if (el == copySelectedBtn && dataGrid)
                        disabled = disabled || dataGrid.getSelectedRowKeys().length == 0;
                    el.option("disabled", disabled);
                });
            }

            function rowCopy(rowsData) {
                let str = "";
                $.each(rowsData, function (index, rowData) {
                    for (let prop in rowData) {
                        if (rowData[prop] !== undefined) {
                            str += `${rowData[prop]}\t`;
                        }
                    }
                    str = str.substr(0, str.length - 1);
                    str += "\n";
                });
                str = str.substr(0, str.length - 1);

                navigator.clipboard.writeText(str).then(() => {
                    DevExpress.ui.notify(i18next.t1("ClipboardCopySuccess"), "success", 1000);
                }, () => {
                    DevExpress.ui.notify(i18next.t1("ClipboardCopyError"), "error", 1000);
                });
            }

            function setFontStyle() {
                inlineOptions = Object.entries(fontOptions).map(function (kv) { return (`${kv[0]}:${kv[1]}`) }).join(';') + ";";
                var dlStyle = $("#" + styleID);
                if (dlStyle.length > 0)
                    dlStyle.remove();
                $("<style id=\"" + styleID + "\">" + foregroundOptions + "#" + thisParentId + ".Log4NetViewer .dx-datebox-datetime input, #" + thisParentId + ".Log4NetViewer div.dx-item-content, #" + thisParentId + ".Log4NetViewer .dx-header-row, #" + thisParentId + ".Log4NetViewer .dx-data-row td, #" + thisParentId + ".Log4NetViewer div.dx-item-content, #" + thisParentId + ".Log4NetViewer .dx-datagrid-content input.dx-texteditor-input, #" + thisParentId + ".Log4NetViewer .dx-header-row td { " + inlineOptions + " }</style>").appendTo("head");
            }

            function styleInnerComboItems(el) {
                var input = el.find("input.dx-texteditor-input").first();
                var inputCss = {
                    "color": getSolidColor(parameters.Foreground),
                    "font-family": parameters.FontFamily,
                    "font-size": parameters.FontSize,
                    "font-weight": fontWeightConverter(parameters.FontWeight)
                };
                var fontStyle = parameters.FontStyle.toLowerCase();
                if (fontStyle != "normal")
                    inputCss["font-style"] = fontStyle;
                input.css(inputCss);
                dynamicFontElements.push(input);
            }
        }
    </script>
</div>

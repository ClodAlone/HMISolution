<div id="HotRegionControl" class="HotRegionControl" style="cursor: pointer;">
    <img src="cl.gif" alt="" onload="onHotRegionLoaded(this)" id="loadingImage" />

    <div id="edit"></div>

    <script>
        function onHotRegionLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var parameters = JSON.parse(paratt);

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var editcontainer = thisPage.children().first();

            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, editcontainer);

            var mutateFunc = function () {
                editcontainer.width(thisParent.width());
                editcontainer.height(thisParent.height());
            };
            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);
        }
    </script>
</div>

<script src="scripts/toolbox/common/checkboxControl.js"></script>

<div id="CheckBoxControl" class="CheckBoxControl" xmlns="http://www.w3.org/1999/xhtml" style="height:100%; width:100%;">
    <img src="cl.gif" alt="" onload="onCheckBoxControlLoaded(this)" id="loadingImage" />

    <div id="normal" style="height:100%; width:100%;"></div>

    <script>
        function onCheckBoxControlLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            $(obj).remove();
            var thisParent = thisPage.parent();

            setOpacity(scope, thisParent, thisPage);
            if (scope.biOS)
                thisPage.css("overflow", "hidden");

            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            var thisParentId = thisParent.attr("id");
            var thisCheckboxID = thisParentId + parameters.screenId;
            var bFirstContentReady = true;

            var customFonts = [parameters.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            var buttoncontainer = thisPage.children().first();
            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, buttoncontainer);
                var bIsInFittedParent = isInFittedParent(thisPage);
                if (webKitRenderCorrection || bIsInFittedParent || ($.trim(parameters.Content) && parameters.currentPopupId && !parameters.bFitInWindow)) {
                    buttoncontainer.css("position", "relative");
                    if (webKitRenderCorrection)
                        thisPage.css("will-change", "opacity");
                }
            }

            var standardCheckbox_settingValue;
            var el;

            var stylesEnablingRules = {
                "ON": function (val, bIsBoolean) {
                    return (!parameters.IsThreeState && (val === 'true' || val === '1')) || (parameters.IsThreeState && (val === '1' || (bIsBoolean && val === 'true')));
                },
                "OFF": function (val, bIsBoolean) {
                    return (!parameters.IsThreeState && parameters.StyleNULL == "") || val === '0' || val === 'false';
                },
                "NULL": function (val, bIsBoolean) {
                    return parameters.StyleNULL !== "" && val !== 'true' && val !== '1' && val !== 'false' && val !== '0';
                }
            };

            var foregroundColor = (parameters.Foreground && parameters.Foreground.Color) ? getSolidColor(parameters.Foreground) : null;
            var button;
            var textDiv;
            var checkboxIconSize = thisParent.height() * 0.7;
            var styleData;

            var mutateFunc = function () {
                styleData = scope.applyControlStyle(scope, thisParent, buttoncontainer, parameters, webKitRenderCorrection);

                if (styleData.styleApplied) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    var drls = registerCheckboxValueHandlers(scope, thisParent, thisPage, parameters, styleData, stylesEnablingRules, webKitRenderCorrection);
                    deregisterListeners.push(...drls);

                    styleData.setStrokeAndFill(false);

                    $(thisParent).bind(disabledClassEvent, function () {
                        styleData.enableDisableStyles(!thisParent.hasClass(disabledClass), webKitRenderCorrection);
                    });

                    if (parameters.Content) {
                        fastdom.mutate(function () {
                            textDiv = $("<div title=\"" + i18next.t1(parameters.Content).replace(/"/g, "&quot;") + "\" style='position:" + (scope.biOS && !parameters.bFitInWindow && !bIsInFittedParent && !parameters.currentPopupId ? "fixed" : "absolute") + ";z-index:2;text-align:center;width:100%;'>" + i18next.t1(parameters.Content) + "</div>");
                            var btnContentCss = {};
                            setTextWrappingOptions(btnContentCss, {}, parameters.TextWrapping, parameters.Content.indexOf("\n") !== -1, scope.biOS);
                            var textAlignment = parameters.HorizontalContentAlignment == 0 || parameters.HorizontalContentAlignment == 3 ? "left" : (parameters.HorizontalContentAlignment == 2 ? "right" : "center");
                            var cssProps = {
                                "font-size": parameters.FontSize,
                                "font-family": parameters.FontFamily,
                                "font-weight": parameters.FontWeight,
                                "cursor": "default",
                                "text-align": textAlignment,
                                "padding": "5px"
                            };
                            var fontStyle = parameters.FontStyle.toLowerCase();
                            if (fontStyle != "normal")
                                cssProps["font-style"] = fontStyle;
                            if (foregroundColor)
                                cssProps["color"] = foregroundColor;
                            buttoncontainer.css({
                                "display": "flex",
                                "align-items": parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "flex-start" : (parameters.VerticalContentAlignment == 2 ? "flex-end" : "center")
                            });
                            var innerText = $(textDiv).css(btnContentCss).appendTo(buttoncontainer)
                            innerText.css(cssProps);
                            dynamicFontElements.push(innerText);
                        });
                    }
                }
                else {
                    var checkboxOptions = {
                        text: i18next.t1(parameters.Content),
                        icon: parameters.icon ? imageFolder + parameters.icon : null,
                        height: thisParent.height(),
                        width: thisParent.width(),
                        disabled: thisParent.hasClass(disabledClass),
                        hint: i18next.t1(parameters.Tooltip),
                        onContentReady: function (e) {
                            try {
                                updateCheckboxStyle(e.component.option("value"), e.component.element());
                            }
                            finally {
                                if (bFirstContentReady) {
                                    StyleIconPseudoElement("--scaledIconTransform" + thisParentId);
                                    bFirstContentReady = false;
                                }
                            }
                        },
                        onValueChanged: function (e) {
                            if (standardCheckbox_settingValue)
                                return;
                            if (!(parameters.screenId in scope.dataValues) || !(parameters.SVGReferenceId in scope.dataValues[parameters.screenId]))
                                return;
                            if (!scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                                return;

                            var valueToServer = e.value;
                            var clientValue = e.value;

                            if (parameters.IsThreeState) {
                                if (e.previousValue == true) {
                                    valueToServer = 2;
                                    standardCheckbox_settingValue = true;
                                    e.component.option("value", undefined);
                                }
                                else if (e.previousValue == undefined) {
                                    valueToServer = false;
                                    standardCheckbox_settingValue = true;
                                    e.component.option("value", false);
                                }
                                else if (e.previousValue == false) {
                                    valueToServer = true;
                                    standardCheckbox_settingValue = true;
                                    e.component.option("value", true);
                                }
                            }
                            updateCheckboxStyle(clientValue);
                            button.option("disabled", true);
                            scope.corehubconnection.invoke("SetValue", parameters.SVGReferenceId, String(valueToServer), parameters.screenId, false)
                                .then((ret) => {

                                    button.option("disabled", false);
                                })
                                .catch(err => {
                                    console.error(err.toString());

                                    button.option("disabled", false);
                                    button.option("value", e.previousValue);
                                    updateCheckboxStyle(e.previousValue);
                                    standardCheckbox_settingValue = false;
                                    scope.$broadcast(onError, { ex: err, value: "Error setting value : " + err.toString() + " for item : " + parameters.SVGItemId });
                                });
                        }
                    };

                    button = buttoncontainer.dxCheckBox(checkboxOptions).dxCheckBox("instance");

                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    var onDataChangedListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                        standardCheckbox_settingValue = true;
                        try {

                            if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                                var val = scope.dataValues[parameters.screenId][parameters.SVGReferenceId].value.toLowerCase();
                                var boolVal = val === 'true' || val === '1' ? true : ((parameters.IsThreeState || parameters.IsFlatStyle) && val !== 'false' && val !== '0' ? undefined : false);
                                button.option("value", boolVal);
                                updateCheckboxStyle(boolVal);
                            }

                            checkEnabled(scope, thisParent, parameters.SVGReferenceId, parameters.screenId);
                        }
                        finally {
                            standardCheckbox_settingValue = false;
                        }
                    });
                    deregisterListeners.push(onDataChangedListener);

                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                        if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                            var val = scope.dataValues[parameters.screenId][parameters.SVGReferenceId].value.toLowerCase();
                            var boolVal = val === 'true' || val === '1' ? true : ((parameters.IsThreeState || parameters.IsFlatStyle) && val !== 'false' && val !== '0' ? undefined : false);
                            button.option("value", boolVal);
                            updateCheckboxStyle(boolVal);
                        }
                    }
                    checkEnabled(scope, thisParent, parameters.SVGReferenceId, parameters.screenId);

                    $(thisParent).bind(disabledClassEvent, function () {
                        if (button)
                            button.option("disabled", thisParent.hasClass(disabledClass));
                    });
                }
            }

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            var deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                if (button) {
                    button.option("text", i18next.t1(parameters.Content));
                    button.option("hint", i18next.t1(parameters.ToolTip));
                }
                if (textDiv) {
                    $(textDiv).text(i18next.t1(parameters.Content));
                    $(textDiv).attr("title", i18next.t1(parameters.ToolTip).replace(/"/g, "&quot;"));
                }
                if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1)
                    var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
            });
            deregisterListeners.push(deregisterListenerActiveLanguage);

            function updateCheckboxStyle(clientValue, el) {
                var el = el ? el : button.element();
                var cssProps = {
                    "text-align": "center",
                    "font-family": parameters.FontFamily,
                    "font-weight": parameters.FontWeight,
                    "font-size": parameters.FontSize
                };
                if (parameters.FontStyle) {
                    var fontStyle = parameters.FontStyle.toLowerCase();
                    if (fontStyle != "normal")
                        cssProps["font-style"] = fontStyle;
                }
                if (foregroundColor)
                    cssProps["color"] = foregroundColor;

                var textCss = {
                    "height": "auto",
                    "width": "auto",
                    "text-align": parameters.HorizontalContentAlignment == 0 || parameters.HorizontalContentAlignment == 3 ? "left" : (parameters.HorizontalContentAlignment == 2 ? "right" : "center")
                };

                if (parameters.VerticalContentAlignment != 1)
                    textCss["align-self"] = parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "flex-start" : "flex-end";

                var iconStyle = {
                    "width": checkboxIconSize,
                    "height": checkboxIconSize,
                    "border-style": "solid", //checkboxBorderSize + "px solid " + parameters.BorderBrush.Color
                    "border-color": parameters.BorderBrush.Color,
                    "border-width": parseFloat(parameters.BorderThickness.Top) + "px " + parseFloat(parameters.BorderThickness.Right) + "px " + parseFloat(parameters.BorderThickness.Bottom) + "px " + parseFloat(parameters.BorderThickness.Left) + "px",
                };
                if (foregroundColor)
                    iconStyle["color"] = foregroundColor;
                fastdom.measure(function () {
                    var checkboxText = el.find(".dx-checkbox-text");
                    var checkboxTextParent = checkboxText.parent();
                    var checkboxIcon = el.find(".dx-checkbox-icon");
                    fastdom.mutate(function () {
                        el.css(cssProps);
                        if (dynamicFontElements.indexOf(el) === -1)
                            dynamicFontElements.push(el);
                        checkboxText.css(textCss);
                        checkboxTextParent.css({
                            "display": "flex",
                            "align-items": "center"
                        });
                        if (isCssGradient(parameters.BorderBrush.Color)) {
                            checkboxIcon.wrap("<span style='display:flex; width:" + checkboxIconSize + "px; height:" + checkboxIconSize + "px;background:" + parameters.BorderBrush.Color + "; align-items:center; justify-content:center;'>");
                            iconStyle["width"] -= parseFloat(parameters.BorderThickness.Left) + parseFloat(parameters.BorderThickness.Right);
                            iconStyle["height"] -= parseFloat(parameters.BorderThickness.Top) + parseFloat(parameters.BorderThickness.Bottom);
                        }
                        checkboxIcon.css(iconStyle);
                    });
                });
                updateBackground(el, clientValue);
            }

            function StyleIconPseudoElement(varName) {
                var CSSvarSelector = "foreignObject#" + thisParentId;
                var dxCheckboxIconRule = CSSvarSelector + " { " + varName + ": scale(1); } " + CSSvarSelector + " div.dx-checkbox-checked .dx-checkbox-icon::before { transform: var(" + varName + "); }";
                fastdom.mutate(function () {
                    var dlStyle = $("style #" + thisCheckboxID);
                    if (dlStyle.length > 0)
                        dlStyle.remove();
                });
                var checkedOrIndeterminateSelector = CSSvarSelector + " div.dx-checkbox-checked .dx-checkbox-icon, " + CSSvarSelector + " div.dx-checkbox-indeterminate .dx-checkbox-icon";

                if (parameters.IsFlatStyle) {
                    var indeterminateVarName = varName + "Indeterminate";
                    if (parameters.OptionBorderBrush || parameters.BackgroundOn)
                        dxCheckboxIconRule = dxCheckboxIconRule + " " + checkedOrIndeterminateSelector + " { background: " + (parameters.BackgroundOn && parameters.BackgroundOn.Color ? parameters.BackgroundOn.Color : parameters.OptionBorderBrush.Color) + "!important; }";
                    dxCheckboxIconRule = dxCheckboxIconRule + " " + CSSvarSelector + " div.dx-checkbox-indeterminate .dx-checkbox-icon::before { transform: var(" + indeterminateVarName + "); " + (foregroundColor ? "background: " + foregroundColor + ";" : "") + " }";
                    dxCheckboxIconRule = dxCheckboxIconRule + " " + checkedOrIndeterminateSelector + " { border-width: 0px!important; }";
                    if (parameters.OptionBorderBrush)
                        dxCheckboxIconRule = dxCheckboxIconRule + " " + CSSvarSelector + " .dx-checkbox.dx-state-hover .dx-checkbox-icon { border-color: " + parameters.OptionBorderBrush.Color + "!important; }";
                }
                else {
                    if (parameters.OptionBorderBrush || parameters.BackgroundOn)
                        dxCheckboxIconRule = dxCheckboxIconRule + " " + checkedOrIndeterminateSelector + " { background: " + (parameters.BackgroundOn && parameters.BackgroundOn.Color ? parameters.BackgroundOn.Color : parameters.Background.Color) + "!important; }";
                    dxCheckboxIconRule = dxCheckboxIconRule + " " + CSSvarSelector + " div.dx-checkbox-indeterminate .dx-checkbox-icon::before { transform: var(" + varName + "); " + (foregroundColor ? "background: "+ foregroundColor + ";" : "") + " }";
                }
                fastdom.mutate(function () {
                    $("<style id=\"" + thisCheckboxID + "\">" + dxCheckboxIconRule + "</style>").appendTo("head");
                    $(CSSvarSelector)[0].style.setProperty(varName, "scale(" + checkboxIconSize / 21 + ")");
                    if (parameters.IsFlatStyle)
                        $(CSSvarSelector)[0].style.setProperty(indeterminateVarName, "scale(" + checkboxIconSize / 21 + ", 1)");
                });
            }

            function updateBackground(element, newValue) {
                var bgProp = newValue ? parameters.BackgroundOn : parameters.Background;
                if (bgProp) {
                    if (bgProp.Color) {
                        fastdom.measure(function () {
                            var checkboxIcon = element.find(".dx-checkbox-icon");
                            fastdom.mutate(function () {
                                checkboxIcon.css("background", bgProp.Color);
                            });
                        })
                    }
                }
            }
			
			function checkEnabled(scope, thisParent, SVGReferenceId, screenId) {

                var enabled = false;
                if (screenId in scope.dataValues && SVGReferenceId in scope.dataValues[screenId])
                    enabled = scope.dataValues[screenId][SVGReferenceId].isGood && !thisParent.hasClass(disabledClass) && scope.dataValues[screenId][SVGReferenceId].isWritable && scope.dataValues[screenId][SVGReferenceId].isUserWritable;

                if (!styleData.styleApplied)
                    button.option("disabled", !enabled);
                else
                    styleData.enableDisableStyles(enabled, webKitRenderCorrection);
            }
        }
    </script>
</div>

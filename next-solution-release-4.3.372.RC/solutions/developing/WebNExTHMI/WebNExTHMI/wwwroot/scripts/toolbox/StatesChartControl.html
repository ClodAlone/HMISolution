<div id="StatesChartControl" class="StatesChartControl" style="height:100%;">
    <img src="cl.gif" alt="" onload="onStatesChartControlLoaded(this)" id="loadingImage" />

    <div id="mainContainer" style="height: 100%;">
        <div id="buttonsContainer">
            <div class="topButton" id="prevbtn" style="float: left;"></div>
            <div class="topButton" id="timecombo" style="float:left;width:100px;"></div>
            <div class="topButton" id="nextbtn" style="float: left;"></div>
            <div class="topButton" id="refreshbtn" style="float: left;"></div>
            <div class="topButton" id="absoluterangesbtn" style="float:left; padding-top: 5px;"></div>
            <div class="topButton" id="zoombackbtn" style="float: left;"></div>
            <div class="topButton" id="minutebtn" style="float: left;"></div>
            <div class="topButton" id="hourbtn" style="float: left;"></div>
            <div class="topButton" id="daybtn" style="float: left;"></div>
            <div class="topButton" id="weekbtn" style="float: left;"></div>
            <div class="topButton" id="monthbtn" style="float: left;"></div>
            <div class="topButton" id="startdatetime" style="float:left;"></div>
            <div class="topButton" id="enddatetime" style="float:left;"></div>
            <div class="topButton" id="fetchbtn" style="float: left;"></div>
        </div>
        <div id="trend" style="overflow: hidden; margin-bottom: 5px; padding: 4px;"></div>
        <div id="legendContainer">
            <div id="legendTitle" class="viewerPanel" style="display: none; position: fixed; bottom: 0px; z-index: 999; padding: 0px 5px; user-select: none; cursor: pointer; background: #555; margin-left: 4px;"></div>
            <div id="legendDragger" style="height: 2px; background-color: #555; width: 100%; cursor: ns-resize;"></div>
            <div id="legendDataGrid" style="margin: auto;"></div>
        </div>
    </div>

    <script>
        function onStatesChartControlLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");

            var mainContainer = thisPage.find("#mainContainer");
            var scrollingOptions = {
                mode: "standard"
            };
            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
            }

            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var interval;
            var minInterval = 20000;
            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
                if (legendPanelHelper) {
                    legendContainer.off("updateChartHeight", updateChartHeight);
                    legendContainer.off("resetChartHeight", resetChartHeight);
                    legendPanelHelper.dispose();
                }
                if (legendStatus.bLegendExpanded)
                    controlPropertiesDB.add(scope, controlStorageKey, legendStatus.latestLegendHeight);
                else
                    controlPropertiesDB.delete(scope, controlStorageKey);
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);
            var customFonts = [parameters.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            var trendcontainer = thisPage.find("#trend");

            var buttonsContainer = thisPage.find("#buttonsContainer");
            var topBarHelper = topBarButtonsHelper(true, buttonsContainer, parameters);
            var buttonsContainerBGDiv = buttonsContainer.find(".topButton:not(#absoluterangesbtn)");
            var dataGridInstance;

            var legendPanelHelper;
            var legendContainer;
            var legendTitle;
            var legendStatus = { bLegendExpanded: false, openLegendHeight: undefined, latestLegendHeight: undefined };
            var parentHeight = $(thisParent).attr("height");
            var thisParentId = thisParent.attr("id");
            var parentScreenName = parameters.screenName;
            var controlStorageKey = {
                "parentScreenName": parentScreenName,
                "controlID": thisParentId,
                "propertyName": "latestLegendHeight_StatesChart"
            };

            var fontOptions = {
                "font-family": parameters.FontFamily,
                "font-size": parameters.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.FontWeight),
                "color": getSolidColor(parameters.LegendAreaForeground)
            };

            var dataSource = new Array(); //new Array(sampleNumber);
            var legendHidden = !parameters.LegendAreaVisible;
            var valueColorsMap = {};

            var timeComboItems = ["Minutes", "Hours", "Days", "Weeks", "Months"];
            var selectTimeCombo;

            var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var actualFilterType = parameters.FilterType - 1; //0 = Minute [...] 4 = month

            var absbtn;
            var zbackbtn;
            var fetchbtn;
            var prevbtn;
            var nextbtn;
            var refreshbtn;
            var minbtn;
            var hourbtn;
            var daybtn;
            var weekbtn;
            var monthbtn;

            var startDatebox;
            var endDatebox;
            var initialStartDate;
            var initialEndDate;
            var zoomHistory = [];
            var commandButtons = [];
            var bLoadingData = false;
            var bAbsoluteRanges = parameters.UseAbsoluteRanges;

            var dateSpanViewTimeFrame = [
                    /*"m":*/ "PT1M",
                    /*"h":*/ "PT1H",
                    /*"d":*/ "P1D",
                    /*"w":*/ "P7D",
                    /*"M":*/ "P1M"
            ];

            var samplingUnit = [
                    /*"m":*/ "PT1S",
                    /*"h":*/ "PT1M",
                    /*"d":*/ "PT15M",
                    /*"w":*/ "PT4H",
                    /*"M":*/ "PT12H"
            ];

            var viewTimeFrame = dateSpanViewTimeFrame[actualFilterType]; // = "PT1H";
            var recordEvery = samplingUnit[actualFilterType]; // = "PT1M";
            var tempDataSource = [];
            var legendds;
            var legendScrollStatus = {
                reachedTop: true,
                reachedBottom: false
            };
            var chart;

            var translations = scope.setTranslations("StatesChartControl", [
                {
                    id: "StartDate",
                    stringSuffix: "StartDate",
                    defValue: i18next.t("StartDate", "Start Date")
                },
                {
                    id: "EndDate",
                    stringSuffix: "EndDate",
                    defValue: i18next.t("EndDate", "End Date")
                },
                {
                    id: "FetchTitle",
                    stringSuffix: "FetchTitle",
                    defValue: i18next.t("FetchTitle", "Fetch")
                },
                {
                    id: "Visible",
                    stringSuffix: "VisibleColumn",
                    defValue: "Visible"
                },
                {
                    id: "PenColor",
                    stringSuffix: "PenColorColumn",
                    defValue: "Pen Color"
                },
                {
                    id: "Name",
                    stringSuffix: "Name",
                    defValue: "Name"
                },
                {
                    id: "EUnit",
                    stringSuffix: "EUnitColumn",
                    defValue: "EUnit"
                },
                {
                    id: "Date",
                    stringSuffix: "DateColumn",
                    defValue: "Date"
                },
                {
                    id: "Value",
                    stringSuffix: "ValueColumn",
                    defValue: "Value"
                },
                {
                    id: "StatisticMin",
                    stringSuffix: "StatisticMinColumn",
                    defValue: "Min Statistic"
                },
                {
                    id: "StatisticMax",
                    stringSuffix: "StatisticMaxColumn",
                    defValue: "Max Statistic"
                },
                {
                    id: "Avg",
                    stringSuffix: "AvgColumn",
                    defValue: "Average"
                },
                {
                    id: "RefreshData",
                    stringSuffix: "RefreshDataButton",
                    defValue: i18next.t("RefreshTitle", "Refresh")
                },
                {
                    id: "AbsoluteRanges",
                    stringSuffix: "UseAbsoluteRangesTitle",
                    defValue: i18next.t("UseAbsoluteRangesTitle", "Use Abs. Ranges")
                },
                {
                    id: "ZoomBack",
                    stringSuffix: "ZoomBackTitle",
                    defValue: i18next.t("ZoomBackTitle", "Zoom Back")
                },
                {
                    id: "TagNameColumn",
                    stringSuffix: "TagNameColumn",
                    defValue: "Variable"
                },
                {
                    id: "HistoricalNameColumn",
                    stringSuffix: "HistoricalNameColumn",
                    defValue: "Historian/DataLogger"
                },

                {
                    id: "PrevTitle",
                    stringSuffix: "PrevTitle",
                    defValue: i18next.t("PrevTitle", "Prev")
                },
                {
                    id: "NextTitle",
                    stringSuffix: "NextTitle",
                    defValue: i18next.t("NextTitle", "Next")
                },
                {
                    id: "RefreshTitle",
                    stringSuffix: "RefreshTitle",
                    defValue: i18next.t("RefreshTitle", "Refresh")
                },
                {
                    id: "MinTitle",
                    stringSuffix: "MinTitle",
                    defValue: i18next.t("MinTitle", "Min")
                },
                {
                    id: "HourTitle",
                    stringSuffix: "HourTitle",
                    defValue: i18next.t("HourTitle", "Hour")
                },
                {
                    id: "DayTitle",
                    stringSuffix: "DayTitle",
                    defValue: i18next.t("DayTitle", "Day")
                },
                {
                    id: "WeekTitle",
                    stringSuffix: "WeekTitle",
                    defValue: i18next.t("WeekTitle", "Week")
                },
                {
                    id: "MonthTitle",
                    stringSuffix: "MonthTitle",
                    defValue: i18next.t("MonthTitle", "Month")
                },
                {
                    id: "LegendTitle",
                    stringSuffix: "LegendTitle",
                    defValue: "Legend"
                }
            ]);

            $.each(parameters.TPenList, function (index, item) {
                tempDataSource.push({
                    "id": item.SVGReferenceId,
                    "Name": {
                        "Title": item.Title,
                        "Values": item.Valuelist
                    },
                    "Variable": item.ColuName,
                    "HistorianDatalogger": item.HistoricalDlrName
                });
                valueColorsMap[item.Title] = { "ValueNotFoundBackground": item.ValueNotFoundBackground.Color, "penMap": {} };
                $.each(item.Valuelist, function (i, el) {
                    var k = "v" + el.Value;
                    valueColorsMap[item.Title]["penMap"][k] = {
                        "color": el.ControlBackground.Color,
                        "label": el.Label
                    };
                });
            });

            var mutateFunc = function () {
                buttonsContainer.css("background", parameters.ToolbarBackground.Color);
                dynamicFontElements.push(...topBarHelper.styleButtons());
                buttonsContainerBGDiv.css("background", parameters.Background.Color);
                if (parameters.PlotBackground)
                    trendcontainer.css("background", parameters.PlotBackground.Color);
                else if (parameters.ControlBackground)
                    trendcontainer.css("background", parameters.ControlBackground.Color);
                else if (parameters.Background)
                    trendcontainer.css("background", parameters.Background.Color);

                var mainContainerCss = {};
                setObjectBorder(mainContainerCss, parameters);
                if (parameters.ControlBackground) {
                    mainContainerCss["background"] = parameters.ControlBackground.Color;
                }
                else if (parameters.Background) {
                    mainContainerCss["background"] = parameters.Background.Color;
                }
                if (scope.biOS) {
                    mainContainerCss["overflow"] = "hidden";
                    if (!webKitRenderCorrection)
                        mainContainerCss["will-change"] = "transform";
                }
                if (!$.isEmptyObject(mainContainerCss))
                    mainContainer.css(mainContainerCss);

                $.each(configureTimeButtons(), function (i, el) {
                    commandButtons.push(el);
                });

                $(thisParent).bind(disabledClassEvent, function () {
                    $(commandButtons).each(function (i, el) {
                        if (el) el.option("disabled", thisParent.hasClass(disabledClass));
                    });
                });

                var chartOptions = {
                    dataSource: dataSource,
                    legend: {
                        visible: false,
                        orientation: "horizontal",
                        verticalAlignment: "bottom",
                        horizontalAlignment: "center"
                    },
                    seriesTemplate: {
                        nameField: "value"
                    },
                    commonAxisSettings: {
                        color: getSolidColor(parameters.LabelForegroundBrush)
                    },
                    commonSeriesSettings: {
                        argumentField: "title",
                        type: "rangeBar", //"stackedBar",
                        rangeValue1Field: "start",
                        rangeValue2Field: "end",
                        barOverlapGroup: "value",
                        point: {
                            visible: false,
                            size: 5,
                            hoverMode: "allArgumentPoints"
                        },
                        barWidth: isNaN(parameters.PensHeight) || parameters.PensHeight == 0 ? undefined : parameters.PensHeight
                    },
                    rotated: true,
                    synchronizeMultiAxes: false,
                    tooltip: {
                        enabled: parameters.ShowTooltips,
                        //shared: true,
                        customizeTooltip: function (info) {
                            var startDateTime = info.originalMinValue.toLocaleDateString() + " (" + info.originalMinValue.toLocaleTimeString() + ")";
                            var endDateTime = info.originalValue.toLocaleDateString() + " (" + info.originalValue.toLocaleTimeString() + ")";
                            var finalText = startDateTime;
                            var valueLabel = "";
                            try {
                                valueLabel = valueColorsMap[info.argument]["penMap"]["v" + info.seriesName].label;
                                finalText += " - " + valueLabel;
                            }
                            catch { }
                            finalText += " - Value: " + info.seriesName;
                            if (info.point.data.secondValue != info.seriesName)
                                finalText += " - 2nd Value: " + info.point.data.secondValue;
                            return {
                                text: finalText
                            };
                        }
                    },
                    customizePoint: function (pointInfo) {
                        //var point = pointInfo.series.getPointsByArg(pointInfo.argument)[0];
                        var pointValue = "v" + pointInfo.seriesName;
                        var pointSecondValue = "v" + pointInfo.data.secondValue;
                        var pointPen = pointInfo.argument; //TPenList.Title = "Pen0", "Pen1",...
                        var pointColor = pointValue in valueColorsMap[pointPen]["penMap"] ? valueColorsMap[pointPen]["penMap"][pointValue].color : valueColorsMap[pointPen]["ValueNotFoundBackground"];
                        var borderColor = pointSecondValue in valueColorsMap[pointPen]["penMap"] ? valueColorsMap[pointPen]["penMap"][pointSecondValue].color : valueColorsMap[pointPen]["ValueNotFoundBackground"];
                        return {
                            color: pointColor,
                            border: {
                                color: borderColor,
                                width: 2,
                                visible: true
                            }
                        };
                    },
                    onPointClick: function (point) {
                        var pointData = point.target.data;
                        if (pointData.value != pointData.secondValue) {
                            if (actualFilterType > 0) {
                                zoomHistory.push({
                                    "start": chart.option("valueAxis.visualRange.startValue"),
                                    "end": chart.option("valueAxis.visualRange.endValue"),
                                    "filterType": actualFilterType
                                });
                                if (!bLoadingData) {
                                    zbackbtn.option("disabled", thisParent.hasClass(disabledClass));
                                }
                                var newStart = pointData.start;
                                var newEnd = pointData.end;
                                updateWholeRange(newStart, newEnd);
                                updateVisualRange(newStart, newEnd);
                                actualFilterType -= 1;
                                loadHistoricalData(newStart, newEnd);
                            }
                        }
                    },
                    onTooltipShown: function (e) {
                        if (parameters.bFitInWindow)
                            $($("body").find(".dxc-tooltip")).each(function (index, el) {
                                $(el).detach().appendTo($(thisParent));
                            });
                    },
                    scrollBar: {
                        visible: true
                    },
                    animation: {
                        enabled: false
                    },
                    zoomAndPan: {
                        valueAxis: "pan",
                        argumentAxis: "both",
                        dragToZoom: true,
                        allowMouseWheel: true,
                        panKey: "shift"
                    },
                    argumentAxis: {
                        label: {
                            visible: parameters.ShowRowLabels,
                            font: {
                                family: parameters.FontFamily,
                                size: parameters.FontSize,
                                weight: fontWeightConverter(parameters.FontWeight, true),
                                color: getSolidColor(parameters.LabelForegroundBrush)
                            }
                        }
                    },
                    valueAxis:
                    {
                        valueType: "datetime",
                        aggregationInterval: "milliseconds",
                        visualRange: {
                            startValue: new Date(Date.now() - 1 * 60 * 60 * 1000), //1hour
                            endValue: Date.now()
                        },
                        grid: {
                            visible: true,
                            width: 1,
                            color: getSolidColor(parameters.LabelForegroundBrush) //"#A3A3A3"
                        },
                        label: {
                            font: {
                                family: parameters.FontFamily,
                                size: parameters.FontSize,
                                weight: fontWeightConverter(parameters.FontWeight, true),
                                color: getSolidColor(parameters.LabelForegroundBrush)
                            }
                        }
                    },
                    size: {
                        //height: (() => {
                        //    var fullHeight = $(thisParent).attr("height") - (legendHidden ? 110 : 225);
                        //    if (!isNaN(parameters.PensHeight) && parameters.PensHeight > 0 && !isNaN(parameters.SeparatorHeight) && parameters.SeparatorHeight > 0)
                        //        return parameters.SeparatorHeight * 2 + parameters.SeparatorHeight * (parameters.TPenList.length - 1) + parameters.PensHeight * parameters.TPenList.length;
                        //    return fullHeight;
                        //})(),
                        width: $(thisParent).attr("width") - 40,
                    },
                    onInitialized: function (e) {
                        InitializeLegend(e.component);
                    }
                };
                chart = trendcontainer.dxChart(chartOptions).dxChart("instance");
                resetChartHeight();

                if (!parameters.UseAbsoluteRanges) {
                    initialEndDate = new Date();
                    var selectedTimeMoment = timeComboItems[actualFilterType].toLowerCase();
                    var initialStartDate = moment(initialEndDate).subtract(1, selectedTimeMoment).toDate();
                    updateWholeRange(initialStartDate, initialEndDate);
                    updateVisualRange(initialStartDate, initialEndDate);
                }

                loadHistoricalData(initialStartDate, initialEndDate);

                var deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    changeLanguage();
                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        if (chart) {
                            var opt1 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("argumentAxis.label.font"));
                            var opt2 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("valueAxis.label.font"));
                            chart.option({
                                "argumentAxis.label.font": opt1,
                                "valueAxis.label.font": opt2
                            });
                        }
                    }
                });
                deregisterListeners.push(deregisterListenerActiveLanguage);

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    var deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                    deregisterListeners.push(deregisterListener);
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            var timefunc = function () {
                //reload historical data and update current visualrange if necessary
                if (new Date() >= chart.option("valueAxis.visualRange.endValue")) {
                    var newStart = moment(chart.option("valueAxis.visualRange.startValue")).add(1, timeComboItems[actualFilterType]).toDate(); //moment.duration(dateSpanViewTimeFrame[actualFilterType]);
                    var newEnd = moment(chart.option("valueAxis.visualRange.endValue")).add(1, timeComboItems[actualFilterType]).toDate();
                    updateWholeRange(newStart, newEnd);
                    updateVisualRange(newStart, newEnd);
                    loadHistoricalData(newStart, newEnd);
                }
                else
                    loadHistoricalData();
            };

            function setAutoRefresh() {
                if (!parameters.AutoRefresh)
                    return;

                updateInterval = Math.max(minInterval, moment.duration(samplingUnit[actualFilterType]));
                if (interval)
                    clearInterval(interval);
                interval = setInterval(timefunc, updateInterval);
            }

            function loadHistoricalData(startDate, endDate, bKeepFilterType = false) {
                if (bLoadingData)
                    return;
                bLoadingData = true;
                $(commandButtons).each(function (i, el) { el.option("disabled", true); });
                if (interval)
                    clearInterval(interval);

                if (!bKeepFilterType)
                    selectTimeCombo.option("value", timeComboItems[actualFilterType]);

                var sDate = null;
                var eDate = null;
                if (!undefinedOrNull(startDate))
                    sDate = moment(startDate).unix();
                if (!undefinedOrNull(endDate))
                    eDate = moment(endDate).unix();

                viewTimeFrame = dateSpanViewTimeFrame[actualFilterType];
                recordEvery = samplingUnit[actualFilterType];

                var historicalDataPendingPens = parameters.TPenList ? parameters.TPenList.length : 0;
                var serverNewDateTimeStart;
                var serverNewDateTimeEnd;

                chart.beginUpdate();

                dataSource = new Array();
                var pensDatasource = {};
                jQuery.each(parameters.TPenList, function (index, item) {
                    pensDatasource["p" + index] = [];
                    if (item.HistoricalDlrName) {
                        scope.corehubconnection.invoke("LoadStatesChartHistoricalData",
                            parameters.screenId, parameters.ConnectionString, parseInt(parameters.CommandTimeout), parseInt(parameters.SampleNumber),
                            viewTimeFrame, recordEvery, item.NodeId, item.HistoricalDlrName, item.Dlrsource, item.ColuName, item.SVGReferenceId, thisParent.attr("id"),
                            new Date().getTimezoneOffset(), sDate, eDate, (actualFilterType + 1).toString())
                            .then((ret) => {
                                if (!serverNewDateTimeStart && !serverNewDateTimeEnd) {
                                    serverNewDateTimeStart = moment(ticksToTimestamp(ret.StartDateTimeTicks) + timezoneOffset).toDate();
                                    serverNewDateTimeEnd = moment(ticksToTimestamp(ret.EndDateTimeTicks) + timezoneOffset).toDate();
                                }
                                jQuery.each(ret.Values, function (index2, record) {
                                    var newitem = {
                                        title: item.Title, //argumentfield (Y axis: pen name)
                                    };
                                    newitem["start"] = new Date(record.SourceTimestamp.getTime() + timezoneOffset - ret.TimezoneDiff);
                                    newitem["end"] = new Date(record.SourceTimestamp.getTime() + timezoneOffset - ret.TimezoneDiff + moment.duration(samplingUnit[actualFilterType])); //getTime() = ms
                                    newitem["value"] = record.Value.toString();
                                    newitem["secondValue"] = ret.SecondValues[index2].Value.toString();
                                    pensDatasource["p" + index].unshift(newitem);
                                });
                            })
                            .catch(err => {
                                console.error("LoadHistoricalData Error:", err);
                            })
                            .finally(() => {
                                historicalDataPendingPens--;
                                if (historicalDataPendingPens == 0) {
                                    for (key in pensDatasource)
                                        [].unshift.apply(dataSource, pensDatasource[key]);
                                    chart.option("dataSource", dataSource);
                                    chart.endUpdate();
                                    updateWholeRange(serverNewDateTimeStart, serverNewDateTimeEnd);
                                    updateVisualRange(serverNewDateTimeStart, serverNewDateTimeEnd);
                                    bLoadingData = false;
                                    $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                                    zbackbtn.option("disabled", zoomHistory.length == 0 || thisParent.hasClass(disabledClass));
                                    setAutoRefresh();
                                }
                            });
                    }
                });
            }

            function changeLanguage() {
                if (dataGridInstance)
                    for (var i = 0; i < dataGridInstance.columnCount(); i++)
                        dataGridInstance.columnOption(i, "caption", translations[dataGridInstance.columnOption(i, "name")]());
                if (startDatebox)
                    startDatebox.option("hint", translations.StartDate());
                if (endDatebox)
                    endDatebox.option("hint", translations.EndDate());
                if (absbtn)
                    absbtn.option({
                        "text": translations.AbsoluteRanges(),
                        "hint": translations.AbsoluteRanges()
                    });
                if (zbackbtn)
                    zbackbtn.option({
                        "text": translations.ZoomBack(),
                        "hint": translations.ZoomBack(),
                    });
                if (fetchbtn)
                    fetchbtn.option({
                        "text": translations.FetchTitle(),
                        "hint": translations.FetchTitle()
                    });
                if (prevbtn)
                    prevbtn.option("hint", translations.PrevTitle());
                if (nextbtn)
                    nextbtn.option("hint", translations.NextTitle());
                if (refreshbtn)
                    refreshbtn.option("hint", translations.RefreshTitle());
                if (minbtn)
                    minbtn.option("hint", translations.MinTitle());
                if (hourbtn)
                    hourbtn.option("hint", translations.HourTitle());
                if (daybtn)
                    daybtn.option("hint", translations.DayTitle());
                if (weekbtn)
                    weekbtn.option("hint", translations.WeekTitle());
                if (monthbtn)
                    monthbtn.option("hint", translations.MonthTitle());
                if (legendTitle)
                    legendTitle.text(translations.LegendTitle());
            }

            function configureTimeButtons() {
                selectTimeCombo = thisPage.find("#timecombo").dxSelectBox({
                    items: timeComboItems,
                    value: timeComboItems[actualFilterType],
                    onInitialized: function (e) {
                        commandButtons.push(e.component);
                        var el = e.component.element();
                        var cssEdits = fontOptions;
                        if (parameters.Foreground.Color)
                            cssEdits["color"] = getSolidColor(parameters.ToolbarForeground);
                        el.css(cssEdits);
                        dynamicFontElements.push(el);
                        setTimeout(function () {
                            var input = el.find("input.dx-texteditor-input").first();
                            dynamicFontElements.push(input);
                            var inputCss = fontOptions;
                            inputCss.color = getSolidColor(parameters.ToolbarForeground);
                            input.css(inputCss);
                        }, 1); //on inner elements rendering
                    }
                }).dxSelectBox("instance");

                prevbtn = thisPage.find("#prevbtn").dxButton({
                    text: "<",
                    hint: translations.PrevTitle(),
                    type: "normal",
                    onClick: function (e) {
                        var selectedTimeMoment = selectTimeCombo.option('value').toLowerCase();
                        var newStart = moment(chart.option("valueAxis.visualRange.startValue")).subtract(1, selectedTimeMoment).toDate();
                        var newEnd = moment(chart.option("valueAxis.visualRange.endValue")).subtract(1, selectedTimeMoment).toDate();
                        updateWholeRange(newStart, newEnd);
                        updateVisualRange(newStart, newEnd);
                        loadHistoricalData(newStart, newEnd, true);
                    },
                    onContentReady: function (e) {
                        topBarHelper.setHeight($(e.component.element()));
                    }
                }).dxButton("instance");
                nextbtn = thisPage.find("#nextbtn").dxButton({
                    text: ">",
                    hint: translations.NextTitle(),
                    type: "normal",
                    onClick: function (e) {
                        var selectedTimeMoment = selectTimeCombo.option('value').toLowerCase();
                        var newStart = moment(chart.option("valueAxis.visualRange.startValue")).add(1, selectedTimeMoment).toDate();
                        var newEnd = moment(chart.option("valueAxis.visualRange.endValue")).add(1, selectedTimeMoment).toDate();
                        updateWholeRange(newStart, newEnd);
                        updateVisualRange(newStart, newEnd);
                        loadHistoricalData(newStart, newEnd, true);
                    }
                }).dxButton("instance");

                refreshbtn = thisPage.find("#refreshbtn").dxButton({
                    icon: "images/toolbox/refresh.svg",
                    hint: translations.RefreshTitle(),
                    type: "normal",
                    onClick: function (e) {
                        loadHistoricalData();
                    }
                }).dxButton("instance");

                absbtn = thisPage.find("#absoluterangesbtn").dxCheckBox({
                    text: translations.AbsoluteRanges(),
                    hint: translations.AbsoluteRanges(),
                    type: "normal",
                    value: parameters.UseAbsoluteRanges,
                    onValueChanged: function (data) {
                        bAbsoluteRanges = data.value;
                        if (!data.value) {
                            var endDate = new Date();
                            var selectedTimeMoment = selectTimeCombo.option('value').toLowerCase();
                            var startDate = moment(endDate).subtract(1, selectedTimeMoment).toDate();
                            updateWholeRange(startDate, endDate);
                            updateVisualRange(startDate, endDate);
                            loadHistoricalData(startDate, endDate);
                        }
                        else
                            loadHistoricalData();
                    }
                }).dxCheckBox("instance");

                zbackbtn = thisPage.find("#zoombackbtn").dxButton({
                    text: translations.ZoomBack(),
                    hint: translations.ZoomBack(),
                    type: "normal",
                    onClick: function (e) {
                        if (zoomHistory.length == 0)
                            return;

                        var lastZoom = zoomHistory.pop();
                        if (zoomHistory.length == 0) {
                            zbackbtn.option("disabled", true);
                        }
                        var newStart = lastZoom.start;
                        var newEnd = lastZoom.end;
                        updateWholeRange(newStart, newEnd);
                        updateVisualRange(newStart, newEnd);
                        actualFilterType = lastZoom.filterType;
                        loadHistoricalData(newStart, newEnd);
                    }
                }).dxButton("instance");
                monthbtn = thisPage.find("#monthbtn").dxButton({
                    text: "M",
                    hint: translations.MonthTitle(),
                    type: "normal",
                    onClick: function (e) {
                        actualFilterType = 4;
                        loadCurrentPeriodHistoricalData();
                    }
                }).dxButton("instance");
                weekbtn = thisPage.find("#weekbtn").dxButton({
                    text: "W",
                    hint: translations.WeekTitle(),
                    type: "normal",
                    onClick: function (e) {
                        actualFilterType = 3;
                        loadCurrentPeriodHistoricalData();
                    }
                }).dxButton("instance");
                daybtn = thisPage.find("#daybtn").dxButton({
                    text: "D",
                    hint: translations.DayTitle(),
                    type: "normal",
                    onClick: function (e) {
                        actualFilterType = 2;
                        loadCurrentPeriodHistoricalData();
                    }
                }).dxButton("instance");
                hourbtn = thisPage.find("#hourbtn").dxButton({
                    text: "H",
                    hint: translations.HourTitle(),
                    type: "normal",
                    onClick: function (e) {
                        actualFilterType = 1;
                        loadCurrentPeriodHistoricalData();
                    }
                }).dxButton("instance");
                minbtn = thisPage.find("#minutebtn").dxButton({
                    text: "m",
                    hint: translations.MinTitle(),
                    type: "normal",
                    onClick: function (e) {
                        actualFilterType = 0;
                        loadCurrentPeriodHistoricalData();
                    }
                }).dxButton("instance");

                //var localeFormat = (moment.localeData(navigator.language).longDateFormat('L') + ' ' + moment.localeData(navigator.language).longDateFormat('LTS')).replace(/D/g, "d").replace(/Y/g, "y").replace(/A/g, "a"); // https://js.devexpress.com/Documentation/Guide/Common/Value_Formatting/#Format_Widget_Values/Custom_Format_String
                
                startDatebox = thisPage.find("#startdatetime").dxDateBox({
                    type: "datetime",
                    hint: translations.StartDate(),
                    width: 270,
                    displayFormat: function (date) {
                        return moment(date).locale(navigator.language).format("L LTS");
                    },
                    onContentReady: function (e) {
                        var inputEl = e.component.element().find("input");
                        dynamicFontElements.push(inputEl);
                        inputEl.css(fontOptions);
                    }
                }).dxDateBox("instance");
                endDatebox = thisPage.find("#enddatetime").dxDateBox({
                    type: "datetime",
                    hint: translations.EndDate(),
                    width: 270,
                    displayFormat: function (date) {
                        return moment(date).locale(navigator.language).format("L LTS");
                    },
                    onContentReady: function (e) {
                        var inputEl = e.component.element().find("input");
                        dynamicFontElements.push(inputEl);
                        inputEl.css(fontOptions);
                    }
                }).dxDateBox("instance");
                fetchbtn = thisPage.find("#fetchbtn").dxButton({
                    text: translations.FetchTitle(),
                    hint: translations.FetchTitle(),
                    type: "normal",
                    onClick: function (e) {
                        if (!startDatebox || !endDatebox)
                            return;

                        var startDate = startDatebox.option("value");
                        var endDate = endDatebox.option("value");
                        if (startDate && endDate)
                            loadCurrentPeriodHistoricalData(startDate, endDate);
                    }
                }).dxButton("instance");
                return [refreshbtn, prevbtn, nextbtn, minbtn, hourbtn, daybtn, weekbtn, monthbtn, absbtn, zbackbtn, startDatebox, endDatebox, fetchbtn];
            }

            function loadCurrentPeriodHistoricalData(inputStartDate, inputEndDate) {
                var startDate = inputStartDate;
                var endDate = inputEndDate;
                if (!startDate || !endDate) {
                    if (!bAbsoluteRanges) {
                        endDate = new Date();
                        var selectedTimeMoment = timeComboItems[actualFilterType].toLowerCase();
                        startDate = moment(endDate).subtract(1, selectedTimeMoment).toDate();
                    }
                }
                loadHistoricalData(startDate, endDate);
            }

            function updateVisualRange(startDate, endDate, isArgumentAxis = false) {
                var axis = chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis");
                axis.visualRange = {};
                if (startDate != null) {
                    axis.visualRange.startValue = startDate;
                    if (startDatebox)
                        startDatebox.option("value", startDate);
                }
                if (endDate != null) {
                    axis.visualRange.endValue = endDate;
                    if (endDatebox)
                        endDatebox.option("value", endDate);
                }
                chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis", axis);
            }

            function updateWholeRange(startDate, endDate, isArgumentAxis = false) {
                var axis = chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis");
                axis.wholeRange = {};
                if (startDate != null)
                    axis.wholeRange.startValue = startDate;
                if (endDate != null)
                    axis.wholeRange.endValue = endDate;
                chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis", axis);
            }

            function InitializeLegend(chartComponent) {
                var dataGridContainer = thisPage.find("#legendDataGrid");
                if (legendHidden) {
                    dataGridContainer.css("display", "none");
                    return;
                }

                legendds = new DevExpress.data.DataSource({
                    store: {
                        type: 'array',
                        data: tempDataSource,
                        key: "id"
                    }
                });

                //dataGridContainer.height(thisParent.height() - 50 - trendcontainer.height() - 70);
                //dataGridContainer.width(thisParent.width() - 20);

                var thisPageHeight = thisPage.height();
                legendContainer = thisPage.find("#legendContainer");
                legendContainer.css({
                    "margin-top": thisPageHeight
                });
                legendTitle = thisPage.find("#legendTitle");
                legendTitle.text(translations.LegendTitle());
                if (scope.biOS) {
                    legendTitle.css("position", "absolute");
                    mainContainer.css("position", "relative");
                }

                legendPanelHelper = collapsibleLegendPanel(chartComponent, legendStatus, legendTitle, legendContainer, dataGridContainer, trendcontainer, thisPage, thisPageHeight, parentHeight, 80);
                legendPanelHelper.init();
                legendContainer.on("updateChartHeight", updateChartHeight);
                legendContainer.on("resetChartHeight", resetChartHeight);

                controlPropertiesDB.get(scope, controlStorageKey)
                    .then(function (res) {
                        if (!undefinedOrNull(res))
                            legendStatus.latestLegendHeight = res;
                        legendStatus.bLegendExpanded = res > 0;
                        if (legendStatus.bLegendExpanded) {
                            legendPanelHelper.openLegendAtHeight(legendStatus.latestLegendHeight);
                            updateChartHeight();
                        }
                    })
                    .catch(function (ex) { })
                    .finally(function (res) {
                        legendTitle.show();
                    });

                var columns = [
                    {
                        name: "Name",
                        dataField: "Name",
                        caption: translations.Name(),
                        cellTemplate: function (element, info) {
                            var container = $("<div></div>");
                            var valueIcons = "";
                            $.each(info.data.Name.Values, function (index, item) {
                                valueIcons += "<div style='display:inline-block;padding:5px;background-color:" + item.ControlBackground.Color + ";'></div>&nbsp;" + i18next.t1(item.Label) + "&nbsp;&nbsp;&nbsp;";
                            });
                            container.html(info.data.Name.Title + ": " + valueIcons);
                            element.append(container);
                        }
                    },
                    {
                        name: "TagNameColumn",
                        dataField: "Variable",
                        caption: translations.TagNameColumn()
                    },
                    {
                        name: "HistoricalNameColumn",
                        dataField: "HistorianDatalogger",
                        caption: translations.HistoricalNameColumn()
                    }
                ];

                $.each(columns, function (index, item) {
                    item.visible = true;
                    if (parameters.GridLayout && parameters.GridLayout.length > 0) {
                        var gridLayoutItem;
                        var gridLayoutItemIndex = parameters.GridLayout.findIndex(function (el) { return el.FieldName == item.dataField || el.ColumnTag == item.dataField });
                        if (gridLayoutItemIndex === -1)
                            item.visible = false;
                        else {
                            gridLayoutItem = parameters.GridLayout[gridLayoutItemIndex];
                            item.visibleIndex = gridLayoutItemIndex;
                        }
                    }
                    if (item.visible) {
                        if (gridLayoutItem) {
                            var actWidth = parseFloat(gridLayoutItem.ActualWidth);
                            if (!isNaN(actWidth)) {
                                item.width = gridLayoutItem.ActualWidth;
                            }
                            if (gridLayoutItem.SortIndex != -1 && gridLayoutItem.ColumnOrder != 0) {
                                item.sortIndex = gridLayoutItem.SortIndex;
                                item.sortOrder = gridLayoutItem.ColumnOrder == 1 ? "asc" : "desc";
                            }
                        }
                    }
                });

                dataGridInstance = dataGridContainer.dxDataGrid({
                    columns: columns,
                    width: "100%",
                    columnResizingMode: "widget",
                    allowColumnResizing: true,
                    dataSource: legendds,
                    loadPanel: {
                        enabled: true
                    },
                    scrolling: scrollingOptions,
                    paging: {
                        pageSize: 50,
                    },
                    onContentReady: function (e) {
                        e.component.option("loadPanel.enabled", false);
                        var el = e.component.element();
                        el.css(fontOptions);
                        el.find(".dx-header-row").css("color", getSolidColor(parameters.LegendAreaForeground));
                        el.find(".dx-data-row td").css("color", getSolidColor(parameters.LegendAreaForeground));
                        if (parameters.ToolbarBackground && parameters.Background) {
                            el.find(".dx-datagrid-headers td").css("background", parameters.ToolbarBackground.Color);
                            el.find(".dx-data-row td").css("background", parameters.Background.Color);
                        }
                    },
                    repaintChangesOnly: true,
                    selection: {
                        mode: "single"
                    },
                    hoverStateEnabled: true
                }).dxDataGrid("instance");

            }

            function resetChartHeight() {
                var fullHeight = $(thisParent).attr("height") - (legendHidden || !legendStatus.bLegendExpanded ? 90 : 200);
                if (!isNaN(parameters.PensHeight) && parameters.PensHeight > 0 && !isNaN(parameters.SeparatorHeight) && parameters.SeparatorHeight > 0)
                    fullHeight = parameters.SeparatorHeight * 2 + parameters.SeparatorHeight * (parameters.TPenList.length - 1) + parameters.PensHeight * parameters.TPenList.length;
                chart.option("size.height", fullHeight);
            }

            function updateChartHeight() {
                var newChartHeight = Math.max(0, parseFloat(chart.option("size.height")) - legendStatus.latestLegendHeight);
                chart.option("size.height", newChartHeight);
            }
        }
    </script>
</div>

<div id="RadialGauge" class="RadialGauge">
    <img src="cl.gif" alt="" onload="onRadialGaugeLoaded(this)" id="loadingImage" />

    <div id="radial"></div>

    <script>
        function onRadialGaugeLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var interval;
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
            });

            var aValues = [47.27, 65.32, 84.59, 71.86];

            var gaugecontainer = thisPage.find("#radial");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, gaugecontainer);

            var gauge = gaugecontainer.dxBarGauge({
                startValue: 0,
                endValue: 100,
                values: aValues,
                label: {
                    indent: 30,
                    format: {
                        type: "fixedPoint",
                        precision: 1
                    },
                    customizeText: function (arg) {
                        return arg.valueText + " %";
                    }
                },
                size: {
                    height: thisParent.height(),
                    width: thisParent.width(),
                }
            }).dxBarGauge("instance");

            interval = setInterval(function () {

                aValues[0] = Math.floor((Math.random() * 100) + 1);
                aValues[1] = Math.floor((Math.random() * 100) + 1);
                aValues[2] = Math.floor((Math.random() * 100) + 1);
                aValues[3] = Math.floor((Math.random() * 100) + 1);

                gauge.option("values", aValues);
            }, 2000);
        }
    </script>
</div>

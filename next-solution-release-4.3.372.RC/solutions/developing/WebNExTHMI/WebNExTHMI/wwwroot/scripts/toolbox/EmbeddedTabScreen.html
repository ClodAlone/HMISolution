<div id="EmbeddedTabScreen" class="EmbeddedTabScreen">
    <img src="cl.gif" alt="" onload="onEmbeddedTabScreenLoaded(this)" id="loadingImage" />

    <div id="edit"></div>

    <script>
        function onEmbeddedTabScreenLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            var thisParentY = thisParent.attr("y");
            var thisParentX = thisParent.attr("x");
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var deregisterListener;
            var deregisterListenerActiveLanguage;
            var observer;
            var screenNamesMap = [];

            $(thisPage).bind('destroyed', function () {
                if (deregisterListener)
                    deregisterListener();
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (observer)
                    observer.disconnect();
            });

            var parameters = JSON.parse(paratt);

            var thisPageId = thisParent.attr("id") + parameters.screenId;
            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var bIsInFittedParent = false;
            var editcontainer = thisPage.find("#edit");
            var webKitRenderCorrection;
            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, editcontainer);
                webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
                bIsInFittedParent = isInFittedParent(thisParent);
                var bRenderPositionMismatch = !parameters.bFitInWindow && thisParent[0].getBBox().y != thisParentY || thisParent[0].getBBox().x != thisParentX;
                if (webKitRenderCorrection || bRenderPositionMismatch) {
                    observer = new MutationObserver(function (mutations) {
                        if (bRenderPositionMismatch)
                            fixForeignObjectPositioning();
                    });
                    var observerConfig = { attributes: false, childList: true, subtree: webKitRenderCorrection, characterData: false };
                }
            }

            if (webKitRenderCorrection) {
                $(thisPage).removeClass("webKitRenderCorrection");
                //var matrixRegex = /matrix\((-?\d*\.?\d+),\s*0,\s*0,\s*(-?\d*\.?\d+),\s*0,\s*0\)/;
                //webKitTransform.width = parseFloat($(thisPage).css("transform").match(matrixRegex)[1]);
                //webKitTransform.height = parseFloat($(thisPage).css("transform").match(matrixRegex)[2]);
                $(thisPage).css({
                    //"transform": "none",
                    "transform-origin": "top left",
                    "position": "relative",
                    "width": "100%",
                    "height": "100%"
                });
            }

            var mutateFunc = function () {

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                }

                if (parameters.Screens.length == 1) {
                    var itemData = parameters.Screens[0];
                    var options = { name: itemData, isdocked: true, isInFittedParent: bIsInFittedParent };
                    parseScreenParameters(0, options);
                    if (observer)
                        observer.observe(editcontainer[0], observerConfig);
                    attachView(scope, editcontainer, 'screenView', JSON.stringify(options), false, true);
                }
                else {
                    deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                        $.each(screenNamesMap, function (i, el) {
                            thisPage.find(".tabtitle_" + thisPageId + i).text(i18next.t1(el));
                        });
                    });

                    var el;
                    var textAlignment = parameters.TextAlignment == 0 ? "left" : parameters.TextAlignment == 1 ? "right" : parameters.TextAlignment == 3 ? "justify" : "center";
                    
                    var tabPanelOptions = {
                        height: thisParent.height(), //webKitRenderCorrection ? thisParent[0].getBoundingClientRect().height : thisParent.height(),
                        width: thisParent.width(), //webKitRenderCorrection ? thisParent[0].getBoundingClientRect().width : thisParent.width(),
                        showNavButtons: true,
                        dataSource: parameters.Screens,
                        selectedIndex: 0,
                        loop: false,
                        animationEnabled: true,
                        swipeEnabled: true,
                        itemTitleTemplate: function (itemData, itemIndex, itemElement) {
                            var filename;
                            if (screenNamesMap.length <= itemIndex) {
                                filename = getScreenBaseName(itemIndex, itemData);
                                screenNamesMap.push(filename);
                            }
                            else
                                filename = screenNamesMap[itemIndex];

                            var tabItem = itemElement.parent();
                            tabItem.addClass("screen_" + itemIndex);
                            if (webKitRenderCorrection)
                                tabItem.css({
                                    //"transform": "matrix(" + webKitTransform.width + ", 0, 0, 1, 0, 0)",
                                    //"transform-origin": "top left",
                                    "border-width": "0px 0.5px",
                                    "border-style": "solid",
                                    "border-color": "#444"
                                });
                            itemElement.append("<span class='tabtitle_" + thisPageId + itemIndex + "'>" + i18next.t1(filename) + "</span>");
                        },
                        itemTemplate: function (itemData, itemIndex, itemElement) {
                            var options = { name: itemData, isdocked: true, isInFittedParent: bIsInFittedParent };
                            parseScreenParameters(itemIndex, options);
                            if (observer)
                                observer.observe(itemElement[0], observerConfig);
                            attachView(scope, itemElement, 'screenView', JSON.stringify(options), false, true);
                        },
                        onContentReady: function (e) {
                            el = e.component.element();
                            var elOptions = { "border": "none" };
                            var inputOptions = { "text-align": textAlignment, "padding": "2px 3px 2px 3px", "min-height": "0px" };
                            if (parameters.Background) {
                                inputOptions["background"] = parameters.Background.Color;
                                fastdom.mutate(function () {
                                    editcontainer.css("background", parameters.Background.Color);
                                });
                            }
                            if (parameters.Foreground)
                                inputOptions["color"] = getSolidColor(parameters.Foreground);
                            if (parameters.FontFamily)
                                elOptions["font-family"] = parameters.FontFamily;
                            if (parameters.FontSize)
                                elOptions["font-size"] = parameters.FontSize;
                            if (parameters.FontWeight)
                                inputOptions["font-weight"] = fontWeightConverter(parameters.FontWeight);

                            fastdom.measure(function () {
                                var input = el.find(".dx-texteditor-input");
                                var tabs = el.find(".dx-tabs-wrapper .dx-tab");
                                var selectedTab = el.find(".dx-tab-selected");
                                var tabsHeight = $(tabs[0]).css("height");
                                var tabsContainer = el.find(".dx-tabs");
                                var tabsContainerHasButtons = tabsContainer.hasClass("dx-tabs-nav-buttons");
                                var tabPanelTabs = el.find(".dx-tabpanel-tabs");
                                fastdom.mutate(function () {
                                    el.css(elOptions);
                                    input.css(inputOptions);

                                    if (parameters.TabBackground) {
                                        tabs.css("background-color", "transparent");
                                        selectedTab.css("background-color", parameters.TabBackground.Color)
                                    }
                                    if (parameters.Foreground)
                                        tabs.css("color", getSolidColor(parameters.Foreground))

                                    tabsContainer.css({ "background-color": "transparent", "border": "none" });
                                    if (!tabsContainerHasButtons) {
                                        tabPanelTabs.css("height", parseFloat(tabsHeight) + 1);
                                        let tabsWidth = [];
                                        let totalTabsWidth = 0;
                                        $(tabs).each(function (i, e) {
                                            var tw = parseFloat($(e).css("width"));
                                            totalTabsWidth += tw;
                                            tabsWidth.push(tw);
                                        });
                                        let printedTabsWidth = 0;
                                        $(tabs).each(function (i, e) {
                                            printedTabsWidth += tabsWidth[i];
                                            $(e).css({
                                                "position": "fixed",
                                                "width": "auto",
                                                "min-width": "140px",
                                                "right": (totalTabsWidth - printedTabsWidth) + "px"
                                            });
                                        });
                                    }
                                    else
                                        tabs.css({
                                            "width": "auto",
                                            "min-width": "140px"
                                        });
                                });
                            });
                        },
                        onSelectionChanged: function (e) {
                            if (parameters.TabBackground) {
                                var itemIndex = parameters.Screens.indexOf(e.addedItems[0]);
                                var selectedScreen = getScreenBaseName(itemIndex, e.addedItems[0]);
                                var el = e.component.element();
                                fastdom.mutate(function () {
                                    el.find(".dx-tab").css("background-color", "transparent");
                                    el.find(".dx-tab.screen_" + itemIndex).css("background-color", parameters.TabBackground.Color)
                                });
                            }
                        }
                    };

                    var tabPanel = editcontainer.dxTabPanel(tabPanelOptions).dxTabPanel("instance");
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function fixForeignObjectPositioning() {
                observer.disconnect();
                fastdom.measure(function () {
                    var container = editcontainer.find("#svgcontainer").first();
                    fastdom.mutate(function () {
                        //Fix for webkit wrong foreignObject positioning
                        //https://bugs.webkit.org/show_bug.cgi?id=23113
                        container.css("position", "fixed");
                    });
                });
            }

            function getScreenBaseName(itemIndex, screenPath) {
                var screenUrlSplit = parameters.Screens[itemIndex].split('?');
                if (screenUrlSplit.length > 2 && $.trim(screenUrlSplit[2]) != "")
                    return screenUrlSplit[2];
                screenPath = screenUrlSplit[0];
                var filename = screenPath.replace(/^.*[\\\/]/, '');
                var namesplit = filename.split('.');
                return namesplit[0];
            }

            function parseScreenParameters(itemIndex, options) {
                var screenUrlParamIndex = parameters.Screens[itemIndex].split('?');
                if (screenUrlParamIndex.length > 1) {
                    var screenUrlParam = screenUrlParamIndex[1];
                    options.name = screenUrlParamIndex[0];
                    options["parameter"] = screenUrlParam;
                }
                else if (parameters.parameter)
                    options["parameter"] = parameters.parameter;                
            }
        }
    </script>
</div>

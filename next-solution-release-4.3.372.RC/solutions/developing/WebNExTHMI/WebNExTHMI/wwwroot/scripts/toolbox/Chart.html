<div id="Chart" class="Chart" style="height:100%; overflow: hidden;">
    <img src="cl.gif" alt="" onload="onChartControlLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="buttonsContainer" style="padding: 5px;">
            <div class="topButton" id="resetbtn" style="float:left; margin-right: 5px;"></div>
            <div class="topButton" id="pushbtn" style="float:left; margin-right: 5px;"></div>
            <div class="topButton" id="seriesLabelsVisible" style="float:left; margin-right: 5px;"></div>
            <div class="topButton" id="legendAreaVisible" style="float:left; margin-right: 5px;"></div>
            <div class="topButton" id="simpleDiagram" style="float:left;"></div>
        </div>

        <div id="trendsContainer">
            <div id="trend" style="overflow: hidden; padding: 5px;"></div>
        </div>
    </div>

    <script>
        function onChartControlLoaded(obj) {

            var thisPage = $(obj).parent();
            var thisParent = thisPage.parent();
            thisParent.css("fill-opacity", 1);

            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            $(obj).remove();

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            var mainContainer = thisPage.find("#mainContainer");
            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
            }
            
            setOpacity(scope, thisParent, thisPage);

            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);

            var customFonts = [parameters.FontFamily, parameters.TitleFonstSettings.FontFamily, parameters.AxsisFontSettings.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            //var sampleNumber = timeRangeSeconds / (updateInterval / 1000);
            var trendcontainer = thisPage.find("#trend");
            var buttonsContainer = thisPage.find("#buttonsContainer");
            var topBarHelper = topBarButtonsHelper(parameters.AllowRuntimeChanges, buttonsContainer, parameters);
            var trendsContainerDiv = thisPage.find("#trendsContainer");

            var dataSource = new Array();
            var initialDataSource = new Array();
            var pensPointsData = [];
            var chartLastArgument;
            var sampleNumber = parseInt(parameters.SampleNumber, 10);
            var pens = [];
            var bEULimitsSet = false;
            //line step column scatter area
            var lineTypesMap = [
                "line",
                "stepline",
                "bar",
                "scatter",
                "area"
            ];
            var chart;
            var bPieModeOn = parameters.SimpleDiagram;
            var resetbtn;
            var pushbtn;
            var seriesLabelsVisible;
            var legendAreaVisible;
            var simpleDiagram;
            var pieCharts = [];
            var bLoadingData;
            var bSeriesLabelsVisible = parameters.SeriesLabelVisible;
            var bLegendAreaVisible = parameters.LegendAreaVisible;
            var firstReset = true;
            var translationsPrefix = "_Chart_";

            var fontStyle = "font-family:'" + parameters.FontFamily + "'; font-size:" + parameters.FontSize + "px; font-weight:" + fontWeightConverter(parameters.FontWeight) + "; color:" + getSolidColor(parameters.ToolbarForeground) + ";";

            var penColors = [];

            var translations = scope.setTranslations("Chart", [
                {
                    id: "SeriesLabelsVisible",
                    stringSuffix: "SeriesLabelVisibleTitle",
                    defValue: "Series labels visible"
                },
                {
                    id: "LegendAreaVisible",
                    stringSuffix: "LegendAreaVisible",
                    defValue: "Legend Area visible"
                },
                {
                    id: "SimpleDiagram",
                    stringSuffix: "SimplePieTitle",
                    defValue: "Simple Diagram"
                }
            ]);

            var commandButtons = [resetbtn, pushbtn, seriesLabelsVisible, legendAreaVisible, simpleDiagram];

            initializePens();

            initializeDataSource();

            var colorsMap = [
                "black",
                "green",
                "yellow",
                "aliceblue",
                "blue",
                "cyan",
                "darkcyan",
                "grey",
                "white",
                "pink",
                "bisque",
                "brown",
                "coral",
                "darkgrey",
                "purple",
                "salmon",
                "lightgreen"
            ];

            var singleChartsOptions = [];
            $.each(pens, function (index, item) {
                var newOptions = {
                    dataSource: dataSource, //store,
                    rotated: parameters.Rotated,
                    legend: {
                        visible: bLegendAreaVisible,
                        orientation: "horizontal",
                        verticalAlignment: parameters.LegendVerticalPosition < 3 ? "top" : "bottom",
                        horizontalAlignment: parameters.LegendHorizontalPosition < 2 ? "left" : (parameters.LegendHorizontalPosition > 2 ? "right" : "center"),
                        font: {
                            family: parameters.FontFamily,
                            size: parameters.FontSize,
                            weight: fontWeightConverter(parameters.FontWeight, true)
                        }
                    },
                    palette: penColors,
                    series: [JSON.parse(JSON.stringify(pens[index]))],
                    //seriesTemplate: {
                    //    nameField: "pen",
                    //    customizeSeries: function (itemName) {
                    //        var item = pens.filter(pen => { return pen.name == itemName; });
                    //        return item.length > 0 ? item[0] : null;
                    //    }
                    //},
                    commonSeriesSettings: {
                        argumentField: "arg",
                        point: {
                            visible: false,
                            size: 5,
                            hoverMode: "allArgumentPoints"
                        },
                        label: {
                            visible: bSeriesLabelsVisible,
                            customizeText: function (point) {
                                var labelText = bPieModeOn && parameters.ShowPercentValuesOnPieSerie ? point.percentText : point.valueText;
                                if (bPieModeOn)
                                    labelText = point.argument + ": " + labelText;
                                return labelText;
                            }
                        }
                    },
                    rotated: parameters.Rotated,
                    synchronizeMultiAxes: false,
                    tooltip: {
                        enabled: true,
                        shared: true,
                        customizeTooltip: tooltipFunction
                    },
                    onTooltipShown: function (e) {
                        if (parameters.bFitInWindow)
                            $($("body").find(".dxc-tooltip")).each(function (index, el) {
                                $(el).detach().appendTo($(thisParent));
                            });
                    },
                    //scrollBar: {
                    //    visible: true
                    //},
                    animation: {
                        enabled: false
                    },
                    zoomAndPan: {
                        valueAxis: "pan",
                        argumentAxis: "both",
                        dragToZoom: true,
                        allowMouseWheel: true,
                        panKey: "shift"
                    },
                    commonAxisSettings: {
                        grid: {
                            visible: true
                        }
                    },
                    argumentAxis: {
                        type: "continuous",
                        argumentType: "numeric",
                        title: {
                            text: i18next.t1(parameters.XTitle),
                            font: {
                                family: parameters.TitleFonstSettings.FontFamily,
                                size: parameters.TitleFonstSettings.FontSize,
                                weight: fontWeightConverter(parameters.TitleFonstSettings.FontWeight, true),
                                color: getSolidColor(parameters.TitleForeground)
                            }
                        },
                        label: {
                            font: {
                                family: parameters.AxsisFontSettings.FontFamily,
                                size: parameters.AxsisFontSettings.FontSize,
                                weight: fontWeightConverter(parameters.AxsisFontSettings.FontWeight, true),
                                color: getSolidColor(parameters.AxisLabelForeground)
                            }
                        }
                    },
                    valueAxis:
                    {
                        allowDecimals: true,
                        logarithmBase: parameters.LogarithmicBaseYScale,
                        valueType: "numeric",
                        title: {
                            text: i18next.t1(parameters.YTitle),
                            font: {
                                family: parameters.FontFamily,
                                size: parameters.FontSize,
                                weight: fontWeightConverter(parameters.FontWeight, true),
                                color: getSolidColor(parameters.TitleForeground)
                            }
                        },
                        label: {
                            font: {
                                family: parameters.AxsisFontSettings.FontFamily,
                                size: parameters.AxsisFontSettings.FontSize,
                                weight: fontWeightConverter(parameters.AxsisFontSettings.FontWeight, true),
                                color: getSolidColor(parameters.AxisLabelForeground)
                            }
                        }
                    },
                    size: {
                        height: $(thisParent).attr("height") - buttonsContainer[0].clientHeight - 12 - (parameters.BorderThickness.Top + parameters.BorderThickness.Bottom),
                        width: $(thisParent).attr("width") - 50
                    },
                    onDrawn: function (e) {
                        var titlefontStyle = parameters.TitleFonstSettings.FontStyle.toLowerCase();
                        if (titlefontStyle != "normal")
                            e.component.element().find(".dxc-val-title text, .dxc-arg-title text").css("font-style", titlefontStyle);
                        var labelsfontStyle = parameters.AxsisFontSettings.FontStyle.toLowerCase();
                        if (labelsfontStyle != "normal")
                            e.component.element().find(".dxc-val-elements text, .dxc-arg-elements text").css("font-style", labelsfontStyle);
                        if (parameters.TrendBackground.Color !== parameters.PlotBackground.Color) {
                            var valGroup = e.component.element().find(".dxc-val-grid");
                            if (valGroup.length > 0) {
                                var coords = valGroup[0].getBBox();
                                var newRect = SVG('<rect x="' + coords.x + '" y="' + coords.y + '" width="' + coords.width + '" height="' + coords.height + '" fill="' + parameters.PlotBackground.Color + '"></rect>');
                                valGroup.prepend(newRect.node);
                            }
                        }
                    },
                    //onInitialized: function (e) {
                    //}
                    customizePoint: function (point) {
                        if (!bPieModeOn)
                            return;
                        return {
                            color: colorsMap[point.argument % colorsMap.length]
                        }
                    }
                };
                delete newOptions.series[0]["type"];
                singleChartsOptions.push(newOptions);
            });

            if (!bPieModeOn)
                $.each(pens, function (index, item) {
                    item.type = pensPointsData[item.name].serieType;
                });
            var chartOptions = {
                dataSource: dataSource, //store,
                rotated: parameters.Rotated,
                legend: {
                    visible: bLegendAreaVisible,
                    orientation: "horizontal",
                    verticalAlignment: parameters.LegendVerticalPosition < 3 ? "top" : "bottom",
                    horizontalAlignment: parameters.LegendHorizontalPosition < 2 ? "left" : (parameters.LegendHorizontalPosition > 2 ? "right" : "center"),
                    font: {
                        family: parameters.AxsisFontSettings.FontFamily,
                        size: parameters.AxsisFontSettings.FontSize,
                        weight: fontWeightConverter(parameters.AxsisFontSettings.FontWeight, true),
                        color: getSolidColor(parameters.AxisLabelForeground)
                    },
                    customizeText: function (item) {
                        return i18next.t1(item.seriesName);
                    }
                },
                palette: penColors,
                series: pens,
                seriesTemplate: {
                    nameField: "pen",
                    customizeSeries: function (itemName) {
                        var item = pens.filter(pen => { return pen.name == itemName; });
                        return item.length > 0 ? item[0] : null;
                    }
                },
                commonSeriesSettings: {
                    argumentField: "arg",
                    point: {
                        visible: false,
                        size: 5,
                        hoverMode: "allArgumentPoints"
                    },
                    label: {
                        visible: bSeriesLabelsVisible
                    }
                },
                rotated: parameters.Rotated,
                synchronizeMultiAxes: false,
                tooltip: {
                    enabled: true,
                    shared: true,
                    customizeTooltip: tooltipFunction
                },
                onTooltipShown: function (e) {
                    if (parameters.bFitInWindow)
                        $($("body").find(".dxc-tooltip")).each(function (index, el) {
                            $(el).detach().appendTo($(thisParent));
                        });
                },
                scrollBar: {
                    visible: true
                },
                animation: {
                    enabled: false
                },
                zoomAndPan: {
                    valueAxis: "pan",
                    argumentAxis: "both",
                    dragToZoom: true,
                    allowMouseWheel: true,
                    panKey: "shift"
                },
                commonAxisSettings: {
                    grid: {
                        visible: true
                    }
                },
                argumentAxis: {
                    type: "continuous",
                    argumentType: "numeric",
                    title: {
                        text: i18next.t1(parameters.XTitle),
                        font: {
                            family: parameters.TitleFonstSettings.FontFamily,
                            size: parameters.TitleFonstSettings.FontSize,
                            weight: fontWeightConverter(parameters.TitleFonstSettings.FontWeight, true),
                            color: getSolidColor(parameters.TitleForeground)
                        }
                    },
                    label: {
                        font: {
                            family: parameters.AxsisFontSettings.FontFamily,
                            size: parameters.AxsisFontSettings.FontSize,
                            weight: fontWeightConverter(parameters.AxsisFontSettings.FontWeight, true),
                            color: getSolidColor(parameters.AxisLabelForeground)
                        }
                    }
                },
                valueAxis:
                {
                    allowDecimals: true,
                    logarithmBase: parameters.LogarithmicBaseYScale,
                    valueType: "numeric",
                    title: {
                        text: i18next.t1(parameters.YTitle),
                        font: {
                            family: parameters.FontFamily,
                            size: parameters.FontSize,
                            weight: fontWeightConverter(parameters.FontWeight, true),
                            color: getSolidColor(parameters.TitleForeground)
                        }
                    },
                    label: {
                        font: {
                            family: parameters.AxsisFontSettings.FontFamily,
                            size: parameters.AxsisFontSettings.FontSize,
                            weight: fontWeightConverter(parameters.AxsisFontSettings.FontWeight, true),
                            color: getSolidColor(parameters.AxisLabelForeground)
                        }
                    }
                },
                size: {
                    width: $(thisParent).attr("width") - 50
                },
                onDrawn: function (e) {
                    var titlefontStyle = parameters.TitleFonstSettings.FontStyle.toLowerCase();
                    if (titlefontStyle != "normal")
                        e.component.element().find(".dxc-val-title text, .dxc-arg-title text").css("font-style", titlefontStyle);
                    var labelsfontStyle = parameters.AxsisFontSettings.FontStyle.toLowerCase();
                    if (labelsfontStyle != "normal")
                        e.component.element().find(".dxc-val-elements text, .dxc-arg-elements text").css("font-style", labelsfontStyle);
                    if (parameters.TrendBackground.Color !== parameters.PlotBackground.Color) {
                        var valGroup = e.component.element().find(".dxc-val-grid");
                        if (valGroup.length > 0) {
                            var coords = valGroup[0].getBBox();
                            var newRect = SVG('<rect x="' + coords.x + '" y="' + coords.y + '" width="' + coords.width + '" height="' + coords.height + '" fill="' + parameters.PlotBackground.Color + '"></rect>');
                            valGroup.prepend(newRect.node);
                        }
                    }
                },
                //onInitialized: function (e) {
                //}
                customizePoint: function (point) {
                    if (!bPieModeOn)
                        return;
                    return {
                        color: colorsMap[point.argument % colorsMap.length]
                    }
                }
            };

            if (parameters.LogarithmicYScale)
                chartOptions.valueAxis["type"] = "logarithmic";

            var chart;

            var mutateFunc = function () {
                configureTheme();

                if (parameters.TrendBackground)
                    trendcontainer.css("background", parameters.TrendBackground.Color);
                else if (parameters.ControlBackground)
                    trendcontainer.css("background", parameters.ControlBackground.Color);
                if (parameters.ControlBackground)
                    thisPage.css("background", parameters.ControlBackground.Color);

                dynamicFontElements.push(...topBarHelper.styleButtons());

                if (parameters.Opacity)
                    trendcontainer.css("opacity", parameters.Opacity);

                $(thisParent).bind(disabledClassEvent, function () {
                    $(commandButtons).each(function (i, el) {
                        if (el) el.option("disabled", thisParent.hasClass(disabledClass));
                    });
                });

                pushbtn = thisPage.find("#pushbtn").dxButton({
                    icon: "images/toolbox/push.svg",
                    hint: "Push",
                    type: "normal",
                    onClick: function (e) {
                        pushExecute();
                    }
                }).dxButton("instance");

                resetbtn = thisPage.find("#resetbtn").dxButton({
                    icon: "images/toolbox/reset.svg",
                    hint: "Reset",
                    type: "normal",
                    onClick: function (e) {
                        resetExecute();
                    }
                }).dxButton("instance");

                seriesLabelsVisible = thisPage.find("#seriesLabelsVisible").dxButton({
                    text: translations.SeriesLabelsVisible(),
                    type: "normal",
                    onInitialized: function (e) {
                        if (bSeriesLabelsVisible)
                            $(e.component.element()).addClass("clicked");
                    },
                    onContentReady: function (e) {
                        topBarHelper.setHeight($(e.component.element()));
                    },
                    onClick: function (e) {
                        if (!chart || thisParent.hasClass(disabledClass))
                            return;
                        var elem = $(e.component.element());
                        elem.toggleClass("clicked");
                        bSeriesLabelsVisible = elem.hasClass("clicked");

                        $.each(getInitializedCharts(), function (i, el) {
                            el.option("commonSeriesSettings.label.visible", !el.option("commonSeriesSettings.label.visible"));
                        });
                    }
                }).dxButton("instance");

                legendAreaVisible = thisPage.find("#legendAreaVisible").dxButton({
                    text: translations.LegendAreaVisible(),
                    type: "normal",
                    onInitialized: function (e) {
                        if (bLegendAreaVisible)
                            $(e.component.element()).addClass("clicked");
                    },
                    onClick: function (e) {
                        if (!chart || thisParent.hasClass(disabledClass))
                            return;
                        var elem = $(e.component.element());
                        elem.toggleClass("clicked");
                        bLegendAreaVisible = elem.hasClass("clicked");

                        $.each(getInitializedCharts(), function (i, el) {
                            el.option("legend.visible", !el.option("legend.visible"));
                        });
                    }
                }).dxButton("instance");

                simpleDiagram = thisPage.find("#simpleDiagram").dxButton({
                    text: translations.SimpleDiagram(),
                    type: "normal",
                    onInitialized: function (e) {
                        if (bPieModeOn)
                            $(e.component.element()).addClass("clicked");
                    },
                    onClick: function (e) {
                        if (!chart || thisParent.hasClass(disabledClass))
                            return;

                        $(e.component.element()).toggleClass("clicked");

                        if (!bPieModeOn) {
                            bPieModeOn = true;
                            OnPieModeOn();
                        }
                        else {
                            bPieModeOn = false;
                            OnPieModeOff();
                        }
                    }
                }).dxButton("instance");

                if (parameters.Push && parameters.Push.SVGReferenceId) {
                    var pushListener = scope.$on(onDataChanged + parameters.screenId + parameters.Push.SVGReferenceId, function (e, value) {
                        if (bLoadingData)
                            return;

                        if (scope.dataValues[parameters.screenId][parameters.Push.SVGReferenceId].isGood) {
                            if (normalizeDataValue(scope.dataValues[parameters.screenId][parameters.Push.SVGReferenceId]).dataValue == 1)
                                pushExecute();
                        }
                    });
                    deregisterListeners.push(pushListener);
                }

                if (parameters.Reset && parameters.Reset.SVGReferenceId) {
                    var resetListener = scope.$on(onDataChanged + parameters.screenId + parameters.Reset.SVGReferenceId, function (e, value) {
                        if (bLoadingData)
                            return;

                        var item = scope.dataValues[parameters.screenId][parameters.Reset.SVGReferenceId];
                        if (item.isGood) {
                            if (firstReset) {
                                if (firstReset === true)
                                    firstReset = item;
                                if (item.sourceTimestamp == firstReset.sourceTimestamp && item.invariantValue == item.invariantValue) {
                                    checkResetTagValue(parameters.Reset, item.invariantValue);
                                    return;
                                }
                            }
                            resetExecute();
                            checkResetTagValue(parameters.Reset, item.invariantValue);
                        }
                        else
                            firstReset = item;
                    });
                    deregisterListeners.push(resetListener);
                }

                if (parameters.Zoom && parameters.Zoom.SVGReferenceId) {
                    var zoomListener = scope.$on(onDataChanged + parameters.screenId + parameters.Zoom.SVGReferenceId, function (e, value) {
                        if (bLoadingData)
                            return;

                        if (scope.dataValues[parameters.screenId][parameters.Zoom.SVGReferenceId].isGood) {
                            zoomExecute(scope.dataValues[parameters.screenId][parameters.Zoom.SVGReferenceId].invariantValue);
                        }
                    });
                    deregisterListeners.push(zoomListener);
                }

                chartOptions.size.height = $(thisParent).attr("height") - buttonsContainer[0].clientHeight - 12 - (parameters.BorderThickness.Top + parameters.BorderThickness.Bottom);
                chart = trendcontainer.dxChart(chartOptions).dxChart("instance");
                if (bPieModeOn)
                    OnPieModeOn();

                loadChartHistoricalData();

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                if (!bPieModeOn)
                    configureValueAxis();

                $.each(pens, function (index, item) {
                    //if (parameters.screenId in scope.dataValues && item.valueField in scope.dataValues[parameters.screenId] && scope.dataValues[parameters.screenId][item.valueField].isGood)
                    //    savePensLastValues(item);
                    var listener = scope.$on(onDataChanged + parameters.screenId + item.valueField, function (e, value) {
                        var bSeriesNeedsUpdate = false;
                        if (item.bValueIsInteger === undefined) {
                            bSeriesNeedsUpdate = true;
                            item.label = {
                                format: {
                                    type: "fixedPoint",
                                    precision: 0,
                                    percentPrecision: item.pointPrecision
                                }
                            };
                            var bIsInteger = null;
                            try {
                                if (scope.dataValues[parameters.screenId][item.valueField].isGood) {
                                    bIsInteger = scope.dataValues[parameters.screenId][item.valueField].bIsInteger;
                                    item.bValueIsInteger = bIsInteger;
                                }
                            }
                            catch { }
                            if (bIsInteger === false)
                                item.label.format.precision = item.pointPrecision;

                            item.label.customizeText = function (point) {
                                var labelText = bPieModeOn && parameters.ShowPercentValuesOnPieSerie ? point.percentText : point.valueText;
                                if (bPieModeOn)
                                    labelText = point.argument + ": " + labelText;
                                return labelText;
                            };
                        }

                        if (!bLoadingData && scope.dataValues[parameters.screenId][item.valueField].isGood) {
                            savePensLastValues(item);

                            var updatedCharts = [chart];
                            if (pieCharts.length > 0)
                                updatedCharts.push(pieCharts.find(function (el) { return el.name == item.name }).chart);

                            $.each(updatedCharts, function (i, ch) {
                                ch.beginUpdate();
                                if (!parameters.AutomaticScale && parameters.UseEUMinMaxValues) {
                                    if (!bEULimitsSet)
                                        configureValueAxis();
                                }
                                if (bSeriesNeedsUpdate)
                                    ch.option("series", pens);
                                ch.option("dataSource", dataSource);
                                ch.endUpdate();
                            });
                        }
                    });
                    deregisterListeners.push(listener);
                });

                var deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    changeLanguage();
                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        if (chart) {
                            var opt1 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("legend.font"));
                            var opt2 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("argumentAxis.title.font"));
                            var opt3 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("argumentAxis.label.font"));
                            var opt4 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("valueAxis.title.font"));
                            var opt5 = buildFontOptionsDevExtreme(parameters.FontSettingList[value], chart.option("valueAxis.label.font"));
                            chart.option({
                                "legend.font": opt1,
                                "argumentAxis.title.font": opt2,
                                "argumentAxis.label.font": opt3,
                                "valueAxis.title.font": opt4,
                                "valueAxis.label.font": opt5
                            });
                        }
                    }
                });
                deregisterListeners.push(deregisterListenerActiveLanguage);

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    var deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                    deregisterListeners.push(deregisterListener);
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function getInitializedCharts() {
                let charts = [];
                if (chart)
                    charts.push(chart);
                $.each(pieCharts, function (i, el) {
                    if (el.chart) {
                        delete el.chart.option("series")[0]["type"];
                        charts.push(el.chart);
                    }
                });
                return charts;
            }

            function OnPieModeOn() {
                try {
                    trendcontainer.hide();

                    if (pieCharts.length) {
                        $.each(pieCharts, function (index, elem) {
                            elem.container.show();
                        });
                        updateVisibleCharts();
                    }
                    else {
                        var newContainer;
                        var trendBg = trendcontainer.css("background");
                        $.each(singleChartsOptions, function (index, item) {
                            var newTrendId = "trend" + index;
                            newContainer = $("<div id='" + newTrendId + "' style='overflow: hidden; padding: 5px;'></div>").appendTo(trendsContainerDiv);
                            newContainer.css("background", trendBg);
                            delete item.series[0]["type"];
                            item.legend.visible = bLegendAreaVisible;
                            item.commonSeriesSettings.label.visible = bSeriesLabelsVisible;
                            pieCharts.push({
                                name: item.series[0].name,
                                chart: newContainer.dxPieChart(item).dxPieChart("instance"),
                                container: newContainer
                            });
                        });
                        newContainer.css("margin-bottom", (buttonsContainer[0].clientHeight + 10) + "px");
                        $.each(pieCharts, function (index, item) {
                            //setTimeout(function () { //necessary to fire "customizePoints"
                            item.chart.beginUpdate();
                            item.chart.option("dataSource", dataSource);
                            item.chart.endUpdate();
                            //}, 1);
                        });
                        var scrollOptions = {
                            scrollByContent: false,
                            showScrollbar: "always",
                            scrollByThumb: true,
                            onInitialized: function (e) {
                                e.component.element().find(".dx-scrollable-wrapper").css("background", trendBg);
                            }
                        };
                        trendsContainerDiv.dxScrollView(scrollOptions).dxScrollView("instance");
                    }
                }
                catch { }
            }

            function OnPieModeOff() {
                $.each(pieCharts, function (index, elem) {
                    elem.container.hide();
                });

                $.each(pens, function (index, item) {
                    item.type = pensPointsData[item.name].serieType;
                });

                if (trendcontainer.is(":hidden")) {
                    trendcontainer.show();
                    updateVisibleCharts();
                }
                else {
                    try {
                        trendcontainer.empty();
                        trendcontainer.removeData();
                        chart = trendcontainer.dxChart(chartOptions).dxChart("instance");
                        chart.beginUpdate();
                        chart.option("dataSource", dataSource);
                        configureValueAxis();
                        chart.endUpdate();
                    }
                    catch { }
                }
            }

            function loadChartHistoricalData() {
                if (bLoadingData)
                    return;
                bLoadingData = true;

                var historicalDataPendingPens = pens.filter(function (item) { return item.historicalName != null; }).length;
                if (historicalDataPendingPens == 0) {
                    bLoadingData = false;
                    return;
                }

                $(commandButtons).each(function (i, el) { if (el) el.option("disabled", true); });

                chart.beginUpdate();

                var pensDatasource = {};
                jQuery.each(pens, function (index, item) {
                    pensDatasource["p" + index] = [];
                    if (item.historicalName) {
                        scope.corehubconnection.invoke("LoadChartHistoricalData",
                            parameters.screenId, parseInt(parameters.CommandTimeout), parseInt(parameters.SampleNumber),
                            item.tagName, thisParent.attr("id"), item.historicalName)
                            .then((ret) => {
                                jQuery.each(ret.Values, function (index2, record) {
                                    var value = parseFloat(record.Value.toString());
                                    if (!isNaN(value)) {
                                        var newitem = getNewPoint(item.valueField, item.name, index2 + 1, value);
                                        pensDatasource["p" + index].push(newitem);
                                    }
                                });
                            })
                            .catch(err => {
                                console.error("LoadChartHistoricalData Error:", err);
                            })
                            .finally(() => {
                                historicalDataPendingPens--;
                                if (historicalDataPendingPens == 0) {
                                    for (key in pensDatasource) {
                                        $.each(pensDatasource[key], function (index2, point) {
                                            var penIndex = parseInt(key.substring(1), 10);
                                            var item = pens[penIndex];
                                            dataSource[pensPointsData[item.name].lastIndex] = point;
                                            pensPointsData[item.name].lastIndex = pensPointsData[item.name].lastIndex + pens.length;
                                        });
                                    }
                                    chart.endUpdate();

                                    $.each(pens, function (index, item) {
                                        pensPointsData[item.name].lastIndex = pensPointsData[item.name].firstIndex;
                                    });

                                    bLoadingData = false;
                                    $(commandButtons).each(function (i, el) { if (el) el.option("disabled", thisParent.hasClass(disabledClass)); });
                                }
                            });
                    }
                });
            }

            function tooltipFunction(info) {
                try {
                    return {
                        html: (function () {
                            var retHtml = "<div id='argumentDiv' tooltipArgument='" + chart._argumentAxes[0].getFormattedValue(info.points[0].originalArgument).replace(/<br\/?>/g, " ") + "'><div class='tooltip-body'>";
                            var point = info.points.find(function (item) { return item.argument == info.argument && item.seriesName == info.seriesName; });
                            if (!undefinedOrNull(point)) {
                                var pen = pens.find(function (el) { return el.name == point.seriesName });
                                var formattedValue = parseFloat(point.value);
                                var precision = pen.bValueIsInteger ? 0 : pen.pointPrecision;
                                if (precision > 0)
                                    formattedValue = parseFloat(Math.round(point.value * Math.pow(10, precision)) / Math.pow(10, precision)).toFixed(precision);
                                retHtml += "<div style=\"" + fontStyle + "\">";
                                retHtml += "<div>" + pen.name + ":</div>";
                                retHtml += "<div>" + i18next.t1("Point") + " = " + point.argument + "</div>";
                                retHtml += "<div>" + i18next.t1("Value") + " = " + formattedValue + "</div>";
                            }
                            retHtml += "</div>";
                            return retHtml;
                        })()
                    };
                }
                catch { }
            }

            function getNewPoint(SVGReferenceId, penName, argument, value) {
                var newItem = {
                    arg: argument,
                    pen: penName
                };
                newItem[SVGReferenceId] = value;
                return newItem;
            }

            function initializePens() {
                jQuery.each(parameters.PenList, function (index, item) {
                    var penName = i18next.t1(item.Name);
                    var color;
                    if (item.LColor) {
                        color = item.LColor;
                        penColors.push(color);
                    }
                    var pensOptions = {
                        valueField: item.SVGReferenceId,
                        color: color,
                        name: penName,
                        width: item.StrokeThickness,
                        //axis: item.Name,
                        minPlottedValue: 0,
                        maxPlottedValue: 0,
                        tagName: item.TagName,
                        historicalName: item.HistoricalName,
                        pointPrecision: parseFloat(item.PointPrecision == -1 ? parameters.PointPrecision : item.PointPrecision)
                    };
                    if (!bPieModeOn) {
                        pensOptions["type"] = lineTypesMap[parseInt(item.PenStyle, 10)];
                        if (pensOptions["type"] == "scatter") {
                            pensOptions["point"] = {
                                visible: true,
                                size: 10,
                                symbol: "square"
                            };
                        }
                    }
                    pens.push(pensOptions);
                });
                $.each(pens, function (index, item) {
                    pensPointsData[item.name] = { firstIndex: index + pens.length, lastIndex: index + pens.length, lastValue: null, bEULimitsSet: false, serieType: lineTypesMap[parseInt(parameters.PenList[index].PenStyle, 10)] }; //dynamic points begin at argument "1"
                });
            }

            function initializeDataSource() {
                var currentArgument = 0;
                for (var i = 0; i <= sampleNumber; i++) {
                    $.each(pens, function (index, item) {
                        dataSource.push(getNewPoint(item.valueField, item.name, currentArgument, null));
                    });
                    currentArgument++;
                }
                chartLastArgument = 1;
                initialDataSource = dataSource.slice();
            }

            function savePensLastValues(pen) {
                var SVGReferenceId = pen.valueField;
                var penName = pen.name;
                var newValue = Number.NaN;
                var bIsArray = false;
                if (parameters.screenId in scope.dataValues && SVGReferenceId in scope.dataValues[parameters.screenId] && scope.dataValues[parameters.screenId][SVGReferenceId].isGood) {
                    newValue = scope.dataValues[parameters.screenId][SVGReferenceId].invariantValue;
                    bIsArray = scope.dataValues[parameters.screenId][SVGReferenceId].bIsArray;
                }
                pensPointsData[penName].lastValue = newValue;

                if (bIsArray) {
                    var newValues = newValue.substring(1, newValue.length - 1).split("|");
                    dataSource = dataSource.filter(function (item) { return item.pen != penName; });
                    for (var i = 0; i < sampleNumber; i++) {
                        var point = getNewPoint(SVGReferenceId, penName, i + 1, parseFloat(newValues[i]));
                        dataSource.push(point);
                    }
                }
                else {
                    dataSource[pensPointsData[penName].lastIndex] = getNewPoint(SVGReferenceId, penName, chartLastArgument, newValue);
                }
            }

            function changeLanguage() {
                var resetKey = translationsPrefix + "ResetTitle";
                var pushKey = translationsPrefix + "PushTitle";
                var labelKey = translationsPrefix + "SeriesLabelVisibleTitle";
                var legendKey = translationsPrefix + "LegendAreaVisible";
                var pieKey = translationsPrefix + "SimplePieTitle";

                if (resetbtn)
                    resetbtn.option("hint", i18next.t1(resetKey, "Reset"));
                if (pushbtn)
                    pushbtn.option("hint", i18next.t1(pushKey, "Push"));
                if (i18next.exists(labelKey) && seriesLabelsVisible)
                    seriesLabelsVisible.option("text", translations.SeriesLabelsVisible());
                if (i18next.exists(legendKey) && legendAreaVisible)
                    legendAreaVisible.option("text", translations.LegendAreaVisible());
                if (i18next.exists(pieKey) && simpleDiagram)
                    simpleDiagram.option("text", translations.SimpleDiagram());

                if (chart) {
                    chart.option("argumentAxis.title.text", i18next.t1(parameters.XTitle));
                    chart.option("valueAxis.title.text", i18next.t1(parameters.YTitle));
                }
            }

            function configureValueAxis() {
                var vAxisObj = {
                    allowDecimals: true,
                    valueType: "numeric",
                    color: "#a3a3a3",
                    visualRangeUpdateMode: "keep",
                    logarithmBase: parameters.LogarithmicBaseYScale,
                    type: parameters.LogarithmicYScale ? "logarithmic" : "continuous",
                    endOnTick: false
                }
                var min = null;
                var max = null;
                if (!parameters.AutomaticScale) {
                    for (var i = 0; i < pens.length; i++) {
                        var penLow = parameters.PenList[i].Range.Low;
                        var penHigh = parameters.PenList[i].Range.High;
                        if (parameters.UseEUMinMaxValues) {
                            var bLowSet = false;
                            try {
                                if (!notNumeric(scope.dataValues[parameters.screenId][parameters.PenList[i].SVGReferenceId].rangeLow)) {
                                    penLow = Math.min(penLow, scope.dataValues[parameters.screenId][parameters.PenList[i].SVGReferenceId].rangeLow);
                                    bLowSet = true;
                                }
                                if (!notNumeric(scope.dataValues[parameters.screenId][parameters.PenList[i].SVGReferenceId].rangeHigh)) {
                                    penHigh = Math.max(penHigh, scope.dataValues[parameters.screenId][parameters.PenList[i].SVGReferenceId].rangeHigh);
                                    if (bLowSet)
                                        pensPointsData[pens[i].name].bEULimitsSet = true;
                                }
                            }
                            catch { }
                        }
                        if (min == null || penLow < min)
                            min = penLow;
                        if (max == null || penHigh > max)
                            max = penHigh;
                    }
                    bEULimitsSet = pens.filter(pen => { return pensPointsData[pen.name].bEULimitsSet == false; }).length == 0;
                }
                var scaleRangeObj = { startValue: (parameters.AutomaticScale ? null : min), endValue: (parameters.AutomaticScale ? null : max) };
                var updateAxis = false;
                try {
                    var oldValueAxis = chart.option("valueAxis");
                    updateAxis = !oldValueAxis["wholeRange"] || scaleRangeObj.startValue != oldValueAxis["wholeRange"].startValue || scaleRangeObj.endValue != oldValueAxis["wholeRange"].endValue;
                }
                catch { }
                if (updateAxis) {
                    vAxisObj["wholeRange"] = vAxisObj["visualRange"] = scaleRangeObj;
                    chart.option("valueAxis", vAxisObj);
                }
            }

            function configureTheme() {
                buttonsContainer.css({
                    "background": getThemeColors(scope).background,
                    "border-bottom": "2px solid " + getThemeColors(scope).background
                });
                if (scope.isLightTheme)
                    $('<style>#buttonsContainer .dx-button-content img { filter: invert(1); }</style>').appendTo('head');
            }

            function pushExecute() {
                if (thisParent.hasClass(disabledClass) || sampleNumber === 0)
                    return;
                chartLastArgument = chartLastArgument == sampleNumber ? 1 : chartLastArgument + 1;
                $.each(pens, function (index, item) {
                    if (chartLastArgument == 1)
                        pensPointsData[item.name].lastIndex = pensPointsData[item.name].firstIndex;
                    else //updating the next point of that pen in datasource
                        pensPointsData[item.name].lastIndex = pensPointsData[item.name].lastIndex + pens.length;
                    dataSource[pensPointsData[item.name].lastIndex] = getNewPoint(item.valueField, item.name, chartLastArgument, pensPointsData[item.name].lastValue);
                });
                updateVisibleCharts();
                try {
                    var item = scope.dataValues[parameters.screenId][parameters.Push.SVGReferenceId];
                    if (item.isGood)
                        checkResetTagValue(parameters.Push, item.invariantValue);
                }
                catch { }
            }

            function updateVisibleCharts() {
                if (bPieModeOn) {
                    $.each(pieCharts, function (index, item) {
                        //setTimeout(function () { //necessary to fire "customizePoints"
                        item.chart.beginUpdate();
                        item.chart.option("dataSource", dataSource);
                        item.chart.endUpdate();
                        //}, 1);
                    });
                }
                else {
                    chart.beginUpdate();
                    chart.option("dataSource", dataSource);
                    chart.endUpdate();
                }
            }

            function resetExecute() {
                if (thisParent.hasClass(disabledClass))
                    return;

                chartLastArgument = 1;
                $.each(pens, function (index, item) {
                    pensPointsData[item.name].firstIndex = index + pens.length;
                    pensPointsData[item.name].lastIndex = index + pens.length;
                    pensPointsData[item.name].lastValue = 0;
                });
                dataSource = initialDataSource;
                initialDataSource = dataSource.slice();

                $.each(pens, function (index, item) {
                    savePensLastValues(item);
                });

                updateVisibleCharts();
            }

            function checkResetTagValue(paramRef, value) {
                if (paramRef && paramRef.SVGReferenceId && (value.toLowerCase() == true.toString() || parseFloat(value) == 1)) {
                    var reference = paramRef.SVGReferenceId;
                    scope.corehubconnection.invoke("SetValue", reference, "0", parameters.screenId, false)
                        .then((ret) => {

                        })
                        .catch(err => {
                            console.error(err.toString());
                            scope.$broadcast(onError, { ex: err, value: "Error resetting reference : " + err.toString() + " for item : " + reference });
                        });
                }
            }

            function zoomExecute(invariantValue) {

            }
        }
    </script>
</div>

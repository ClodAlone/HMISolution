<div id="GridControl" class="GridControl">
    <img src="cl.gif" alt="" onload="onGridControlLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="topToolbar" style="width:100%;">
            <div id="bestfitbtn" style="margin: 5px;"></div>
        </div>

        <div id="activeFilterCriteriaContainer" class="dx-nav-item" style="padding: 5px 2.5px; display: none;">
            <div id="btnClearFilter"></div>
            <div id="activeFilterCriteria" style="margin-left: 2.5px; display: inline-block;"></div>
        </div>

        <div id="mainDataGrid" style="overflow: hidden;padding:5px;"></div>

        <div class="dataGridToolbar" style="text-align:center;padding:5px;">
            <div id="refreshbtn"></div>
            <div id="addbtn"></div>
            <div id="deletebtn"></div>
            <div id="savebtn"></div>
            <!--<div id="exportbtn"></div>-->
        </div>
    </div>

    <script>
        function onGridControlLoaded(obj) {
            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            var thisParentId = thisParent.attr("id");

            setOpacity(scope, thisParent, thisPage);

            var deregisterListenerActiveLanguage;
            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (deregisterListener)
                    deregisterListener();
            });

            var mainContainer = thisPage.find("#mainContainer");
            var scrollingOptions = {
                mode: webKitRenderCorrection ? "standard" : "virtual"
            };

            var parameters = JSON.parse(paratt);

            if (parameters.bFitInWindow)
                thisPage.addClass("fittedDataGrid");

            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                var bIsChrome = isChrome();
                var tapEvent = bIsChrome ? "mousedown" : "touchend";
            }
            if (scope.biOS || (isMobile.Android() && parameters.bFitInWindow)) {
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }

            var customFonts = [parameters.FontFamily, parameters.RowAreaFontSettings.FontFamily, parameters.HeaderFontSettings.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            var currentCulture = navigator.language;
            
            var mainGrid = thisPage.find("#mainDataGrid");
            var refreshbtnDiv = thisPage.find("#refreshbtn");
            var addbtnDiv = thisPage.find("#addbtn");
            var deletebtnDiv = thisPage.find("#deletebtn");
            var savebtnDiv = thisPage.find("#savebtn");
            var bestfitbtnDiv = thisPage.find("#bestfitbtn");
            var dataGridToolbar = thisPage.find(".dataGridToolbar");
            var topToolbar = thisPage.find("#topToolbar");
            //var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var bRequestDispatched;
            var columnListSettings = {};
            var gridPendingChanges = {};
            var thisGridID = thisParentId + parameters.screenId;
            var styleID = buildStyleID(thisPage, thisParentId, parameters.screenName);
            var columnDefaultValues;
            var columnDataTypes;
            var columnsInfo;
            var bCustomizingColumns;
            var currentCellInfo;
            var isDoubleClick;
            var bAddingRow;
            var lastSelectedRow;
            var tapped = false;
            var lastEditedCellInfo;
            var gridColumns = [];
            var translationsPrefix = "_DBControl_";
            var bHasDateTimeColumns;
            var backCellColor = parameters.FocusedRowBackground.Color;
            var foreCellColor = getSolidColor(parameters.FocusedRowForeground);

            var activeFilterCriteriaDiv = thisPage.find("#activeFilterCriteria");
            var activeFilterCriteriaContainerDiv = thisPage.find("#activeFilterCriteriaContainer");
            var btnClearFilterDiv = thisPage.find("#btnClearFilter");
            var parametersFilterCriteria = "";
            var parametersOriginalFilterCriteria = "";
            var parametersJSFilterCriteria;
            if (parameters.FilterCriteria) {
                parametersJSFilterCriteria = parameters.FilterCriteria.replace(/indexOf\((.*?)\)/g, "indexOf(\"$1\")").replace().replace(/(^|\s|\(+)itemData\.time /g, "$1itemData.timeticks ").replace(/(itemData\..*? [\!=]= )(.*?)(\s|$|\)+)/g, "$1\"$2\"$3");
                parametersFilterCriteria = parametersJSFilterCriteria;
                parametersOriginalFilterCriteria = parameters.OriginalFilterCriteria;
            }

            var bFirstLoading = true;
            var bestfitbtn;
            var refreshbtn;
            var addbtn;
            var deletebtn;
            var savebtn;

            var rowFontOptions = {};
            var headerFontOptions = {};

            var imageThresholdsMap = {};
            if (parameters.ImageThresholds && parameters.ImageThresholds.length > 0) {
                $.each(parameters.ImageThresholds, function (index, item) {
                    if (!(item.ColumnName in imageThresholdsMap))
                        imageThresholdsMap[item.ColumnName] = {};
                    var mapKey = "v" + item.ImageThresholdValue;
                    imageThresholdsMap[item.ColumnName][mapKey] = {
                        src: item.Value,
                        caption: item.ImageCaption == 0 ? "" : item.ImageThresholdValue,
                        captionAlignment: item.ImageCaption == 1 ? "top" : (item.ImageCaption == 2 ? "right" : (item.ImageCaption == 3 ? "bottom" : "left")),
                    }
                });
            }

            $.each(parameters.ControlDataSource.ColumnListSettings, function (index, item) {
                columnListSettings[item.ColName] = item;
            });

            if (parameters.FontFamily)
                rowFontOptions["font-family"] = headerFontOptions["font-family"] = parameters.FontFamily;
            if (parameters.FontSize)
                rowFontOptions["font-size"] = headerFontOptions["font-size"] = parameters.FontSize;
            if (parameters.FontWeight)
                rowFontOptions["font-weight"] = headerFontOptions["font-weight"] = fontWeightConverter(parameters.FontWeight);

            if (parameters.RowAreaFontSettings) {
                if (parameters.RowAreaFontSettings.FontFamily)
                    rowFontOptions["font-family"] = parameters.RowAreaFontSettings.FontFamily;
                if (parameters.RowAreaFontSettings.FontSize)
                    rowFontOptions["font-size"] = parameters.RowAreaFontSettings.FontSize;
                if (parameters.RowAreaFontSettings.FontWeight)
                    rowFontOptions["font-weight"] = fontWeightConverter(parameters.RowAreaFontSettings.FontWeight);
            }
            if (parameters.HeaderFontSettings) {
                if (parameters.HeaderFontSettings.FontFamily)
                    headerFontOptions["font-family"] = parameters.HeaderFontSettings.FontFamily;
                if (parameters.HeaderFontSettings.FontSize)
                    headerFontOptions["font-size"] = parameters.HeaderFontSettings.FontSize;
                if (parameters.HeaderFontSettings.FontWeight)
                    headerFontOptions["font-weight"] = fontWeightConverter(parameters.HeaderFontSettings.FontWeight);
            }

            var thisGridSelector = "foreignObject#" + thisParentId + ".GridControl";
            var additionalStyleRules = "";
            if (parameters.HeaderBackground)
                additionalStyleRules = thisGridSelector + " .dx-header-row td { background: " + parameters.HeaderBackground.Color + "; } ";

            if (parameters.RowAreaForeground)
                additionalStyleRules += thisGridSelector + " .dx-data-row td { color: " + getSolidColor(parameters.RowAreaForeground) + "; }";
            if (parameters.ShowCellsBorder && parameters.CellBorderColor)
                additionalStyleRules += thisGridSelector + " .dx-data-row td { border: 1px solid " + parameters.CellBorderColor.Color + "; }";
            else if (!parameters.ShowCellsBorder)
                additionalStyleRules += thisGridSelector + " .dx-datagrid .dx-column-lines > td { border: none; }";
            if (parameters.Background)
                additionalStyleRules += thisGridSelector + " div.dx-datagrid.dx-gridbase-container, " + thisGridSelector + " div.dx-toolbar-items-container { background: " + parameters.Background.Color + ";}";

            var dataGridOptions = {
                showBorders: true,
                columnResizingMode: "widget",
                disabled: thisParent.hasClass(disabledClass),
                width: "100%",
                columnAutoWidth: false,
                onCellClick: function (e) {
                    if (!e.row)
                        return;

                    currentCellInfo = {
                        columnIndex: e.columnIndex,
                        rowIndex: e.row.rowIndex,
                        isEditable: e.column.allowEditing
                    };
                    if (lastSelectedRow != e.row) {
                        if (lastSelectedRow) {
                            $.each(lastSelectedRow.cells, function (index, item) {
                                $(item.cellElement[0]).css({
                                    "color": getSolidColor(parameters.RowAreaForeground),
                                    "background": "unset"
                                });
                            });
                        }
                        lastSelectedRow = e.row;
                    }
                    $.each(e.row.cells, function (index, item) {
                        $(item.cellElement[0]).css({
                            "color": index == e.columnIndex && !parameters.RowSelectionMode ? getSolidColor(parameters.FocusedCellForeground) : foreCellColor,
                            "background": index == e.columnIndex && !parameters.RowSelectionMode ? parameters.FocusedCellBackground.Color : backCellColor,
                        });
                    });
                },
                //selection: {
                //    mode: "single"
                //},
                //onSelectionChanged: function (selectedItems) {
                //    console.log(selectedItems);
                //},
                editing: {
                    allowUpdating: parameters.AllowEdit,
                    allowAdding: parameters.AllowAddNew && parameters.AllowEdit,
                    allowDeleting: parameters.AllowRemove && parameters.AllowEdit,
                    mode: 'cell'
                },
                allowColumnReordering: true,
                allowColumnResizing: true,
                onRowPrepared: function (e) {
                    if (parameters.RowMinHeight) {
                        e.rowElement.css({ "height": parameters.RowMinHeight });
                        e.rowElement.children("td").css("vertical-align", "middle");
                    }
                },
                filterPanel: { visible: parameters.ShowFilterPanel },
                customizeColumns: function (columns) {
                    if (bCustomizingColumns)
                        return;
                    bCustomizingColumns = true;

                    gridColumns = columns;
                    $.each(columns, function (index, item) {
                        if (parameters.GridLayout && parameters.GridLayout.length > 0) {
                            var gridLayoutItem;
                            var gridLayoutItemIndex = parameters.GridLayout.findIndex(function (el) { return el.FieldName == item.dataField || el.ColumnTag == item.dataField });
                            if (gridLayoutItemIndex === -1 && item.dataField != " ")
                                item.visible = false;
                            else {
                                gridLayoutItem = parameters.GridLayout[gridLayoutItemIndex];
                                item.visibleIndex = gridLayoutItemIndex;
                            }
                        }
                        if (item.visible) {
                            if (gridLayoutItem) {
                                var actWidth = parseFloat(gridLayoutItem.ActualWidth);
                                if (!isNaN(actWidth)) {
                                    bBestFit = false;
                                    item.width = gridLayoutItem.ActualWidth;
                                }
                                if (gridLayoutItem.SortIndex != -1 && gridLayoutItem.ColumnOrder != 0) {
                                    item.sortIndex = gridLayoutItem.SortIndex;
                                    item.sortOrder = gridLayoutItem.ColumnOrder == 1 ? "asc" : "desc";
                                }
                            }

                            if (columnDataTypes[index]) {
                                var dataType = columnDataTypes[index].toString();
                                dataGrid.columnOption(item.dataField, 'caption', i18next.t1(columnListSettings[item.dataField].Caption));
                                dataGrid.columnOption(item.dataField, 'dataType', (dataType == "decimal" || dataType == "float") ? "number" : dataType);
                                if (dataType == "decimal" || dataType == "float") {
                                    if (dataType == "decimal" && columnsInfo != null && item.dataField in columnsInfo)
                                        dataGrid.columnOption(item.dataField, 'format', { type: "fixedPoint", precision: Math.min(columnsInfo[item.dataField].Precision, columnsInfo[item.dataField].Scale) });
                                    else
                                        dataGrid.columnOption(item.dataField, 'format', { type: "fixedPoint", precision: parameters.DefaultDigitNumber });
                                }
                            }
                            if (item.dataField in imageThresholdsMap) {
                                dataGrid.columnOption(item.dataField, 'cellTemplate', function (container, options) {
                                    if (!undefinedOrNull(options.value)) {
                                        var mapKey = "v" + options.value.toString();
                                        if (mapKey in imageThresholdsMap[item.dataField]) {
                                            var threshold = imageThresholdsMap[item.dataField][mapKey];
                                            $("<div>", { "class": "cellTemplateContainer", "style": "flex-wrap: " + (threshold.captionAlignment == "top" ? "wrap" : (threshold.captionAlignment == "bottom" ? "wrap-reverse" : "nowrap")) })
                                                .append($('<div class="cellImageCaption" style="flex-basis: ' + (threshold.captionAlignment == "top" || threshold.captionAlignment == "bottom" ? "100%" : "auto") + '; ' + (threshold.captionAlignment == 'right' ? 'order: 1;' : '') + '">' + threshold.caption + "</div>"))
                                                .append($("<img>", {
                                                    "class": "cellTemplateImg",
                                                    "src": threshold.src
                                                }))
                                                .appendTo(container);
                                        }
                                        else {
                                            var cellvalue = options.value;
                                            if (options.value instanceof Date) {
                                                cellvalue = moment(options.value).locale(currentCulture).format("L LT");
                                            }
                                            $(container).append(cellvalue);
                                        }
                                    }
                                });
                            }
                            else if (columnDataTypes[index] == "datetime") {

                                //var devExtremeLongDateFormat = moment.localeData(currentCulture).longDateFormat('L').replace(/Y/g, "y").replace(/D/g, "d");
                                //var devExtremeLongDateTimeFormat = devExtremeLongDateFormat + " " + moment.localeData(currentCulture).longDateFormat('LTS');

                                //dataGrid.columnOption(item.dataField, 'serializationFormat', devExtremeLongDateTimeFormat);
                                //dataGrid.columnOption(item.dataField, 'format', devExtremeLongDateTimeFormat /*'yyyy/MM/dd hh:mm:ss'*/);
                                bHasDateTimeColumns = parameters.ShowSearchPanel;
                                var cellTemplate = function (container, options) {
                                    var cellvalue = options.value;
                                    if (options.value instanceof Date)
                                        cellvalue = moment(options.value).locale(currentCulture).format("L LT");
                                    $(container).append(cellvalue);
                                };
                                dataGrid.columnOption(item.dataField, 'cellTemplate', cellTemplate);
                                dataGrid.columnOption(item.dataField, 'headerFilter', { allowSearch: true });
                            }
                        }
                    });

                    setTimeout(function () {
                        if (bHasDateTimeColumns)
                            dataGrid.option("filterRow.visible", true);
                        bestFit();
                    }, 1);

                    $.each(columns, function (index, item) {
                        if (item.dataField == " ")
                            item.allowEditing = false;
                        if (item.visible && columnListSettings[item.dataField]) {
                            item.visible = columnListSettings[item.dataField]["IsVisible"];
                            item.allowEditing = columnListSettings[item.dataField]["IsEditable"];
                            item.setCellValue = function (newData, value, currentRowData) {
                                newData[item.dataField] = value;
                                if ("__DATASET_ROWINDEX__" in currentRowData) {
                                    if (!gridPendingChanges["_edited"])
                                        gridPendingChanges["_edited"] = {};
                                    var dsRowIndex = "i" + currentRowData["__DATASET_ROWINDEX__"];
                                    if (!gridPendingChanges["_edited"][dsRowIndex])
                                        gridPendingChanges["_edited"][dsRowIndex] = {};
                                    gridPendingChanges["_edited"][dsRowIndex][item.dataField] = value;
                                }
                                else if ("__KEY__" in currentRowData) {
                                    var rowKey = currentRowData["__KEY__"];
                                    if (!gridPendingChanges["_added"])
                                        gridPendingChanges["_added"] = {};
                                    if (!gridPendingChanges["_added"][rowKey])
                                        gridPendingChanges["_added"][rowKey] = {};
                                    var newRowData = currentRowData;
                                    newRowData[item.dataField] = value;
                                    gridPendingChanges["_added"][rowKey] = newRowData;
                                }
                                checkEnableSaveBtn();
                            }
                        }
                    });
                    bCustomizingColumns = false;
                },
                errorRowEnabled: false,
                //onRowUpdated: function (e) {
                //    bDataGridDirty = true;
                //    console.log("ROWUPDATED", e, e.data);
                //var groupName = e.data.GroupName;
                //var recipeGuid = recipeNamesMap[lblRecipeCombo.option("value")];
                //var dataValueName = e.data.Name;
                //var dataValueValue = e.data.Value;
                //if (dataValueName in dataValueInfo && dataValueValue === "") //dataValueInfo[dataValueName].DataType != 11
                //    dataValueValue = dataValueInfo[dataValueName].DefaultValue;
                //addOrUpdateObjectProps(recipePendingChanges, [groupName, recipeGuid, dataValueName], dataValueValue);
                //},
                groupPanel: {
                    visible: parameters.ShowGroupPanel
                },
                searchPanel: { visible: parameters.ShowSearchPanel },
                grouping: {
                    contextMenuEnabled: parameters.ShowGroupPanel,
                    autoExpandAll: false
                },
                onInitialized: function (e) {
                    setTimeout(function () {
                        var el = e.component.element();
                        $(el).height($(thisParent).attr("height") - findRealHeight(activeFilterCriteriaContainerDiv) - (parameters.ShowCommandButtons ? dataGridToolbar.height() + 20 : 10) - topToolbar.height() - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
                    }, 1);
                },
                onContentReady: function (e) {
                    var el = e.component.element();
                    if (bFirstLoading) {
                        bFirstLoading = false;
                    }
                    if (parameters.ToolbarBackground)
                        el.find(".dx-datagrid-header-panel").css("background", parameters.ToolbarBackground.Color);
                    //el.find("div.dx-datagrid-search-panel").css(styleOptions);
                    el.find(".dx-datagrid-rowsview .dx-row > td").each(function (index, elem) {
                        if (!isEventBound(elem, "dblclick")) {
                            var onFunc = {
                                dblclick: function () {
                                    isDoubleClick = true;
                                    if (currentCellInfo.isEditable)
                                        e.component.editCell(currentCellInfo.rowIndex, currentCellInfo.columnIndex);
                                }
                            };
                            if (scope.biOS) {
                                onFunc[tapEvent] = function (ev) {
                                    if (!tapped) {
                                        if (e.component.getController("editing").isEditing() && lastEditedCellInfo != currentCellInfo) {
                                            e.component.cancelEditData();
                                        }
                                        tapped = setTimeout(function () {
                                            tapped = false
                                        }, 300);
                                    } else {
                                        isDoubleClick = true;
                                        clearTimeout(tapped);
                                        tapped = false;
                                        if (currentCellInfo.isEditable) {
                                            lastEditedCellInfo = currentCellInfo;
                                            if (bIsChrome) {
                                                setTimeout(function () {
                                                    e.component.editCell(currentCellInfo.rowIndex, currentCellInfo.columnIndex);
                                                }, 0);
                                            }
                                            else {
                                                e.component.editCell(currentCellInfo.rowIndex, currentCellInfo.columnIndex);
                                                e.component.focus(e.component.getCellElement(currentCellInfo.rowIndex, currentCellInfo.columnIndex));
                                            }
                                        }
                                    }
                                };
                            }
                            $(elem).on(onFunc);
                        }
                    });
                },
                onInitNewRow: function (e) {
                    bAddingRow = true;
                    for (var column in columnDefaultValues) {
                        e.data[column] = columnDefaultValues[column];
                    }
                    var rowKey = e.data["__KEY__"];
                    if (!gridPendingChanges["_added"])
                        gridPendingChanges["_added"] = {};
                    if (!gridPendingChanges["_added"][rowKey])
                        gridPendingChanges["_added"][rowKey] = {};
                    gridPendingChanges["_added"][rowKey] = e.data;
                    checkEnableSaveBtn();
                },
                onRowRemoving: function (e) {
                    if (!gridPendingChanges["_deleted"])
                        gridPendingChanges["_deleted"] = [];
                    if ("__DATASET_ROWINDEX__" in e.data) {
                        var dsRowIndex = e.data["__DATASET_ROWINDEX__"];
                        if (gridPendingChanges["_deleted"].indexOf(dsRowIndex) === -1) {
                            gridPendingChanges["_deleted"].push(dsRowIndex);
                            var editsRowIndex = "i" + dsRowIndex;
                            if (editsRowIndex in gridPendingChanges["_deleted"])
                                delete gridPendingChanges[editsRowIndex];
                        }
                    }
                    else if ("__KEY__" in e.data) {
                        var rowKey = e.data["__KEY__"];
                        if (rowKey in gridPendingChanges["_added"])
                            delete gridPendingChanges[rowKey];
                    }
                    checkEnableSaveBtn();
                },
                onEditingStart: function (e) {
                    if (parameters.RowSelectionMode) {
                        e.cancel = true;
                        return;
                    }
                    if (bAddingRow) {
                        bAddingRow = false;
                        return;
                    }
                    e.cancel = !isDoubleClick;
                    if (isDoubleClick) {
                        isDoubleClick = false;
                    }
                },
                //filterValue: parameters.FilterCriteria,
                scrolling: scrollingOptions,
                paging: {
                    pageSize: 50
                },
                filterRow: {
                    visible: false
                },
                loadPanel: {
                    enabled: true
                },
                noDataText: i18next.t1("NoDataText")
            };

            var commandButtons;
            var dataGrid;
            var mutateFunc = function () {
                var styleOptions = {
                    "font-family": parameters.FontFamily,
                    "font-size": parameters.FontSize + "px",
                    "font-weight": fontWeightConverter(parameters.FontWeight),
                    "color": getSolidColor(parameters.Foreground),
                };
                if (parameters.Background)
                    styleOptions["background"] = parameters.Background.Color;

                $.each(dataGridToolbar.find("div"), function (index, el) {
                    var elem = $(el);
                    elem.css(styleOptions);
                    dynamicFontElements.push(elem);
                });
                $.each(topToolbar.find("div"), function (index, el) {
                    var elem = $(el);
                    elem.css(styleOptions);
                    dynamicFontElements.push(elem);
                });

                if (!parameters.ShowColumnHeaders)
                    additionalStyleRules += thisGridSelector + " .dx-datagrid-headers { display: none; } ";

                setGridFontStyle();

                if (parameters.Background)
                    mainGrid.css("background", parameters.Background.Color);
                if (parameters.ToolbarBackground) {
                    dataGridToolbar.css("background", parameters.ToolbarBackground.Color);
                    topToolbar.css("background", parameters.ToolbarBackground.Color);
                }

                if (!parameters.ShowCommandButtons)
                    dataGridToolbar.hide();

                if (!parameters.ShowBestFitButton)
                    bestfitbtnDiv.hide();

                if (parametersJSFilterCriteria) {
                    activeFilterCriteriaContainerDiv.show();
                    let btnClearFilter = btnClearFilterDiv.dxCheckBox({
                        value: true,
                        onValueChanged: function (ea) {
                            parametersFilterCriteria = ea.value ? parametersJSFilterCriteria : null;
                            CreateDataSource();
                        }
                    }).dxCheckBox("instance");
                    activeFilterCriteriaDiv.text("[" + parametersOriginalFilterCriteria + "]");
                }

                bestfitbtn = bestfitbtnDiv.dxButton({
                    text: i18next.t1(translationsPrefix + "BestFit", "Best Fit"),
                    type: "normal",
                    visible: parameters.ShowBestFitButton,
                    disabled: true,
                    onClick: function (e) {
                        bestFit();
                    }
                }).dxButton("instance");

                var refreshOpts = {
                    type: "normal",
                    disabled: false,
                    width: $(refreshbtnDiv).css("width"),
                    onClick: function (e) {
                        CreateDataSource();
                    }
                };
                if (parameters.UseIcon)
                    refreshOpts.icon = "images/toolbox/refresh.svg";
                else
                    refreshOpts.text = i18next.t1(translationsPrefix + "ReloadData", i18next.t1("Reload Data"));
                refreshbtn = refreshbtnDiv.dxButton(refreshOpts).dxButton("instance");

                var addOpts = {
                    type: "normal",
                    disabled: true,
                    width: $(addbtnDiv).css("width"),
                    onClick: function (e) {
                        dataGrid.addRow();
                    }
                };
                if (parameters.UseIcon)
                    addOpts.icon = "images/toolbox/piu.svg";
                else
                    addOpts.text = i18next.t1(translationsPrefix + "InsertRow", i18next.t1("Insert Row"));
                addbtn = addbtnDiv.dxButton(addOpts).dxButton("instance");

                var deleteOpts = {
                    type: "normal",
                    disabled: true,
                    width: $(deletebtnDiv).css("width"),
                    onClick: function (e) {
                        if (currentCellInfo) {
                            if (currentCellInfo.rowIndex >= 0) {
                                dataGrid.deleteRow(currentCellInfo.rowIndex);
                            }
                        }
                    }
                };
                if (parameters.UseIcon)
                    deleteOpts.icon = "images/toolbox/redcross.svg";
                else
                    deleteOpts.text = i18next.t1(translationsPrefix + "DeleteRow", i18next.t1("Delete Row"));
                deletebtn = deletebtnDiv.dxButton(deleteOpts).dxButton("instance");

                var saveOpts = {
                    type: "normal",
                    disabled: true,
                    width: $(savebtnDiv).css("width"),
                    onClick: function (e) {
                        SaveAndReloadData();
                    }
                };
                if (parameters.UseIcon)
                    saveOpts.icon = "images/toolbox/save.svg";
                else
                    saveOpts.text = i18next.t1(translationsPrefix + "SaveData", i18next.t1("Save Data"));
                savebtn = savebtnDiv.dxButton(saveOpts).dxButton("instance");

                commandButtons = [bestfitbtn, refreshbtn, addbtn, deletebtn, savebtn];

                $(thisParent).bind(disabledClassEvent, function () {
                    $(commandButtons).each(function (i, el) {
                        if (el) el.option("disabled", thisParent.hasClass(disabledClass));
                        if (dataGrid) dataGrid.option("disabled", thisParent.hasClass(disabledClass));
                    });
                });

                dataGrid = mainGrid.dxDataGrid(dataGridOptions).dxDataGrid("instance");

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    currentCulture = value;
                    $.each(gridColumns, function (index, item) {
                        if (columnListSettings[item.dataField]) {
                            var columnKey = translationsPrefix + columnListSettings[item.dataField].Caption;
                            if (i18next.exists(columnKey))
                                dataGrid.columnOption(item.dataField, 'caption', i18next.t1(columnKey));
                        }
                    });
                    mainGrid.find("td[role=columnheader] .dx-datagrid-text-content").css("opacity", 1);
                    dataGrid.option("noDataText", i18next.t1("NoDataText"));

                    var bestFitKey = translationsPrefix + "BestFit";
                    if (i18next.exists(bestFitKey))
                        bestfitbtn.option("text", i18next.t1(bestFitKey));
                    if (!parameters.UseIcon) {
                        var reloadKey = translationsPrefix + "ReloadData";
                        if (i18next.exists(reloadKey))
                            refreshbtn.option("text", i18next.t1(reloadKey));
                        var insertKey = translationsPrefix + "InsertRow";
                        if (i18next.exists(insertKey))
                            addbtn.option("text", i18next.t1(insertKey));
                        var deleteKey = translationsPrefix + "DeleteRow";
                        if (i18next.exists(deleteKey))
                            deletebtn.option("text", i18next.t1(deleteKey));
                        var saveKey = translationsPrefix + "SaveData";
                        if (i18next.exists(saveKey))
                            savebtn.option("text", i18next.t1(saveKey));
                    }

                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        for (var cssProp in fontOpts) {
                            headerFontOptions[cssProp] = fontOpts[cssProp];
                            rowFontOptions[cssProp] = fontOpts[cssProp];
                        }
                        setGridFontStyle();
                    }
                });

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                }

                CreateDataSource();
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function setGridFontStyle() {
                var inlineHeaderFontOptions = "font-family: " + headerFontOptions["font-family"] + "; font-size: " + headerFontOptions["font-size"] + "; font-weight: " + headerFontOptions["font-weight"] + ";";
                if (parameters.HeaderForeground)
                    inlineHeaderFontOptions += "color: " + getSolidColor(parameters.HeaderForeground) + ";";

                var inlineRowsFontOptions = "font-family: " + rowFontOptions["font-family"] + "; font-size: " + rowFontOptions["font-size"] + "; font-weight: " + rowFontOptions["font-weight"] + ";";

                var dlStyle = $("#" + styleID);
                if (dlStyle.length > 0)
                    dlStyle.remove();
                $("<style id=\"" + styleID + "\">" + thisGridSelector + " .dx-header-row { " + inlineHeaderFontOptions + " } " + thisGridSelector + " .dx-data-row td, " + thisGridSelector + " div.dx-item-content, " + thisGridSelector + " .dx-datagrid-content input.dx-texteditor-input { " + inlineRowsFontOptions + " } " + additionalStyleRules + "</style>").appendTo("head");
            }

            function bestFit() {
                for (var i = 0; i < dataGrid.columnCount(); i++) {
                    if (dataGrid.columnOption(i, 'visible')) {
                        dataGrid.columnOption(i, 'width', !isNaN(gridColumns[i].width) ? gridColumns[i].width : 'auto');
                    }
                }
                dataGrid.option("columnAutoWidth", true);
                dataGrid.repaint();
                mainGrid.find("td[role=columnheader] .dx-datagrid-text-content").css("opacity", 1);
            }

            function checkEnableEditButtons(bEditingDisabled) {
                bestfitbtn.option("disabled", false);
                refreshbtn.option("disabled", false);
                if (parameters.AllowAddNew && parameters.AllowEdit && !bEditingDisabled)
                    addbtn.option("disabled", false);
                if (parameters.AllowRemove && parameters.AllowEdit && !bEditingDisabled)
                    deletebtn.option("disabled", false);
                checkEnableSaveBtn(bEditingDisabled);
            }

            function checkEnableSaveBtn(bEditingDisabled) {
                if (!savebtn.option("disabled"))
                    return;

                if (!bEditingDisabled && parameters.AllowEdit && !$.isEmptyObject(gridPendingChanges))
                    savebtn.option("disabled", false);
            }

            function SaveAndReloadData() {

                $(commandButtons).each(function (i, el) { if (el) el.option("disabled", true); });
                
                scope.corehubconnection.invoke("GridControlDBSave", parameters.screenId, thisGridID, gridPendingChanges)
                    .then((ret) => {
                        resetPendingChanges();
                        CreateDataSource();

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorDBDataSave") });

                        checkEnableEditButtons();

                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function CreateDataSource() {
                if (bRequestDispatched)
                    return;

                bRequestDispatched = true;
                var controlDataSource = parameters.ControlDataSource.ControlDataSource;
                if (!controlDataSource)
                    return;

                $(commandButtons).each(function (i, el) { if (el) el.option("disabled", true); });
                
                scope.corehubconnection.invoke("LoadDataGridData", parameters.screenId, thisGridID, parameters.CommandTimeout, parameters.ConnectionString, controlDataSource.DataProvider, controlDataSource.Connection, controlDataSource.Select, controlDataSource.Where, controlDataSource.GroupBy, controlDataSource.Sort, controlDataSource.TableName, parameters.MaxTransactionsBeforeCommit, parameters.AllowPrimaryKeyChanging)
                    .then((ret) => {
                        ret = JSON.parse(ret);
                        columnDefaultValues = ret.columnDefaultValues;
                        columnDataTypes = ret.columnDataTypes;
                        columnsInfo = ret.columnsInfo;

                        $(ret.Table).each(function (index, item) {
                            item["__DATASET_ROWINDEX__"] = index;
                            item[" "] = "";
                        });

                        updateDatasource(dataGrid, ret.Table, parametersFilterCriteria);

                        resetPendingChanges();

                        checkEnableEditButtons(ret.bConstraintsDisabled);

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorDBDataLoad") });

                        checkEnableEditButtons();

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .finally(() => {
                        bRequestDispatched = false;
                    });
            }

            function resetPendingChanges() {
                gridPendingChanges = {};
                savebtn.option("disabled", true);
            }
        }
    </script>
</div>

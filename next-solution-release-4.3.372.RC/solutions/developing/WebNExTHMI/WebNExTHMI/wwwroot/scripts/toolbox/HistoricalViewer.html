<div id="HistoricalViewer" class="HistoricalViewer">
    <img src="cl.gif" alt="" onload="onHistoricalViewerLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="buttonsContainer">
            <div>
                <div class="topButton" id="bestfitbtn" style="float:left; margin: 3px 3px 0px 3px;"></div>
                <span id="startTimeLbl" style="float:left; margin: 10px 5px;"></span>
                <div class="topButton" id="startdatetime" style="float: left;"></div>
                <span id="endTimeLbl" style="float:left; margin: 10px 5px;"></span>
                <div class="topButton" id="enddatetime" style="float: left;"></div>
                <div class="topButton" id="minutebtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="hourbtn" style="float: left; margin: 3px;"></div>
                <div class="topButton" id="daybtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="weekbtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="monthbtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="yearbtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="allbtn" style="float:left; margin: 3px;"></div>
                <div class="topButton" id="historianComboDiv" style="display: inline-block; margin: 3px;"></div>
            </div>
        </div>

        <div id="activeFilterCriteriaContainer" class="dx-nav-item" style="padding: 5px 2.5px; display: none;">
            <div id="btnClearFilter"></div>
            <div id="activeFilterCriteria" style="margin-left: 2.5px; display: inline-block;"></div>
        </div>

        <div id="mainGrid" style="overflow: hidden;"></div>
        <div id="refreshbtn"></div>
    </div>

    <!--<div class="grid" style="display: grid; grid-template-columns: auto auto;">
        <div id="startbtn"></div>
        <div id="pausebtn"></div>
    </div>
    <div id="legendDataGrid"></div>-->

    <script>
        function onHistoricalViewerLoaded(obj) {
            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            var thisParentId = thisParent.attr("id");
            var thisGridSelector = "#" + thisParentId + ".HistoricalViewer";

            var refreshPeriod = 0;
            var refreshTimeout;
            var lastTimerExecutedMS;

            setOpacity(scope, thisParent, thisPage);

            var deregisterListenerActiveLanguage;
            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (deregisterListener)
                    deregisterListener();
                if (refreshTimeout)
                    clearTimeout(refreshTimeout);
            });

            var mainContainer = thisPage.find("#mainContainer");
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            var scrollingOptions = {
                mode: "virtual"
            };

            var parameters = JSON.parse(paratt);

            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
            }
            if (scope.biOS || (isMobile.Android() && parameters.bFitInWindow)) {
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }
            
            var customFonts = [parameters.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            var currentCulture = navigator.language;
            var historianList = [""];
            var parametersFilterCriteria = "";
            var parametersOriginalFilterCriteria = "";
            var parametersJSFilterCriteria;
            if (parameters.FilterCriteria) {
                parametersJSFilterCriteria = parameters.FilterCriteria.replace(/indexOf\((.*?)\)/g, "indexOf(\"$1\")").replace().replace(/(^|\s|\(+)itemData\.time /g, "$1itemData.timeticks ").replace(/(itemData\..*? [\!=]= )(.*?)(\s|$|\)+)/g, "$1\"$2\"$3");
                parametersFilterCriteria = parametersJSFilterCriteria;
                parametersOriginalFilterCriteria = parameters.OriginalFilterCriteria;
            }

            var activeFilterCriteriaDiv = thisPage.find("#activeFilterCriteria");
            var activeFilterCriteriaContainerDiv = thisPage.find("#activeFilterCriteriaContainer");
            var btnClearFilterDiv = thisPage.find("#btnClearFilter");
            
            var mainGrid = thisPage.find("#mainGrid");
            var historianComboDiv = thisPage.find("#historianComboDiv");
            var btnMinDiv = thisPage.find("#minutebtn");
            var btnHourDiv = thisPage.find("#hourbtn");
            var btnDayDiv = thisPage.find("#daybtn");
            var btnWeekDiv = thisPage.find("#weekbtn");
            var btnMonthDiv = thisPage.find("#monthbtn");
            var btnYearDiv = thisPage.find("#yearbtn");
            var btnAllDiv = thisPage.find("#allbtn");
            var refreshbtnDiv = thisPage.find("#refreshbtn");
            var bestfitbtnDiv = thisPage.find("#bestfitbtn");
            var buttonsContainer = thisPage.find("#buttonsContainer");
            var filterType = ["None", "All", "Minute", "Hour", "Day", "Week", "Month", "Year"];
            var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var bRequestDispatched;
            var commandButtons = [];
            var translationPrefix = "_HistoricalViewer_";
            
            var translations = scope.setTranslations("HistoricalViewer", [
                {
                    id: "All",
                    stringSuffix: "All",
                    defValue: "All"
                },
                {
                    id: "Minute",
                    stringSuffix: "Minute",
                    defValue: "Minute"
                },
                {
                    id: "Hour",
                    stringSuffix: "Hour",
                    defValue: "Hour"
                },
                {
                    id: "Day",
                    stringSuffix: "Day",
                    defValue: "Day"
                },
                {
                    id: "Week",
                    stringSuffix: "Week",
                    defValue: "Week"
                },
                {
                    id: "Month",
                    stringSuffix: "Month",
                    defValue: "Month"
                },
                {
                    id: "Year",
                    stringSuffix: "Year",
                    defValue: "Year"
                },
                {
                    id: "Fit",
                    stringSuffix: "BestFit",
                    defValue: "Best Fit"
                },
                {
                    id: "Ref",
                    stringSuffix: "RefreshDataCommand",
                    defValue: "Refresh"
                },
                {
                    id: "Start",
                    stringSuffix: "DateTimeStart",
                    defValue: "Start Time"
                },
                {
                    id: "End",
                    stringSuffix: "DateTimeEnd",
                    defValue: "End Time"
                }
            ]);

            var fg = getSolidColor(parameters.Foreground);
            var fontOptions = {
                "font-family": parameters.FontFamily,
                "font-size": parameters.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.FontWeight),
                "color": fg
            };
            var buttonsContainerButtons = buttonsContainer.find("div");
            var topBarHelper = topBarButtonsHelper(true, buttonsContainer, parameters, fg);

            var startDatebox;
            var endDatebox;
            var refreshbtn;
            var historianCombo;

            var inlineOptions;
            var styleID = buildStyleID(thisPage, thisParentId, parameters.screenName);
            var gridStyle;
            var bCellsStyled;

            var dataGrid;
            var dataGridOptions = {
                showBorders: true,
                columnResizingMode: "widget",
                disabled: thisParent.hasClass(disabledClass),
                width: "100%",
                editing: {
                    allowUpdating: false,
                    allowAdding: false,
                    allowDeleting: false,
                    mode: 'cell'
                },
                allowColumnReordering: true,
                allowColumnResizing: true,
                //onRowPrepared: function (e) {
                //    if (e.rowType != 'data')
                //        return;
                //    else if (e.data.needsAcknoledge) {
                //        arrayrow.push(e.rowElement);
                //    }
                //},
                //focusedRowEnabled: true,
                errorRowEnabled: false,
                groupPanel: {
                    visible: true
                },
                grouping: {
                    contextMenuEnabled: true,
                    autoExpandAll: false
                },
                filterPanel: { visible: true },
                searchPanel: { visible: parameters.ShowSearchPanel },
                onInitialized: function (e) {
                    setTimeout(function () {
                        var el = e.component.element();
                        updateGridHeight(el);
                    }, 1);
                },
                onContentReady: function (e) {
                    var el = e.component.element();

                    fastdom.mutate(function () {
                        if (parameters.Background) {
                            el.find(".dx-toolbar").css("background", parameters.Background.Color);
                            el.find(".dx-datagrid").css("background", parameters.Background.Color);
                        }

                        if (parameters.ShowCellsBorder && parameters.CellBorderColor)
                            el.find(".dx-data-row td").css("border", "1px solid " + parameters.CellBorderColor.Color);
                    });

                    if (!bCellsStyled) {
                        if ($(".dx-data-row td").length > 0) {
                            bCellsStyled = true;
                            var cellsStyle = thisGridSelector + " .dx-data-row td {border-width: 1px; border-style: solid; border-color: " + $(".dx-data-row td").css("border-right-color") + ";}";
                            if (gridStyle)
                                fastdom.mutate(function () {
                                    gridStyle[0].sheet.insertRule(cellsStyle);
                                });
                        }
                    }
                },
                //filterValue: parameters.FilterCriteria,
                scrolling: scrollingOptions,
                //filterRow: {
                //    visible: parameters.ShowFilterPanel ? true : false
                //},
                loadPanel: {
                    enabled: true
                },
                columns: loadColumns(),
                noDataText: i18next.t1("NoDataText")
            };

            var mutateFunc = function () {
                dynamicFontElements.push(...topBarHelper.styleButtons());

                buttonsContainerButtons.css(fontOptions);
                $.each(buttonsContainerButtons, function (index, el) {
                    dynamicFontElements.push($(el));
                });
                if (parameters.Background) {
                    buttonsContainerButtons.css("background", parameters.Background.Color);
                    if (!webKitRenderCorrection)
                        thisParent.css("background", parameters.Background.Color);
                }

                refreshbtnDiv.css(fontOptions);
                dynamicFontElements.push(refreshbtnDiv);
                if (parameters.Background)
                    refreshbtnDiv.css("background", parameters.Background.Color);

                setGridFontStyle();

                var tf = getSolidColor(parameters.ToolbarForeground);
                thisPage.find("#startTimeLbl").text(translations.Start()).css("color", tf);
                thisPage.find("#endTimeLbl").text(translations.End()).css("color", tf);

                var now = new Date();
                startDatebox = thisPage.find("#startdatetime").dxDateBox({
                    type: "datetime",
                    value: now,
                    onContentReady: function (e) {
                        e.component.element().css("width", (e.component.element().width() * 0.78) + "px");
                    }
                }).dxDateBox("instance");
                endDatebox = thisPage.find("#enddatetime").dxDateBox({
                    type: "datetime",
                    value: now,
                    onContentReady: function (e) {
                        e.component.element().css("width", (e.component.element().width() * 0.78) + "px");
                    }
                }).dxDateBox("instance");

                var btnMin = btnMinDiv.dxButton({
                    text: translations.Minute(),
                    hint: translations.Minute(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Minute");
                    }
                }).dxButton("instance");
                var btnHour = btnHourDiv.dxButton({
                    text: translations.Hour(),
                    hint: translations.Hour(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Hour");
                    }
                }).dxButton("instance");
                var btnDay = btnDayDiv.dxButton({
                    text: translations.Day(),
                    hint: translations.Day(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Day");
                    }
                }).dxButton("instance");
                var btnWeek = btnWeekDiv.dxButton({
                    text: translations.Week(),
                    hint: translations.Week(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Week");
                    }
                }).dxButton("instance");
                var btnMonth = btnMonthDiv.dxButton({
                    text: translations.Month(),
                    hint: translations.Month(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Month");
                    }
                }).dxButton("instance");
                var btnYear = btnYearDiv.dxButton({
                    text: translations.Year(),
                    hint: translations.Year(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("Year");
                    }
                }).dxButton("instance");
                var btnAll = btnAllDiv.dxButton({
                    text: translations.All(),
                    hint: translations.All(),
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        CreateDataSource("All");
                    }
                }).dxButton("instance");
                var bestfitbtn = bestfitbtnDiv.dxButton({
                    text: translations.Fit(),
                    hint: translations.Fit(),
                    type: "normal",
                    disabled: true,
                    onContentReady: function (e) {
                        topBarHelper.setHeight($(e.component.element()));
                    },
                    onClick: function (e) {
                        for (var i = 0; i < dataGrid.columnCount(); i++) {
                            if (dataGrid.columnOption(i, 'visible')) {
                                dataGrid.columnOption(i, 'width', 'auto');
                            }
                        }
                        dataGrid.option("columnAutoWidth", true);
                        dataGrid.repaint();
                    }
                }).dxButton("instance");
                refreshbtn = refreshbtnDiv.dxButton({
                    text: translations.Ref(),
                    hint: translations.Ref(),
                    type: "normal",
                    disabled: true,
                    width: $(refreshbtnDiv).css("width"),
                    onClick: function (e) {
                        RefreshData();
                    }
                }).dxButton("instance");

                if (parametersJSFilterCriteria) {
                    activeFilterCriteriaContainerDiv.show();
                    let btnClearFilter = btnClearFilterDiv.dxCheckBox({
                        value: true,
                        onValueChanged: function (ea) {
                            parametersFilterCriteria = ea.value ? parametersJSFilterCriteria : null;
                            //dataGrid.clearFilter();
                            RefreshData();
                        }
                    }).dxCheckBox("instance");
                    activeFilterCriteriaDiv.text("[" + parametersOriginalFilterCriteria + "]");
                }

                Array.prototype.push.apply(commandButtons, [btnMin, btnHour, btnDay, btnWeek, btnMonth, btnYear, btnAll, bestfitbtn, refreshbtn, startDatebox, endDatebox]);

                if (parameters.ToolbarBackground) {
                    buttonsContainer.css("background", parameters.ToolbarBackground.Color);
                    buttonsContainerButtons.css("background", parameters.ToolbarBackground.Color);
                }

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                dataGrid = mainGrid.dxDataGrid(dataGridOptions).dxDataGrid("instance");

                historianCombo = historianComboDiv.dxSelectBox({
                    disabled: true,
                    onInitialized: function (e) {
                        commandButtons.push(e.component);
                        var el = e.component.element();
                        var cssEdits = fontOptions;
                        if (parameters.ToolbarForeground.Color)
                            cssEdits["color"] = tf;
                        dynamicFontElements.push(el);
                        el.css(cssEdits);
                        setTimeout(function () {
                            var input = el.find("input.dx-texteditor-input").first();
                            var inputCss = fontOptions;
                            inputCss.color = tf;
                            dynamicFontElements.push(input);
                            input.css(inputCss);
                        }, 1); //on inner elements rendering
                    },
                    onValueChanged: function (e) {
                        if (e.previousValue != null)
                            CreateDataSource("None", true);
                    }
                }).dxSelectBox("instance");

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    currentCulture = value;

                    jQuery.each(parameters.GridLayout, function (index, item) {
                        let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                        dataGrid.columnOption(index, 'caption', i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix)));
                    });

                    dataGrid.option("columns", loadColumns());
                    dataGrid.option("noDataText", i18next.t1("NoDataText"));

                    thisPage.find("#startTimeLbl").text(translations.Start());
                    thisPage.find("#endTimeLbl").text(translations.End());
                    btnMin.option({ "text": translations.Minute(), "hint": translations.Minute() });
                    btnHour.option({ "text": translations.Hour(), "hint": translations.Hour() });
                    btnDay.option({ "text": translations.Day(), "hint": translations.Day() });
                    btnWeek.option({ "text": translations.Week(), "hint": translations.Week() });
                    btnMonth.option({ "text": translations.Month(), "hint": translations.Month() });
                    btnYear.option({ "text": translations.Year(), "hint": translations.Year() });
                    btnAll.option({ "text": translations.All(), "hint": translations.All() });
                    bestfitbtn.option({ "text": translations.Fit(), "hint": translations.Fit() });
                    refreshbtn.option({ "text": translations.Ref(), "hint": translations.Ref() });

                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        for (var cssProp in fontOpts)
                            fontOptions[cssProp] = fontOpts[cssProp];
                        setGridFontStyle();
                    }
                });

                $(thisParent).bind(disabledClassEvent, function () {
                    dataGrid.option("disabled", thisParent.hasClass(disabledClass));
                    $(commandButtons).each(function (i, el) {
                        if (el) el.option("disabled", thisParent.hasClass(disabledClass));
                    });
                });

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                }

                InitValues();
            };
            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function setGridFontStyle() {
                inlineOptions = Object.entries(fontOptions).map(function (kv) { return (`${kv[0]}:${kv[1]}`) }).join(';') + ";";
                var dlStyle = $("#" + styleID);
                if (dlStyle.length > 0)
                    dlStyle.remove();
                gridStyle = $("<style id=\"" + styleID + "\">" + thisGridSelector + " .dx-datebox-datetime input, " + thisGridSelector + " div.dx-item-content, " + thisGridSelector + " .dx-header-row, " + thisGridSelector + " .dx-data-row td, " + thisGridSelector + " div.dx-item-content, " + thisGridSelector + " input.dx-texteditor-input { " + inlineOptions + " }</style>").appendTo("head");
            }

            function RefreshData(bAutoRefresh = false) {
                CreateDataSource("None", true, bAutoRefresh);
            }

            function SetRefreshTimeout(period) {
                if (period <= 0)
                    RefreshData(true);
                else {
                    refreshTimeout = setTimeout(function () {
                        RefreshData(true);
                    }, period);
                 }
             }
 
            function GetRemainingRefreshTime() {
                return refreshPeriod - ((new Date()).getTime() - lastTimerExecutedMS);
            }

            function InitValues() {
                scope.corehubconnection.invoke("InitHistoricalValues", parameters.screenId, parameters.ShowAuditTrace)
                    .then((ret) => {
                        historianList = ret;
                        historianCombo.option({
                            "items": historianList,
                            "disabled": thisParent.hasClass(disabledClass)
                        });
                        if (parameters.ShowAuditTrace && parameters.AuditTraceName && historianList.indexOf(parameters.AuditTraceName) !== -1)
                            historianCombo.option("value", parameters.AuditTraceName);
                        else if (parameters.HistoricalName && historianList.indexOf(parameters.HistoricalName) !== -1)
                            historianCombo.option("value", parameters.HistoricalName);

                        var rp = parseFloat(parameters.RefreshTimeout);
                        if (rp > 0) {
                            refreshPeriod = rp * 1000;
                            SetRefreshTimeout(refreshPeriod);
                        }

                        CreateDataSource(filterType[parseFloat(parameters.FilterType) + 1]);

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorDBDataLoad") });

                        $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                        
                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function loadColumns() {
                var columns = [];
                jQuery.each(parameters.GridLayout, function (index, item) {
                    var actWidth = parseFloat(item.ActualWidth);
                    let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                    let colCaption = i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix));
                    var col = { dataField: item.ColumnTag ? item.ColumnTag : item.FieldName, caption: colCaption, allowEditing: false };
                    if (!isNaN(actWidth))
                        col["width"] = item.ActualWidth;
                    if (col.dataField == "RecordDateTime") {
                        col.dataType = "date";
                        col.format = {
                            formatter: function (originalValue) {
                                var ret = moment(originalValue).subtract(timezoneOffset, "ms").locale(currentCulture).format("L LTS");
                                return ret;
                            }
                        };
                    }
                    setColumnOrdering(item, col);
                    columns.push(col);
                });
                return columns;
            }

            function CreateDataSource(rangeType, bRefresh = false, bAutoRefresh = false) {
                if (bRequestDispatched)
                    return;
                bRequestDispatched = true;

                if (!rangeType)
                    rangeType = "None";
                var startDateTime = null;
                var endDateTime = null;
                if (bRefresh) {
                    if (startDatebox.option("value") >= endDatebox.option("value")) {
                        scope.$broadcast(onError, { ex: null, value: thisParentId + ": " + i18next.t1("EndDateMustBeGreater") });
                        bRequestDispatched = false;
                        scope.$apply();
                        return;
                    }
                    startDateTime = moment(startDatebox.option("value").getTime() - timezoneOffset).unix();
                    endDateTime = moment(endDatebox.option("value").getTime() - timezoneOffset).unix();
                }

                if (bAutoRefresh)
                    lastTimerExecutedMS = (new Date()).getTime();

                scope.corehubconnection.invoke("LoadHistoricalViewerData", parameters.ConnectionString, parameters.screenId, parameters.ShowAuditTrace, historianList, historianCombo.option("value"), parameters.MaxRows, parameters.CommandTimeout, rangeType, startDateTime, endDateTime)
                    .then((ret) => {
                        var dateTimeStart = moment(ticksToTimestamp(ret.StartDateTimeTicks) + timezoneOffset).toDate();
                        var dateTimeEnd = moment(ticksToTimestamp(ret.EndDateTimeTicks) + timezoneOffset).toDate();
                        startDatebox.option("value", dateTimeStart);
                        endDatebox.option("value", dateTimeEnd);

                        updateDatasource(dataGrid, ret.Items, parametersFilterCriteria);

                        $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                        
                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorDBDataLoad") });

                        $(commandButtons).each(function (i, el) { el.option("disabled", thisParent.hasClass(disabledClass)); });
                        
                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .finally(() => {
                        bRequestDispatched = false;
                        if (bAutoRefresh)
                            SetRefreshTimeout(GetRemainingRefreshTime());
                    });
            }

            function updateGridHeight(dataGridElement) {
                $(dataGridElement).height(thisParent.height() - findRealHeight(activeFilterCriteriaContainerDiv) - refreshbtn.element().height() - buttonsContainer.height() - 12 - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
            }
        }
    </script>
</div>

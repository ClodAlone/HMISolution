<div id="AnimatedImage" class="AnimatedImage" xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">
    <img src="cl.gif" alt="" onload="onAnimatedImageLoaded(this)" id="loadingImage" />

    <div id="bgContainer" style="width:100%; height:100%;">
        <div id="animContainer" style="width:100%; height:100%;">
            <div id="animImageContainer" style="width:100%; height:100%;">
                <div id="animatedImage" style="width:100%;"></div>
            </div>
        </div>
    </div>

    <script>
        function onAnimatedImageLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var imageInterval;
            var currentImageIndex = 0;
            var currentThreshold;
            var thisParent = thisPage.parent();
            $(obj).remove();

            var webKitRenderCorrection = thisPage.hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            setOpacity(scope, thisParent, thisPage);

            var deregisterListeners = new Array();

            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
                if (imageInterval) {
                    clearInterval(imageInterval);
                }
            });

            var parameters = JSON.parse(paratt);
            if (!parameters.ControlClipToBounds)
                thisParent.css("overflow", "visible");

            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var verticalAlignment = parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "top" : parameters.VerticalContentAlignment == 2 ? "bottom" : "center";
            var startingTextTransform = "translateY(" + (verticalAlignment == "top" ? 0 : verticalAlignment == "bottom" ? "-100%" : "-50%") + ")";

            var bgContainer = thisPage.find("#bgContainer");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, bgContainer);
            var animcontainer = thisPage.find("#animContainer");
            var animatedImage = $(animcontainer).find("#animatedImage");

            var options = {
                "text-align": parameters.TextAlignment == 0 ? "left" : parameters.TextAlignment == 1 ? "right" : parameters.TextAlignment == 3 ? "justify" : "center"
            };
            if (parameters.FontFamily)
                options["font-family"] = parameters.FontFamily;
            if (parameters.FontSize)
                options["font-size"] = parameters.FontSize;
            if (parameters.Background) {
                if (parameters.Background.Color)
                    options["background"] = parameters.Background.Color;
                else if (parameters.BackImage || parameters.Background.Source) {
                    var bgOptions = {};
                    bgOptions["background"] = "url(\"" + sanitizedImageUrl(parameters.BackImage ? parameters.BackImage : parameters.Background.Source) + "\")";
                    bgOptions["background-repeat"] = "no-repeat";
                    bgOptions["image-rendering"] = "-webkit-optimize-contrast";
                    if (parameters.Stretch == 0) { // None
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 1) { // Fill
                        bgOptions["background-size"] = "100% 100%";
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 2) { // Uniform
                        bgOptions["background-size"] = "contain";
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 3) { // UniformFill
                        bgOptions["background-size"] = "cover";
                        bgOptions["background-position"] = "left top";
                    }
                    bgContainer.css(bgOptions);
                }
            }
            if (parameters.Foreground)
                options["color"] = getSolidColor(parameters.Foreground);
            if (parameters.FontWeight)
                options["font-weight"] = fontWeightConverter(parameters.FontWeight);
            setObjectBorder(options, parameters);

            $(animcontainer).css(options);

            $(animatedImage).css({
                "position": "relative",
                "top": parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? 0 : parameters.VerticalContentAlignment == 2 ? "100%" : "50%",
                "transform": startingTextTransform
            });

            var animationList = {};
            var animationKeys = [];

            if (parameters.AnimationList.length > 0) {
                var minValue = Number.MAX_VALUE;
                var maxValue = Number.MIN_VALUE;
                $(parameters.AnimationList).each(function (i, e) {
                    var val = parseFloat(e.Value);
                    if (val < minValue)
                        minValue = val;
                    if (val > maxValue)
                        maxValue = val;
                    animationList[e.Value] = e;
                    animationKeys.unshift(val);
                });
            }

            var mutateFunc = function () {
                if (animationKeys.length > 0) {
                    var onDataChangedListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                        onSettingValue = true;
                        try {
                            if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                                setanimatedImage(normalizeDataValue(scope.dataValues[parameters.screenId][parameters.SVGReferenceId]).dataValue.toString());
                        }
                        finally {
                            onSettingValue = false;
                        }
                    });
                    deregisterListeners.push(onDataChangedListener);

                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                        if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                            setanimatedImage(normalizeDataValue(scope.dataValues[parameters.screenId][parameters.SVGReferenceId]).dataValue.toString());
                    }
                }
            }
            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function setanimatedImage(stringValue) {
                if (stringValue in animationList)
                    currentThreshold = animationList[stringValue];
                else {
                    currentThreshold = null;
                    var value = parseFloat(stringValue);
                    if (value > maxValue)
                        currentThreshold = animationList[maxValue];
                    else if (value >= minValue) {
                        var nearestThreshold = animationKeys.find(function (item) { return item < value; });
                        if (nearestThreshold !== undefined)
                            currentThreshold = animationList[nearestThreshold];
                    }
                }
                updateanimatedImageOnValueChanged(animatedImage);
            }

            function resetanimatedImage() {
                fastdom.mutate(function () {
                    $(animatedImage).css({
                        "color": getSolidColor(parameters.Foreground),
                        "animation": "none",
                        "transform": startingTextTransform
                    });
                    $(animcontainer).css({ "background": "none" });
                });
            }

            function updateanimatedImageOnValueChanged(animatedImage) {
                if (imageInterval) {
                    clearInterval(imageInterval);
                    currentImageIndex = 0;
                }
                $(animcontainer).css("background", "none");
                if (!currentThreshold) {
                    resetanimatedImage();
                    return;
                }
                var options = {};
                var containerOptions = {};
                if (currentThreshold.Foreground && currentThreshold.Foreground.Color)
                    options["color"] = getSolidColor(currentThreshold.Foreground);

                if (currentThreshold.BackImageList.length > 0) {
                    containerOptions["background"] = "url(\"" + sanitizedImageUrl(currentThreshold.BackImageList[0].Value) + "\")";
                    containerOptions["background-repeat"] = "no-repeat";
                    containerOptions["image-rendering"] = "-webkit-optimize-contrast";
                    if (currentThreshold.ImageStretch == 0) { // None
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 1) { // Fill
                        containerOptions["background-size"] = "100% 100%";
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 2) { // Uniform
                        containerOptions["background-size"] = "contain";
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 3) { // UniformFill
                        containerOptions["background-size"] = "cover";
                        containerOptions["background-position"] = "left top";
                    }
                }
                if (currentThreshold.BackImageList.length > 1 && currentThreshold.AnimationTime > 0) { // Image animation
                    imageInterval = setInterval(
                        function () {
                            currentImageIndex = (currentImageIndex + 1) % currentThreshold.BackImageList.length;
                            containerOptions["background"] = "url(\"" + sanitizedImageUrl(currentThreshold.BackImageList[currentImageIndex].Value) + "\")";
                            fastdom.mutate(function () {
                                $(animcontainer).css(containerOptions);
                            });
                        }, currentThreshold.AnimationTime);
                }
                fastdom.mutate(function () {
                    $(animatedImage).css(options);
                    $(animcontainer).css(containerOptions);
                });
            }
        }
    </script>
</div>

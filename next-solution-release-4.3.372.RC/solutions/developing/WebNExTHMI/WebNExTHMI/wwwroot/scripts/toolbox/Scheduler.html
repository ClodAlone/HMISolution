<script src="scripts/toolbox/common/schedulerControl.js"></script>
<link rel="stylesheet" href="scripts/toolbox/common/css/schedulerControl.css" />

<div id="Scheduler" class="Scheduler">
    <img src="cl.gif" alt="" onload="onSchedulerLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="schedulerChooserControl" style="padding:5px;">
            <div id="lblSchedulerName" style="display:inline-block;"></div>
            <div id="lblSchedulerCombo" style="display:inline-block;"></div>
            <div id="btnSave" style="float:right;"></div>
            <div id="btnRefresh" style="float:right; margin-right: 5px;"></div>
        </div>

        <div id="schedulerTabs"></div>
        <div id="selectedTabContent">
            <div id="weeklyView"></div>
            <div id="calendarView" style="text-align: center;">
                <div id="calendarGrid"></div>
            </div>
            <div id="holidaysView" style="text-align: center;">
                <div id="addRefreshHolidays"></div>
                <div id="deleteAllHolidayItems"></div>
                <div id="holidaysGrid"></div>
            </div>
            <div id="propertiesView">
                <div class="grid" id="propertiesViewGrid"></div>
            </div>
        </div>

        <div id="eventPopup"></div>
        <div id="context-menu-edit"></div>
    </div>
</div>

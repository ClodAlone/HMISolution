<div id="SliderControl" class="SliderControl">
    <img src="cl.gif" alt="" onload="onSliderLoaded(this)" id="loadingImage" />

    <!--<div id="slider"></div>-->
    <div id="nouislider"></div>

    <script>
        function onSliderLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            var webKitRenderCorrection = thisPage.hasClass("webKitRenderCorrection");
            var settingSlider = false;
            var deregisterListenerActiveLanguage;

            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            $(thisPage).bind('destroyed', function () {
                if (deregisterListener)
                    deregisterListener();
                if (writeTimer)
                    clearTimeout(writeTimer);
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
            });

            var parameters = JSON.parse(paratt);

            var customFonts = [parameters.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var sliderPips;

            var onSettingValue;
            var bIsSliding;

            //var slidercontainer = thisPage.children().first();

            var writeTimer;
            var lastSetValue;
            var lastSetPrevValue;

            var foreignObject = thisPage.parent();
            foreignObject.css({ "overflow": "visible" });

            /* TEST CUSTOM LIBRARY NOUISLIDER */
            var customslider = thisPage.find("#nouislider")[0];
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, customslider);
            var labelsNo = Math.max(2, parseInt((parameters.MaxValue - parameters.MinValue) / parameters.TickMajorFrequency, 10));
            var isVertical = parameters.Orientation == "1";

            var bSliding = false;
            var bSlidingDenied = false;
            var thumbWidth; //= touchSquareSize;
            var thumbHeight; //= touchSquareSize;
            var defaultTickSize = 6;
            var maxTickSize = Math.max(parseInt(parameters.TickSize, 10), parseInt(parameters.TickMinorSize, 10));
            var fontOptions = {
                "font-family": parameters.FontFamily,
                "font-size": parameters.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.FontWeight),
                //"color": parameters.Foreground.Color
            };
            var fontStyle = parameters.FontStyle.toLowerCase();
            if (fontStyle != "normal")
                fontOptions["font-style"] = fontStyle;

            var bTagHasDynamicLimits;
            var bTagHasEU;
            var minmax;
            var sliderLengthFactor = 0.82;
            var options = {
                step: (typeof (parameters.SmallChange) != "undefined" ? parseFloat(parameters.SmallChange) : 0.1),
                connect: [true, true],
                start: [0]
            };

            minmax = getMinMaxControlValues(scope, parameters, bTagHasDynamicLimits, bTagHasEU);
            options.range = { min: minmax.min, max: minmax.max };

            if (parameters.ShowLabel || parameters.TickSize > 0) {
                options.pips = {
                    mode: 'count',
                    values: labelsNo + 1
                };
            }
            if (isVertical) {
                options.orientation = 'vertical';
                options.direction = 'rtl';
                if (webKitRenderCorrection)
                    options.iOSViewboxFactor = window.innerHeight / parameters.parentViewbox.height;
            }
            else {
                options.orientation = 'horizontal';
                if (webKitRenderCorrection)
                    options.iOSViewboxFactor = window.innerWidth / parameters.parentViewbox.width;
            }

            var mutateFunc = function () {

                noUiSlider.create(customslider, options);

                if (isVertical) {
                    $(customslider).css({ "position": "relative", "height": thisParent.attr("height") * sliderLengthFactor, "left": thisParent.width() / 2 });
                }
                else {
                    $(customslider).css("margin-top", "7px");

                    if (maxTickSize != defaultTickSize)
                        $(customslider).find('.noUi-pips.noUi-pips-horizontal').css('top', -80 + defaultTickSize - maxTickSize);
                }

                updateSliderLayout();

                if (parameters.TagMinValue && parameters.TagMinValue.SVGReferenceId) {
                    deregisterListenerMin = scope.$on(onDataChanged + parameters.screenId + parameters.TagMinValue.SVGReferenceId, function (e, value) {
                        if (scope.dataValues[parameters.screenId][parameters.TagMinValue.SVGReferenceId].isGood) {
                            bTagHasDynamicLimits = true;
                            updateMeterScale();
                        }
                    });
                }

                if (parameters.TagMinValue) {
                    if (parameters.screenId in scope.dataValues && parameters.TagMinValue.SVGReferenceId in scope.dataValues[parameters.screenId] &&
                        scope.dataValues[parameters.screenId][parameters.TagMinValue.SVGReferenceId].isGood) {
                        bTagHasDynamicLimits = true;
                        updateMeterScale();
                    }
                }

                if (parameters.TagMaxValue && parameters.TagMaxValue.SVGReferenceId) {
                    deregisterListenerMax = scope.$on(onDataChanged + parameters.screenId + parameters.TagMaxValue.SVGReferenceId, function (e, value) {
                        if (scope.dataValues[parameters.screenId][parameters.TagMaxValue.SVGReferenceId].isGood) {
                            bTagHasDynamicLimits = true;
                            updateMeterScale();
                        }
                    });
                }

                if (parameters.TagMaxValue) {
                    if (parameters.screenId in scope.dataValues && parameters.TagMaxValue.SVGReferenceId in scope.dataValues[parameters.screenId] &&
                        scope.dataValues[parameters.screenId][parameters.TagMaxValue.SVGReferenceId].isGood) {
                        bTagHasDynamicLimits = true;
                        updateMeterScale();
                    }
                }

                $(thisParent).bind(disabledClassEvent, function () {
                    var disabled = thisParent.hasClass(disabledClass);
                    $(customslider).attr('disabled', disabled);
                });

                customslider.noUiSlider.on('set', function (values, handle, unencoded, tap, positions) {
                    bIsSliding = false;
                    if (!settingSlider)
                        OnUserSlideSet(values);
                });

                customslider.noUiSlider.on('slide', function (values, handle, unencoded, tap, positions) {
                    var firstSlide = !bSliding;
                    bSliding = true;
                    if ($(customslider).attr('disabled') || bSlidingDenied) {
                        customslider.noUiSlider.set([Math.min(Math.max((lastSetValue ? lastSetValue : 0), parameters.MinValue), parameters.MaxValue)]);
                        return;
                    }
                    if (firstSlide) {
                        thisParent.trigger("mousedown"); //Access Rights Check
                        if ($(customslider).attr('disabled')) {
                            bSlidingDenied = true;
                            return;
                        }
                    }
                    OnUserSlideSet(values);
                });
                customslider.noUiSlider.on('end', function (values, handle, unencoded, tap, positions) {
                    bSliding = false;
                    bSlidingDenied = false;
                });

                if (parameters.SliderStyle && scope.Styles && scope.Styles[parameters.screenId]) {
                    var styleSvg = SVG(scope.Styles[parameters.screenId]);
                    var thumbStyle = styleSvg.find('#' + parameters.SliderStyle);
                    if (thumbStyle.length > 0)
                        thumbStyle = thumbStyle[0]; //.clone();

                    if (parameters.ThumbColor || parameters.UseThumbOptions) {
                        var tagsBG = styleSvg.find("[tag='BG']");
                        if (parameters.ThumbColor) {
                            for (var i = 0; i < tagsBG.length; i++)
                                tagsBG[i].addClass(parameters.ThumbColor);
                        }
                        if (parameters.UseThumbOptions) {
                            if (parameters.ThumbBorderBrush && parameters.ThumbBorderBrush.Color && parameters.ThumbBorderThickness > 0) {
                                for (var i = 0; i < tagsBG.length; i++) {
                                    tagsBG[i].attr({
                                        "stroke": urlReferenceReplace(parameters.ThumbBorderBrush.Color, parameters.screenId),
                                        "stroke-width": parameters.ThumbBorderThickness,
                                        "rx": parseFloat(tagsBG[i].attr("rx")) - parameters.ThumbBorderThickness / 2,
                                        "ry": parseFloat(tagsBG[i].attr("ry")) - parameters.ThumbBorderThickness / 2
                                    });
                                }
                            }
                        }
                    }

                    $(customslider).find('.noUi-handle').css({ "border-style": "none", "background": "transparent", "box-shadow": "none" });
                    var touchArea = $(customslider).find('.noUi-touch-area');
                    var factorHeight = parameters.ThumbFactor.FactorHeight != null ? parameters.ThumbFactor.FactorHeight : 1;
                    var factorWidth = parameters.ThumbFactor.FactorWidth != null ? parameters.ThumbFactor.FactorWidth : 1;

                    if (isVertical) {
                        thumbWidth = parseFloat(thisParent.attr("width")) - 10;
                        thumbHeight = thumbWidth * factorHeight;
                        var maxSliderH = thisParent.attr("height") - thumbHeight;
                        if (parseFloat($(customslider).css("height")) > maxSliderH)
                            $(customslider).css("height", maxSliderH);

                        var verticalPipsBar = $(customslider).find(".noUi-pips.noUi-pips-vertical");
                        verticalPipsBar.css("left", - thumbWidth / 2 - 30);
                        $(customslider).find('.noUi-value.noUi-value-vertical').css({
                            "padding": 0,
                            "width": "40px",
                            "transform": "rotate(-90deg)",
                            "transform-origin": "bottom center"
                        });
                        $(customslider).find(".noUi-marker.noUi-marker-vertical").css("left", 27);
                    }
                    else {
                        thumbHeight = parseFloat(thisParent.attr("height")) - 10;
                        thumbWidth = thumbHeight * factorWidth;
                        var maxSliderW = thisParent.attr("width") - thumbWidth;
                        if (parseFloat($(customslider).css("width")) > maxSliderW)
                            $(customslider).css("width", maxSliderW);
                        if (thumbHeight > 40)
                            thisPage.find("div.noUi-horizontal .noUi-base").css("transform", "translateY(" + ((thumbHeight - 40) / 2) + "px)");
                    }
                    $(thumbStyle.node).appendTo(touchArea).css({
                        "width": thumbWidth,
                        "height": thumbHeight,
                        "position": "absolute",
                        "top": (touchArea.height() - thumbHeight) / 2,
                        "left": (touchArea.width() - thumbWidth) / 2,
                        "z-index": 1
                    });
                }
                $(customslider).css(isVertical ? "top" : "left", isVertical ? (thisParent.attr("height") - $(customslider).height()) / 2 : (thisParent.attr("width") - $(customslider).width()) / 2);

                $(customslider).find('.noUi-connect').each(function (i, e) {
                    var cssProps = {};
                    if (!isVertical) {
                        cssProps["width"] = $(this).width() + thumbWidth / 2;
                        if (i == 0)
                            cssProps["left"] = - thumbWidth / 2;
                    }
                    else {
                        cssProps["height"] = $(this).height() + thumbHeight / 2;
                        if (i > 0)
                            cssProps["top"] = - thumbHeight / 2;
                    }
                    if (i == 0) {
                        if (parameters.DecreaseButtonColor && parameters.DecreaseButtonColor.Color)
                            cssProps["background"] = parameters.DecreaseButtonColor.Color;
                    }
                    else if (parameters.BarColor && parameters.BarColor.Color)
                        cssProps["background"] = parameters.BarColor.Color;

                    $(this).css(cssProps);
                });

                onSliderDataChanged();
                
                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId, false, null, true);                
                        if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                            onSliderDataChanged();
                    }
                
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId, false, null, true);
                        onSliderDataChanged();
                    });
                }

                if (parameters.FontSettingList)
                    deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                        if (sliderPips && (value in parameters.FontSettingList) !== -1) {
                            var fontOpts = applyFontSettingList([sliderPips], parameters.FontSettingList[value]);
                        }
                    });
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function onSliderDataChanged() {
                if (bIsSliding)
                    return;
                onSettingValue = true;
                try {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId] &&
                        scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                        settingSlider = true;
                        customslider.noUiSlider.set([normalizeDataValue(scope.dataValues[parameters.screenId][parameters.SVGReferenceId]).dataValue]);
                        settingSlider = false;

                        if (parameters.UseEUnit) {
                            if (!notNumeric(scope.dataValues[parameters.screenId][parameters.SVGReferenceId].rangeLow)) {
                                bTagHasEU = true;
                                updateMeterScale();
                            }
                            if (!notNumeric(scope.dataValues[parameters.screenId][parameters.SVGReferenceId].rangeHigh)) {
                                bTagHasEU = true;
                                updateMeterScale();
                            }
                        }
                    }
                }
                finally {
                    onSettingValue = false;
                }
            }

            function updateSliderLayout() {
                fastdom.measure(function () {
                    var majorTicks = $(customslider).find('.noUi-marker.noUi-marker-large');
                    var minorTicks = $(customslider).find('.noUi-marker.noUi-marker-normal');
                    if (!parameters.ShowLabel)
                        var sliderLabel = $(customslider).find('.noUi-value')
                    sliderPips = $(customslider).find('.noUi-pips');
                    fastdom.mutate(function () {
                        majorTicks.css({
                            "height": parseInt(parameters.TickSize, 10),
                            "width": parseInt(parameters.TickThickness, 10)
                        });
                        minorTicks.css({
                            "height": parseInt(parameters.TickMinorSize, 10),
                            "width": parseInt(parameters.TickThickness, 10)
                        });
                        if (!parameters.ShowLabel)
                            sliderLabel.css("display", "none");
                        sliderPips.css(fontOptions);

                        if (parameters.TickColor) {
                            sliderPips.css("color", parameters.TickColor.Color);
                            minorTicks.css("background", parameters.TickColor.Color);
                            majorTicks.css("background", parameters.TickColor.Color);
                        }
                    });
                });
            }

            function OnUserSlideSet(values) {
                if (onSettingValue)
                    return;
                bIsSliding = true;
                if (!(parameters.screenId in scope.dataValues) || !(parameters.SVGReferenceId in scope.dataValues[parameters.screenId]))
                    return;
                if (!scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood || thisParent.hasClass(disabledClass) || !scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isWritable || !scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isUserWritable)
                    return;

                if (typeof (lastSetPrevValue) == "undefined")
                    lastSetPrevValue = customslider.noUiSlider.get();

                if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].bIsInteger)
                    values[0] = Math.round(values[0]);
                lastSetValue = String(values[0]);
                if (writeTimer == null) {
                    writeTimer = setTimeout(() => {
                        writeTimer = null;
                        scope.corehubconnection.invoke("SetValue", parameters.SVGReferenceId, lastSetValue, parameters.screenId, false)
                            .then((ret) => {
                                lastSetPrevValue = lastSetValue;
                            })
                            .catch(err => {
                                console.error(err.toString());
                                settingSlider = true;
                                customslider.noUiSlider.set([lastSetPrevValue]);
                                settingSlider = false;
                                scope.$broadcast(onError, { ex: err, value: "Error setting value : " + err.toString() + " for item : " + parameters.SVGItemId });
                            })
                            .finally(() => {
                                bIsSliding = false;
                            });
                    }, 100);
                }
            }

            function updateMeterScale() {
                var mm = getMinMaxControlValues(scope, parameters, bTagHasDynamicLimits, bTagHasEU);
                if (minmax)
                    if ((mm.min == minmax.min && mm.max == minmax.max) || isNaN(mm.min) || isNaN(mm.max))
                        return;

                minmax = mm;

                customslider.noUiSlider.updateOptions({ range: { 'min': mm.min, 'max': mm.max } });
                updateSliderLayout();
            }
        }
    </script>
</div>

<div id="WebBrowserControl" class="WebBrowserControl" style="height: 100%;">
    <img src="cl.gif" alt="" onload="onWebBrowserControlLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="buttonsContainer" style="display: flex;">
            <div id="btnHome" style="margin: 5px 2.5px;"></div>
            <div id="btnSetHome" style="margin: 5px 2.5px;"></div>
            <div id="btnLoadPage" style="margin: 5px 2.5px;"></div>
            <div id="urlBar" style="margin: 5px 2.5px; flex-grow: 1;"></div>
            <div id="btnPrev" style="margin: 5px 2.5px;"></div>
            <div id="btnNext" style="margin: 5px 2.5px;"></div>
        </div>

        <iframe id="mainFrame" style="border: none; width: 100%">

        </iframe>
    </div>

    <script>
        function onWebBrowserControlLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var deregisterListenerActiveLanguage;
            var deregisterListenerUser;
            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (deregisterListener)
                    deregisterListener();
                if (deregisterListenerUser)
                    deregisterListenerUser();
                if (iframeErrorTimeout)
                    clearTimeout(iframeErrorTimeout);
            });

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection) {
                thisParent.css("overflow", "visible");
                thisPage.css("will-change", "opacity");
            }

            var mainContainer = thisPage.find("#mainContainer");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);

            var thisParentId = thisParent.attr("id");
            var parameters = JSON.parse(paratt);
            var iframeErrorTimeout;

            var storageKey = {
                "parentScreenName": parameters.screenName,
                "controlID": thisParentId,
                "propertyName": "webBrowserHomeURL"
            };

            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var container = thisPage.find("#mainContainer");
            if (parameters.Background)
                container.css("background", parameters.Background.Color);
            var mainFrame = thisPage.find("#mainFrame");
            var buttonsContainer = thisPage.find("#buttonsContainer");
            var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var highLoadTimesTimeout = 8000;
            
            var btnHomeDiv = thisPage.find("#btnHome");
            var btnSetHomeDiv = thisPage.find("#btnSetHome");
            var btnLoadPageDiv = thisPage.find("#btnLoadPage");
            var urlBarDiv = thisPage.find("#urlBar");
            var btnPrevDiv = thisPage.find("#btnPrev");
            var btnNextDiv = thisPage.find("#btnNext");
            
            var noDataText = i18next.t1('WaitText');
            
            var commandButtons = [];

            var btnHome;
            var btnSetHome;
            var btnLoadPage;
            var urlBar;
            var btnPrev;
            var btnNext;

            var actualHome = parameters.Source;

            if (scope.currentUser && parameters.UserBasedRuntimeSettings && parameters.UserBasedRuntimeSettingsList)
                loadUserBasedHomePage(scope.currentUser.name);

            var translations = {
                "GoHome": function () { return i18next.t1("GoHome", "Go Home"); },
                "SetHome": function () { return i18next.t1("SetHome", "Set Home page URL"); },
                "Refresh": function () { return i18next.t1("NavigateURL", "Load page"); },
                "GoBack": function () { return i18next.t1("GoBack", "Go Back"); },
                "GoForward": function () { return i18next.t1("GoForward", "Go Forward"); }
            };

            var historyManager = function (){
                let history = [];
                let historyIndex = -1;
                let hm = {
                    backToHome: function (url) {
                        historyIndex = 0;
                    },
                    push: function (url) {
                        historyIndex++;
                        history.splice(historyIndex, 0, url);
                    },
                    prevUrl: function () {
                        var url;
                        if (historyIndex > 0) {
                            historyIndex--;
                            url = history[historyIndex];
                        }
                        return url;
                    },
                    nextUrl: function () {
                        var url;
                        if (historyIndex < history.length - 1) {
                            historyIndex++;
                            url = history[historyIndex];
                        }
                        return url;
                    },
                    contains: function (url) {
                        return history.indexOf(url) !== -1;
                    },
                    checkPrevDisabled: function () {
                        return history.length < 2 || historyIndex <= 0;
                    },
                    checkNextDisabled: function () {
                        return history.length < 2 || historyIndex == history.length - 1;
                    }
                };
                return hm;
            }();

            mainFrame[0].onload = function () {
                loadingProcessEnded();
            };

            mainFrame[0].onerror = function () {
                loadingProcessEnded();
            };

            var mutateFunc = function () {
                btnHome = btnHomeDiv.dxButton({
                    icon: "home",
                    hint: translations.GoHome(),
                    disabled: false,
                    onClick: function (e) {
                        iframeGoTo(actualHome, true, true);
                    }
                }).dxButton("instance");

                btnSetHome = btnSetHomeDiv.dxButton({
                    icon: "save",
                    hint: translations.SetHome(),
                    disabled: false,
                    onClick: function (e) {
                        if (urlBar) {
                            actualHome = urlBar.option("value");
                            controlPropertiesDB.add(scope, storageKey, actualHome);
                            DevExpress.ui.notify(i18next.t1("SettingsSaved"), "success", 1000);
                        }
                    }
                }).dxButton("instance");

                var urlBarOptions = {
                    value: actualHome,
                    onEnterKey: function (e) {
                        iframeGoTo(e.component.option("value"));
                    }
                };
                urlBar = urlBarDiv.dxTextBox(urlBarOptions).dxTextBox("instance");

                btnLoadPage = btnLoadPageDiv.dxButton({
                    icon: "images/toolbox/refresh.svg",
                    hint: translations.Refresh(),
                    disabled: false,
                    onContentReady: function (e) {
                        var el = e.component.element();
                        mainFrame.height(thisParent.height() - el.height() - parseFloat(el.css("margin-top")) - parseFloat(el.css("margin-bottom")) - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
                    },
                    onClick: function (e) {
                        iframeGoTo(urlBar.option("value"));
                    }
                }).dxButton("instance");

                btnPrev = btnPrevDiv.dxButton({
                    icon: "arrowleft",
                    hint: translations.GoBack(),
                    disabled: true,
                    onClick: function (e) {
                        iframeGoTo(historyManager.prevUrl(), true);
                    }
                }).dxButton("instance");

                btnNext = btnNextDiv.dxButton({
                    icon: "arrowright",
                    hint: translations.GoForward(),
                    disabled: false,
                    onClick: function (e) {
                        iframeGoTo(historyManager.nextUrl(), true);
                    }
                }).dxButton("instance");

                Array.prototype.push.apply(commandButtons, [btnHome, btnSetHome, btnLoadPage, urlBar, btnPrev, btnNext]);

                controlPropertiesDB.get(scope, storageKey)
                    .then(function (res) {
                        if (res)
                            actualHome = res;
                    })
                    .catch(function (ex) { })
                    .finally(function (res) {
                        if (actualHome)
                            iframeGoTo(actualHome);
                        else
                            checkEnableDisableButtons();
                    });

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {

                    noDataText = i18next.t1('WaitText');

                    btnHome.option("hint", translations.GoHome());
                    btnSetHome.option("hint", translations.SetHome());
                    btnLoadPage.option("hint", translations.Refresh());
                    btnPrev.option("hint", translations.GoBack());
                    btnNext.option("hint", translations.GoForward());
                });

                if (parameters.UserBasedRuntimeSettings && parameters.UserBasedRuntimeSettingsList && parameters.UserBasedRuntimeSettingsList.length > 0) {
                    deregisterListenerUser = scope.$watch('currentUser', function (v) {
                        setTimeout(function () { //https://code.angularjs.org/1.8.2/docs/error/$rootScope/inprog?p0=$digest
                            if (v)
                                loadUserBasedHomePage(v.name);
                            else {
                                var home = parameters.Source;
                                controlPropertiesDB.get(scope, storageKey)
                                    .then(function (res) {
                                        if (res)
                                            home = res;
                                    })
                                    .catch(function (ex) { })
                                    .finally(function (res) {
                                        if (home) {
                                            actualHome = home;
                                            iframeGoTo(home);
                                        }
                                    });
                            }
                        }, 0);
                    });
                }

                $(thisParent).bind(disabledClassEvent, function () {
                    dataGrid.option("disabled", thisParent.hasClass(disabledClass));
                    checkEnableDisableButtons();
                });

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function checkEnableDisableButtons() {
                var parentDisabled = thisParent.hasClass(disabledClass);
                btnPrev.option("disabled", parentDisabled || historyManager.checkPrevDisabled());
                btnNext.option("disabled", parentDisabled || historyManager.checkNextDisabled());
                $(commandButtons).each(function (i, el) {
                    if (el != btnPrev && el != btnNext)
                        el.option("disabled", parentDisabled);
                });
            }

            function iframeGoTo(url, bNavigatingHistory = false, bBackToHome = false) {
                if (!url)
                    return;
                url = url.replace(/^(https?:\/\/)?/i, (a) => a || 'http://');
                $(commandButtons).each(function (i, el) { if (el) el.option("disabled", true); });
                if (iframeErrorTimeout)
                    clearTimeout(iframeErrorTimeout);
                iframeErrorTimeout = setTimeout(highLoadTimesWarning, highLoadTimesTimeout);
                mainFrame.attr("src", url);
                urlBar.option("value", url);
                if (!bNavigatingHistory)
                    historyManager.push(url);
                else if (bBackToHome)
                    historyManager.backToHome();
            }

            function highLoadTimesWarning() {
                loadingProcessEnded();
                DevExpress.ui.notify("WebBrowserControl " + thisParentId + ": " + i18next.t1("WebBrowserSlowLoading"), "warning", 3000);
            }

            function loadingProcessEnded() {
                if (iframeErrorTimeout) {
                    clearTimeout(iframeErrorTimeout);
                    iframeErrorTimeout = null;
                }
                checkEnableDisableButtons();
            }

            function loadUserBasedHomePage(user) {
                try {
                    var userSource = parameters.UserBasedRuntimeSettingsList.find((item) => { return item.Key == user }).Value;
                    actualHome = userSource;
                    iframeGoTo(actualHome);
                }
                catch (e) { }
            }
        }
    </script>
</div>

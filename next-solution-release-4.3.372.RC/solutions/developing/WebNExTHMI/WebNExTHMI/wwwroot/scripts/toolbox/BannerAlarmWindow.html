<div id="BannerAlarmWindow" class="BannerAlarmWindow">
    <img src="cl.gif" alt="" onload="onBannerAlarmWindowLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="bannerGrid" style="display: grid;">
            <div id="thresholdIconContainer" style="display: none;">&nbsp;</div>
            <div id="alarmbanner"></div>
        </div>
        <div id="alarmbannerSpinner">
            <div id="spinner">
                <div class="spinBtn" id="spinUp"></div>
                <div class="spinBtn" id="spinDown"></div>
            </div>
        </div>
    </div>

    <script>
        function onBannerAlarmWindowLoaded(obj) {
            var thisPage = $(obj).parent();
            var thisParent = thisPage.parent();
            thisPage.localize();
            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            $(obj).remove();

            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, thisPage.find("#mainContainer"));

            setOpacity(scope, thisParent, thisPage);

            var bannerInterval;
            var intervalBlink;
            var intervalCycle;
            var deregisterListener;
            var deregisterListenerActiveLanguage;
            var bannerAlarmsList = [];
            var currentAlarmIndex = 0;
            var bannerInputField;
            var severityColorMap = {};
            var currentCulture = navigator.language;
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            var translations = scope.setTranslations("BannerAlarmWindow", [
                {
                    id: "NextAlarm",
                    stringSuffix: "NextAlarmCmd",
                    defValue: "Next Alarm"
                },
                {
                    id: "PrevAlarm",
                    stringSuffix: "PrevAlarmCmd",
                    defValue: "Prev Alarm"
                }
            ]);
            var bBannerInit;

            $(thisPage).bind('destroyed', function () {
                if (bannerInterval)
                    clearInterval(bannerInterval);
                if (intervalBlink)
                    clearInterval(intervalBlink);
                if (intervalCycle)
                    clearInterval(intervalCycle);
                if (deregisterListener)
                    deregisterListener();
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (parameters.ConnectChildAlarms) {
                    scope.corehubconnection.invoke("UnsubscribeChildrenAlarmServer", parameters.screenId)
                        .then((ret) => {

                        })
                        .catch(err => {
                            console.error(err.toString());
                            var errorText = i18next.t1('ErrorUnsubscribingChildrenAlarmServer') + err.toString();
                            scope.$broadcast(onError, { ex: err, value: errorText });
                        });
                }
            });

            var parameters = JSON.parse(paratt);
            var connectChildAlarms = parameters.ConnectChildAlarms == true ? true : false;
            if (connectChildAlarms) {
                scope.corehubconnection.invoke("SubscribeChildrenAlarmServer", parameters.screenId)
                    .then((ret) => {
                        
                    })
                    .catch(err => {
                        console.error(err.toString());
                        var errorText = i18next.t1('ErrorSubscribingChildrenAlarmServer') + err.toString();
                        bannerText.option("value", errorText);
                        scope.$broadcast(onError, { ex: err, value: errorText });
                    });
            }
                

            var horizontalAlignment = parameters.HorizontalContentAlignment == 0 || parameters.HorizontalContentAlignment == 3 ? "left" : (parameters.HorizontalContentAlignment == 2 ? "right" : "center");
            var verticalAlignment = parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "top" : parameters.VerticalContentAlignment == 2 ? "bottom" : "center";
            var alarmFilters = {
                alarmMaskFilter: parseFloat(parameters.AlarmMaskFilter),
                severityFilter: parseFloat(parameters.SeverityFilter),
                severityFilterConditions: parseFloat(parameters.SeverityFilterConditions),
                alarmDescriptionFilter: parameters.AlarmDescriptionFilter
            };

            if (parameters.AlarmAreaFontSettings.FontFamily) {
                var customFonts = [parameters.AlarmAreaFontSettings.FontFamily];
                if (parameters.FontSettingList)
                    $.each(parameters.FontSettingList, function (index, item) {
                        customFonts.push(item.FontFamily);
                    });
                loadCustomFonts(customFonts);
            }
            var dynamicFontElements = [];

            var connected = false;
            var container = thisPage.find("#alarmbanner");
            var stylizedContainers = container;
            var bannerSpinner = thisPage.find("#alarmbannerSpinner");
            var thresholdIconContainer;
            var bannerGrid = thisPage.find("#bannerGrid");
            var bUsesThresholdsIcon = parameters.IconWidth > 0;
            var blinkStyledElements;
            var currentSeverityIconPath;
            var iconSizeMap = {};

            var spinUp = thisPage.find("#spinUp");
            var spinDown = thisPage.find("#spinDown");
            var spinTitles;
            var bLanguageChanged = false;
            var thisParentHeight = thisParent.height();

            bannerSpinner.css({
                "display": parameters.EnableSpin ? "block" : "none",
                "height": thisParentHeight,
                "position": "relative",
                "top": thisParentHeight * -1
            });
            if (parameters.EnableSpin) {
                thisPage.find("#spinner").css("float", parameters.SpinPosition == 0 ? "left" : "right");
                var spinSize = parameters.SpinDimension == 0 ? "20px" : parameters.SpinDimension == 1 ? "25px" : "30px";
                var spinStyle = { "width": spinSize, "color": getThemeColors(scope).foreground };
                if (parameters.SpinBackground)
                    spinStyle["background"] = parameters.SpinBackground.Color;
                thisPage.find(".spinBtn").css(spinStyle);
            }

            if (bUsesThresholdsIcon) {
                thresholdIconContainer = thisPage.find("#thresholdIconContainer");
                if (scope.biOS)
                    thresholdIconContainer.css("transform", "translate(0px, 0px)");
                stylizedContainers = stylizedContainers.add(bannerGrid);
                fastdom.mutate(() => {
                    bannerGrid.css({
                        "width": thisParent.width() - parseFloat(spinSize),
                        "grid-template-columns": parameters.IconWidth + "px 1fr"
                    });
                    thresholdIconContainer.show();
                });
            }
            
            var noDataText = i18next.t1('ConnectingToServer');

            var bNeedsWrapping = parameters.TextWrapping != 1;

            var editOptions = {
                height: thisParentHeight,
                value: noDataText,
                hoverStateEnabled: false,
                readOnly: true,
                onValueChanged: function (e) {
                    if (parameters && !parameters.EnableRefreshButton && !parameters.EnableSpin) {
                        var bannerInputField = e.component.element().find(".dx-texteditor-input");
                        if (bannerInputField.length > 0) {
                            var h = bannerInputField[0].offsetHeight;
                            bannerInputField.css({
                                paddingTop: 0,
                                height: 0
                            });

                            var padding = verticalAlignment == "top" ? 0 : (verticalAlignment == "bottom" ? Math.max(0, h - bannerInputField[0].scrollHeight) : Math.max(0, h / 2 - bannerInputField[0].scrollHeight / 2));
                            bannerInputField.css({
                                paddingTop: padding,
                                height: h
                            });
                        }
                    }
                },
                onContentReady: function (e) {
                    if (bBannerInit)
                        return;
                    bBannerInit = true;

                    var el = e.component.element();
                    var inputContainer = el.find(".dx-texteditor-input-container");

                    var elOptions = {};
                    setObjectBorder(elOptions, parameters);
                    var inputOptions = { "text-align": horizontalAlignment, "min-height": "0px" };
                    var textArea;
                    if (!bNeedsWrapping)
                        inputOptions["padding"] = "0px 3px 0px 10px";
                    else {
                        textArea = el.find("textarea");
                        inputOptions["paddingBottom"] = 0;
                    }
                    if (parameters.Background) {
                        inputOptions["background"] = parameters.Background.Color;
                        stylizedContainers.css("background", parameters.Background.Color);
                    }
                    if (parameters.Foreground)
                        inputOptions["color"] = getSolidColor(parameters.Foreground);
                    if (parameters.AlarmAreaFontSettings.FontFamily)
                        inputOptions["font-family"] = parameters.AlarmAreaFontSettings.FontFamily;
                    if (parameters.AlarmAreaFontSettings.FontSize)
                        elOptions["font-size"] = parameters.AlarmAreaFontSettings.FontSize;
                    if (parameters.AlarmAreaFontSettings.FontWeight)
                        inputOptions["font-weight"] = fontWeightConverter(parameters.AlarmAreaFontSettings.FontWeight);
                    if (parameters.EnableSpin && parameters.SpinPosition == 0)
                        inputOptions["padding-left"] = "35px";
                    el.css(elOptions);
                    inputContainer.css("height", "100%");
                    bannerInputField = el.find(".dx-texteditor-input");
                    if (textArea) {
                        textArea.css("z-index", 1);
                        if (parameters.TextWrapping == 0) {
                            inputOptions["white-space"] = "break-spaces";
                            inputOptions["overflow-wrap"] = "normal";
                        }
                    }
                    dynamicFontElements.push(bannerInputField);
                    bannerInputField.css(inputOptions);
                }
            };
            if (!bUsesThresholdsIcon)
                editOptions["width"] = thisParent.width() - parseFloat(spinSize);

            var bannerText;

            var mutateFunc = function () {
                if (bNeedsWrapping)
                    bannerText = container.dxTextArea(editOptions).dxTextArea("instance");
                else
                    bannerText = container.dxTextBox(editOptions).dxTextBox("instance");

                spinUp.html("<svg viewBox='0 0 100 200' preserveAspectRatio='none' style='vertical-align:top; width:80%; height:50%; margin-top:" + (thisParentHeight / 8) + "px;-webkit-filter: invert(1) grayscale(1) contrast(100);filter: invert(1) contrast(100);'><polygon points='50,10 90,170 10,170' style='fill:" + parameters.Background.Color + ";' /><title>" + translations.PrevAlarm() + "</title></svg>");
                spinUp.click(function () {
                    setCurrentAlarmIndex(currentAlarmIndex - 1);
                });

                spinDown.html("<svg viewBox='0 0 100 200' preserveAspectRatio='none' style='vertical-align:top; width:80%; height:50%; margin-top:" + (thisParentHeight / 8) + "px;-webkit-filter: invert(1) grayscale(1) contrast(100);filter: invert(1) contrast(100);'><polygon points='50,170 90,10 10,10' style='fill:" + parameters.Background.Color + ";' /><title>" + translations.NextAlarm() + "</title></svg>");
                spinDown.click(function () {
                    setCurrentAlarmIndex(currentAlarmIndex + 1);
                });

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    if (currentCulture != value)
                        bLanguageChanged = true;
                    currentCulture = value;
                    noDataText = i18next.t1('ConnectingToServer');
                    if (!spinTitles) {
                        spinTitles = {};
                        fastdom.measure(function () {
                            spinTitles.up = spinUp.find("title");
                            spinTitles.down = spinDown.find("title");
                            mutateSpinTitles();
                        });
                    }
                    else
                        mutateSpinTitles();

                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1)
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);

                    if (!connected)
                        bannerText.option("value", noDataText);
                    else
                        updateAlarmMessage();
                });

                applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId, false, webKitRenderCorrection ? bannerGrid.add(bannerSpinner) : null);
                if (scope.dataValues[parameters.screenId] && scope.dataValues[parameters.screenId][parameters.SVGReferenceId] && scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood && !bannerInterval)
                    setTimer();

                deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId, false, webKitRenderCorrection ? bannerGrid.add(bannerSpinner) : null);
                    if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                        if (!bannerInterval)
                            setTimer();
                    }
                    else {
                        if (bannerInterval) {
                            clearInterval(bannerInterval);
                            bannerText.option("value", noDataText);
                            bannerInterval = undefined;
                        }
                        connected = false;
                    }
                });

                $(thisParent).bind(disabledClassEvent, function () {
                    bannerText.option("disabled", thisParent.hasClass(disabledClass));
                });

                var blink = false;
                if (!parameters.DisableBlinkAnimation) {
                    intervalBlink = setInterval(function () {
                        if (!bannerInputField || !populateBlinkStyledElements())
                            return;

                        blink = !blink;
                        if (bannerAlarmsList.length == 0 || !bannerAlarmsList[currentAlarmIndex].needsAcknoledge) {
                            if (bannerInputField.hasClass("blinkingRow")) {
                                fastdom.mutate(function () {
                                    $(blinkStyledElements).each(function (i, el) {
                                        $(el).removeClass("blinkingRow").css("background", bannerInputField.attr("thresholdColor"));
                                    });
                                });
                            }
                            return;
                        }

                        fastdom.measure(function () {
                            var thresColor = bannerInputField.attr("thresholdColor");
                            fastdom.mutate(function () {
                                $(blinkStyledElements).each(function (i, el) {
                                    var $el = $(el);
                                    if (blink)
                                        $el.addClass("blinkingRow");
                                    else
                                        $el.removeClass("blinkingRow").css("background", thresColor);
                                });
                            });
                        });
                    }, 1000);
                }

                if (parameters.AthomaticScroll && parameters.CyclingTime > 0) {
                    intervalCycle = setInterval(function () {
                        setCurrentAlarmIndex(currentAlarmIndex + 1 >= bannerAlarmsList.length ? 0 : currentAlarmIndex + 1);
                    }, parameters.CyclingTime * 1000);
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function mutateSpinTitles() {
                fastdom.mutate(function () {
                    spinTitles["up"].text(translations.PrevAlarm());
                    spinTitles["down"].text(translations.NextAlarm());
                });
            }

            function setTimer() {
                bannerText.option("value", "");
                pollBannerData(scope, bannerText, parameters.SVGReferenceId, parameters.screenId);
                connected = true;

                bannerInterval = setInterval(function () {
                    if (connected)
                        pollBannerData(scope, bannerText, parameters.SVGReferenceId, parameters.screenId);
                }, 1000);
            }

            function pollBannerData(scope, bannerText, id, screenId) {
                var bForceRefresh = false;
                if (bLanguageChanged) {
                    bLanguageChanged = false;
                    bForceRefresh = true;
                }
                scope.corehubconnection.invoke("GetConditionStateList", id, screenId, true, bForceRefresh, alarmFilters, connectChildAlarms)
                .then((ret) => {
                    if (ret.length > 0) {
                        bannerAlarmsList = ret;
                        if (currentAlarmIndex >= bannerAlarmsList.length)
                            setCurrentAlarmIndex(0);
                        else
                            visualizeBannerAlarm();
                    }
                    else {
                        bannerAlarmsList = [];
                        fastdom.mutate(function () {
                            if (populateBlinkStyledElements())
                                resetBlinkStyledElements();
                            bannerText.option("value", i18next.t1(parameters.EmptyAlarmListDefaultText));
                        });
                    }
                })
                .catch(err => {
                    console.error(err.toString());
                    var errorText = i18next.t1('ErrorGettingConditionList') + err.toString();
                    bannerText.option("value", errorText);
                    scope.$broadcast(onError, { ex: err, value: errorText });
                });
            }

            function visualizeBannerAlarm() {
                if (!populateBlinkStyledElements())
                    return;

                if (parameters.Thresholds.length > 0)
                    updateThresholdElementColor(bannerAlarmsList[currentAlarmIndex], jQuerize(bannerInputField), parameters.Thresholds, severityColorMap, blinkStyledElements);
                updateAlarmMessage();
                if (bUsesThresholdsIcon)
                    updateSeverityIcon(bannerAlarmsList[currentAlarmIndex].severity);
            }

            function updateSeverityIcon(severity) {
                var severityIcon;
                var severityIconPath;
                try {
                    severityIcon = findThresholdDataBySeverity(severity || 0, parameters.Thresholds, severityColorMap).ThresholdIconPath;
                }
                catch { }

                if (!severityIcon)
                    severityIconPath = severity > 0 ? "images/toolbox/gridAlarmWindow/IconAlarm.png" : "images/toolbox/gridAlarmWindow/IconMessage.png";
                else
                    severityIconPath = "images/" + scope.configurationSettings.projectTitle + "/" + severityIcon;

                if (severityIconPath == currentSeverityIconPath)
                    return;
                currentSeverityIconPath = severityIconPath;

                thresholdIconContainer.html("");
                if (iconSizeMap[severityIconPath])
                    setCellBackgroundImage(thresholdIconContainer, severityIconPath, iconSizeMap[severityIconPath]);
                else {
                    var image = new Image();
                    image.src = severityIconPath;
                    image.onload = function () {
                        var imageSize = {
                            w: image.naturalWidth,
                            h: image.naturalHeight
                        }
                        iconSizeMap[severityIconPath] = imageSize;
                        setCellBackgroundImage(thresholdIconContainer, severityIconPath, imageSize);
                    };
                }
            }

            function updateAlarmMessage() {
                fastdom.mutate(function () {
                    if (bannerAlarmsList[currentAlarmIndex])
                        bannerText.option("value", i18next.t1(bannerAlarmsList[currentAlarmIndex].message) + " - " + moment(ticksToTimestamp(bannerAlarmsList[currentAlarmIndex].timeticks))./*subtract(new Date().getTimezoneOffset(), "minutes").*/locale(currentCulture).format("L LTS"));
                });
            }

            function setCurrentAlarmIndex(index) {
                if (index < 0 || bannerAlarmsList.length <= index)
                    return;

                currentAlarmIndex = index;
                visualizeBannerAlarm();
            }

            function setCellBackgroundImage(container, imageUrl, imageSize) {
                var template = $("<div>", { "class": "alarmThresholdIconContainer" });
                var bgTemplate = $("<div>", { "class": "cellTemplateBgContainer" });
                var templateCss = {
                    "background-image": 'url("' + imageUrl + '")',
                    "background-size": "contain",
                    "max-width": Math.min(imageSize.w, parameters.IconWidth),
                    "max-height": imageSize.h
                };
                fastdom.mutate(function () {
                    var heightMargin = container.height() - imageSize.h;
                    if (heightMargin > 0)
                        templateCss["margin-top"] = heightMargin / 2;
                    template.css(templateCss).appendTo(bgTemplate);
                    bgTemplate.css({
                        "width": "100%",
                        "display": "flex",
                        "justify-content": "center"
                    }).appendTo(container);
                });
            }

            function populateBlinkStyledElements() {
                if (!bannerInputField)
                    return false;
                if (!blinkStyledElements)
                    blinkStyledElements = bUsesThresholdsIcon ? bannerInputField.add(thresholdIconContainer) : bannerInputField;
                return true;
            }

            function resetBlinkStyledElements() {
                bannerInputField.css({
                    "background": "transparent",
                    "color": getSolidColor(parameters.Foreground)
                });
                if (bUsesThresholdsIcon) {
                    currentSeverityIconPath = null;
                    thresholdIconContainer.html("").css({
                        "background": "transparent",
                        "color": getSolidColor(parameters.Foreground)
                    });
                }
            }
        }
    </script>
</div>

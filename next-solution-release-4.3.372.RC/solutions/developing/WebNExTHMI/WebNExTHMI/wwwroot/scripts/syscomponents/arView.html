<div id="arView" class="arView">
    <img src="cl.gif" alt="" onload="onARLoaded(this)" id="loadingImage" />
    <div id="arViewControlsContainer">
        <div id="toolbarOptions" dx-toolbar="toolbarOptions"></div>
    </div>
    <div id="arContainer">
        <canvas id="canvasOutput" style="border:1px solid #000000; width:100%; height: 100%"></canvas>
        <video id="cameraInput" style="border:1px solid #000000; width:100%; height: 100%"></video>
        <svg id="boxes" style="position: absolute; left: 0px; top: 0px; z-index: 2; width: 100%; height: 100%"></svg>
    </div>

    <script>
        function onARLoaded(obj) {
            var thisPage = $(obj).parent();
            $(obj).remove();
            thisPage.localize();
            var scope = thisPage.scope();
            if (!scope)
                return;

            var pageId = setUniqueId(thisPage, thisPage.attr("id"));

            var screenLoaded = {};
            var rectCreated = {};
            var sentImageWidth;
            var sentImageHeight;
            var lastImageData;
            var timeoutProcImages;
            var listeningArray = new Array();
            var windowSize = { w: $(window).width(), h: $(window).height() };

            var bCanvasSized;
            var videoSize;
            var canvasVideoData = {
                fullSized: null,
                scaled: null
            };
            var qrFactor = scope.configurationSettings.ARQRCodeScaleFactor;
            
            var streaming = true;
            var intervalStatus;
            $(thisPage).bind('destroyed', function () {
                console.log('arview unloaded');
                streaming = false;

                listeningArray.forEach(function (item, index, array) {
                    item();
                });

                if (timeoutProcImages)
                    clearTimeout(timeoutProcImages);
                if (intervalStatus)
                    clearInterval(intervalStatus);

                for (var key in screenLoaded) {
                    scope.$broadcast(onPopupCloseRequest + key, key);
                }
                screenLoaded = {};
            });

            scope.corehubconnection.invoke("GetListScreens")
                .then((ret) => {
                    var screensList = ret.map(function (name) { return { name: name[0].toLowerCase(), fullName: name[1].toLowerCase() } });
                    
                    var toolbar = thisPage.find("#toolbarOptions");
                    var controlsContainer = thisPage.find("#arViewControlsContainer");
                    var canvas = thisPage.find("#canvasOutput");
                    var video = thisPage.find("#cameraInput");
                    var context;
                    var arDrawImageParams;
                    if (scope.biOS) {
                        video.prop("playsInline", true);
                    }
                    var svghtml = thisPage.find("#boxes");
                    var status;

                    var tensorFlowWithQRCodes = scope.configurationSettings.ARScanQRCode && !scope.configurationSettings.ARScanQRCodeOnly;
                    var lastQRFound = null;
                    var timeoutNoQR = null;

                    var boundingBox_svg = function (x, y, width, height, className, color) {
                        var svgns = "http://www.w3.org/2000/svg";
                        var rect = document.createElementNS(svgns, 'rect');
                        rect.setAttributeNS(null, 'x', x);
                        rect.setAttributeNS(null, 'y', y);
                        rect.setAttributeNS(null, 'height', height);
                        rect.setAttributeNS(null, 'width', width);
                        rect.setAttributeNS(null, 'fill', color);
                        rect.setAttributeNS(null, 'fill-opacity', 0.2);
                        rect.setAttributeNS(null, 'stroke', color);
                        rect.setAttributeNS(null, 'stroke-width', 2);
                        //rect.setAttributeNS(null, 'onmouseout', "evt.target.setAttribute('stroke-width', 2)");
                        //rect.setAttributeNS(null, 'onmouseover', "evt.target.setAttribute('stroke-width', 10)");
                        //rect.setAttributeNS(null, 'onclick', "client.clickBox('" + className + "')");
                        svghtml.append(rect);

                        //var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        //text.setAttribute('x', x);
                        //text.setAttribute('y', y + 8);
                        //text.setAttribute('fill', color);
                        //text.setAttribute('style', 'font-weight: bold');
                        //text.setAttribute('onclick', "client.clickBox('" + className + "')");
                        //text.textContent = className;
                        //svghtml.append(text);

                        return rect;
                    };

                    //let svg = SVG('#boxes');
                    //var rect = svg.rect(200, 200).fill('#f06').stroke({ color: '#f06', width: 2 });

                    canvas.hide();

                    var waitingForClose = [];

                    var jsQR;
                    if (scope.configurationSettings.ARScanQRCodeOnly || scope.configurationSettings.ARScanQRCode) {
                        var jsQRPath = './lib/jsqr/dist/jsQR.js';
                        import(jsQRPath).then(function (module) {
                            jsQR = module.default;
                            if (tensorFlowWithQRCodes)
                                requestAnimationFrame(tick);
                        });
                    }

                    var drl1 = scope.$on("ImageProcessed" + pageId, function (e, res_json) {
                        var screendetected = [];
                        //For each object detected:

                        //if (res_json.num_detections == 0)
                        //res_json = {
                        //    num_detections: 2, detections: [
                        //        { screen: "gearmotor", coordinates: { Xmin: 0, Ymin: 0, Xmax: 420, Ymax: 380 } },
                        //        { screen: "photocell", coordinates: { Xmin: 0, Ymin: 0, Xmax: 220, Ymax: 200 } },
                        //    ]
                        //};

                        for (var i = 0; i < res_json.num_detections; i++) {
                            var box = res_json.detections[i];

                            var fields = box.screen.split(',');
                            var screenName = fields[0];

                            var screenByFullname = screensList.find(key => key.fullName.toLowerCase() === screenName.toLowerCase());
                            if (screenByFullname)
                                screenName = screenByFullname.name;
                            else if (!screensList.find(key => key.name.toLowerCase() === screenName.toLowerCase()))
                                continue;

                            var Xmax = box.coordinates.Xmax * $(video[0]).width() / sentImageWidth * qrFactor;
                            var Xmin = box.coordinates.Xmin * $(video[0]).width() / sentImageWidth * qrFactor;
                            var Ymax = box.coordinates.Ymax * $(video[0]).height() / sentImageHeight * qrFactor;
                            var Ymin = box.coordinates.Ymin * $(video[0]).height() / sentImageHeight * qrFactor;

                            var parameterFile;
                            if (fields.length > 1)
                                parameterFile = fields[1];
                            if (i == 0 && lastQRFound && !parameterFile && !scope.configurationSettings.ARScanQRCodeOnly && scope.configurationSettings.ARScanQRCode && jsQR)
                                parameterFile = lastQRFound;

                            var screenNameWithParameter = screenName;
                            if (parameterFile)
                                screenNameWithParameter = screenName + "_" + parameterFile;
                            var normalizeScreenId = screenNameWithParameter.replace(/[^a-zA-Z0-9]/g, '_');
                            if (normalizeScreenId in screenLoaded) {
                                scope.$broadcast(onPopupSizeRequest + normalizeScreenId, { x: Xmin, y: Ymin, videoW: $(video).width(), videoH: $(video).height(), windowSize: windowSize, boxW: Xmax - Xmin, boxH: Ymax - Ymin });
                            }
                            else {
                                screenLoaded[normalizeScreenId] = normalizeScreenId;
                                var options = { name: screenName, parameter: parameterFile };
                                attachPopup(scope, 'screenView', normalizeScreenId, JSON.stringify(options), Xmin, Ymin);
                            }

                            var elemIndex = waitingForClose.indexOf(normalizeScreenId);
                            if (elemIndex !== -1)
                                waitingForClose.splice(elemIndex, 1);

                            if (screendetected.indexOf(normalizeScreenId) === -1)
                                screendetected.push(normalizeScreenId);

                            if (normalizeScreenId in rectCreated) {

                                var rect = rectCreated[normalizeScreenId];
                                rect.setAttributeNS(null, 'x', Xmin);
                                rect.setAttributeNS(null, 'y', Ymin);
                                rect.setAttributeNS(null, 'height', Ymax - Ymin);
                                rect.setAttributeNS(null, 'width', Xmax - Xmin);
                            }
                            else {

                                rectCreated[normalizeScreenId] = boundingBox_svg(Xmin, Ymin,
                                    Xmax - Xmin, Ymax - Ymin,
                                    box.class_name, "#0bd500");
                            }
                        }

                        for (var key in screenLoaded) {

                            var found = screendetected.indexOf(key);
                            if (found === -1 && waitingForClose.indexOf(key) === -1) {
                                waitingForClose.push(key);
                                setTimeoutWithClosure(key, screendetected, 1000);
                            }
                        }
                    });
                    listeningArray.push(drl1);

                    startVideo();

                    var startStopVodeoBtn = {
                        location: 'before',
                        widget: 'dxButton',
                        options: {
                            icon: 'video',
                            text: 'play-pause',
                            onClick: function () {

                                if (streaming) {

                                    if (timeoutProcImages)
                                        clearTimeout(timeoutProcImages);
                                    streaming = false;
                                    video[0].srcObject.getVideoTracks()[0].enabled = false;
                                    video.hide();
                                    captureCanvasImage(true);
                                    canvas.show();
                                }
                                else {
                                    video[0].srcObject.getVideoTracks()[0].enabled = true;
                                    video.show();
                                    canvas.hide();
                                    streaming = true;
                                    timeoutProcImages = setTimeout(captureImage, 0);
                                }
                            }
                        }
                    };
                    var serverStatusBtn = {
                        locateInMenu: 'never',
                        location: 'before',
                        html: '<div>Server Status : Connecting</div>'
                    };
                    var serverLastErrorBtn = {
                        locateInMenu: 'never',
                        location: 'before'
                    };
                    var serverImageStatisticsBtn = {
                        locateInMenu: 'never',
                        location: 'before'
                    };

                    scope.toolbarItems = [startStopVodeoBtn, serverStatusBtn, serverLastErrorBtn, serverImageStatisticsBtn];

                    scope.toolbarOptions = {
                        bindingOptions: {
                            dataSource: {
                                deep: true,
                                dataPath: 'toolbarItems'
                            }
                        }
                    };

                    updateBoxesContainer();

                    intervalStatus = setInterval(function () {

                        if (status) {

                            serverStatusBtn.html = '<div><b>Server Status</b> : ' + (status.isOnTimeout ? 'timeout</div>' : 'ok</div>');
                            serverLastErrorBtn.html = '<div><b>Last Server Error</b> : ' + status.lastError + '</div>';
                            serverImageStatisticsBtn.html = '<div><b>Statistics : #Processed</b> : ' + status.nProcessedImages +
                                ' <b>#Expired</b> : ' + status.nExpiredImages +
                                ' <b>#Lost</b> : ' + status.nLostImages +
                                ' <b>PI Execution ms</b> : ' + status.lastExecutionProcessedMs +
                                '</div>';

                            toolbar.dxToolbar("instance").repaint();
                        }
                    }, 1000);

                    //#region FUNCTIONS

                    function tick() {
                        if (video[0].readyState === video[0].HAVE_ENOUGH_DATA) {
                            try {
                                captureCanvasImage();
                                if (lastImageData)
                                    var code = jsQR(lastImageData, sentImageWidth, sentImageHeight, {
                                        inversionAttempts: "dontInvert",
                                    });
                                if (code) {
                                    if (timeoutNoQR) {
                                        clearTimeout(timeoutNoQR);
                                        timeoutNoQR = null;
                                    }
                                    if (lastQRFound != code.data)
                                        lastQRFound = code.data.replace(/(^\w+:|^)\/\//, '');
                                }
                                else {
                                    if (!timeoutNoQR && lastQRFound)
                                        timeoutNoQR = setTimeout(function () {
                                            lastQRFound = null;
                                            timeoutNoQR = null;
                                        }, scope.configurationSettings.ARScanQRToleranceMS);
                                }
                            }
                            catch (e) { }
                        }
                        requestAnimationFrame(tick);
                    }

                    function setTimeoutWithClosure(key, screendetected, time) {
                        setTimeout(function () {
                            var elementIndex = waitingForClose.indexOf(key);
                            if (elementIndex === -1)
                                return;

                            waitingForClose.splice(elementIndex, 1);
                            delete screendetected[key];

                            scope.$broadcast(onPopupCloseRequest + key, key);

                            delete screenLoaded[key];

                            if (key in rectCreated) {
                                rectCreated[key].remove();
                                delete rectCreated[key];
                            }
                        }, time);
                    }

                    function captureCanvasImage(bFullSize) {
                        if (!bCanvasSized) {
                            if (video[0].videoWidth <= 0 || video[0].videoHeight <= 0)
                                return;
                            bCanvasSized = true;

                            canvas.height(video.height());
                            canvas.width(video.width());
                            videoSize = {
                                w: video[0].videoWidth,
                                h: video[0].videoHeight
                            };
                        }
                        let bPosToBeSet = false;
                        if (!bFullSize) {
                            if (!canvasVideoData.scaled) {
                                canvasVideoData.scaled = {
                                    scaleX: canvas[0].width / video[0].videoWidth * qrFactor,
                                    scaleY: canvas[0].height / video[0].videoHeight * qrFactor
                                };
                                bPosToBeSet = true;
                            }
                        }
                        else if (!canvasVideoData.fullSized) {
                            canvasVideoData.fullSized = {
                                scaleX: canvas[0].width / video[0].videoWidth,
                                scaleY: canvas[0].height / video[0].videoHeight
                            };
                            bPosToBeSet = true;
                        }

                        var contextData = bFullSize ? canvasVideoData.fullSized : canvasVideoData.scaled;
                        if (bPosToBeSet) {
                            contextData.top = canvas[0].height / 2 - (videoSize.h / 2) * contextData.scaleY;
                            contextData.left = canvas[0].width / 2 - (videoSize.w / 2) * contextData.scaleX;
                        }

                        sentImageWidth = videoSize.w * contextData.scaleX;
                        sentImageHeight = videoSize.h * contextData.scaleY;
                        getContext().drawImage(video[0], contextData.left, contextData.top, sentImageWidth, sentImageHeight);
                        try {
                            lastImageData = getContext().getImageData(contextData.left, contextData.top, sentImageWidth, sentImageHeight).data;
                        }
                        catch { }
                    }

                    function attachPopup($scope, viewType, parent, option, x, y) {
                        $scope.busyVisible = true;
                        $scope.$apply();
                        try {
                            var page = $scope.loadHtmlOnDemand(viewType, true, false, option);

                            showPopup({
                                transparent: true,
                                noshading: true,
                                $scope: $scope,
                                parent: parent,
                                content: page,
                                showtitle: true,
                                showclose: false,
                                dragenabled: true,
                                resizeenabled: false,
                                x: x,
                                y: y
                            });
                        }
                        catch (e) {

                            if (e === true) {

                                var deregisterListener = $scope.$on(onloadedHtmlOnDemand + viewType, function (e, value) {

                                    page = $scope.loadHtmlOnDemand(viewType, true, false, option);

                                    deregisterListener();

                                    showPopup({
                                        transparent: true,
                                        noshading: true,
                                        $scope: $scope,
                                        parent: parent,
                                        content: page,
                                        showtitle: true,
                                        showclose: false,
                                        dragenabled: true,
                                        resizeenabled: false,
                                        x: x,
                                        y: y
                                    });
                                });
                            }
                            else
                                throw e;
                        }
                    }

                    function startVideo() {
                        var constraints = window.constraints = {
                            audio: false,
                            video: {
                                facingMode: "environment",
                                //width: { ideal: 4096 },
                                //height: { ideal: 2160 }
                            }
                        };
                        navigator.mediaDevices.getUserMedia(constraints)
                            .then(function (stream) {
                                var videoTrack = stream.getVideoTracks()[0];
                                var trackSettings = videoTrack.getSettings();
                                if ('zoom' in trackSettings) {
                                    toolbar.before("<div style='margin:auto; text-align: center;'><input id='zoomInput' type='range' style='display:inline-block; margin: 3px 10px; width:50%; height:100%;' name='zoomControl'/><label for='zoomControl'>Zoom Level</label></div>");
                                    var zoomInput = thisPage.find("#zoomInput")[0];
                                    var trackCapabilities = videoTrack.getCapabilities();
                                    zoomInput.min = trackCapabilities.zoom.min;
                                    zoomInput.max = trackCapabilities.zoom.max;
                                    zoomInput.step = trackCapabilities.zoom.step;
                                    zoomInput.value = trackSettings.zoom;
                                    zoomInput.oninput = function (event) {
                                        videoTrack.applyConstraints({ advanced: [{ zoom: event.target.value }] });
                                    }
                                    updateBoxesContainer();
                                }

                                video[0].srcObject = stream;
                                video[0].play();

                                scope.busyVisible = false;
                                scope.$apply();

                                timeoutProcImages = setTimeout(captureImage, 0);
                                /*
                                setTimeout(function () {
        
                                    var options = { name: 'popup' };
                                    attachPopup(scope, 'screenView', JSON.stringify(options), 400, 300, -400, -200);
        
                                    setTimeout(function () {
        
                                        var options = { name: 'popup2' };
                                        attachPopup(scope, 'screenView', JSON.stringify(options), 300, 500, 250, 250);
        
                                    }, 1000);
        
                                }, 1000);
                                */
                                /*
                                video[0].height = video.height();
                                video[0].width = video.width();
                                let src = new cv.Mat(video[0].height, video[0].width, cv.CV_8UC4);
                                let dst = new cv.Mat(video[0].height, video[0].width, cv.CV_8UC4);
                                let gray = new cv.Mat();
                                let cap = new cv.VideoCapture(video[0]);
                                let faces = new cv.RectVector();
                                let classifier = new cv.CascadeClassifier();
        
                                // load pre-trained classifiers
                                classifier.load('haarcascade_frontalface_default.xml');
        
                                const FPS = 30;
                                function processVideo() {
                                    try {
                                        if (!streaming) {
                                            // clean and stop.
                                            src.delete();
                                            dst.delete();
                                            gray.delete();
                                            faces.delete();
                                            classifier.delete();
                                            return;
                                        }
                                        let begin = Date.now();
                                        // start processing.
                                        cap.read(src);
                                        src.copyTo(dst);
                                        cv.cvtColor(dst, gray, cv.COLOR_RGBA2GRAY, 0);
                                        // detect faces.
                                        classifier.detectMultiScale(gray, faces, 1.1, 3, 0);
                                        // draw faces.
                                        for (let i = 0; i < faces.size(); ++i) {
                                            let face = faces.get(i);
                                            let point1 = new cv.Point(face.x, face.y);
                                            let point2 = new cv.Point(face.x + face.width, face.y + face.height);
                                            cv.rectangle(dst, point1, point2, [255, 0, 0, 255]);
                                        }
                                        cv.imshow(canvas[0], dst);
                                        // schedule the next one.
                                        let delay = 1000 / FPS - (Date.now() - begin);
                                        setTimeout(processVideo, delay);
                                    } catch (err) {
                                        console.log("An error occurred! " + err);
                                        setTimeout(processVideo, 1000);
                                    }
                                };
        
                                // schedule the first one.
                                setTimeout(processVideo, 0);
                                */

                            })
                            .catch(function (err) {
                                console.log("An error occurred! " + err);

                                scope.busyVisible = false;
                                scope.$apply();
                            });
                    }

                    function captureImage() {
                        if (timeoutProcImages)
                            clearTimeout(timeoutProcImages);

                        if (!tensorFlowWithQRCodes)
                            captureCanvasImage();

                        if (!scope.configurationSettings.ARScanQRCodeOnly) {
                            if (scope.configurationSettings.ARScanQRCode && qrFactor != 1) {
                                if (!arDrawImageParams || !arDrawImageParams.width || !arDrawImageParams.height) {
                                    let scaleX = canvas[0].width / video[0].videoWidth;
                                    let scaleY = canvas[0].height / video[0].videoHeight;
                                    arDrawImageParams = {
                                        width: video[0].videoWidth * scaleX,
                                        height: video[0].videoHeight * scaleY,
                                        top: canvas[0].height / 2 - (video[0].videoHeight / 2) * scaleY,
                                        left: canvas[0].width / 2 - (video[0].videoWidth / 2) * scaleX
                                    };
                                }
                                getContext().drawImage(video[0], arDrawImageParams.left, arDrawImageParams.top, arDrawImageParams.width, arDrawImageParams.height); //AR image
                            }
                            var dataURL = canvas[0].toDataURL("image/jpeg", 1.0);

                            scope.corehubconnection.invoke("SendImage", dataURL, 0, pageId)
                                .then((ret) => {
                                    status = ret;
                                    if (streaming)
                                        timeoutProcImages = setTimeout(captureImage, 100);
                                })
                                .catch(err => {
                                    console.error(err.toString());
                                    scope.$broadcast(onError, { ex: err, value: "Error sending image : " + err.toString() });

                                    if (streaming)
                                        timeoutProcImages = setTimeout(captureImage, 1000);
                                });
                        }
                        else {

                            if (jsQR && lastImageData) {
                                // var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                                var code = jsQR(lastImageData, sentImageWidth, sentImageHeight, {
                                    inversionAttempts: "dontInvert",
                                });

                                var res_json = {
                                    num_detections: 0
                                };

                                if (code) {
                                    res_json.num_detections = 1;
                                    res_json.detections = new Array();

                                    var box = {};
                                    var coordinate = {};

                                    coordinate.Xmax = code.location.topRightCorner.x;
                                    coordinate.Xmin = code.location.topLeftCorner.x;
                                    coordinate.Ymax = code.location.bottomRightCorner.y;
                                    coordinate.Ymin = code.location.topLeftCorner.y;
                                    box.coordinates = coordinate;
                                    box.screen = code.data.replace(/(^\w+:|^)\/\//, '');
                                    res_json.detections.push(box);
                                }
                                scope.$broadcast("ImageProcessed" + pageId, res_json);
                            }

                            if (streaming)
                                timeoutProcImages = setTimeout(captureImage, 100);
                        }
                    }
					
                    function updateBoxesContainer() {
                        svghtml.css('top', controlsContainer.height());
                    }

                    function getContext() {
                        if (!context)
                            context = canvas[0].getContext('2d', { willReadFrequently: true });
                        return context;
                    }

                    //#endregion
                });
            }
    </script>
</div>

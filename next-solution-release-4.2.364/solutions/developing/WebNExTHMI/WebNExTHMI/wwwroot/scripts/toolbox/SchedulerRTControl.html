<div id="SchedulerRTControl" class="SchedulerRTControl">
    <img src="cl.gif" alt="" onload="onSchedulerRTControlLoaded(this)" id="loadingImage" />

    <div id="edit"></div>

    <script>
        function onSchedulerRTControlLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            $(thisPage).bind('destroyed', function () {
            });

            var parameters = JSON.parse(paratt);

            var editcontainer = thisPage.children().first();

            var el;
            var edit = editcontainer.dxScheduler({
                dataSource: data,
                views: ["day", "week", "workWeek", "month"],
                currentView: "week",
                currentDate: new Date(2017, 4, 25),
                startDayHour: 9,
                height: thisParent.height(),
                width: thisParent.width()
            }).dxScheduler("instance");
        }
    </script>
</div>

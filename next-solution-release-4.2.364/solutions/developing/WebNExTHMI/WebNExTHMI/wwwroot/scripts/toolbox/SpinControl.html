<div id="SpinControl" class="SpinControl" style="height: 100%;">
    <img src="cl.gif" alt="" onload="onSpinControlLoaded(this)" id="loadingImage" />

    <div id="spinContainer" style="position: relative;">
        <div id="firstBtn" style="position: absolute;"></div>
        <div id="secondBtn" style="position: absolute;"></div>
    </div>

    <script>
        function onSpinControlLoaded(obj) {
            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (increasingInterval)
                    clearInterval(increasingInterval);
                if (decreasingInterval)
                    clearInterval(decreasingInterval);
                if (increasingTimeout)
                    clearTimeout(increasingTimeout);
                if (decreasingTimeout)
                    clearTimeout(decreasingTimeout);
                if (deregisterListener)
                    deregisterListener();
            });

            var parameters = JSON.parse(paratt);
            var spinStep = parseFloat(parameters.Change, 10) || 1;
            var spinContainer = thisPage.find("#spinContainer");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, spinContainer);
            var firstBtnDiv = thisPage.find("#firstBtn");
            var secondBtnDiv = thisPage.find("#secondBtn");
            var bServerSettingValue = false;
            var bServerNeedsUpdate = false;
            var lastServerReadValue = null;

            var buttonsHeight = thisParent.attr("height") / 2;
            var buttonsWidth = thisParent.attr("width");
            var svgSpinStyle = "display:block; margin:auto; width:70%; height:60%; position:relative; top:20%;";

            var currentSpinClientValue = 0;
            var increasingInterval;
            var increasingTimeout;
            var decreasingInterval;
            var decreasingTimeout;

            var bTopBtnIsDown = false;
            var bBottomBtnIsDown = false;
            var firstBtn;
            var secondBtn;

            var mutateFunc = function () {
                secondBtnDiv.css({
                    "top": buttonsHeight
                });

                firstBtn = firstBtnDiv.dxButton({
                    text: "T",
                    type: "normal",
                    height: buttonsHeight,
                    width: buttonsWidth,
                    disabled: thisParent.hasClass(disabledClass),
                    hint: i18next.t1(parameters.ToolTip),
                    onContentReady: function (e) {
                        el = e.component.element();
                        el.html("<svg viewBox='0 0 100 200' preserveAspectRatio='none' style='" + svgSpinStyle + "'><polygon points='50,0 100,200 0,200' style='fill:#AAAAAA;' /></svg>");
                    }
                }).dxButton("instance");

                secondBtn = secondBtnDiv.dxButton({
                    text: "D",
                    type: "normal",
                    height: buttonsHeight,
                    width: buttonsWidth,
                    disabled: thisParent.hasClass(disabledClass),
                    hint: i18next.t1(parameters.ToolTip),
                    onContentReady: function (e) {
                        el = e.component.element();
                        el.html("<svg viewBox='0 0 100 200' preserveAspectRatio='none' style='" + svgSpinStyle + "'><polygon points='50,200 100,0 0,0' style='fill:#AAAAAA;' /></svg>");
                    }
                }).dxButton("instance");

                thisParent.on("mousedown touchstart", function (e) {
                    if (e.type == "touchstart") {
                        //e.stopPropagation(); 
                        e.preventDefault();
                    }

                    var eventPath = e.originalEvent.composedPath();
                    bTopBtnIsDown = eventPath.indexOf(firstBtnDiv[0]) !== -1;
                    bBottomBtnIsDown = eventPath.indexOf(secondBtnDiv[0]) !== -1;
                    if (bTopBtnIsDown) {
                        if (firstBtn.option("disabled") == true)
                            return;

                        if (increasingTimeout) {
                            clearTimeout(increasingTimeout);
                            increasingTimeout = null;
                        }

                        increaseValue();
                        increasingTimeout = setTimeout(function () {
                            increasingInterval = setInterval(increaseValue, 50);
                        }, 500);
                    }
                    else if (bBottomBtnIsDown) {
                        if (secondBtn.option("disabled") == true)
                            return;

                        if (decreasingTimeout) {
                            clearTimeout(decreasingTimeout);
                            decreasingTimeout = null;
                        }

                        decreaseValue();
                        decreasingTimeout = setTimeout(function () {
                            decreasingInterval = setInterval(decreaseValue, 50);
                        }, 500);
                    }
                }).on("mouseup touchend", function (e) {
                    if (e.type == "touchend") {
                        //e.stopPropagation(); 
                        e.preventDefault();
                    }
                    try {
                        if (bTopBtnIsDown) {
                            if (increasingInterval) {
                                clearInterval(increasingInterval);
                                increasingInterval = null;
                            }
                            if (increasingTimeout) {
                                clearTimeout(increasingTimeout);
                                increasingTimeout = null;
                            }
                        }
                        else if (bBottomBtnIsDown) {
                            if (decreasingInterval) {
                                clearInterval(decreasingInterval);
                                decreasingInterval = null;
                            }
                            if (decreasingTimeout) {
                                clearTimeout(decreasingTimeout);
                                decreasingTimeout = null;
                            }
                        }
                    }
                    finally {
                        bTopBtnIsDown = false;
                        bBottomBtnIsDown = false;
                    }
                });

                checkEnableEditDisplay(scope, thisParent, parameters.SVGReferenceId, parameters.screenId);

                $(thisParent).bind(disabledClassEvent, function () {
                    checkEnableEditDisplay(scope, thisParent, parameters.SVGReferenceId, parameters.screenId)
                });

                applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);

                deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    try {
                        if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                            var localValue = scope.dataValues[parameters.screenId][parameters.SVGReferenceId].value;
                            var finalValue = scope.dataValues[parameters.screenId][parameters.SVGReferenceId].invariantValue;

                            if (!notNumeric(finalValue)) {
                                currentSpinClientValue = finalValue;
                                lastServerReadValue = finalValue;
                            }
                        }
                        checkEnableEditDisplay(scope, thisParent, parameters.SVGReferenceId, parameters.screenId);
                    }
                    finally {

                    }
                });
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function increaseValue() {
                if (currentSpinClientValue >= parameters.MaxValue)
                    return;

                currentSpinClientValue = Math.min(parseFloat(currentSpinClientValue, 10) + spinStep, parameters.MaxValue);
                trySetValue();
            }
            function decreaseValue() {
                if (currentSpinClientValue <= parameters.MinValue)
                    return;

                currentSpinClientValue = Math.max(parseFloat(currentSpinClientValue, 10) - spinStep, parameters.MinValue);
                trySetValue();
            }

            function trySetValue() {
                if (!(parameters.screenId in scope.dataValues) || !(parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) || !scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                    return;
                
                if (lastServerReadValue == currentSpinClientValue) {
                    bServerNeedsUpdate = false;
                    return;
                }

                if (bServerSettingValue) {
                    bServerNeedsUpdate = true;
                    return;
                }

                bServerSettingValue = true;
                scope.corehubconnection.invoke("SetValue", parameters.SVGReferenceId, String(currentSpinClientValue), parameters.screenId)
                    .then((ret) => {

                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: "Error setting value : " + err.toString() + " for item : " + parameters.SVGItemId });
                    })
                    .finally(() => {
                        bServerSettingValue = false;
                        if (bServerNeedsUpdate) {
                            bServerNeedsUpdate = false;
                            trySetValue();
                        }
                    });
            }

            function checkEnableEditDisplay(scope, thisParent, SVGReferenceId, screenId) {
                var enabled = false;
                if (screenId in scope.dataValues && SVGReferenceId in scope.dataValues[screenId]) {
                    enabled = !thisParent.hasClass(disabledClass) && scope.dataValues[screenId][SVGReferenceId].isGood && scope.dataValues[screenId][SVGReferenceId].isWritable && scope.dataValues[screenId][SVGReferenceId].isUserWritable;
                }
                var wasDisabled = firstBtn.option("disabled");
                firstBtn.option("disabled", !enabled);
                secondBtn.option("disabled", !enabled);
            }
        }
    </script>
</div>

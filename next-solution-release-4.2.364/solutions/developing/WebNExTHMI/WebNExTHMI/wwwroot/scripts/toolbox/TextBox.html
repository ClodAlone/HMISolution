<div id="TextBox" class="TextBox">
    <img src="cl.gif" alt="" onload="onTextBoxLoaded(this)" id="loadingImage" />

    <div id="edit"></div>

    <script>
        function onTextBoxLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var deregisterListeners = [];
            var visibilityObserver;

            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
                if (visibilityObserver)
                    visibilityObserver.disconnect();
            });

            var parameters = JSON.parse(paratt);
            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var webKitRenderCorrection = thisPage.hasClass("webKitRenderCorrection");

            var editcontainer = thisPage.find("#edit");
            if (scope.biOS) {
                thisPage.css("position", "relative");
                webkitMoveRotateTransform(thisParent, thisPage, editcontainer);
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
            }

            var el;
            var textAlignmentProp = undefinedOrNull(parameters.WebHMITextAlignment) ? parameters.HorizontalContentAlignment : parameters.WebHMITextAlignment;
            var textAlignment = textAlignmentProp == 0 ? "left" : textAlignmentProp == 2 ? "right" : textAlignmentProp == 3 ? "justify" : "center";

            var bNeedsWrapping = parameters.TextWrapping != 1 || parameters.Text.indexOf("\n") !== -1;

            var editOptions = {
                height: thisParent.height(),
                width: thisParent.width(),
                hoverStateEnabled: false,
                readOnly: true,
                onContentReady: function (e) {
                    el = e.component.element();
                    var elOptions = {};
                    setObjectBorder(elOptions, parameters);
                    var inputOptions = {
                        "height": bNeedsWrapping ? 0 : "auto",
                        "text-align": textAlignment,
                        "padding": "2px 3px 2px 3px", "min-height": "0px", "overflow": "hidden",
                    };
                    if (parameters.Background) {
                        var bgOptions = {};
                        if (parameters.Background.Source) {
                            bgOptions["background"] = "url(\"" + sanitizedImageUrl(parameters.Background.Source) + "\")";
                            bgOptions["background-repeat"] = "no-repeat";
                            bgOptions["background-position"] = "center center";
                            bgOptions["background-size"] = "100% 100%";
                            bgOptions["image-rendering"] = "-webkit-optimize-contrast";
                        }
                        else {
                            inputOptions["background"] = parameters.Background.Color;
                            bgOptions["background"] = parameters.Background.Color;
                        }
                        fastdom.mutate(function () {
                            editcontainer.css(bgOptions);
                        });
                    }
                    if (parameters.Foreground)
                        inputOptions["color"] = parameters.Foreground.Color;
                    if (parameters.FontFamily)
                        inputOptions["font-family"] = parameters.FontFamily;
                    if (parameters.FontSize)
                        inputOptions["font-size"] = parameters.FontSize;
                    if (parameters.FontWeight)
                        inputOptions["font-weight"] = fontWeightConverter(parameters.FontWeight);
                    var fontStyle = parameters.FontStyle.toLowerCase();
                    if (fontStyle != "normal")
                        inputOptions["font-style"] = fontStyle;
                    if (bNeedsWrapping && parameters.TextWrapping == 0) {
                        inputOptions["white-space"] = "break-spaces";
                        inputOptions["overflow-wrap"] = "normal";
                    }
                    fastdom.measure(function () {
                        var input = el.find(".dx-texteditor-input");
                        var inputParent = input.parent();
                        fastdom.mutate(function () {
                            inputParent.css({
                                "display": "flex",
                                "align-items": parameters.VerticalContentAlignment == 0 ? "flex-start" : parameters.VerticalContentAlignment == 2 ? "flex-end" : "center"
                            });
                            el.css(elOptions);
                            input.css(inputOptions);
                            e.component.option("value", i18next.t1(parameters.Text));
                            if (bNeedsWrapping) {
                                if (thisParent.is(":visible")) {
                                    input.css({
                                        "height": input[0].scrollHeight,
                                        "max-height": "100%"
                                    });
                                }
                                else if (!visibilityObserver) {
                                    visibilityObserver = new MutationObserver(function (mutationList) {
                                        if (input[0].scrollHeight > 0) {
                                            if (visibilityObserver)
                                                visibilityObserver.disconnect();
                                            input.css({
                                                "height": input[0].scrollHeight,
                                                "max-height": "100%"
                                            });

                                        }
                                    });
                                    visibilityObserver.observe($(currentRoot)[0], { attributes: true, subtree: true });
                                }
                            }
                        });
                    });
                }
            };

            var edit;
            var mutateFunc = function () {
                if (bNeedsWrapping)
                    edit = editcontainer.dxTextArea(editOptions).dxTextArea("instance");
                else
                    edit = editcontainer.dxTextBox(editOptions).dxTextBox("instance");
            };

            if (parameters.SVGReferenceId) {
                applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                var onDataChangedListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                });
                deregisterListeners.push(onDataChangedListener);
            }
            var deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                if (edit)
                    edit.option("value", i18next.t1(parameters.Text));
            });
            deregisterListeners.push(deregisterListenerActiveLanguage);

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);
        }
    </script>
</div>

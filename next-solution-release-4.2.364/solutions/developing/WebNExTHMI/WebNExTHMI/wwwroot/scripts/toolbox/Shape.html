<div id="Shape" class="Shape">
    <img src="cl.gif" alt="" onload="onShapeLoaded(this)" id="loadingImage" />
    <script>
        function onShapeLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
            return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
            return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            var parentOpacity = thisParent.attr("opacity");

            var deregisterListener;
            $(thisPage).bind('destroyed', function () {
                if (deregisterListener)
                    deregisterListener();
            });

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");

            var thisParentId = thisParent.attr("id");
            var parameters = JSON.parse(paratt);
            var fobjReplacerContainer;

            var mutateFunc = function () {
                removeForeignObject();
                var qualityElem = $(fobjReplacerContainer);
                if (scope.biOS && qualityElem.is("svg")) {
                    qualityElem = qualityElem.children().first();
                }
                applyTagQualityStyle(qualityElem, scope, parameters.screenId, parameters.SVGReferenceId, true);
                deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                    applyTagQualityStyle(qualityElem, scope, parameters.screenId, parameters.SVGReferenceId, true);
                });
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function removeForeignObject() {
                if (webKitRenderCorrection) {
                    $.each(thisParent.parents("g[transform]"), function (i, gr) {
                        $(gr).removeAttr("transform");
                    });
                }

                var svgShape = thisParent.children().first();
                var newShape = SVG(thisParent[0]).replace(SVG(svgShape[0].outerHTML));
                fobjReplacerContainer = $(newShape.node);
                fobjReplacerContainer.attr("id", thisParentId).addClass("shapeControl");

                if (scope.biOS && parentOpacity)
                    fobjReplacerContainer.css("opacity", parentOpacity);

                fobjReplacerContainer.bind('destroyed', function () {
                    if (deregisterListener)
                        deregisterListener();
                });

                updateControlSecurity(thisParent[0], fobjReplacerContainer);
            }
        }
    </script>
</div>

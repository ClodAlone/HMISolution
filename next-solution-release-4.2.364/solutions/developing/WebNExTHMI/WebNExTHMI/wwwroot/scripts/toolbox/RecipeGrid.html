<div id="RecipeGrid" class="RecipeGrid" style="height: 100%;">
    <img src="cl.gif" alt="" onload="onRecipeGridLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="recipeChooserControl" style="padding:5px;">
            <div id="lblRecipeName" style="display:inline-block;"></div>
            <div id="lblRecipeCombo" style="display:inline-block;"></div>
            <div id="btn" style="display:inline-block; opacity: 0;"></div>
        </div>
        <div id="recipegrid"></div>

        <div id="recipeToolbar" style="text-align:center;padding:5px;">
            <div id="btnDBLoadDiv"></div>
            <div id="btnDBSaveDiv"></div>
            <div id="btnAddRecipeDiv"></div>
            <div id="btnDelRecipeDiv"></div>
            <!--<div id="btnOpenCSVDiv"></div>
            <div id="btnSaveCSVDiv"></div>-->
            <div id="btnDeviceLoadDiv"></div>
            <div id="btnDeviceSaveDiv"></div>
        </div>
    </div>

    <script>
        function onRecipeGridLoaded(obj) {
            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var interval;
            var deregisterListener;
            var deregisterListenerActiveLanguage;
            var deregisterListenerUser;
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
                if (deregisterListener)
                    deregisterListener();
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
                if (deregisterListenerUser)
                    deregisterListenerUser();
                if (colResizeOperation)
                    clearTimeout(colResizeOperation);
            });

            var parameters = JSON.parse(paratt);

            if (parameters.bFitInWindow)
                thisPage.addClass("fittedDataGrid");

            var mainContainer = thisPage.find("#mainContainer");
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            var scrollingOptions = {
                mode: webKitRenderCorrection ? "standard" : "virtual"
            };
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
            if (scope.biOS || (isMobile.Android() && parameters.bFitInWindow)) {
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }

            loadCustomFonts([parameters.FontFamily, parameters.RowAreaFontSettings.FontFamily, parameters.HeaderFontSettings.FontFamily]);

            var connected = false;
            var btn = thisPage.find("#btn");
            var recipegrid = thisPage.find("#recipegrid");
            var recipeChooser = thisPage.find("#recipeChooserControl");
            var recipeToolbar = thisPage.find("#recipeToolbar");
            var btnDBLoadDiv = thisPage.find("#btnDBLoadDiv");
            var btnDBSaveDiv = thisPage.find("#btnDBSaveDiv");
            var btnAddRecipeDiv = thisPage.find("#btnAddRecipeDiv");
            var btnDelRecipeDiv = thisPage.find("#btnDelRecipeDiv");
            //var btnOpenCSVDiv = thisPage.find("#btnOpenCSVDiv");
            //var btnSaveCSVDiv = thisPage.find("#btnSaveCSVDiv");
            var btnDeviceLoadDiv = thisPage.find("#btnDeviceLoadDiv");
            var btnDeviceSaveDiv = thisPage.find("#btnDeviceSaveDiv");
            var lblRecipeName = thisPage.find("#lblRecipeName");
            var lblRecipeComboDiv = thisPage.find("#lblRecipeCombo");
            var commandButtons = [];
            var forceRecipeReload = [];
            var recipeNamesMap = {};
            var recipePendingChanges = {};
            var decimalSeparator = getDecimalSeparator(scope);
            const newRecipePrefix = "_NEWRECIPE_";
            var recipeWriteEnabled;
            var recipeReadEnabled;
            var bGridInitialized = false;
            var columnWidth = {};
            var componentsReady = {
                datagrid: false,
                toolbar: false,
                chooser: false,
                all: function () {
                    return this.datagrid && this.toolbar && this.chooser;
                }
            }
            var bIgnoreValueChange;
            var bEditing;
            var bWaitingRowUpdate;
            var bDBWaitingRowUpdate;
            var bDeviceWaitingRowUpdate;
            var lblRecipeCombo;
            var btnDBSave;
            var btnDeviceSave;
            var btnDeviceLoad;
            var id = notNumeric(parseInt(parameters.SVGReferenceId)) ? -1 : parameters.SVGReferenceId;

            var scrollableContent;
            var lastHeaderColumn;
            var lastColMinWidth;
            var colResizeOperation;
            var lastResizeArg;
            var maxProcessingFreqMS = 200;
            var bCreatingRecipe;

            var translationsPrefix = "RecipeGrid";
            var translations = scope.setTranslations(translationsPrefix, [
                {
                    id: "RecipeName",
                    stringSuffix: "RecipeNameLabel",
                    defValue: "Recipe Name"
                },
                {
                    id: "Wait",
                    stringSuffix: "WaitText",
                    defValue: "Connecting..."
                },
                {
                    id: "ReloadTooltip",
                    stringSuffix: "LayoutRecipeReloadCommandToolTip",
                    defValue: "Reload all recipe's values from archive."
                },
                {
                    id: "SaveTooltip",
                    stringSuffix: "LayoutRecipeSaveCommandToolTip",
                    defValue: "Save all recipe's changes to archive."
                },
                {
                    id: "AddTooltip",
                    stringSuffix: "LayoutRecipeNewCommandToolTip",
                    defValue: "Add a new recipe in the archive."
                },
                {
                    id: "RemoveTooltip",
                    stringSuffix: "LayoutRecipeRemoveCommandToolTip",
                    defValue: "Remove the current recipe from the archive."
                },
                {
                    id: "ImportTooltip",
                    stringSuffix: "LayoutRecipeImportCommandToolTip",
                    defValue: "Import recipe values from '.csv' file."
                },
                {
                    id: "ExportTooltip",
                    stringSuffix: "LayoutRecipeExportCommandToolTip",
                    defValue: "Export selected recipe values to '.csv' file."
                },
                {
                    id: "ReadTooltip",
                    stringSuffix: "LayoutRecipeReadCommandToolTip",
                    defValue: "Read the data values from device."
                },
                {
                    id: "WriteTooltip",
                    stringSuffix: "LayoutRecipeWriteCommandToolTip",
                    defValue: "Write the actual data values to device."
                },
                {
                    id: "Reload",
                    stringSuffix: "ReloadButton",
                    defValue: "Reload"
                },
                {
                    id: "Save",
                    stringSuffix: "SaveButton",
                    defValue: "Save"
                },
                {
                    id: "Add",
                    stringSuffix: "AddButton",
                    defValue: "New"
                },
                {
                    id: "Remove",
                    stringSuffix: "RemoveButton",
                    defValue: "Remove"
                },
                {
                    id: "Import",
                    stringSuffix: "ImportButton",
                    defValue: "Import"
                },
                {
                    id: "Export",
                    stringSuffix: "ExportButton",
                    defValue: "Export"
                },
                {
                    id: "Read",
                    stringSuffix: "ReadButton",
                    defValue: "Read"
                },
                {
                    id: "Write",
                    stringSuffix: "WriteButton",
                    defValue: "Write"
                }
            ]);

            var dataValueInfo = {};
            var arrayDataValueInfo = {};
            if (parameters.DataValues) {
                for (var i = 0; i < parameters.DataValues.length; i++) {
                    if (parameters.DataValues[i].ArrayDimension > 0) {
                        var oldName = parameters.DataValues[i].Name;
                        for (var j = 0; j < parameters.DataValues[i].ArrayDimension; j++) {
                            var newName = oldName + " (" + j + ")";
                            dataValueInfo[newName] = JSON.parse(JSON.stringify(parameters.DataValues[i]));
                            dataValueInfo[newName].Name = newName;
                        }
                        arrayDataValueInfo[oldName] = parameters.DataValues[i].ArrayDimension;
                    }
                    else
                        dataValueInfo[parameters.DataValues[i].Name] = parameters.DataValues[i];
                }
            }
            
            var bDataGridDirty = false;
            //var bPaintingGrid = false;
            //var bNeedsResize = false;
            var headerTable;

            function columnResizeFix(e) {
                if (!scrollableContent) {
                    var el = $(e.component.element());
                    headerTable = el.find(".dx-datagrid-headers .dx-datagrid-table").first();
                    scrollableContent = el.find(".dx-scrollable-content").first();
                    scrollableContainer = el.find(".dx-scrollable-container").first();
                    lastHeaderColumn = el.find("tr.dx-header-row td[role='columnheader']").last();
                }
                var lastColWidth = lastHeaderColumn.width();
                if (!lastColMinWidth)
                    lastColMinWidth = scrollableContent.width() * 2 / 3;

                var bIsOutOfView = lastHeaderColumn.hasClass("outOfView");
                if (lastColWidth < 0 && !bIsOutOfView) {
                    var newW = scrollableContent.width() + lastColMinWidth;
                    lastHeaderColumn.css("width", lastColMinWidth).addClass("outOfView");
                    scrollableContent.css("width", newW);
                    headerTable.css("width", newW);
                }
                if (bIsOutOfView && lastColWidth != lastColMinWidth)
                    lastHeaderColumn.css("width", "inherit").removeClass("outOfView");
            }

            var dataGridOptions = {
                showBorders: true,
                columnResizingMode: "widget",
                onOptionChanged: function (e) {
                    var bWidthChanged = e.fullName.match(/columns\[[0-9]+\]\.width/) != null;
                    if (!bWidthChanged)
                        return;

                    lastResizeArg = e;
                    if (colResizeOperation)
                        return;
                    
                    colResizeOperation = setTimeout(function () {
                        colResizeOperation = null;
                        columnResizeFix(lastResizeArg);
                    }, maxProcessingFreqMS);
                },
                disabled: thisParent.hasClass(disabledClass),
                width: "100%",
                editing: {
                    allowUpdating: true,
                    allowAdding: false,
                    allowDeleting: false,
                    mode: 'cell'
                },
                allowColumnReordering: true,
                allowColumnResizing: true,
                //onRowPrepared: function (e) {
                //    if (e.rowType != 'data')
                //        return;
                //    else if (e.data.needsAcknoledge) {
                //        arrayrow.push(e.rowElement);
                //    }
                //},
                //focusedRowEnabled: true,
                errorRowEnabled: false,
                groupPanel: {
                    visible: true
                },
                grouping: {
                    contextMenuEnabled: true,
                    autoExpandAll: false
                },
                onInitialized: function (e) {
                    setTimeout(function () {
                        componentsReady.datagrid = true;
                        if (componentsReady.all())
                            updateGridHeight();
                    }, 1);
                },
                onContentReady: function (e) {
                    if (e.component.option("dataSource") && !bGridInitialized) {
                        bGridInitialized = true;
                        e.component.option("columns", configureGridColumns());
                    }
                    var el = e.component.element();
                    if (parameters.RowAreaFontSettings) {
                        var inputOptions = {};
                        if (parameters.RowAreaFontSettings.FontFamily)
                            inputOptions["font-family"] = parameters.RowAreaFontSettings.FontFamily;
                        if (parameters.RowAreaFontSettings.FontSize)
                            inputOptions["font-size"] = parameters.RowAreaFontSettings.FontSize;
                        if (parameters.RowAreaFontSettings.FontWeight)
                            inputOptions["font-weight"] = fontWeightConverter(parameters.RowAreaFontSettings.FontWeight);
                        inputOptions["color"] = parameters.Foreground.Color;
                        el.find(".dx-data-row td, div.dx-item-content, input.dx-texteditor-input").css(inputOptions);
                        el.find(".dx-datagrid-content").css("font-size", inputOptions["font-size"]);
                    }
                    if (parameters.HeaderFontSettings) {
                        var inputOptions = {};
                        if (parameters.HeaderFontSettings.FontFamily)
                            inputOptions["font-family"] = parameters.HeaderFontSettings.FontFamily;
                        if (parameters.HeaderFontSettings.FontSize)
                            inputOptions["font-size"] = parameters.HeaderFontSettings.FontSize;
                        if (parameters.HeaderFontSettings.FontWeight)
                            inputOptions["font-weight"] = fontWeightConverter(parameters.HeaderFontSettings.FontWeight);
                        inputOptions["color"] = parameters.Foreground.Color;
                        el.find(".dx-header-row").css(inputOptions);
                    }
                    var inputOptions = {};
                    if (parameters.FontFamily)
                        inputOptions["font-family"] = parameters.FontFamily;
                    if (parameters.FontSize)
                        inputOptions["font-size"] = parameters.FontSize;
                    if (parameters.FontWeight)
                        inputOptions["font-weight"] = fontWeightConverter(parameters.FontWeight);
                    recipeChooser.css(inputOptions);
                    recipeChooser.find("input").css(inputOptions);
                    inputOptions["color"] = parameters.ToolbarForeground ? parameters.ToolbarForeground.Color : parameters.Foreground.Color;

                    lblRecipeName.css(inputOptions);
                    btnAddRecipeDiv.css(inputOptions);
                    btnDBLoadDiv.css(inputOptions);
                    btnDBSaveDiv.css(inputOptions);
                    btnDelRecipeDiv.css(inputOptions);
                    btnDeviceLoadDiv.css(inputOptions);
                    btnDeviceSaveDiv.css(inputOptions);
                    btn.css(inputOptions);

                    inputOptions["color"] = parameters.Foreground.Color;
                    el.find("div.dx-item-content, .dx-header-row, .dx-data-row td, div.dx-item-content, input.dx-texteditor-input").css(inputOptions);
                    el.find(".dx-datagrid-content").css("font-size", inputOptions["font-size"]);

                    if (parameters.Background)
                        el.find(".dx-toolbar, .dx-datagrid").css("background", parameters.Background.Color);

                    if (parameters.HeaderForeground)
                        el.find(".dx-header-row").css("color", parameters.HeaderForeground.Color);
                    if (parameters.HeaderBackground)
                        el.find(".dx-header-row td").css("background", parameters.HeaderBackground.Color)
                    if (parameters.RowAreaForeground)
                        el.find(".dx-data-row td").css("color", parameters.RowAreaForeground.Color);
                    if (parameters.ShowCellsBorder && parameters.CellBorderColor)
                        el.find(".dx-data-row td").css("border", "1px solid " + parameters.CellBorderColor.Color);

                    //if (parameters.FocusedRowBackground)
                    //    el.find(".dx-datagrid-rowsview .dx-row-focused.dx-data-row > td:not(.dx-focused)").css("background-color", parameters.FocusedRowBackground.Color);
                    //if (parameters.FocusedRowForeground)
                    //    el.find(".dx-datagrid-rowsview .dx-row-focused.dx-data-row > td:not(.dx-focused)").css("color", parameters.FocusedRowForeground.Color);

                    //if (bNeedsResize) {
                    //    bNeedsResize = false;
                    //    var grid = e.component;
                    //    grid.option("columnAutoWidth", true);
                    //    if (!bPaintingGrid) {
                    //        bPaintingGrid = true;
                    //        grid.repaint();
                    //        bPaintingGrid = false;
                    //    }
                    //}
                },
                onEditingStart: function (e) {
                    var cellDatatype = "string";
                    switch (e.data.EditControlType) {
                        case "CheckBox":
                            cellDatatype = "boolean";
                            break;
                        case "RadioButton":
                            cellDatatype = "boolean";
                            break;
                        case "EditDisplay":
                            cellDatatype = "string";
                            break;
                        case "ComboBox":
                            cellDatatype = "object";
                            break;
                        case "ListView":
                            cellDatatype = "object";
                            break;
                    }
                    e.column.dataType = cellDatatype;
                },
                onRowUpdated: function (e) {
                    bDataGridDirty = true;
                    var groupName = e.data.GroupName;
                    var recipeGuid = recipeNamesMap[lblRecipeCombo.option("value")];
                    var dataValueName = e.data.Name;
                    var dataValueValue = e.data.Value;
                    var dvInfo;
                    if (dataValueName in dataValueInfo)
                        dvInfo = dataValueInfo[dataValueName];

                    if (e.data.ArrayPropName) {
                        var arrayCells = dataGrid.option("dataSource").filter(function (item) { return item.ArrayPropName == e.data.ArrayPropName });
                        var newArrayValue = "{";
                        $.each(arrayCells, function (index, item) {
                            var newValue = item.Value;
                            if (dvInfo && dvInfo["IsDecimal"] && decimalSeparator != invariantNumberDecimalSeparator)
                                newValue = newValue.toString().replace(decimalSeparator, invariantNumberDecimalSeparator);
                            newArrayValue += newValue + (index == arrayCells.length - 1 ? "}" : " |");
                        });
                        dataValueName = e.data.ArrayPropName;
                        dataValueValue = newArrayValue;
                    }

                    if (dvInfo) {
                        if (dvInfo["IsScalar"] && dvInfo["UnitName"] && dataValueValue !== null && dataValueValue !== undefined && dataValueValue.toString().indexOf(dvInfo["UnitName"]) !== -1) {
                            var re = new RegExp("\\s*" + dvInfo["UnitName"] + "");
                            dataValueValue = dataValueValue.toString().replace(re, "");
                        }
                        
                        if (dataValueValue === "")
                            dataValueValue = dataValueInfo[dataValueName].DefaultValue;
                        else if (dvInfo["IsDecimal"])
                            dataValueValue = dataValueValue.toString().replace(decimalSeparator, invariantNumberDecimalSeparator);
                    }
                    addOrUpdateObjectProps(recipePendingChanges, [groupName, recipeGuid, dataValueName], dataValueValue);
                    bWaitingRowUpdate = false;
                    if (bDBWaitingRowUpdate) {
                        bDBWaitingRowUpdate = false;
                        RecipeDBSave(scope, parameters.SVGReferenceId, parameters.screenId, recipePendingChanges);
                        enableDisableCommandButtons(true);
                    }
                    if (bDeviceWaitingRowUpdate) {
                        bDeviceWaitingRowUpdate = false;
                        RecipeDeviceSave(scope, id, recipePendingChanges);
                        enableDisableCommandButtons(true);
                    }
                },
                filterValue: parameters.FilterCriteria,
                scrolling: scrollingOptions,
                paging: {
                    enabled: false,
                    pageSize: 50,
                },
                filterRow: {
                    visible: parameters.ShowFilterPanel ? true : false
                },
                loadPanel: {
                    enabled: true
                },
                columns: [],
                noDataText: translations.Wait()
            };

            var dataGrid;

            var mutateFunc = function () {
                dataGrid = recipegrid.dxDataGrid(dataGridOptions).dxDataGrid("instance");
                $(lblRecipeName).text(translations.RecipeName());
                if (parameters.Background)
                    $(thisPage.find(".dx-datagrid-rowsview")[0]).css("background", parameters.Background.Color);

                if (parameters.Background) {
                    lblRecipeComboDiv.css("background", parameters.Background.Color);
                    recipeToolbar.children("div").css("background", parameters.Background.Color);
                }
                if (parameters.ToolbarBackground) {
                    recipeChooser.css("background", parameters.ToolbarBackground.Color);
                    recipeToolbar.css("background", parameters.ToolbarBackground.Color);
                    thisPage.css("background", parameters.ToolbarBackground.Color);
                }


                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                var btnDBLoad = btnDBLoadDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/refresh.svg" : null,
                    hint: translations.ReloadTooltip(),
                    text: parameters.UseIcon ? null : translations.Reload(),
                    type: "normal",
                    disabled: true,
                    visible: parameters.ShowReloadButton,
                    onClick: function (e) {
                        ReloadRecipeData(lblRecipeCombo.option("value"));
                    }
                }).dxButton("instance");

                btnDBSave = btnDBSaveDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/save.svg" : null,
                    hint: translations.SaveTooltip(),
                    text: parameters.UseIcon ? null : translations.Save(),
                    type: "normal",
                    disabled: true,
                    visible: parameters.ShowSaveButton,
                    onClick: function (e) {
                        if (bWaitingRowUpdate) {
                            bDBWaitingRowUpdate = true;
                            enableDisableCommandButtons(true);
                            return;
                        }
                        RecipeDBSave(scope, parameters.SVGReferenceId, parameters.screenId, recipePendingChanges);
                    }
                }).dxButton("instance");

                btnDeviceLoad = btnDeviceLoadDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/enter.svg" : null,
                    hint: translations.ReadTooltip(),
                    text: parameters.UseIcon ? null : translations.Read(),
                    type: "normal",
                    disabled: false,
                    visible: parameters.ShowReadButton,
                    onClick: function (e) {
                        if (parameters.UseIcon)
                            btnDeviceLoad.option("icon", "images/toolbox/enter.svg");

                        var selectedSubrecipeName = lblRecipeCombo.option("value");
                        var selectedSubrecipeGuid = recipeNamesMap[selectedSubrecipeName];
                        if (!selectedSubrecipeName || !selectedSubrecipeGuid)
                            return;

                        scope.busyVisible = true;
                        scope.$apply();

                        var id = notNumeric(parseInt(parameters.SVGReferenceId)) ? -1 : parameters.SVGReferenceId;
                        scope.corehubconnection.invoke("RecipeDeviceLoad", id, parameters.screenId, parameters.RecipeName, selectedSubrecipeName, selectedSubrecipeGuid)
                            .then((ret) => {
                                setGridDataSource(ret.items);
                                bDataGridDirty = true;
                                recipePendingChanges = ret.items[0];

                                enableDisableCommandButtons(false);
                                if (parameters.UseIcon)
                                    btnDeviceLoad.option("icon", "images/toolbox/enter_ok.svg");

                                scope.busyVisible = false;
                                scope.$apply();
                            })
                            .catch(err => {
                                console.error(err.toString());
                                scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorReadingDeviceData") });

                                enableDisableCommandButtons(false);
                                if (parameters.UseIcon)
                                    btnDeviceLoad.option("icon", "images/toolbox/enter_ko.svg");

                                scope.busyVisible = false;
                                scope.$apply();
                            });
                    }
                }).dxButton("instance");

                var btnAddRecipe = btnAddRecipeDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/piu.svg" : null,
                    hint: translations.AddTooltip(),
                    text: parameters.UseIcon ? null : translations.Add(),
                    type: "normal",
                    disabled: true,
                    visible: parameters.ShowAddButton,
                    onClick: function (e) {
                        var myDialog = DevExpress.ui.dialog.custom({
                            buttons: [
                                {
                                    text: i18next.t1("OkText"),
                                    onClick: function (e) { return true; }
                                },
                                {
                                    text: i18next.t1("CancelText"),
                                    onClick: function (e) { return false; }
                                }
                            ],
                            messageHtml: "<div><input id='txt1' style='width:100%;' /></div>",
                            title: i18next.t1("EnterNewItemName")
                        });
                        myDialog.show().done(function (res) {
                            if (res) {
                                var newname = $("#txt1").val();
                                if (newname != "") {
                                    var comboItems = lblRecipeCombo.option("items");
                                    comboItems.push(newname);
                                    lblRecipeCombo.option({
                                        "items": comboItems,
                                        "value": comboItems[comboItems.length - 1]
                                    });
                                    bDataGridDirty = true;
                                }
                            }
                        });
                    }
                }).dxButton("instance");
                
                var btnDelRecipe = btnDelRecipeDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/redcross.svg" : null,
                    hint: translations.RemoveTooltip(),
                    text: parameters.UseIcon ? null : translations.Remove(),
                    type: "normal",
                    disabled: true,
                    visible: parameters.ShowRemoveButton,
                    onClick: function (e) {
                        DevExpress.ui.dialog.confirm(i18next.t1("ConfirmRecipeDeletion"), i18next.t1("UserConfirmationNeededTitle"))
                            .then(function (res) {
                                if (res) {
                                    var selectedRecipeName = lblRecipeCombo.option("value");
                                    var selectedRecipeGuid = recipeNamesMap[selectedRecipeName];
                                    if (selectedRecipeGuid.includes(newRecipePrefix))
                                        ReloadRecipeData(); //discarding client's tracked changes on the new recipe. Server must remain unaware of it
                                    else
                                        RecipeDBSave(scope, parameters.SVGReferenceId, parameters.screenId, null, true);
                                }
                            });
                    }
                }).dxButton("instance");

                //var btnOpenCSV = btnOpenCSVDiv.dxButton({
                //    icon: "images/toolbox/csv1.svg",
                //    type: "normal",
                //    disabled: true,
                //    onClick: function (e) {
                //        alert("TODO");
                //    }
                //}).dxButton("instance");

                //var btnSaveCSV = btnSaveCSVDiv.dxButton({
                //    icon: "images/toolbox/csv2.svg",
                //    type: "normal",
                //    disabled: true,
                //    onClick: function (e) {
                //        alert("TODO");
                //    }
                //}).dxButton("instance");

                btnDeviceSave = btnDeviceSaveDiv.dxButton({
                    icon: parameters.UseIcon ? "images/toolbox/exit.svg" : null,
                    hint: translations.WriteTooltip(),
                    text: parameters.UseIcon ? null : translations.Write(),
                    type: "normal",
                    disabled: false,
                    visible: parameters.ShowWriteButton,
                    onContentReady: function (e) {
                        componentsReady.toolbar = true;
                        if (componentsReady.all())
                            updateGridHeight();
                    },
                    onClick: function (e) {
                        if (bWaitingRowUpdate) {
                            bDeviceWaitingRowUpdate = true;
                            enableDisableCommandButtons(true);
                            return;
                        }
                        RecipeDeviceSave(scope, id, recipePendingChanges)
                    }
                }).dxButton("instance");

                commandButtons = [btnDBLoad, btnDBSave, btnDelRecipe, btnAddRecipe, btnDeviceLoad, btnDeviceSave/*, btnOpenCSV, btnSaveCSV*/];

                lblRecipeCombo = lblRecipeComboDiv.dxSelectBox({
                    disabled: true,
                    acceptCustomValue: true,
                    onCustomItemCreating: function (data) {
                        var comboItems = lblRecipeCombo.option("items");
                        var itemIndex = comboItems.indexOf(data.text);
                        data.customItem = data.text;
                        if (itemIndex == -1) {
                            comboItems.push(data.text);
                            lblRecipeCombo.option("items", comboItems);
                        }
                    },
                    onValueChanged: function (e) {
                        if (bIgnoreValueChange)
                            return;

                        var previousValue = e.previousValue;
                        var newValue = e.value;
                        if (newValue) {
                            var onCancelFn = function () {
                                bIgnoreValueChange = true;
                                lblRecipeCombo.option("value", previousValue);
                                bIgnoreValueChange = false;
                            }
                            var onOkFn = function () {
                                if (newValue in recipeNamesMap && !recipeNamesMap[newValue].includes(newRecipePrefix)) {
                                    if (forceRecipeReload.indexOf(recipeNamesMap[newValue]) !== -1 || (recipeNamesMap[previousValue] && recipeNamesMap[previousValue].includes(newRecipePrefix)))
                                        ReloadRecipeData(newValue);
                                    else
                                        FilterSingleRecipeData(newValue);
                                }
                                else //new Recipe
                                {
                                    var clonedRecipeGuid;
                                    clonedRecipeGuid = recipeNamesMap[previousValue];
                                    if (!clonedRecipeGuid)
                                        clonedRecipeGuid = emptyGuID;
                                    if (!(newValue in recipeNamesMap))
                                        recipeNamesMap[newValue] = newRecipePrefix + clonedRecipeGuid + newValue;
                                }
                            }
                            if (bDataGridDirty) {
                                DevExpress.ui.dialog.confirm(i18next.t1("SaveBeforeLeaving"), i18next.t1("PendingChangesTitle"))
                                    .then(function (res) {
                                        if (!res) {
                                            forceRecipeReload.push(recipeNamesMap[previousValue]);
                                            onOkFn();
                                        }
                                        else {
                                            onCancelFn();
                                            RecipeDBSave(scope, parameters.SVGReferenceId, parameters.screenId, recipePendingChanges, false, false)
                                                .finally(() => {
                                                    bIgnoreValueChange = true;
                                                    lblRecipeCombo.option("value", newValue);
                                                    bIgnoreValueChange = false;
                                                    onOkFn();
                                                });
                                        }
                                    })
                                    .catch(function (req) {
                                        onCancelFn();
                                    });
                            }
                            else
                                onOkFn();
                        }
                        else { //no selected recipie. Populating with default values

                                    scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorLoadingRecipeData") });

                                    scope.busyVisible = false;
                                    scope.$apply();
                                });
                        }

            function completeDvInfo(dvInfo, item) {
                item["Description"] = dvInfo.Description;
                dvInfo["IsString"] = item.IsString;
                dvInfo["IsUnsigned"] = item.IsUnsigned;
                dvInfo["IsDecimal"] = item.IsDecimal;
                dvInfo["IsScalar"] = item.IsScalar;
            }

            function normalizeBooleanValue(dvInfo, item, bDefaultValue) {
                if (dvInfo.EditControlType == 2 && dvInfo.DataType == 0) {
                    var key = bDefaultValue ? "DefaultValue" : "Value";
                    var fval = parseFloat(item[key]);
                    var finalValue;
                    if (isNaN(fval)) {
                        if (undefinedOrNull(item[key]))
                            finalValue = undefinedOrNull(item["DefaultValue"]) ? "0" : normalizeBooleanValue(dvInfo, item, true);
                        else
                            finalValue = item[key].toLowerCase() == "true" ? "1" : "0";
                    }
                    else {
                        finalValue = fval == "1" ? "1" : "0";
                    }
                    item["Value"] = finalValue;
                }
            }

            function parseSerializedArrayDataValues(dvItems) {
                let toBeExpanded = [];
                for (var i = 0; i < dvItems.length; i++) {
                    if (dvItems[i].Name in dataValueInfo || dvItems[i].Name in arrayDataValueInfo) {
                        if (dvItems[i].Name in dataValueInfo) {
                            completeDvInfo(dataValueInfo[dvItems[i].Name], dvItems[i]);
                            normalizeBooleanValue(dataValueInfo[dvItems[i].Name], dvItems[i]);
                        }
                        else
                            toBeExpanded.push(dvItems[i]["Name"]);
                    }
                }
                jQuery.each(toBeExpanded, function (i, e) {
                    let originalItemIndex = dvItems.findIndex(function (item) { return item.Name == e });
                    let originalItem = dvItems[originalItemIndex];
                    let arraySubElements = [];
                    for (var j = 0; j < arrayDataValueInfo[e] - 1; j++) { //arraydimension
                        var clone = JSON.parse(JSON.stringify(originalItem));
                        configureArrayDataValue(originalItem, clone, j + 1);
                        arraySubElements.push(clone);
                    }
                    configureArrayDataValue(originalItem, originalItem, 0);
                    dvItems.splice(originalItemIndex + 1, 0, ...arraySubElements);
                });
                return dvItems;
            }

            function configureArrayDataValue(sourceItem, targetItem, arrayIndex) {
                targetItem["ArrayPropName"] = sourceItem.Name;
                targetItem["Name"] += " (" + arrayIndex + ")";
                completeDvInfo(dataValueInfo[targetItem.Name], sourceItem);
                if (sourceItem["Value"].length > 0)
                    targetItem["Value"] = sourceItem["Value"].substring(1, sourceItem["Value"].length - 1).split(/\s*\|\s*/)[arrayIndex];
                normalizeBooleanValue(dataValueInfo[targetItem.Name], targetItem);
                if (sourceItem["IsDecimal"] && sourceItem["DecimalDigits"] > 0) {
                    var newValue = targetItem["Value"];
                    if (decimalSeparator && decimalSeparator != invariantNumberDecimalSeparator)
                        newValue = newValue.toString().replace(decimalSeparator, invariantNumberDecimalSeparator);
                    targetItem["Value"] = parseFloat(newValue).toFixed(sourceItem.DecimalDigits);
                    if (isNaN(targetItem["Value"]))
                        targetItem["Value"] = parseFloat(undefinedOrNull(targetItem["DefaultValue"]) || isNaN(targetItem["DefaultValue"]) ? 0 : targetItem["DefaultValue"]).toFixed(sourceItem.DecimalDigits);
                }
                else if (targetItem["IsScalar"] && isNaN(targetItem["Value"]))
                    targetItem["Value"] = undefinedOrNull(targetItem["DefaultValue"]) || isNaN(targetItem["DefaultValue"]) ? "0" : parseInt(targetItem["DefaultValue"], 10);
            }

            function FilterSingleRecipeData(selectedSubRecipe) {
                enableDisableCommandButtons(true);
                scope.busyVisible = true;
                scope.$apply();
                scope.corehubconnection.invoke("FilterSingleRecipeData", parameters.RecipeName, selectedSubRecipe, parameters.screenId)
                    .then((ret) => {
                        bDataGridDirty = false;
                        var dvItems = parseSerializedArrayDataValues(ret.items);
                        setGridDataSource(dvItems);

                        enableDisableCommandButtons(false);

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorLoadingRecipeData") });

                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function setGridDataSource(items) {
                //bNeedsResize = true;
                if (!dataGrid)
                    return;

                dataGrid.option({
                    "dataSource": items,
                    "showColumnHeaders": items == null ? false : true
                });
            }

            function ClearGridData() {
                bDataGridDirty = false;
                recipeNamesMap = {};
                recipePendingChanges = {};
                lblRecipeCombo.option("items", []);
                setGridDataSource(null);
            }

            function ReloadRecipeData(oldSelectedRecipe) {
                enableDisableCommandButtons(true);
                scope.busyVisible = true;
                scope.$apply();
                scope.corehubconnection.invoke("InitializeRecipeDocument", parameters.RecipeName, parseInt(parameters.ReadWriteTimeOut, 10))
                    .then((ret) => {
                        ret = JSON.parse(ret);

                        recipeReadEnabled = ret.recipeReadWrite[0];
                        recipeWriteEnabled = ret.recipeReadWrite[1];
                        if (ret.lastFillError && ret.lastFillError != '')
                        {
                            var fillErrorMsg = i18next.t1("RecipeReadingError") + " (" + i18next.t1(ret.lastFillError[0]) + ")";
                            DevExpress.ui.notify({ message: fillErrorMsg }, "error", 5000);
                            console.error(fillErrorMsg);
                            var errorOverlay = thisPage.find(".lastRecipeErrorOverlay");
                            if (errorOverlay.length == 0) {
                                thisPage.append("<div class='lastRecipeErrorOverlay'>" + fillErrorMsg + "<div class='errorAckedBtn'></div></div>");
                                thisPage.find(".errorAckedBtn").dxButton({
                                    icon: "check",
                                    onClick: function (e) {
                                        e.component.dispose();
                                        thisPage.find(".lastRecipeErrorOverlay").remove();
                                    }
                                });
                            }
                        }
                        
                        ClearGridData();

                        var recipeNames = [""];
                        if (ret.RecipeNames && ret.RecipeNames.length > 0) {
                            recipeNames = ret.RecipeNames;
                            for (var i = 0; i < ret.RecipeNames.length; i++)
                                recipeNamesMap[ret.RecipeNames[i]] = ret.RecipeIDS[i];
                        }
                        var newValue = recipeNames[0];
                        if (oldSelectedRecipe) {
                            var recipeIndex = forceRecipeReload.indexOf(recipeNamesMap[oldSelectedRecipe]);
                            if (recipeIndex !== -1)
                                forceRecipeReload.splice(recipeIndex, 1);
                            var oldRecipeIndex = recipeNames.indexOf(oldSelectedRecipe);
                            if (oldRecipeIndex != -1)
                                newValue = recipeNames[oldRecipeIndex];
                            FilterSingleRecipeData(newValue);
                        }
                        lblRecipeCombo.option({
                            "items": recipeNames,
                            "value": newValue,
                            "disabled": false
                        });
                        enableDisableCommandButtons(false);

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorInitializingRecipeDocument") });

                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function RecipeDeviceSave(scope, id, recipePendingChanges) {
                if (parameters.UseIcon)
                    btnDeviceSave.option("icon", "images/toolbox/exit.svg");
                var recipeGuid = recipeNamesMap[lblRecipeCombo.option("value")];
                if (!recipeGuid)
                    return;
                scope.busyVisible = true;
                scope.$apply();
                scope.corehubconnection.invoke("RecipeDeviceSave", id, parameters.screenId, parameters.RecipeName, recipePendingChanges, recipeGuid, newRecipePrefix)
                    .then((ret) => {
                        recipePendingChanges = {};
                        if (parameters.UseIcon)
                            btnDeviceSave.option("icon", "images/toolbox/exit_ok.svg");

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {
                        console.error(err.toString());
                        scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorWritingDeviceData") });

                        enableDisableCommandButtons(false);
                        if (parameters.UseIcon)
                            btnDeviceSave.option("icon", "images/toolbox/exit_ko.svg");

                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }

            function RecipeDBSave(scope, id, screenId, recipePendingChanges, bDeleting = false, bReloadRecipe = true) {
                return new Promise(function (resolve, reject) {
                    id = notNumeric(parseInt(id)) ? -1 : id;
                    var recipeGuid = recipeNamesMap[lblRecipeCombo.option("value")];
                    if (!recipeGuid)
                        reject(false);

                    enableDisableCommandButtons(true);
                    scope.busyVisible = true;
                    scope.$apply();

                    scope.corehubconnection.invoke("RecipeDBSave", id, screenId, parameters.RecipeName, recipePendingChanges, recipeGuid, newRecipePrefix, bDeleting)
                        .then((ret) => {
                            if (bReloadRecipe)
                                ReloadRecipeData(lblRecipeCombo.option("value"));
                            scope.busyVisible = false;
                            scope.$apply();
                            resolve(true);
                        })
                        .catch(err => {
                            console.error(err.toString());
                            scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorDBDataSave") });

                            enableDisableCommandButtons(false);

                            scope.busyVisible = false;
                            scope.$apply();
                            reject(false);
                        });
                });
            }

            function setColumnAutoWidth(fieldName, displayValue) {
                if (undefinedOrNull(displayValue))
                    return;
                if (undefinedOrNull(displayValue.length))
                    return;

                let newWidth = displayValue.length + (fieldName == "Value" ? 4 : 3);
                if (newWidth > columnWidth[fieldName]) {
                    columnWidth[fieldName] = newWidth;
                    newWidth = (newWidth) + "ch";
                    dataGrid.columnOption(fieldName, "width", newWidth);
                }
            }

            function configureGridColumns() {
                var columns = [];
                columnWidth = {};
                jQuery.each(parameters.GridLayout, function (index, item) {
                    var colOptions = {
                        dataField: item.FieldName,
                        caption: i18next.t1("_" + translationsPrefix + "_" + item.FieldName, item.FieldName),
                        allowEditing: item.FieldName == "Value" ? true : false,
                        showEditorAlways: true
                    };
                    if (!isNaN(item.ActualWidth))
                        colOptions["width"] = item.ActualWidth;
                    if (parameters.GroupByName && item.FieldName == "GroupName")
                        colOptions.groupIndex = 0;
                    columnWidth[item.FieldName] = 0;
                    if (item.FieldName == "Value") {
                        colOptions.editCellTemplate = function (container, options) {
                            var dataValueName = options.data.Name;
                            if (typeof (options.value) == "undefined")
                                options.value = "";
                            var initialCellStringValue = options.value.toString().toLowerCase();

                            setColumnAutoWidth(item.FieldName, options.displayValue);

                            if (dataValueName in dataValueInfo) {
                                var dvInfo = dataValueInfo[dataValueName];
                                var newStringTrueValue = dvInfo["IsString"] ? "True" : "1";
                                var newStringFalseValue = dvInfo["IsString"] ? "False" : "0";
                                switch (parseInt(dvInfo.EditControlType)) {
                                    case 0:
                                        return $("<div class='recipeEditTemplate' />").dxCheckBox({
                                            value: initialCellStringValue == "" || parseFloat(initialCellStringValue) == 0 || initialCellStringValue == "false" ? false : true,
                                            onValueChanged: function (data) {
                                                var newCellValue = data.value ? newStringTrueValue : newStringFalseValue;
                                                dataGrid.cellValue(options.row.rowIndex, "Value", newCellValue);
                                                dataGrid.saveEditData();
                                            }
                                        });
                                        break;
                                    case 1:
                                        var items = dvInfo.EnumOptions;
                                        if (items.length > 0) {
                                            var valueIndex = normalizeBoolean(options.value);
                                            var radioValue = valueIndex >= 0 && items.length > valueIndex ? items[valueIndex] : null;
                                            return $("<div class='recipeEditTemplate'/>").dxRadioGroup({
                                                items: items,
                                                value: radioValue,
                                                onValueChanged: function (data) {
                                                    var newCellValue = items.indexOf(data.value);
                                                    if (newCellValue != -1) {
                                                        dataGrid.cellValue(options.row.rowIndex, "Value", newCellValue);
                                                        dataGrid.saveEditData();
                                                    }
                                                }
                                            });
                                        }
                                        break;
                                    case 2:
                                        return $("<div>").dxTextBox({
                                            value: options.value,
                                            onFocusIn: function (e) {
                                                var currentValue = dataGrid.cellValue(options.row.rowIndex, "Value").toString();
                                                if (dvInfo["IsScalar"] && dvInfo["UnitName"] && currentValue !== null && currentValue !== undefined && currentValue.indexOf(dvInfo["UnitName"]) !== -1) {
                                                    var re = new RegExp("\\s*" + dvInfo["UnitName"] + "");
                                                    e.component.option("value", currentValue.replace(re, ""));
                                                    dataGrid.editCell(options.row.rowIndex, "Value");
                                                }
                                            },
                                            onKeyDown: function (e) {
                                                if (!dvInfo["IsDecimal"] && !dvInfo["IsString"]) {
                                                    var event = e.jQueryEvent || e.event;
                                                    var keyCode = event.keyCode;
                                                    if (keyCode == 110 || keyCode == 190 || keyCode == 188) {
                                                        event.preventDefault();
                                                    }
                                                }
                                            },
                                            onValueChanged: function (data) {
                                                var newValue = data.value;
                                                if (dvInfo["IsScalar"]) {
                                                    newValue = parseFloat(data.value.replace(decimalSeparator, invariantNumberDecimalSeparator));
                                                    if (newValue > parseFloat(dvInfo.MaxValue) || newValue < dvInfo.MinValue) {
                                                        dataGrid.cellValue(options.row.rowIndex, "Value", data.previousValue);
                                                        return;
                                                    }

                                                    if (dvInfo["IsDecimal"]) {
                                                        newValue = newValue.toFixed(dvInfo.DecimalDigits)
                                                        if (decimalSeparator) {
                                                            if (decimalSeparator != invariantNumberDecimalSeparator)
                                                                newValue = newValue.toString().replace(invariantNumberDecimalSeparator, decimalSeparator);
                                                        }
                                                    }
                                                }

                                                if (dvInfo["IsUnsigned"] && newValue.toString().indexOf("-") !== -1)
                                                    newValue = data.previousValue;

                                                if (data.event && data.event.type == "change")
                                                    bWaitingRowUpdate = true;
                                                
                                                dataGrid.cellValue(options.row.rowIndex, "Value", newValue);
                                            },
                                            onContentReady: function (e) {
                                                if (decimalSeparator && dvInfo["IsDecimal"]) {
                                                    var bLocalSeparator = decimalSeparator != invariantNumberDecimalSeparator;
                                                    var actValue = e.component.option("value").toString();
                                                    if (bLocalSeparator)
                                                        actValue = actValue.replace(decimalSeparator, invariantNumberDecimalSeparator);
                                                    var newValue = parseFloat(actValue).toFixed(dvInfo.DecimalDigits).toString();
                                                    e.component.option("value", bLocalSeparator ? newValue.replace(invariantNumberDecimalSeparator, decimalSeparator) : newValue);
                                                }

                                                if (parameters.PromptPad) {
                                                    var bPadNumeric = !dvInfo["IsString"];
                                                    var el = e.component.element();
                                                    el.find("input").on("click", function (ea) {
                                                        if (bEditing)
                                                            return;

                                                        bEditing = true;
                                                        var oldValue;
                                                        if (!bPadNumeric)
                                                            oldValue = dataGrid.cellValue(options.row.rowIndex, "Value");
                                                        else {
                                                            var numValue = parseFloat(dataGrid.cellValue(options.row.rowIndex, "Value").toString().replace(decimalSeparator, invariantNumberDecimalSeparator));
                                                            oldValue = notNumeric(numValue) ? "" : numValue;
                                                        }
                                                        var padThen = function (val) {
                                                            if (val !== null) {
                                                                var newValue = val;
                                                                if (dvInfo["IsScalar"])
                                                                    newValue = Math.max(Math.min(parseFloat(dvInfo.MaxValue), parseFloat(val)), parseFloat(dvInfo.MinValue));
                                                                dataGrid.cellValue(options.row.rowIndex, "Value", newValue);
                                                                dataGrid.saveEditData();
                                                            }
                                                        };
                                                        var padCatch = function (err) {
                                                            console.error(err.toString());
                                                            scope.$broadcast(onError, { ex: err, value: getClientErrorText(err, "ErrorSettingField") });
                                                            scope.$apply();
                                                        };
                                                        var padFinally = function () {
                                                            bEditing = false;
                                                        };
                                                        if (bPadNumeric)
                                                            scope.showNumericPad(scope, false, parseFloat(dvInfo.MinValue), parseFloat(dvInfo.MaxValue), oldValue)
                                                                .then(padThen)
                                                                .catch(padCatch)
                                                                .finally(() => {
                                                                    bEditing = false;
                                                                });
                                                        else
                                                            scope.showAlphanumericPad(scope, false, oldValue)
                                                                .then(padThen)
                                                                .catch(padCatch)
                                                                .finally(padFinally);
                                                    });
                                                }
                                            }
                                        });
                                        break;
                                    case 3:
                                        var items = dvInfo.EnumOptions;
                                        if (items.length > 0) {
                                            var valueIndex = normalizeBoolean(options.value);
                                            var comboValue = valueIndex >= 0 && items.length > valueIndex ? items[valueIndex] : null;
                                            return $("<div class='recipeEditTemplate' style='border: 1px solid #4d4d4d'/>").dxSelectBox({
                                                items: items,
                                                value: comboValue,
                                                onValueChanged: function (data) {
                                                    var newCellValue = items.indexOf(data.value);
                                                    if (newCellValue != -1) {
                                                        dataGrid.cellValue(options.row.rowIndex, "Value", newCellValue);
                                                        dataGrid.saveEditData();
                                                    }
                                                }
                                            });
                                        }
                                        break;
                                    case 4:
                                        var items = dvInfo.EnumOptions;
                                        if (items.length > 0) {
                                            var valueIndex = normalizeBoolean(options.value);
                                            var listValue = valueIndex >= 0 && items.length > valueIndex ? items[valueIndex] : null;
                                            return $("<div class='recipeEditTemplate' style='border: 1px solid #4d4d4d'/>").dxList({
                                                selectionMode: "single",
                                                items: items,
                                                selectedItems: [listValue],
                                                onSelectionChanged: function (data) {
                                                    var newCellValue = items.indexOf(data.addedItems[0]);
                                                    if (newCellValue != -1) {
                                                        dataGrid.cellValue(options.row.rowIndex, "Value", newCellValue);
                                                        dataGrid.saveEditData();
                                                    }
                                                }
                                            });
                                        }
                                        break;
                                }
                            }
                        }
                    }
                    else
                        colOptions.editCellTemplate = function (container, options) {
                            setColumnAutoWidth(item.FieldName, options.displayValue);
                            var txtVal = undefinedOrNull(options.value) ? "" : i18next.t1("_" + translationsPrefix + "_" + options.value, options.value);
                            return $("<div>").dxTextBox({ value: txtVal, readOnly: true });
                        }
                    columns.push(colOptions);
                });
                return columns;
            }

            function updateGridHeight() {
                btn.css("display", "none");
                recipegrid.height($(thisParent).height() - recipeChooser.height() - recipeToolbar.height() - 23 - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
            }
        }
    </script>
</div>

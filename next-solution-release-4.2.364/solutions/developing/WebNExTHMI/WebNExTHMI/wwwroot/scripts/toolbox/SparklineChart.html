<div id="SparklineChart" class="SparklineChart" style="height:100%;">
    <img src="cl.gif" alt="" onload="onSparklineChartLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="trend" style="overflow: hidden; padding: 10px;"></div>
        <div class="grid" style="display: grid; grid-template-columns: auto auto; margin: 10px;">
            <div id="startbtn"></div>
            <div id="pausebtn"></div>
        </div>
    </div>
    
    <script>
        function onSparklineChartLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");

            var mainContainer = thisPage.find("#mainContainer");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);

            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var interval;
            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);
            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var trendcontainer = thisPage.find("#trend");

            var dataSource = new Array(); //new Array(sampleNumber);
            var bFirstDrawn = false;

            var timezoneOffset = (new Date()).getTimezoneOffset() * 60 * 1000;
            var bLoadingData = false;
            var bTimerAborted;

            if (parameters.PlotBackground)
                trendcontainer.css("background", parameters.PlotBackground.Color);
            else if (parameters.ControlBackground)
                trendcontainer.css("background", parameters.ControlBackground.Color);
            if (parameters.ControlBackground)
                thisPage.css("background", parameters.ControlBackground.Color);

            var _valuecolumnname = parameters.ValueColumnName;
            if (!_valuecolumnname)
                _valuecolumnname = "ConsumValue";
            var _timecolumnname = "RecordDateTime";
            if (!_timecolumnname)
                _timecolumnname = Properties.Settings.Default.TimeColumnName;
            var _tablename = parameters.TableName;
            if (!_tablename)
                _tablename = "VwTodayValues15Min";
            var _maxrecord = parameters.MaxrecordNum;
            var _whereCondition = parameters.WhereCondition;
            var _orderby = "";
            var _groupby = "";
            var _select;
            var _connection;
            var _dataprovider;
            if (parameters.ControlDataSource && parameters.ControlDataSource.ReaderModel) {
                var model = parameters.ControlDataSource.ReaderModel;
                _connection = model.Connection;
                _dataprovider = model.DataProvider;
                if (model.DataColumn)
                    _valuecolumnname = model.DataColumn;
                if (model.TimeColumn)
                    _timecolumnname = model.TimeColumn;
                if (model.TableName)
                    _tablename = model.TableName;
                _maxrecord = model.MaxTake;
                _whereCondition = model.Where;
                _select = model.Select;
                _orderby = model.Sort;
                _groupby = model.GroupBy;
            }

            var now = new Date();
            var roundTo = 1000 * 3600 * 24;
            var startDate = new Date(Math.floor(now.getTime() / roundTo) * roundTo + timezoneOffset);
            var endDate = new Date(Math.ceil(now.getTime() / roundTo) * roundTo + timezoneOffset);
            var penLabel;
            if (parameters.ControlDataSource)
                if (parameters.ControlDataSource.ReaderModel)
                    penLabel = parameters.ControlDataSource.ReaderModel.DataColumn;
            if (penLabel)
                penLabel = "Pen";
            var bLastDataInError = false;

            var chartOptions = {
                dataSource: dataSource,
                legend: {
                    visible: false,
                    orientation: "horizontal",
                    verticalAlignment: "bottom",
                    horizontalAlignment: "center"
                },
                //seriesTemplate: {
                //    nameField: "value"
                //},
                series: [
                    { valueField: "dValue", name: penLabel, color: parameters.PenBrush },
                ],
                autoHidePointMarkers: false,
                commonSeriesSettings: {
                    argumentField: "SourceTimeStamp",
                    type: "line",
                    rangeValue1Field: "start",
                    rangeValue2Field: "end",
                    barOverlapGroup: "value",
                    hoverMode: "none",
                    point: {
                        visible: parameters.ShowMarkers,
                        color: parameters.MarkerBrush,
                        size: 2,
                        hoverMode: "none",
                    }
                },
                rotated: false,
                synchronizeMultiAxes: false,
                tooltip: {
                    enabled: false,
                },
                scrollBar: {
                    visible: false
                },
                animation: {
                    enabled: false
                },
                zoomAndPan: {
                    valueAxis: "none",
                    argumentAxis: "none"
                },
                argumentAxis:
                {
                    argumentType: "datetime",
                    aggregationInterval: "milliseconds",
                    type: "continuous",
                    color: parameters.PlotBorderBrush,
                    visualRange: {
                        startValue: startDate,
                        endValue: endDate
                    },
                    wholeRange: { startValue: null, endValue: null },
                    grid: {
                        visible: true,
                        width: 1,
                        color: parameters.GridBrush
                    },
                    minorGrid: {
                        visible: true,
                        width: 1,
                        color: "#A3A3A3"
                    },
                    label: {
                        visible: parameters.ShowLabels,
                        format: function (date) {
                            return padString(date.getHours(), 2, '0') + ":" + padString(date.getMinutes(), 2, '0');
                        },
                        font: {
                            color: parameters.LabelBrush.Color,
                            family: parameters.FontFamily,
                            size: parameters.FontSize,
                            weight: fontWeightConverter(parameters.FontWeight, true),
                        }
                    },
                    tickInterval: { minutes: 60 * 24 / parameters.MajorXDivision },
                    minorTick: {
                        visible: true
                    },
                    minorTickCount: parameters.MinorXDivision - 1
                },
                valueAxis: {
                    color: parameters.PlotBorderBrush,
                    label: {
                        visible: parameters.ShowLabels,
                        font: {
                            color: parameters.LabelBrush.Color,
                            family: parameters.FontFamily,
                            size: parameters.FontSize,
                            weight: fontWeightConverter(parameters.FontWeight, true),
                        },
                        format: function (val) {
                            var matches = parameters.LabelFormat.match(/\.([#0]*)/);
                            if (matches && matches.length > 1) {
                                var ch = matches[1].substr(0, 1);
                                var decimalPlaces = matches[1].length;
                                if (ch == '0')
                                    return val.toFixed(decimalPlaces);
                                else if (ch == '#')
                                    return mathHelpers.roundToSignificantDigits(val, decimalPlaces);
                            }
                            return val.toFixed(0);
                        }
                    },
                    valueMarginsEnabled: false,
                    visualRange: {
                        startValue: parameters.AutomaticScale ? null : parameters.MinValue,
                        endValue: parameters.AutomaticScale ? null : parameters.MaxValue
                    },
                    wholeRange: {
                        startValue: parameters.AutomaticScale ? null : parameters.MinValue,
                        endValue: parameters.AutomaticScale ? null : parameters.MaxValue
                    },
                    minorGrid: {
                        visible: true,
                        width: 1,
                        color: "#A3A3A3"
                    },
                    minorTickCount: parameters.MinorYDivision - 1,
                    tickInterval: (parameters.MaxValue - parameters.MinValue) / parameters.MajorYDivision
                },
                size: {
                    height: $(thisParent).attr("height") - 20,
                    width: $(thisParent).attr("width") - 20,
                },
                onDrawn: function (e) {
                    if (bFirstDrawn)
                        return;
                    bFirstDrawn = true;

                    var el = e.component.element();
                    var chartSvg = el.children("svg.dxc-chart").first();
                    chartSvg.children("rect").first().attr({ "fill": parameters.Background.Color, "opacity": 1 });
                    trendcontainer.css("background", parameters.Background.Color);
                }
            };

            var chart;
            var mutateFunc = function () {
                chart = trendcontainer.dxChart(chartOptions).dxChart("instance");

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                var timefunc = function () {
                    loadHistoricalData();
                };

                function setAutoRefresh() {
                    var updateInterval = moment.duration(parameters.LoadDataEvery);
                    if (updateInterval <= 0)
                        return;

                    if (interval)
                        clearInterval(interval);
                    interval = setInterval(timefunc, updateInterval);
                }

                if (parameters.SVGReferenceId) {
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    }
                    var deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    });
                    deregisterListeners.push(deregisterListener);
                }

                loadHistoricalData();

                function loadHistoricalData(/*startDate, endDate*/) {
                    if (bLoadingData)
                        return;
                    bLoadingData = true;

                    if (interval)
                        clearInterval(interval);

                    chart.beginUpdate();

                    dataSource = new Array();

                    if ((_connection && _dataprovider) || parameters.ConnectionString) {
                        bLastDataInError = false;
                        scope.corehubconnection.invoke("LoadSparklineHistoricalData",
                            parameters.screenId, _connection, _dataprovider, parseInt(parameters.CommandTimeout), parameters.InvalidPointsValue,
                            _valuecolumnname, _groupby, _maxrecord, _select, _orderby, _tablename, _timecolumnname, _whereCondition, parameters.ConnectionString)
                            .then((ret) => {
                                jQuery.each(ret.Values, function (index, item) {
                                    var newitem = {
                                        SourceTimeStamp: item.SourceTimeStamp,
                                        dValue: item.dValue
                                    };
                                    dataSource.push(newitem);
                                });
                                if (ret.bBlockingException) {
                                    if (interval)
                                        clearInterval(interval);
                                    bTimerAborted = true;
                                }
                            })
                            .catch(err => {
                                bLastDataInError = true;
                                console.error("LoadHistoricalData Error:", err);
                            })
                            .finally(() => {
                                chart.option("dataSource", dataSource);
                                chart.endUpdate();
                                bLoadingData = false;
                                if (!bLastDataInError && parameters.AutomaticScale)
                                    updateAxisTicks();
                                if (!bTimerAborted)
                                    setAutoRefresh();
                            });
                    }
                }
            }

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function updateAxisTicks() {
                var axis = chart.option("valueAxis");
                axis.tickInterval = (axis.visualRange.endValue - axis.visualRange.startValue) / parameters.MajorYDivision;
                chart.option("valueAxis", axis);
            }
        }
    </script>
</div>

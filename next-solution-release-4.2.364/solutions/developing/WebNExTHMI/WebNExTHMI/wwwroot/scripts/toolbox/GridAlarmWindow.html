<div id="GridAlarmWindow" class="GridAlarmWindow">
    <img src="cl.gif" alt="" onload="onGridAlarmWindowLoaded(this)" id="loadingImage" />

    <div id="mainContainer">
        <div id="topToolbar" style="display:none; width:100%;">
            <div id="bestfitbtn" style="margin: 5px 2.5px;"></div>
        </div>

        <div id="alarmgrid"></div>

        <div id="alarmToolbar" style="padding:5px; text-align: center;">
            <div id="btnAckAll"></div>
            <div id="btnResetAll"></div>
            <div id="btnAck"></div>
            <div id="btnReset"></div>
            <div id="btnToggleSound"></div>
        </div>
    </div>

    <script>
        function onGridAlarmWindowLoaded(obj) {

            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var thisParent = thisPage.parent();
            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            var thisParentId = thisParent.attr("id");
            var interval;
            var intervalBlink;
            var deregisterListener;
            var deregisterListenerActiveLanguage;
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
                if (intervalBlink)
                    clearInterval(intervalBlink);
                if (deregisterListener)
                    deregisterListener();
                if (deregisterListenerActiveLanguage)
                    deregisterListenerActiveLanguage();
            });

            var mainContainer = thisPage.find("#mainContainer");
            var scrollingOptions = {
                mode: webKitRenderCorrection ? "standard" : "virtual"
            };

            var parameters = JSON.parse(paratt);

            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                if (webKitRenderCorrection)
                    thisPage.css("will-change", "opacity");
            }
            if (scope.biOS || (isMobile.Android() && parameters.bFitInWindow)) {
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }

            var customFonts = [parameters.FontFamily, parameters.HeaderFontSettings.FontFamily, parameters.AlarmAreaFontSettings.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            let arrayrow = [];
            var selectedData;
            var connected = false;
            var container = thisPage.find("#alarmgrid");
            var btnContainer = container.next();
            var bLanguageChanged = false;

            var bestfitbtn;
            var btnAckAllDiv = btnContainer.children().first();
            var btnResetAllDiv = btnAckAllDiv.next();
            var btnAckDiv = btnResetAllDiv.next();
            var btnResetDiv = btnAckDiv.next();
            var btnToggleSoundDiv = btnResetDiv.next();
            var noDataText = i18next.t1('ConnectingToServer');
            var severityColorMap = {};
            var currentCulture = navigator.language;
            var thisParentHeight = $(thisParent).attr("height");
            var bestfitbtnDiv = thisPage.find("#bestfitbtn");
            var topToolbar = thisPage.find("#topToolbar");
            var alarmToolbar = thisPage.find("#alarmToolbar");
            var topToolbarVisible = false;
            var alarmToolbarReady;
            var dataGridReady;
            var columnAlignment = parameters.HorizontalColumnAlignment == 1 ? "center" : (parameters.HorizontalColumnAlignment == 2 ? "right" : "left");
            var translationPrefix = "_AlarmWindow_";
            var translations = scope.setTranslations("AlarmWindow", [
                {
                    id: "BestFitBtn",
                    stringSuffix: "BestFit",
                    defValue: "Best Fit"
                },
                {
                    id: "AckAll",
                    stringSuffix: "AckAllCmd",
                    defValue: "Ack All"
                },
                {
                    id: "Ack",
                    stringSuffix: "AckCmd",
                    defValue: "Ack"
                },
                {
                    id: "AckedTime",
                    stringSuffix: "AckedTransitionTime",
                    defValue: "Acked Transition Time"
                },
                {
                    id: "ActiveTime",
                    stringSuffix: "ActiveTransitionTime",
                    defValue: "Active Transition Time"
                },
                {
                    id: "ActSettings",
                    stringSuffix: "ActualSettings",
                    defValue: "Actual Settings"
                },
                {
                    id: "AddComment",
                    stringSuffix: "AddCommentCmd",
                    defValue: "Add Comment"
                },
                {
                    id: "Comm",
                    stringSuffix: "Comment",
                    defValue: "Comment"
                },
                {
                    id: "Confirm",
                    stringSuffix: "ConfirmCmd",
                    defValue: "Reset"
                },
                {
                    id: "ConfirmAll",
                    stringSuffix: "ConfirmAllCmd",
                    defValue: "Reset All"
                },
                {
                    id: "DisableSound",
                    stringSuffix: "DisableSoundCmd",
                    defValue: "Sound"
                }
            ]);

            var headerFontOptions = {
                "font-family": parameters.HeaderFontSettings.FontFamily,
                "font-size": parameters.HeaderFontSettings.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.HeaderFontSettings.FontWeight),
                "color": parameters.ToolbarForeground.Color,
                "background": parameters.Background.Color
            };
            var dataFontOptions = {
                "font-family": parameters.AlarmAreaFontSettings.FontFamily,
                "font-size": parameters.AlarmAreaFontSettings.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.AlarmAreaFontSettings.FontWeight),
                "color": parameters.AlarmAreaSelectedForeground.Color
            };

            var gridAlarmOpts = {
                showBorders: true,
                columnResizingMode: "widget",
                disabled: thisParent.hasClass(disabledClass),
                editing: {
                    editEnabled: false,
                    editMode: 'row',
                    insertEnabled: false,
                    removeEnabled: false
                },
                width: "100%",
                allowColumnReordering: true,
                allowColumnResizing: true,
                onRowPrepared: function (e) {
                    if (e.rowType != 'data')
                        return;
                    else if (e.data.needsAcknoledge) {
                        arrayrow.push(e.rowElement);
                        if (blink) {
                            e.rowElement.addClass("blinkingRow");
                        }
                    }
                    updateThresholdElementColor(e.data, e.rowElement, parameters.Thresholds, severityColorMap);
                },
                onInitialized: function (e) {
                    setTimeout(function () {
                        dataGridReady = true;
                        if (alarmToolbarReady)
                            updateGridHeight($(e.component.element()));
                    }, 1);
                },
                //filterValue: parameters.FilterCriteria,
                selection: {
                    mode: "multiple"
                },
                scrolling: scrollingOptions,
                paging: {
                    pageSize: 50,
                },
                filterRow: {
                    visible: parameters.ShowFilterPanel ? true : false
                },
                loadPanel: {
                    enabled: true
                },
                columns: loadColumns(),
                noDataText: noDataText,
                onSelectionChanged: function (e) {
                    var ackDisabled = true;
                    var resetDisabled = true;
                    if (connected) {

                        for (var i = 0; i < e.selectedRowsData.length; ++i) {

                            if (e.selectedRowsData[i].needsAcknoledge) {
                                ackDisabled = false;
                                break;
                            }
                        }
                        for (var i = 0; i < e.selectedRowsData.length; ++i) {

                            if (e.selectedRowsData[i].needsConfirm) {
                                resetDisabled = false;
                                break;
                            }
                        }
                    }

                    btnAck.option("disabled", ackDisabled);
                    btnReset.option("disabled", resetDisabled);

                    selectedData = e.selectedRowsData;
                }
            };

            var dataGrid;
            var blink = false;
            var btnAckAll;
            var btnResetAll;

            var mutateFunc = function () {
                alarmToolbar.css("background", parameters.Background.Color);
                $.each(alarmToolbar.children("div"), function (i, el) {
                    var elem = $(el);
                    elem.css({
                        "font-family": parameters.FontFamily,
                        "font-size": parameters.FontSize + "px",
                        "font-weight": fontWeightConverter(parameters.FontWeight),
                        "color": parameters.Foreground.Color,
                        "background": parameters.Background.Color,
                        "min-width": 70
                    });
                    dynamicFontElements.push(elem);
                });
                bestfitbtnDiv.css({
                    "font-family": parameters.FontFamily,
                    "font-size": parameters.FontSize + "px",
                    "font-weight": fontWeightConverter(parameters.FontWeight),
                    "color": parameters.ToolbarForeground.Color
                });
                dynamicFontElements.push(bestfitbtnDiv);

                setGridFontStyle();

                if (parameters.ShowBestFitButton) {
                    topToolbarVisible = true;
                    topToolbar.css({
                        "display": "block",
                        "background": parameters.Background.Color
                    });
                    bestfitbtn = bestfitbtnDiv.dxButton({
                        text: translations.BestFitBtn(),
                        type: "normal",
                        onClick: function (e) {
                            for (var i = 0; i < dataGrid.columnCount(); i++) {
                                if (dataGrid.columnOption(i, 'visible')) {
                                    dataGrid.columnOption(i, 'width', 'auto');
                                }
                            }
                            dataGrid.option("columnAutoWidth", true);
                            dataGrid.repaint();
                        }
                    }).dxButton("instance");
                }

                dataGrid = container.dxDataGrid(gridAlarmOpts).dxDataGrid("instance");

                if (parameters.Background)
                    $(thisPage.find(".dx-datagrid-rowsview")[0]).css("background", parameters.Background.Color);

                var options = {};
                setObjectBorder(options, parameters);
                if (!$.isEmptyObject(options))
                    mainContainer.css(options);

                btnAckAll = btnAckAllDiv.dxButton({
                    text: parameters.UseIcon ? "" : translations.AckAll(),
                    icon: parameters.UseIcon ? "images/toolbox/gridAlarmWindow/CircleCheck.svg" : null,
                    type: "normal",
                    disabled: true,
                    onContentReady: function (e) {
                        alarmToolbarReady = true;
                        if (dataGridReady)
                            updateGridHeight(dataGrid.element());
                    },
                    onClick: function (e) {
                        prepareAckReset(dataGrid, scope, false, parameters.SVGReferenceId, parameters.screenId);
                    }
                }).dxButton("instance");

                btnResetAll = btnResetAllDiv.dxButton({
                    text: parameters.UseIcon ? "" : translations.ConfirmAll(),
                    icon: parameters.UseIcon ? "images/toolbox/gridAlarmWindow/CircleUncheck.svg" : null,
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {
                        prepareAckReset(dataGrid, scope, true, parameters.SVGReferenceId, parameters.screenId);
                    }
                }).dxButton("instance");

                var btnAck = btnAckDiv.dxButton({
                    text: parameters.UseIcon ? "" : translations.Ack(),
                    icon: parameters.UseIcon ? "images/toolbox/gridAlarmWindow/Check.svg" : null,
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {

                        prepareAckReset(dataGrid, scope, false, parameters.SVGReferenceId, parameters.screenId, selectedData);
                    }
                }).dxButton("instance");

                var btnReset = btnResetDiv.dxButton({
                    text: parameters.UseIcon ? "" : translations.Confirm(),
                    icon: parameters.UseIcon ? "images/toolbox/gridAlarmWindow/Uncheck.svg" : null,
                    type: "normal",
                    disabled: true,
                    onClick: function (e) {

                        prepareAckReset(dataGrid, scope, true, parameters.SVGReferenceId, parameters.screenId, selectedData);
                    }
                }).dxButton("instance");

                var btnToggleSound = btnToggleSoundDiv.dxButton({
                    text: parameters.UseIcon ? "" : translations.DisableSound(),
                    icon: parameters.UseIcon ? "images/toolbox/gridAlarmWindow/Mute.svg" : null,
                    type: "normal",
                    disabled: false,
                    onClick: function (e) {
                        $(e.component.element()).toggleClass("clicked");
                        scope.corehubconnection.invoke("ToggleAlarmSound");
                    }
                }).dxButton("instance");

                deregisterListenerActiveLanguage = scope.$on(onActiveLanguageChanged, function (e, value) {
                    if (currentCulture != value)
                        bLanguageChanged = true;
                    currentCulture = value;

                    jQuery.each(parameters.GridLayout, function (index, item) {
                        let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                        dataGrid.columnOption(index, 'caption', i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix)));
                    });

                    dataGrid.option("columns", loadColumns());

                    noDataText = i18next.t1('ConnectingToServer');
                    if (!connected)
                        dataGrid.option("noDataText", noDataText);

                    if (bestfitbtn)
                        bestfitbtn.option("text", translations.BestFitBtn());
                    btnAckAll.option("text", translations.AckAll());
                    btnResetAll.option("text", translations.ConfirmAll());
                    btnAck.option("text", translations.Ack());
                    btnReset.option("text", translations.Confirm());
                    btnToggleSound.option("text", translations.DisableSound());

                    if (parameters.FontSettingList && (value in parameters.FontSettingList) !== -1) {
                        var fontOpts = applyFontSettingList(dynamicFontElements, parameters.FontSettingList[value]);
                        for (var cssProp in fontOpts) {
                            headerFontOptions[cssProp] = fontOpts[cssProp];
                            dataFontOptions[cssProp] = fontOpts[cssProp];
                        }
                        setGridFontStyle();
                    }
                });

                $(thisParent).bind(disabledClassEvent, function () {
                    dataGrid.option("disabled", thisParent.hasClass(disabledClass));
                });

                if (!parameters.DisableBlinkAnimation) {
                    intervalBlink = setInterval(function () {
                        blink = !blink;
                        for (let i = 0; i < arrayrow.length; i++) {
                            if (blink) {
                                fastdom.mutate(function () {
                                    arrayrow[i].addClass("blinkingRow");
                                });
                            }
                            else {
                                fastdom.measure(function () {
                                    var thresColor = arrayrow[i].attr("thresholdColor");
                                    fastdom.mutate(function () {
                                        arrayrow[i].removeClass("blinkingRow");
                                        arrayrow[i].css("background", thresColor);
                                    });
                                });
                            }
                        }
                    }, 1000);
                }

                applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                if (scope.dataValues[parameters.screenId] && scope.dataValues[parameters.screenId][parameters.SVGReferenceId] && scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood && !interval)
                    setTimer();

                deregisterListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood) {
                        if (!interval)
                            setTimer();
                    }
                    else {
                        if (interval) {
                            clearInterval(interval);
                            dataGrid.option("noDataText", noDataText);
                            interval = undefined;
                        }

                        connected = false;
                        btnAckAll.option("disabled", true);
                        btnResetAll.option("disabled", true);
                        btnAck.option("disabled", true);
                        btnReset.option("disabled", true);
                    }
                });
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function setGridFontStyle() {
                var inlineHeaderOptions = Object.entries(headerFontOptions).map(function (kv) { return (`${kv[0]}:${kv[1]}`) }).join(';') + ";";
                var inlineDataOptions = Object.entries(dataFontOptions).map(function (kv) { return (`${kv[0]}:${kv[1]}`) }).join(';') + ";";

                var styleID = buildStyleID(thisPage, thisParentId, parameters.screenName);
                var dlStyle = $("#" + styleID);
                if (dlStyle.length > 0)
                    dlStyle.remove();
                $("<style id=\"" + styleID + "\">#" + thisParentId + ".GridAlarmWindow .dx-header-row { " + inlineHeaderOptions + " } #" + thisParentId + ".GridAlarmWindow .dx-data-row td { " + inlineDataOptions + " }</style>").appendTo("head");
            }

            function loadColumns() {
                var columns = [];
                jQuery.each(parameters.GridLayout, function (index, item) {
                    let stringSuffix = item.ColumnTag ? item.ColumnTag : item.FieldName;
                    let colCaption = i18next.t1(translationPrefix + stringSuffix, i18next.t1(stringSuffix));
                    var col = {
                        dataField: lowercaseFirstLetter(item.FieldName),
                        name: "col" + index,
                        caption: colCaption,
                        width: item.ActualWidth,
                        alignment: columnAlignment
                    };
                    if (item.ColumnTag == "Reason" || item.ColumnTag == "State") {
                        col["customizeText"] = function (cellInfo) {
                            var newValue = cellInfo.value;
                            try {
                                var oldValue = cellInfo.value.split("|");
                                if (item.ColumnTag == "Reason")
                                    newValue = translateReason(oldValue[0].trim());
                                else
                                    newValue = i18next.t1(oldValue[1].trim());
                            }
                            finally {
                                return newValue;
                            }
                        };
                    }
                    setColumnOrdering(item, col);
                    columns.push(col);
                });
                return columns;
            }

            function translateReason(str) {
                switch (str) {
                    case "Active":
                        return i18next.t1("StateON", "ON");
                    case "High":
                        return i18next.t1("StateONHigh", "ON (High)");
                    case "HighHigh":
                        return i18next.t1("StateONHighHigh", "ON (HighHigh)");
                    case "Low":
                        return i18next.t1("StateONLow", "ON (Low)");
                    case "LowLow":
                        return i18next.t1("StateONLowLow", "ON (LowLow)");
                    case "HighActive":
                        return i18next.t1("StateONHighActive", "ON (HighActive)");
                    case "HighHighActive":
                        return i18next.t1("StateONHighHighActive", "ON (HighHighActive)");
                    case "LowActive":
                        return i18next.t1("StateONLowActive", "ON (LowActive)");
                    case "LowLowActive":
                        return i18next.t1("StateONLowLowActive", "ON (LowLowActive)");
                    case "Inactive":
                        return i18next.t1("StateOFF", "OFF");
                    case "Unacknowledged":
                        return i18next.t1("StateUnacknowledged", "Unacknowledged");
                    case "Unconfirmed":
                        return i18next.t1("StateUnconfirmed", "Unconfirmed");
                    case "Suppressed":
                        return i18next.t1("StateSuppressed", "Suppressed");
                    case "TimedShelved":
                        return i18next.t1("StateTimedShelved", "Timed Shelved");
                    default:
                        return i18next.t1(str);
                }
            }

            function updateGridHeight(dataGridElement) {
                dataGridElement.height(thisParentHeight - (topToolbarVisible ? topToolbar.height() : 0) - (alarmToolbar.height() + 10) - parameters.BorderThickness.Top - parameters.BorderThickness.Bottom);
            }

            function getFilteredData() {
                var filterExpr = dataGrid.getCombinedFilter();
                if (!filterExpr)
                    return dataGrid.option("dataSource");

                return DevExpress.data.query(dataGrid.option("dataSource"))
                    .filter(filterExpr)
                    .toArray();
            }

            function setTimer() {
                dataGrid.option("noDataText", "");
                pollData(scope, dataGrid, parameters.SVGReferenceId, parameters.screenId, btnAckAll, btnResetAll, arrayrow)
                connected = true;

                interval = setInterval(function () {
                    if (connected)
                        pollData(scope, dataGrid, parameters.SVGReferenceId, parameters.screenId, btnAckAll, btnResetAll, arrayrow)

                }, 1000);
            }

            function pollData(scope, dataGrid, id, screenId, btnAckAll, btnResetAll, arrayrow) {
                var bForceRefresh = false;
                if (bLanguageChanged) {
                    bLanguageChanged = false;
                    bForceRefresh = true;
                }
                scope.corehubconnection.invoke("GetConditionStateList", id, screenId, false, bForceRefresh)
                    .then((ret) => {
                        $.each(ret, function (index, item) {
                            item.time = moment(ticksToTimestamp(item.timeticks))./*subtract(new Date().getTimezoneOffset(), "minutes").*/locale(currentCulture).format("L LTS")
                        });
                        arrayrow.length = 0;
                        fastdom.mutate(function () {
                            dataGrid.option("dataSource", ret);
                            dataGrid.option("loadPanel.enabled", false);

                            btnAckAll.option("disabled", ret.length == 0);
                            btnResetAll.option("disabled", ret.length == 0);
                        });
                    })
                    .catch(err => {

                        console.error(err.toString());
                        dataGrid.option("loadPanel.enabled", false);
                        var errorText = i18next.t1('ErrorGettingConditionList') + err.toString();
                        dataGrid.option("noDataText", errorText);
                        scope.$broadcast(onError, { ex: err, value: errorText });
                    });
            }

            function prepareAckReset(dataGrid, scope, isReset, id, screenId, data) {
                if (!data)
                    data = getFilteredData();

                var list = data.map(function (obj) { return obj.nodeId; });
                ackReset(scope, isReset, id, screenId, list);
            }

            function ackReset(scope, isReset, id, screenId, list) {

                scope.busyVisible = true;
                scope.$apply();

                scope.corehubconnection.invoke("AckReset", id, screenId, list, isReset)
                    .then((ret) => {

                        scope.busyVisible = false;
                        scope.$apply();
                    })
                    .catch(err => {

                        console.error(err.toString());

                        var errorText = i18next.t1('ErrorAckReset') + err.toString();
                        scope.$broadcast(onError, { ex: err, value: errorText });

                        scope.busyVisible = false;
                        scope.$apply();
                    });
            }
        }

    </script>
</div>

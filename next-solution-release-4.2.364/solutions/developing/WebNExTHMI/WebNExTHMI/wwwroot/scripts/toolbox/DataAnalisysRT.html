<div id="DataAnalisysRT" class="DataAnalisysRT" style="height:100%;">
    <img src="cl.gif" alt="" onload="onDataAnalisysRTControlLoaded(this)" id="loadingImage" />
    
    <div id="mainContainer" style="height: 100%;">
        <div id="large-indicator"></div>
        <div id="buttonsContainer" style="padding: 5px; overflow:auto;">
            <div id="refreshbtn" style="float:left;"></div>
            <div id="allvaluesbtn" style="float:left;"></div>
            <div id="yearbtn" style="float:left;"></div>
            <div id="monthbtn" style="float:left;"></div>
            <div id="weekbtn" style="float:left;"></div>
            <div id="daybtn" style="float:left;"></div>
            <div id="hourbtn" style="float:left;"></div>
            <div id="minutebtn" style="float:left;"></div>
            <div id="nowbtn" style="float:left;"></div>
            <div id="prevbtn" style="float:left;"></div>
            <div id="timecombo" style="float:left;width:100px;"></div>
            <div id="nextbtn" style="float:left;"></div>
            <div id="startdatetime" style="float:left;"></div>
            <div id="enddatetime" style="float: left;"></div>
            <div id="fetchbtn"></div>
        </div>
        <div id="trend" style="overflow: hidden; margin: 10px;"></div>
        <div style="display: grid; grid-gap: 2px; grid-template-columns: auto auto; margin: 10px;">
            <div id="startbtn"></div>
            <div id="pausebtn"></div>
        </div>
        <div id="legendDataGrid" style="margin: auto;"></div>
    </div>

    <script>
        function onDataAnalisysRTControlLoaded(obj) {

            var thisPage = $(obj).parent();
            var thisParent = thisPage.parent();
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            var translationsPrefix = "_DataAnalysis_";

            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            $(obj).remove();

            setOpacity(scope, thisParent, thisPage);

            var mainContainer = thisPage.find("#mainContainer");
            var scrollingOptions = {
                mode: "standard"
            };
            if (scope.biOS) {
                webkitMoveRotateTransform(thisParent, thisPage, mainContainer);
                scrollingOptions["useNative"] = false;
                scrollingOptions["scrollByThumb"] = true;
            }

            var interval;
            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                if (interval)
                    clearInterval(interval);
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);
            var fontOptions = {
                "font-family": parameters.FontFamily,
                "font-size": parameters.FontSize + "px",
                "font-weight": fontWeightConverter(parameters.FontWeight),
                "color": parameters.LegendAreaForeground.Color
            };

            var customFonts = [parameters.FontFamily, parameters.XAxsisFontSettings.FontFamily, parameters.YAxsisFontSettings.FontFamily];
            if (parameters.FontSettingList)
                $.each(parameters.FontSettingList, function (index, item) {
                    customFonts.push(item.FontFamily);
                });
            loadCustomFonts(customFonts);
            var dynamicFontElements = [];

            var dataGridContainer;
            var selectTimeCombo;
            var comboToMoment = ["none", "minute", "hour", "day", "week", "month", "year"];
            var timeComboItems = [
                i18next.t1(translationsPrefix + "None", i18next.t1("None")),
                i18next.t1(translationsPrefix + "Minute", i18next.t1("Minute")),
                i18next.t1(translationsPrefix + "Hour", i18next.t1("Hour")),
                i18next.t1(translationsPrefix + "Day", i18next.t1("Day")),
                i18next.t1(translationsPrefix + "Week", i18next.t1("Week")),
                i18next.t1(translationsPrefix + "Month", i18next.t1("Month")),
                i18next.t1(translationsPrefix + "Year", i18next.t1("Year"))
            ];

            var momentRecordEvery = moment.duration(parameters.RecordEvery);
            var updateInterval = (momentRecordEvery.hours() * 3600 +
                momentRecordEvery.minutes() * 60 +
                momentRecordEvery.seconds()) * 1000 + momentRecordEvery.milliseconds();
            var momentTimeRangeSeconds = moment.duration(parameters.ViewTimeFrame);
            var timeRangeSeconds = momentTimeRangeSeconds.hours() * 3600 +
                momentTimeRangeSeconds.minutes() * 60 +
                momentTimeRangeSeconds.seconds();
            var timeRangeMilliseconds = momentTimeRangeSeconds.asMilliseconds();
            var sampleNumber = timeRangeSeconds / (updateInterval / 1000);
            var trendcontainer = thisPage.find("#trend");
            var foreignObject = thisPage.parent();
            var buttonsContainer = thisPage.find("#buttonsContainer");

            var startButton = thisPage.find("#startbtn");
            var pauseButton = thisPage.find("#pausebtn");
            var allvbtn = thisPage.find("#allvaluesbtn");
            var ybtn = thisPage.find("#yearbtn");
            var mobtn = thisPage.find("#monthbtn");
            var wbtn = thisPage.find("#weekbtn");
            var dbtn = thisPage.find("#daybtn");
            var hbtn = thisPage.find("#hourbtn");
            var mibtn = thisPage.find("#minutebtn");
            var nowbtn = thisPage.find("#nowbtn");
            var refbtn = thisPage.find("#refreshbtn");
            var fetchb = thisPage.find("#fetchbtn");
            var loadingIndicatorDiv = thisPage.find("#large-indicator");

            var startbtn;
            var pausebtn;
            var dataGridInstance;
            var startDatebox;
            var endDatebox;
            var dataSource = new Array(sampleNumber);
            var pens = [];
            var lineTypesMap = {
                "lineSeries": "line",
                "areaStepSeries": "steparea",
                "barSideSeries": "bar", // stackedbar, fullstackedbar, rangebar
                "lineStepSeries": "stepline",
                "lineStackedSeries": "stackedline",
                "lineFullStackedSeries": "fullstackedline",
                "areaSeries": "area",
                "areaStackedSeries": "stackedarea",
                "areaFullStackedSeries": "fullstackedarea"
            };
            var globalMin = Number.MAX_VALUE;
            var globalMax = Number.MIN_VALUE;
            var bHasHistoricalData = false;
            var historicalPensCount = 0;
            if (parameters.StaticSeriesSettings.length > 0) {
                historicalPensCount = parameters.StaticSeriesSettings.filter(function (item) { return !undefinedOrNull(item.historicalName); }).length;
                bHasHistoricalData = historicalPensCount > 0;
            }
            var legendAndFetchHidden = parameters.AlwaysExpanded || !parameters.AutoHidePanelsVisible;
            var bTopBarHidden = legendAndFetchHidden && !parameters.ShowToolbarShowHideButtons && !parameters.ShowToolbarTimeControls;
            var interactiveControls = [];
            var legendColumns = [];
            var tempDataSource = [];
            var chartAggregationInterval = "milliseconds";
            var lastLegendValue;
            var bParentDisabled;
            var liveDateColVisible;
            var liveValueColVisible;
            var legendScrollStatus = {
                reachedTop: true,
                reachedBottom: false
            };

            if (parameters.PlotBackground) {
                trendcontainer.css("background", parameters.PlotBackground.Color);
                if (bTopBarHidden)
                    trendcontainer.css("border", "1px solid " + parameters.PlotBackground.Color);
            }
            else if (parameters.ControlBackground) {
                trendcontainer.css("background", parameters.ControlBackground.Color);
                if (bTopBarHidden)
                    trendcontainer.css("border", "1px solid " + parameters.ControlBackground.Color);
            }
            if (parameters.ControlBackground)
                mainContainer.css("background", parameters.ControlBackground.Color);

            if (bTopBarHidden)
                buttonsContainer.css("display", "none");
            else {
                buttonsContainer.css("background", parameters.ToolbarBackground.Color);
                $.each(buttonsContainer.children("div"), function (i, el) {
                    var elem = $(el);
                    elem.css({
                        "font-family": parameters.FontFamily,
                        "font-size": parameters.FontSize + "px",
                        "font-weight": fontWeightConverter(parameters.FontWeight),
                        "color": parameters.ToolbarForeground.Color,
                        "background": parameters.Background.Color
                    });
                    dynamicFontElements.push(elem);
                });
            }

            loadingIndicatorDiv.css({
                position: scope.biOS && !parameters.bFitInWindow && !isInFittedParent(thisPage) ? "fixed" : "absolute",
                top: (parseFloat(foreignObject.attr("height")) - 60) / 2,
                left: (parseFloat(foreignObject.attr("width")) - 60) / 2
            });
            var loadingIndicator = loadingIndicatorDiv.dxLoadIndicator({
                height: 60,
                width: 60,
                visible: bHasHistoricalData
            }).dxLoadIndicator("instance");

            var translations = scope.setTranslations("DataAnalysis", [
                {
                    id: "Visible",
                    stringSuffix: "VisibleColumn",
                    defValue: "Visible"
                },
                {
                    id: "PenColor",
                    stringSuffix: "ColorColumn",
                    defValue: "Color"
                },
                {
                    id: "PenName",
                    stringSuffix: "NameTitleColumn",
                    defValue: "Name"
                },
                {
                    id: "EUnit",
                    stringSuffix: "EUnitColumn",
                    defValue: "EUnit"
                },
                {
                    id: "Date",
                    stringSuffix: "PointDateColumn",
                    defValue: "Nearest Point Date"
                },
                {
                    id: "Value",
                    stringSuffix: "PointValueColumn",
                    defValue: "Nearest Point Value"
                },
                {
                    id: "StatisticMin",
                    stringSuffix: "StatisticMinColumn",
                    defValue: "Min Statistic"
                },
                {
                    id: "StatisticMax",
                    stringSuffix: "StatisticMaxColumn",
                    defValue: "Max Statistic"
                },
                {
                    id: "Avg",
                    stringSuffix: "AverageColumn",
                    defValue: "Average"
                },
                {
                    id: "RefreshData",
                    stringSuffix: "RefreshTitle",
                    defValue: "Refresh"
                },
                {
                    id: "FetchButton",
                    stringSuffix: "FetchTitle",
                    defValue: "Fetch"
                },
                {
                    id: "SDate",
                    stringSuffix: "StartDate",
                    defValue: "Start Date"
                },
                {
                    id: "EDate",
                    stringSuffix: "EndDate",
                    defValue: "End Date"
                },
                {
                    id: "Now",
                    stringSuffix: "NowTitle",
                    defValue: "Now"
                },
                {
                    id: "AllValues",
                    stringSuffix: "AllTitle",
                    defValue: "All Values"
                },
                {
                    id: "DayBtn",
                    stringSuffix: "Day",
                    defValue: "Day"
                },
                {
                    id: "HourBtn",
                    stringSuffix: "Hour",
                    defValue: "Hour"
                },
                {
                    id: "MinuteBtn",
                    stringSuffix: "Minute",
                    defValue: "Minute"
                },
                {
                    id: "MonthBtn",
                    stringSuffix: "Month",
                    defValue: "Month"
                },
                {
                    id: "WeekBtn",
                    stringSuffix: "Week",
                    defValue: "Week"
                },
                {
                    id: "YearBtn",
                    stringSuffix: "Year",
                    defValue: "Year"
                },
                {
                    id: "PauseBtn",
                    stringSuffix: "PauseBtnTitle",
                    defValue: "Pause"
                },
                {
                    id: "PlayBtn",
                    stringSuffix: "PlayBtnTitle",
                    defValue: "Play"
                },
                {
                    id: "HistoricalName",
                    stringSuffix: "HistoricalNameColumn",
                    defValue: "Historical/Datalogger"
                },
                {
                    id: "TagName",
                    stringSuffix: "TagNameColumn",
                    defValue: "Variable"
                },
                {
                    id: "Min",
                    stringSuffix: "MinColumn",
                    defValue: "Min"
                },
                {
                    id: "Max",
                    stringSuffix: "MaxColumn",
                    defValue: "Max"
                },

                {
                    id: "ShowAxis",
                    stringSuffix: "ShowAxisTitle",
                    defValue: "Show Axis"
                },
                {
                    id: "StatisticsEnabled",
                    stringSuffix: "StatisticsLineColumn",
                    defValue: "Statistics"
                },
                {
                    id: "AddVirtualPoints",
                    stringSuffix: "AddVirtualPointsTitle",
                    defValue: "Add Virtual Points"
                },
                {
                    id: "LiveValue",
                    stringSuffix: "LiveValueColumn",
                    defValue: "Live Value"
                },
                {
                    id: "Median",
                    stringSuffix: "MedianColumn",
                    defValue: "Median"
                },
                {
                    id: "Variance",
                    stringSuffix: "VarianceColumn",
                    defValue: "Variance"
                },
                {
                    id: "StandardDev",
                    stringSuffix: "StandardDevColumn",
                    defValue: "Standard Dev."
                },
                {
                    id: "NumPoints",
                    stringSuffix: "TotalDataSourceColumn",
                    defValue: "Total Data Source"
                },
                {
                    id: "NumCompressPoint",
                    stringSuffix: "TotalCompressedPointColumn",
                    defValue: "Total Compressed Point"
                },
                {
                    id: "NumCompressRation",
                    stringSuffix: "CompressRatioColumn",
                    defValue: "Compress Ratio"
                }
            ]);

            initLegendColumns();

            var trendClass = (function () {
                return {
                    init: function (trendcontainer, chart) {
                        //private props & methods
                        var state = {
                            bPlaying: parameters.PlayOnStart,
                            penSubscribed: []
                        };
                        var updateState = function (propsObj) {
                            for (var prop in propsObj) {
                                if (prop in state)
                                    state[prop] = propsObj[prop];
                            }
                        };
                        var managePlayStop = function (bPlay, bUpdateRange = true) {
                            if (pausebtn)
                                pausebtn.option("disabled", !bPlay);
                            if (startbtn)
                                startbtn.option("disabled", bPlay);
                            chart.beginUpdate();
                            updateState({ "bPlaying": bPlay });
                            var chartOptions = {
                                "commonSeriesSettings.point.visible": false, //!bPlay
                                "tooltip.enabled": !bPlay,
                                "argumentAxis.visualRangeUpdateMode": bPlay ? "shift" /*"auto"*/ : "keep"
                            };
                            if (bPlay) {
                                chartOptions["argumentAxis.tickInterval"] = { seconds: 12 };
                                stopSampling();
                                startSampling();
                            }
                            chart.option(chartOptions);
                            if (bUpdateRange)
                                updateRanges();
                            chart.endUpdate();
                            if (dataGridInstance) {
                                if (liveDateColVisible)
                                    dataGridContainer.dxDataGrid("columnOption", "Date", "visible", !bPlay);
                                if (liveValueColVisible)
                                    dataGridContainer.dxDataGrid("columnOption", "Value", "visible", !bPlay);
                            }
                        };
                        
                        var loadPenHistoricalData = function (parameters, index, item, bFirstStart, bResetArgumentRange, historicalLoadingStatusAccessor, conditionalString, newVisualRange) {
                            if (!bFirstStart) {
                                dataSource = dataSource.filter(function (elem) { return elem.SVGRefId != item.SVGReferenceId; });
                                stopSampling();
                            }

                            var sDate = null;
                            var eDate = null;
                            if (newVisualRange) {
                                var startD = moment.isMoment(newVisualRange.start) ? newVisualRange.start.toDate() : newVisualRange.start;
                                var endD = moment.isMoment(newVisualRange.end) ? newVisualRange.end.toDate() : newVisualRange.end;
                                sDate = moment(startD.getTime()).unix();
                                eDate = moment(endD.getTime()).unix();
                            }
                            scope.corehubconnection.invoke("LoadHistoricalData",
                                parameters.screenId, parameters.ConnectionString, parseInt(parameters.CommandTimeout), sDate, eDate, item.usesourcetimestamp, parseInt(parameters.MaxRecords),
                                parameters.UseAggregation, parseInt(parameters.MaxAggregationFactor), parseInt(parameters.MaxDeadLockRetry), item.localizeSourceTimeStamp, parameters.ViewTimeFrame,
                                item.minAggregation, item.maxAggregation, item.avgAggregation,
                                item.tagName, item.ColumnTagName, item.title.toString(), item.nodeID, item.historicalName, item.dlrsource, conditionalString)
                                .then((ret) => {
                                    //console.log("LoadHistoricalData completed. Results:", foreignObject.attr("id"), ret); //ret.Values => [AvgValues[], MaxValues[], MinValues[], Values[{"SourceTimeStamp", "bCompressed", "bIsFakePoint", "dValue"}]]
                                    var penHistoricalFloatValues = [];
                                    jQuery.each(ret.Values, function (index2, record) {
                                        var historicalLoadingStatus = historicalLoadingStatusAccessor();
                                        var newitem = { dateTime: record.SourceTimeStamp, bFirstHistoricalPoint: historicalLoadingStatus.bFirstHistoricalPoint };
                                        if (historicalLoadingStatus.bFirstHistoricalPoint) {
                                            historicalLoadingStatusAccessor({
                                                firstHistoricalDate: record.SourceTimeStamp,
                                                bFirstHistoricalPoint: false
                                            });
                                        }
                                        var val = parseFloat(record.dValue);
                                        penHistoricalFloatValues.push(val);
                                        if (val < pens[index].minPlottedValue)
                                            pens[index].minPlottedValue = val;
                                        if (val > pens[index].maxPlottedValue)
                                            pens[index].maxPlottedValue = val;
                                        newitem[item.SVGReferenceId] = val;
                                        dataSource.unshift(newitem);
                                    });
                                    chart.beginUpdate();
                                    chart.option("dataSource", dataSource);
                                    chart.endUpdate();
                                    if (!parameters.AutomaticGeneralScale && !pens[index].isFullStackedType) {
                                        updateAxesScales(index, pens[index].minPlottedValue, pens[index].maxPlottedValue);
                                    }
                                    else {
                                        if (pens[index].minPlottedValue < globalMin) {
                                            historicalLoadingStatusAccessor({ bGlobalLimitsChanged: true });
                                            globalMin = pens[index].minPlottedValue;
                                        }
                                        else if (pens[index].maxPlottedValue > globalMax) {
                                            historicalLoadingStatusAccessor({ bGlobalLimitsChanged: true });
                                            globalMax = pens[index].maxPlottedValue;
                                        }
                                    }
                                    if (bResetArgumentRange && !state.bPlaying && ret.Values.length > 0 && dataSource[0]) {
                                        updateWholeRange(dataSource[0].dateTime, historicalLoadingStatusAccessor().firstHistoricalDate /*dataSource[dataSource.length - 1].dateTime*/);
                                        updateVisualRange(dataSource[0].dateTime, historicalLoadingStatusAccessor().firstHistoricalDate /*dataSource[dataSource.length - 1].dateTime*/);
                                    }

                                    var store = legendds.store();
                                    var updatingObj = {
                                        "NumPoints": ret.NumPoints,
                                        "NumCompressPoint": ret.NumCompressPoint,
                                        "NumCompressRation": ret.NumCompressRation,
                                        "Statistics": {
                                            "Median": legendColumns.find(function (item) { return item.name == "Median"; }).visible ? mathHelpers.median(penHistoricalFloatValues) : 0,
                                            "Variance": legendColumns.find(function (item) { return item.name == "Variance"; }).visible ? mathHelpers.variance(penHistoricalFloatValues) : 0,
                                            "StandardDeviation": legendColumns.find(function (item) { return item.name == "StandardDev"; }).visible ? mathHelpers.standardDeviation(penHistoricalFloatValues) : 0
                                        }
                                    };
                                    store.update(item.SVGReferenceId, updatingObj);
                                    legendds.load();
                                })
                                .catch(err => {
                                    console.error("LoadHistoricalData Error:", err);
                                })
                                .finally(() => {
                                    var historicalLoadingStatus = historicalLoadingStatusAccessor();
                                    var newResponseIndex = historicalLoadingStatus.responseIndex + 1;
                                    historicalLoadingStatusAccessor({
                                        responseIndex: newResponseIndex
                                    });
                                    if (newResponseIndex == historicalPensCount) {
                                        if (loadingIndicator)
                                            loadingIndicator.option("visible", false);

                                        startSampling();

                                        if (!pens[index].isFullStackedType && parameters.AutomaticGeneralScale && historicalLoadingStatus.bGlobalLimitsChanged) {
                                            jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                                                updateAxesScales(index, globalMin, globalMax);
                                            });
                                        }
                                        var vaxis = chart.option("valueAxis");
                                        if (undefinedOrNull(vaxis.find(function (va) { return va.grid.visible == true })))
                                            chart.option("valueAxis[" + (vaxis.length - 1) + "][grid][visible]", true);
                                        if (newVisualRange) {
                                            updateWholeRange(newVisualRange.start, newVisualRange.end, true, newVisualRange.newTickInterval ? true : false);
                                            updateVisualRange(newVisualRange.start, newVisualRange.end, true, newVisualRange.newTickInterval ? true : false);
                                            if (newVisualRange.newTickInterval)
                                                chart.option("argumentAxis.tickInterval", newVisualRange.newTickInterval);
                                        }
                                    }
                                    if (bFirstStart && parameters.PlayOnStart)
                                        managePlayStop(true);

                                    enableDisableButtons();
                                });
                        }

                        //public props & methods
                        var obj = {
                            loadHistoricalData: function (bFirstStart = false, bResetArgumentRange = true, newVisualRange = null) {
                                if (state.bPlaying)
                                    managePlayStop(false);

                                if (loadingIndicator)
                                    loadingIndicator.option("visible", true);
                                enableDisableButtons(false);

                                var historicalLoadingStatus = {
                                    bGlobalLimitsChanged: false,
                                    responseIndex: 0,
                                    bFirstHistoricalPoint: true,
                                    firstHistoricalDate: null
                                }
                                var historicalLoadingStatusAccessor = function (toSet) {
                                    if (toSet === undefined)
                                        return historicalLoadingStatus;
                                    else {
                                        for (var k in toSet)
                                            historicalLoadingStatus[k] = toSet[k];
                                    }
                                };
                                jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                                    if (item.historicalName) {
                                        var conditionalString = "";
                                        if (!isNaN(item.SVGReferenceConditionalId) && item.SVGReferenceConditionalId > 0) {
                                            if (parameters.screenId in scope.dataValues && item.SVGReferenceConditionalId in scope.dataValues[parameters.screenId] &&
                                                scope.dataValues[parameters.screenId][item.SVGReferenceConditionalId].isGood) {
                                                try {
                                                    conditionalString = scope.dataValues[parameters.screenId][item.SVGReferenceConditionalId].value.toString();
                                                }
                                                catch { }
                                            }
                                            else if (bFirstStart) {
                                                if (state.penSubscribed.indexOf(index.toString()) === -1) {
                                                    state.penSubscribed.push(index.toString());
                                                    var listener = scope.$on(onDataChanged + parameters.screenId + item.SVGReferenceConditionalId, function (e, value) {
                                                        if (scope.dataValues[parameters.screenId][item.SVGReferenceConditionalId].isGood && !undefinedOrNull(scope.dataValues[parameters.screenId][item.SVGReferenceConditionalId].value)) {
                                                            try {
                                                                conditionalString = scope.dataValues[parameters.screenId][item.SVGReferenceConditionalId].value.toString();
                                                                //unsubscribe and load pen's historical data
                                                                listener();
                                                                loadPenHistoricalData(parameters, index, item, bFirstStart, bResetArgumentRange, historicalLoadingStatusAccessor, conditionalString, newVisualRange);
                                                            }
                                                            catch { }
                                                        }
                                                    });
                                                }
                                                return;
                                            }
                                        }
                                        loadPenHistoricalData(parameters, index, item, bFirstStart, bResetArgumentRange, historicalLoadingStatusAccessor, conditionalString, newVisualRange);
                                    }
                                });
                            },
                            isPlaying: function () {
                                return state.bPlaying;
                            },
                            play: function () {
                                managePlayStop(true);
                            },
                            stop: function () {
                                managePlayStop(false);
                            },
                            pause: function () {
                                if (state.bPlaying)
                                    managePlayStop(false, false);
                            }
                        }
                        return obj;
                    }
                };
            })();

            jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                var penName = i18next.t1(item.title);
                var eUnit = item.eUnit;
                var tagName = item.tagName;
                var historicalName = item.historicalName;
                var min = item.min;
                var max = item.max;
                var showAxis = item.showaxis;
                var statisticsEnabled = item.isstatisticenabled;
                var addVirtualPoints = item.addVirtualPoints;
                var minAggregation = item.minAggregation;
                var maxAggregation = item.maxAggregation;
                var avgAggregation = item.avgAggregation;
                var useTableAggregation = item.useTableAggregation;
                var color;
                if (item.color)
                    color = item.color; //"rgba(" + item.color.R + ", " + item.color.G + ", "  + item.color.B +  ", " + item.color.A + ")";
                var bIsBarSideType = lineTypesMap[item.serieTypeLineKey] == "bar";
                if (bIsBarSideType)
                    chartAggregationInterval = { seconds: 1 * parameters.MeasureUnitMultiplier };
                pens.push({
                    valueField: item.SVGReferenceId,
                    color: color, name: penName, type: lineTypesMap[item.serieTypeLineKey],
                    isFullStackedType: lineTypesMap[item.serieTypeLineKey] == "fullstackedarea" || lineTypesMap[item.serieTypeLineKey] == "fullstackedline",
                    width: item.thickness,
                    //svgIndicator: '<svg viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns: xlink="http://www.w3.org/1999/xlink" style="vertical-align: top;"><polyline fill="' + color + '" points="0,7 7,0 15,0 15,15 7,15" /></svg>',
                    axis: item.title,
                    minPlottedValue: 0,
                    maxPlottedValue: 0,
                    aggregation: {
                        enabled: bIsBarSideType ? true : false,
                        method: "custom",
                        calculate: function (aggregationInfo, series) {
                            return aggregationInfo.data[0];
                        }
                    }
                });
                //pens[pens.length - 1]["valueIndicator"] = $("<div id='penValueIndicator" + (pens.length - 1) + "' style='width:15px;height:15px;position:absolute;'>" + pens[pens.length - 1]["svgIndicator"] + "</div>");
                tempDataSource.push({
                    "id": item.SVGReferenceId,
                    "Visible": true,
                    "PenColor": color,
                    "Pen": penName,
                    "EUnit": eUnit,
                    "TagName": tagName,
                    "HistoricalName": historicalName,
                    "Min": min,
                    "Max": max,

            function togglePenSelection(clickedIndex) {

                var initialEndDate = chart.option("argumentAxis.visualRange.endValue");

                chart.beginUpdate();
                var noAxisVisible = true;
                $.each(currentValueAxis, function (index, item) {
                    pens[index].selected = index == clickedIndex && !bWasSelected;
                    var newWidth = pens[index].selected ? parameters.StaticSeriesSettings[index].thickness + 5 : parameters.StaticSeriesSettings[index].thickness;
                    chart.option("series[" + index + "].width", newWidth);
                    if (!parameters.AutomaticGeneralScale && !parameters.StaticSeriesSettings[clickedIndex].showaxis) {
                        let isVisible = parameters.StaticSeriesSettings[index].showaxis || (index == clickedIndex && !bWasSelected);
                        if (isVisible)
                            noAxisVisible = false;
                        currentValueAxis[index]["label"] = currentValueAxis[index]["tick"] = { color: parameters.StaticSeriesSettings[index].color, visible: isVisible };
                        currentValueAxis[index]["grid"] = { visible: isVisible || index == currentValueAxis.length - 1 && noAxisVisible };
                    }
                });
                var argAxis = chart.option("argumentAxis");
                argAxis.visualRange.startValue = initialStartDate;
                argAxis.visualRange.endValue = initialEndDate;
                chart.option({
                    "valueAxis": currentValueAxis,
                    "argumentAxis": argAxis
                });

                chart.endUpdate();
            }

            var timefunc = function () {
                chart.beginUpdate();

                var newitem =
                {
                    //id: dataSource.length,
                    dateTime: new Date(new Date().getTime())
                };

                var bGlobalLimitsChanged = false;
                jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                    newitem["SVGRefId"] = item.SVGReferenceId;
                    if (parameters.screenId in scope.dataValues && item.SVGReferenceId in scope.dataValues[parameters.screenId] &&
                        scope.dataValues[parameters.screenId][item.SVGReferenceId].isGood) {
                        var newValue = scope.dataValues[parameters.screenId][item.SVGReferenceId].invariantValue;
                        newitem[item.SVGReferenceId] = newValue;
                        var newVal = parseFloat(newValue);
                        if (!parameters.AutomaticGeneralScale && !pens[index].isFullStackedType)
                            checkUpdateAxesScales(index, newVal);
                        else {
                            if (newVal < globalMin) {
                                bGlobalLimitsChanged = true;
                                globalMin = newVal;
                            }
                            else if (newVal > globalMax) {
                                bGlobalLimitsChanged = true;
                                globalMax = newVal;
                            }
                        }
                    }
                    else
                        newitem[item.SVGReferenceId] = Number.NaN;
                });
                if (bGlobalLimitsChanged) {
                    jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                        if (!pens[index].isFullStackedType)
                            updateAxesScales(index, globalMin, globalMax);
                    });
                }

                dataSource.push(newitem);
                
                if (trend.isPlaying()) {
                    updateRanges();
                    chart.option("dataSource", dataSource);
                }

                chart.endUpdate();

                if (trend.isPlaying()) {
                    var labels = trendcontainer.find("g.dxc-arg-elements>text");
                    var firstLabel = labels.first();
                    if (firstLabel && firstLabel[0]) {
                        var firstLabelBox = firstLabel[0].getBBox();
                        if (firstLabelBox.x < 36.9) {
                            chart.option("argumentAxis.label.alignment", "left");
                        }
                        else
                            chart.option("argumentAxis.label.alignment", "right");
                    }
                }

                updateValueIndicatorsAndLegend(newitem);
            };

            function getNewAverage(oldSamplesNumber, lastAverage, newValue) {
                if (notNumeric(newValue))
                    return lastAverage;
                return (lastAverage * oldSamplesNumber + newValue) / (oldSamplesNumber + 1);
            }

            function updateValueIndicatorsAndLegend(newitem) {
                if (legendAndFetchHidden)
                    return;
                if (legendds.isLoading()) {
                    lastLegendValue = newitem;
                    return;
                }

                var store = legendds.store();
                jQuery.each(parameters.StaticSeriesSettings, function (index, item) {
                    var currentValue = parseFloat(newitem[item.SVGReferenceId]);
                    var valueString = currentValue.toFixed(3);
                    store.byKey(item.SVGReferenceId).done(function (storeItem) {
                        var updatingObj = {
                            "Statistics": {
                                "Average": getNewAverage(storeItem.Statistics.Samples, parseFloat(storeItem.Statistics.Average), currentValue).toFixed(3),
                                "Samples": storeItem.Statistics.Samples + 1
                            }
                        };
                        //if (trend.isPlaying())
                            updatingObj["LiveValue"] = valueString;
                        if (parseFloat(storeItem.Statistics.MinStat) > currentValue)
                            updatingObj.Statistics.MinStat = valueString;
                        if (parseFloat(storeItem.Statistics.MaxStat) < currentValue)
                            updatingObj.Statistics.MaxStat = valueString;
                        store.update(item.SVGReferenceId, updatingObj).done(function (dataobj, key) {
                            legendds.reload().done(function (res) {
                                if (!undefinedOrNull(lastLegendValue))
                                    updateValueIndicatorsAndLegend(lastLegendValue);
                            });
                        });
                    });
                });
            }

            function startSampling() {

                                onPlayPauseToggle();
                            }
                            let newStart = moment(chart.option("argumentAxis.visualRange.startValue")).subtract(1, selectedTimeMoment).toDate();
                            let newEnd = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, selectedTimeMoment).toDate();
                            if (!refreshHistoricalData({ start: newStart, end: newEnd })) {
                                updateWholeRange(newStart, newEnd, true, true);
                                updateVisualRange(newStart, newEnd, true, true);
                            }
                        }
                    }).dxButton("instance");

                    var nextb = thisPage.find("#nextbtn").dxButton({
                        text: ">",
                        type: "normal",
                        onClick: function (e) {
                            var selectedTime = selectTimeCombo.option('value');
                            if (selectedTime == timeComboItems[0])
                                return;
                            var selectedTimeMoment = comboToMoment[timeComboItems.indexOf(selectedTime)];

                            if (trend.isPlaying()) {
                                onPlayPauseToggle();
                            }
                            let newStart = moment(chart.option("argumentAxis.visualRange.startValue")).add(1, selectedTimeMoment).toDate();
                            let newEnd = moment(chart.option("argumentAxis.visualRange.endValue")).add(1, selectedTimeMoment).toDate();
                            if (!refreshHistoricalData({ start: newStart, end: newEnd })) {
                                updateWholeRange(newStart, newEnd, true, true);
                                updateVisualRange(newStart, newEnd, true, true);
                            }
                        }
                    }).dxButton("instance");

                    dynamicControls.push(prevb, nextb);
                }

                var now = new Date();
                var sd = startDatebox = thisPage.find("#startdatetime").dxDateBox({
                    type: "datetime",
                    value: now,
                    onContentReady: function (e) {
                        var inputEl = e.component.element().find("input");
                        inputEl.css(fontOptions);
                        dynamicFontElements.push(inputEl);
                    },
                    visible: !legendAndFetchHidden
                }).dxDateBox("instance");
                var ed = endDatebox = thisPage.find("#enddatetime").dxDateBox({
                    type: "datetime",
                    value: now,
                    onContentReady: function (e) {
                        var inputEl = e.component.element().find("input");
                        inputEl.css(fontOptions);
                        dynamicFontElements.push(inputEl);
                    },
                    visible: !legendAndFetchHidden
                }).dxDateBox("instance");

                var fb = fetchb.dxButton({
                    text: translations.FetchButton(),
                    hint: translations.FetchButton(),
                    type: "normal",
                    onClick: function (e) {
                        let newStart = startDatebox.option('value');
                        let newEnd = endDatebox.option('value');
                        if (newEnd <= newStart) {
                            alert(i18next.t1('EndDateMustBeGreater'));
                            return;
                        }
                        if (trend.isPlaying()) {
                            onPlayPauseToggle();
                        }
                        if (!refreshHistoricalData({ start: newStart, end: newEnd })) {
                            updateWholeRange(newStart, newEnd);
                            updateVisualRange(newStart, newEnd);
                        }
                    },
                    visible: !legendAndFetchHidden
                }).dxButton("instance");

                var rb = refbtn.dxButton({
                    icon: "images/toolbox/refresh.svg",
                    hint: translations.RefreshData(),
                    type: "normal",
                    onClick: function (e) {
                        var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                        var axisStart = moment(chart.option("argumentAxis.visualRange.startValue"));
                        refreshHistoricalData({ start: axisStart, end: axisEnd });
                    },
                    onContentReady: function (e) {
                        if (!bTopBarHidden)
                            buttonsContainer.css("height", $(e.component.element()).height() + parseFloat(buttonsContainer.css("padding-top"), 10) + parseFloat(buttonsContainer.css("padding-bottom"), 10) + 1.5);
                    },
                    visible: !legendAndFetchHidden
                }).dxButton("instance");

                dynamicControls.push(sd, ed, fb, rb);

                if (parameters.ShowToolbarTimeControls) {
                    var avb = allvbtn.dxButton({
                        text: translations.AllValues(),
                        hint: translations.AllValues(),
                        type: "normal",
                        onClick: function (e) {
                            if (trend.isPlaying())
                                onPlayPauseToggle();
                            if (dataSource && dataSource.length > 0) {
                                //refreshHistoricalData({ start: dataSource[0].dateTime, end: dataSource[dataSource.length - 1].dateTime });
                                if (!bHasHistoricalData)
                                    return;

                                dataSource = new Array(sampleNumber);
                                trend.loadHistoricalData();
                            }
                        }
                    }).dxButton("instance");
                    var yb = ybtn.dxButton({
                        text: "Y",
                        hint: translations.YearBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneYearBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'years');
                            refreshHistoricalData({ start: oneYearBefore, end: axisEnd });
                        }
                    }).dxButton("instance");
                    var mb = mobtn.dxButton({
                        text: "M",
                        hint: translations.MonthBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneMonthBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'months');
                            refreshHistoricalData({ start: oneMonthBefore, end: axisEnd });
                        }
                    }).dxButton("instance");
                    var wb = wbtn.dxButton({
                        text: "W",
                        hint: translations.WeekBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneWeekBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'weeks');
                            refreshHistoricalData({ start: oneWeekBefore, end: axisEnd });
                        }
                    }).dxButton("instance");
                    var dayb = dbtn.dxButton({
                        text: "D",
                        hint: translations.DayBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneDayBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'days');
                            refreshHistoricalData({ start: oneDayBefore, end: axisEnd });
                        }
                    }).dxButton("instance");
                    var hb = hbtn.dxButton({
                        text: "H",
                        hint: translations.HourBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneHourBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'hours');
                            refreshHistoricalData({ start: oneHourBefore, end: axisEnd });
                        }
                    }).dxButton("instance");
                    var minb = mibtn.dxButton({
                        text: "m",
                        hint: translations.MinuteBtn(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var axisEnd = moment(chart.option("argumentAxis.visualRange.endValue"));
                            var oneMinuteBefore = moment(chart.option("argumentAxis.visualRange.endValue")).subtract(1, 'minutes');
                            refreshHistoricalData({ start: oneMinuteBefore, end: axisEnd, newTickInterval: { seconds: 12 } });
                        }
                    }).dxButton("instance");
                    var nowb = nowbtn.dxButton({
                        text: translations.Now(),
                        hint: translations.Now(),
                        type: "normal",
                        onClick: function (e) {
                            trend.pause();
                            var now = Date.now();
                            var firstDsPoint = dataSource.find(function (item) { return item && item.dateTime; });
                            if (firstDsPoint) {
                                updateWholeRange(firstDsPoint.dateTime, null);
                                updateVisualRange(new Date(now - timeRangeMilliseconds), now);
                            }
                        }
                    }).dxButton("instance");

                    dynamicControls.push(avb, yb, mb, wb, dayb, hb, minb, nowb);
                }
                //chart.render({ force: true, animate: false });
                return dynamicControls;
            }

            function refreshHistoricalData(newVisualRange = null) {
                if (!bHasHistoricalData)
                    return false;

                var firstHistoricalPointIndex = dataSource.findIndex(function (item) { return item && item.dateTime && item.bFirstHistoricalPoint; });
                if (firstHistoricalPointIndex !== -1) {
                    dataSource.splice(0, firstHistoricalPointIndex + 1);
                }
                trend.loadHistoricalData(false, false, newVisualRange);
                return true;
            }

            function updateVisualRange(startDate, endDate, isArgumentAxis = true, bKeepTickInterval = false) {
                var axis = chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis");
                axis.visualRange = {};
                if (startDate != null)
                    axis.visualRange.startValue = startDate;
                if (endDate != null)
                    axis.visualRange.endValue = endDate;
                if (isArgumentAxis && !bKeepTickInterval && !trend.isPlaying())
                    axis.tickInterval = undefined;
                chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis", axis);
            }

            function updateWholeRange(startDate, endDate, isArgumentAxis = true, bKeepTickInterval = false) {
                var axis = chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis");
                axis.wholeRange = {};
                if (startDate != null)
                    axis.wholeRange.startValue = startDate;
                if (endDate != null)
                    axis.wholeRange.endValue = endDate;
                if (isArgumentAxis && !bKeepTickInterval && !trend.isPlaying())
                    axis.tickInterval = undefined;
                chart.option(isArgumentAxis ? "argumentAxis" : "valueAxis", axis);
            }

            function onPlayPauseToggle() {
                if (trend.isPlaying())
                    trend.stop();
                else
                    trend.play();
            }

            function changeLanguage() {
                fastdom.mutate(function () {
                    if (dataGridInstance)
                        for (var i = 0; i < dataGridInstance.columnCount(); i++)
                            dataGridInstance.columnOption(i, "caption", translations[dataGridInstance.columnOption(i, "name")]());
                    if (pausebtn)
                        pausebtn.option("hint", translations.PauseBtn());
                    if (startbtn)
                        startbtn.option("hint", translations.PlayBtn());

                    if (selectTimeCombo) {
                        var selectedIndex = timeComboItems.indexOf(selectTimeCombo.option("displayValue"));
                        timeComboItems = [
                            i18next.t1(translationsPrefix + "None", i18next.t1("None")),
                            i18next.t1(translationsPrefix + "Minute", i18next.t1("Minute")),
                            i18next.t1(translationsPrefix + "Hour", i18next.t1("Hour")),
                            i18next.t1(translationsPrefix + "Day", i18next.t1("Day")),
                            i18next.t1(translationsPrefix + "Week", i18next.t1("Week")),
                            i18next.t1(translationsPrefix + "Month", i18next.t1("Month")),
                            i18next.t1(translationsPrefix + "Year", i18next.t1("Year"))
                        ];
                        selectTimeCombo.option("items", timeComboItems);
                        selectTimeCombo.option("value", timeComboItems[Math.max(0, selectedIndex)]);
                    }

                    try {
                        if (fetchb.dxButton("instance"))
                            fetchb.dxButton("instance").option({
                                "text": translations.FetchButton(),
                                "hint": translations.FetchButton()
                            });
                    } catch { }
                    try {
                        if (allvbtn.dxButton("instance"))
                            allvbtn.dxButton("instance").option({
                                "text": translations.AllValues(),
                                "hint": translations.AllValues()
                            });
                    } catch { }
                    try {
                        if (nowbtn.dxButton("instance"))
                            nowbtn.dxButton("instance").option({
                                "text": translations.Now(),
                                "hint": translations.Now()
                            });
                    } catch { }
                    try {
                        if (refbtn.dxButton("instance"))
                            refbtn.dxButton("instance").option("hint", translations.RefreshData());
                    } catch { }
                    try {
                        if (ybtn.dxButton("instance"))
                            ybtn.dxButton("instance").option("hint", translations.YearBtn());
                    } catch { }
                    try {
                        if (mobtn.dxButton("instance"))
                            mobtn.dxButton("instance").option("hint", translations.MonthBtn());
                    } catch { }
                    try {
                        if (wbtn.dxButton("instance"))
                            wbtn.dxButton("instance").option("hint", translations.WeekBtn());
                    } catch { }
                    try {
                        if (dbtn.dxButton("instance"))
                            dbtn.dxButton("instance").option("hint", translations.DayBtn());
                    } catch { }
                    try {
                        if (hbtn.dxButton("instance"))
                            hbtn.dxButton("instance").option("hint", translations.HourBtn());
                    } catch { }
                    try {
                        if (mibtn.dxButton("instance"))
                            mibtn.dxButton("instance").option("hint", translations.MinuteBtn());
                    } catch { }
                });
            }

            function updateRanges() {
                //chart.beginUpdate();
                var now = Date.now();
                updateVisualRange(new Date(now - timeRangeMilliseconds), now, true, true);
                chart.option("argumentAxis.wholeRange.endValue", trend.isPlaying() ? null : Date.now());
                if (trend.isPlaying() && chart.option("argumentAxis.wholeRange.startValue") > new Date(now))
                    chart.option("argumentAxis.wholeRange.startValue", new Date(now - timeRangeMilliseconds));
                //chart.endUpdate();
            }

            function initAxesScales() {
                var newValueAxes = [];
                for (var i = 0; i < pens.length; i++) {
                   var ticksAndLabelsVisible = parameters.StaticSeriesSettings[i].showaxis || (parameters.AutomaticGeneralScale ? i == 0 : false);
                    var vAxisObj = {
                        allowDecimals: true,
                        valueType: "numeric",
                        logarithmBase: parameters.LogarithmicBaseYScale,
                        type: parameters.LogarithmicYScale ? "logarithmic" : "continuous",
                        tick: { visible: ticksAndLabelsVisible },
                        label: {
                            visible: ticksAndLabelsVisible,
                            font: {
                                family: parameters.YAxsisFontSettings.FontFamily,
                                size: parameters.YAxsisFontSettings.FontSize,
                                weight: fontWeightConverter(parameters.YAxsisFontSettings.FontWeight, true),
                                color: parameters.CurrentValueLabelForeground.Color
                            }
                        },
                        grid: { visible: ticksAndLabelsVisible }
                    }
                    if (!parameters.AutomaticGeneralScale)
                        vAxisObj.color = vAxisObj.tick["color"] = pens[i].color;
                    var min = 0;
                    var max = 0;
                    if (pens[i].isFullStackedType) {
                        var padding = parseFloat(parameters.ScalePaddingFactor) / 100;
                        min = -padding;
                        max = 1 + padding;
                    }
                    else if (!parameters.StaticSeriesSettings[i].authomaticscale && !parameters.AutomaticGeneralScale) {
                        min = parameters.StaticSeriesSettings[i].min;
                        max = parameters.StaticSeriesSettings[i].max;
                        vAxisObj["visualRangeUpdateMode"] = "keep";
                    }
                    else if (parameters.AutomaticGeneralScale) {
                        if (parseFloat(pens[i].minPlottedValue) < globalMin)
                            globalMin = parseFloat(pens[i].minPlottedValue);
                        if (parseFloat(pens[i].maxPlottedValue) > globalMax)
                            globalMax = parseFloat(pens[i].maxPlottedValue);
                    }
                    else {
                        min = pens[i].minPlottedValue;
                        max = pens[i].maxPlottedValue
                    }
                    if (pens[i].isFullStackedType || !parameters.AutomaticGeneralScale) {
                        vAxisObj["wholeRange"] = { startValue: min, endValue: max };
                        vAxisObj["visualRange"] = { startValue: min, endValue: max };
                        vAxisObj["name"] = pens[i].axis;
                        newValueAxes.push(vAxisObj);
                    }
                }
                if (parameters.AutomaticGeneralScale) {
                    for (var i = 0; i < pens.length; i++) {
                        newValueAxes.push({
                            allowDecimals: true,
                            valueType: "numeric",
                            logarithmBase: parameters.LogarithmicBaseYScale,
                            type: parameters.LogarithmicYScale ? "logarithmic" : "continuous",
                            name: pens[i].axis,
                            visualRangeUpdateMode: "keep",
                            visible: i == 0,
                            tick: { visible: i == 0 },
                            label: { visible: i == 0}
                            //wholeRange: { startValue: globalMin, endValue: globalMax },
                            //visualRange: { startValue: globalMin, endValue: globalMax }
                        });
                    }
                }
                chart.option("valueAxis", newValueAxes);
            }

            function checkUpdateAxesScales(index, newValue) {
                if (pens[index].isFullStackedType || (!parameters.StaticSeriesSettings[index].authomaticscale && !parameters.AutomaticGeneralScale))
                    return;

                var bLimitsChanged;
                if (newValue < pens[index].minPlottedValue) {
                    bLimitsChanged = true;
                    pens[index].minPlottedValue = newValue;
                }
                if (newValue > pens[index].maxPlottedValue) {
                    bLimitsChanged = true;
                    pens[index].maxPlottedValue = newValue;
                }
                if (bLimitsChanged)
                    updateAxesScales(index, pens[index].minPlottedValue, pens[index].maxPlottedValue)
            }

            function updateAxesScales(index, minValue, maxValue) {
                if (pens[index].isFullStackedType || (!parameters.StaticSeriesSettings[index].authomaticscale && !parameters.AutomaticGeneralScale))
                    return;

                var currentValueAxis = chart.option("valueAxis");
                if (!currentValueAxis[index])
                    return;

                if (minValue != Number.MIN_VALUE && maxValue != Number.MAX_VALUE) {
                    var padding = (maxValue - minValue) * parseFloat(parameters.ScalePaddingFactor) / 100;
                    var newAxisMin = minValue - padding;
                    var newAxisMax = maxValue + padding;
                    currentValueAxis[index]["wholeRange"] = { startValue: newAxisMin, endValue: newAxisMax };
                    currentValueAxis[index]["visualRange"] = { startValue: newAxisMin, endValue: newAxisMax };
                }
                chart.option("valueAxis", currentValueAxis);
            }
        }
    </script>
</div>

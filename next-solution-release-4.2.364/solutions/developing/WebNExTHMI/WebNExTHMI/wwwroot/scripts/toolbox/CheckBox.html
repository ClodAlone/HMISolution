<script src="scripts/toolbox/common/checkboxControl.js"></script>

<div id="CheckBox" class="CheckBox" xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">
    <img src="cl.gif" alt="" onload="onCheckBoxLoaded(this)" id="loadingImage" />

    <div id="normal" style="width:100%; height:100%;"></div>

    <script>
        function onCheckBoxLoaded(obj) {

            var thisPage = $(obj).parent();
            var webKitRenderCorrection = $(thisPage).hasClass("webKitRenderCorrection");
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            $(obj).remove();
            var thisParent = thisPage.parent();

            setOpacity(scope, thisParent, thisPage);

            var deregisterListeners = new Array();
            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
            });

            var parameters = JSON.parse(paratt);

            var buttoncontainer = thisPage.children().first();
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, buttoncontainer);

            var stylesEnablingRules = {
                "ON": function (val) {
                    return (!parameters.IsThreeState && (val === 'true' || val === '1')) || (parameters.IsThreeState && val === '1');
                },
                "OFF": function (val) {
                    return !parameters.IsThreeState || val === '0' || val === 'false';
                },
                "NULL": function (val) {
                    return parameters.StyleNULL !== "" && val === '2';
                }
            };

            var mutateFunc = function () {
                var styleData = scope.applyControlStyle(scope, thisParent, buttoncontainer, parameters);
                if (styleData.styleApplied) {
                    var drls = registerCheckboxValueHandlers(scope, thisParent, thisPage, parameters, styleData, stylesEnablingRules, webKitRenderCorrection);
                    deregisterListeners.push(...drls);

                    styleData.setStrokeAndFill(false);
                }
            };

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);
        }
    </script>
</div>

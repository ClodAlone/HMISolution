<script src="scripts/toolbox/common/animatedObject.js"></script>

<div id="FullAnimatedText" class="FullAnimatedText" xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">
    <img src="cl.gif" alt="" onload="onFullAnimatedTextLoaded(this)" id="loadingImage" />

    <div id="bgContainer" style="width:100%; height:100%;">
        <div id="textContainer" style="width:100%; height:100%;">
            <div id="animTextContainer" style="width:100%; height:100%;">
                <div id="animatedText" style="width:100%;"></div>
            </div>
        </div>
    </div>

    <script>
        function onFullAnimatedTextLoaded(obj) {
            var thisPage = $(obj).parent();
            thisPage.localize();

            var scope = thisPage.scope();
            if (!scope)
                return;
            var paratt = thisPage.data(dataparameters);
            if (!paratt)
                return;

            var imageInterval;
            var currentImageIndex = 0;
            var currentThreshold;
            var thisParent = thisPage.parent();
            $(obj).remove();

            var webKitRenderCorrection = thisPage.hasClass("webKitRenderCorrection");
            if (webKitRenderCorrection)
                thisPage.css("will-change", "opacity");

            setOpacity(scope, thisParent, thisPage);

            var deregisterListeners = new Array();

            $(thisPage).bind('destroyed', function () {
                deregisterListeners.forEach(function (item, index, array) {
                    item();
                });
                if (imageInterval) {
                    clearInterval(imageInterval);
                }
            });

            var parameters = JSON.parse(paratt);
            if (!parameters.ControlClipToBounds)
                thisParent.css("overflow", "visible");

            if (parameters.FontFamily)
                loadCustomFonts([parameters.FontFamily]);

            var verticalAlignment = parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? "top" : parameters.VerticalContentAlignment == 2 ? "bottom" : "center";
            var startOriginY = verticalAlignment == "top" ? 0 : verticalAlignment == "bottom" ? 100 : 50;
            var origin_x = (parameters.ControlRenderTransformOrigin._x * 100) + "%";
            var origin_y = startOriginY + (parameters.ControlRenderTransformOrigin._y * 100) + "%";
            var startingTextTransform = "translateY(" + (verticalAlignment == "top" ? 0 : verticalAlignment == "bottom" ? "-100%" : "-50%") + ")";

            var bgContainer = thisPage.find("#bgContainer");
            if (scope.biOS)
                webkitMoveRotateTransform(thisParent, thisPage, bgContainer);
            var textcontainer = thisPage.find("#textContainer");
            var animatedText = $(textcontainer).find("#animatedText");
            var animTextContainer = $(textcontainer).find("#animTextContainer");
            if (!parameters.ControlClipToBounds)
                animTextContainer.css("overflow", "hidden");
            var bStringContextTag = false;
            var animationKeyframeStyle;
            var defaultTextcontainerColor;

            var options = {
                "text-align": parameters.TextAlignment == 0 ? "left" : parameters.TextAlignment == 1 ? "right" : parameters.TextAlignment == 3 ? "justify" : "center"
            };
            if (parameters.FontFamily)
                options["font-family"] = parameters.FontFamily;
            if (parameters.FontSize)
                options["font-size"] = parameters.FontSize;
            if (parameters.Background) {
                defaultTextcontainerColor = parameters.Background.Color;
                if (defaultTextcontainerColor)
                    options["background"] = defaultTextcontainerColor;
                else if (parameters.BackImage || parameters.Background.Source) {
                    var bgOptions = {};
                    bgOptions["background"] = "url(\"" + sanitizedImageUrl(parameters.BackImage ? parameters.BackImage : parameters.Background.Source) + "\")";
                    bgOptions["image-rendering"] = "-webkit-optimize-contrast";
                    bgOptions["background-repeat"] = "no-repeat";
                    //bgOptions["background-position"] = "center center";
                    if (parameters.Stretch == 0) { // None
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 1) { // Fill
                        bgOptions["background-size"] = "100% 100%";
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 2) { // Uniform
                        bgOptions["background-size"] = "contain";
                        bgOptions["background-position"] = "center center";
                    }
                    if (parameters.Stretch == 3) { // UniformFill
                        bgOptions["background-size"] = "cover";
                        bgOptions["background-position"] = "left top";
                    }
                    bgContainer.css(bgOptions);
                }
            }
            if (parameters.Foreground)
                options["color"] = parameters.Foreground.Color;
            if (parameters.FontWeight)
                options["font-weight"] = fontWeightConverter(parameters.FontWeight);
            setObjectBorder(options, parameters);

            var textCssOpts = {
                "position": "relative",
                "top": parameters.VerticalContentAlignment == 0 || parameters.VerticalContentAlignment == 3 ? 0 : parameters.VerticalContentAlignment == 2 ? "100%" : "50%",
                "transform": startingTextTransform
            };
            switch (parameters.TextWrapping) {
                case 0: //wrap with overflow
                    textCssOpts["white-space"] = "break-spaces";
                    break;
                case 1: //nowrap
                    textCssOpts["white-space"] = "nowrap";
                    break;
                case 2: //wrap
                    textCssOpts["white-space"] = "break-spaces";
                    textCssOpts["overflow-wrap"] = "break-word";
                    break;
            }

            var animationList = {};
            var animationKeys = [];

            if (parameters.AnimationList.length > 0) {
                var minValue = Number.MAX_VALUE;
                var maxValue = Number.MIN_VALUE;
                $(parameters.AnimationList).each(function (i, e) {
                    var val = parseFloat(e.Value, 10);
                    if (val < minValue)
                        minValue = val;
                    if (val > maxValue)
                        maxValue = val;
                    animationList[e.Value] = e;
                    animationKeys.unshift(val);
                });
            }

            var mutateFunc = function () {
                $(textcontainer).css(options);

                $(animatedText).text(i18next.t1(parameters.DefaultText));
                $(animatedText).css(textCssOpts);

                if (parameters.AnimationTime > 0)
                    setAnimation(parameters.AnimationTime, parameters.TextAnimation, animatedText);

                if (animationKeys.length > 0) {
                    $(parameters.AnimationList).each(function (i, e) {
                        if (e.SVGReferenceId) {
                            var onDataChangedListener = scope.$on(onDataChanged + parameters.screenId + e.SVGReferenceId, function (ev, value) {
                                if (currentThreshold) {
                                    if (currentThreshold.SVGReferenceId != e.SVGReferenceId)
                                        return;

                                    onSettingValue = true;
                                    try {
                                        if (scope.dataValues[parameters.screenId][e.SVGReferenceId].isGood)
                                            $(animatedText).text(i18next.t1(scope.dataValues[parameters.screenId][currentThreshold.SVGReferenceId].invariantValue.toString()));
                                    }
                                    finally {
                                        onSettingValue = false;
                                    }
                                }
                            });
                            deregisterListeners.push(onDataChangedListener);
                        }
                    });
                }

                if (parameters.SVGReferenceId) {
                    applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                    if (parameters.screenId in scope.dataValues && parameters.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                        if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                            onDataContextChanged();
                    }
                    var onDataChangedListener = scope.$on(onDataChanged + parameters.screenId + parameters.SVGReferenceId, function (e, value) {
                        applyTagQualityStyle(webKitRenderCorrection ? thisPage : thisParent, scope, parameters.screenId, parameters.SVGReferenceId);
                        onSettingValue = true;
                        try {
                            if (scope.dataValues[parameters.screenId][parameters.SVGReferenceId].isGood)
                                onDataContextChanged();
                        }
                        finally {
                            onSettingValue = false;
                        }
                    });
                    deregisterListeners.push(onDataChangedListener);
                }

                var deregisterListenerActiveLanguage = animatedObject.onLanguageChanged(scope, parameters, animatedText, function () { return currentThreshold; }, function () { return bStringContextTag }, setTextToContextTag);
                deregisterListeners.push(deregisterListenerActiveLanguage);
            }

            mutateHandler.scheduleMutate(parameters.screenId, mutateFunc);

            function onDataContextChanged() {
                bStringContextTag = scope.dataValues[parameters.screenId][parameters.SVGReferenceId].bIsString;
                if (bStringContextTag) {
                    setTextToContextTag();
                    if (parameters.AnimationList.length > 0) {
                        setAnimatedText(parameters.AnimationList[0].Value, true);
                    }
                }
                else if (parameters.AnimationList.length > 0) {
                    setAnimatedText(normalizeDataValue(scope.dataValues[parameters.screenId][parameters.SVGReferenceId]).dataValue.toString());
                }
            }

            function setTextToContextTag() {
                try {
                    $(animatedText).text(i18next.t1(scope.dataValues[parameters.screenId][parameters.SVGReferenceId].invariantValue.toString()));
                }
                catch { }
            }

            function setAnimatedText(stringValue, bSkipText = false) {
                if (stringValue in animationList)
                    currentThreshold = animationList[stringValue];
                else {
                    currentThreshold = null;
                    var value = parseFloat(stringValue, 10);
                    if (value > maxValue)
                        currentThreshold = animationList[maxValue];
                    else if (value >= minValue) {
                        var nearestThreshold = animationKeys.find(function (item) { return item < value; });
                        if (nearestThreshold !== undefined)
                            currentThreshold = animationList[nearestThreshold];
                    }
                }
                if (imageInterval) {
                    clearInterval(imageInterval);
                    currentImageIndex = 0;
                }
                fastdom.mutate(function () {
                    $(textcontainer).css("background", defaultTextcontainerColor ? defaultTextcontainerColor : "none");
                });
                if (!currentThreshold) {
                    resetAnimatedText(value);
                    return;
                }
                if (!bSkipText) {
                    var thresholdText = currentThreshold.Text;
                    if (currentThreshold.SVGReferenceId) {
                        if (parameters.screenId in scope.dataValues && currentThreshold.SVGReferenceId in scope.dataValues[parameters.screenId]) {
                            if (scope.dataValues[parameters.screenId][currentThreshold.SVGReferenceId].isGood)
                                thresholdText = scope.dataValues[parameters.screenId][currentThreshold.SVGReferenceId].invariantValue.toString();
                        }
                    }
                    fastdom.mutate(function () {
                        $(animatedText).text(i18next.t1(thresholdText));
                    });
                }
                var options = {};
                var containerOptions = {};
                if (currentThreshold.Foreground && currentThreshold.Foreground.Color)
                    options["color"] = currentThreshold.Foreground.Color;

                if (currentThreshold.BackImageList.length > 0) {
                    containerOptions["background"] = "url(\"" + sanitizedImageUrl(currentThreshold.BackImageList[0].Value) + "\")";
                    containerOptions["background-repeat"] = "no-repeat";
                    containerOptions["image-rendering"] = "-webkit-optimize-contrast";
                    if (currentThreshold.ImageStretch == 0) { // None
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 1) { // Fill
                        containerOptions["background-size"] = "100% 100%";
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 2) { // Uniform
                        containerOptions["background-size"] = "contain";
                        containerOptions["background-position"] = "center center";
                    }
                    if (currentThreshold.ImageStretch == 3) { // UniformFill
                        containerOptions["background-size"] = "cover";
                        containerOptions["background-position"] = "left top";
                    }
                }
                if (currentThreshold.BackImageList.length > 1 && currentThreshold.AnimationTime > 0) { // Image animation
                    imageInterval = setInterval(
                        function () {
                            currentImageIndex = (currentImageIndex + 1) % currentThreshold.BackImageList.length;
                            containerOptions["background"] = "url(\"" + sanitizedImageUrl(currentThreshold.BackImageList[currentImageIndex].Value) + "\")";
                            fastdom.mutate(function () {
                                $(textcontainer).css(containerOptions);
                            });
                        }, currentThreshold.AnimationTime);
                }

                fastdom.mutate(function () {
                    $(animatedText).css(options);
                    $(textcontainer).css(containerOptions);
                });

                setAnimation(currentThreshold.AnimationTime, currentThreshold.Animation, animatedText);
            }

            function resetAnimatedText(value) {
                fastdom.mutate(function () {
                    $(animatedText).text(i18next.t1(parameters.DefaultText));
                    $(animatedText).css({
                        "color": parameters.Foreground.Color,
                        "animation": "none",
                        "transform": startingTextTransform
                    });
                    $(textcontainer).css({ "background": "none" });
                });
                if (value < minValue && parameters.AnimationTime > 0) {
                    setAnimation(parameters.AnimationTime, parameters.TextAnimation, animatedText);
                }
                else {
                    var animCss = { "animation": "", "transform": "none", "transform-origin": origin_x + " " + origin_y };
                    fastdom.mutate(function () {
                        $(animTextContainer).css(animCss);
                    });
                }
            }

            function setAnimation(animationTime, animationIndex, animatedText) {
                var animCss = { "animation": "", "transform": "none", "transform-origin": origin_x + " " + origin_y };

                if (animationTime > 0) {
                    switch (animationIndex) {
                        case 0: //none
                            break;
                        case 1: //leftright
                            var widthOverflow = $(animatedText)[0].scrollWidth - $(animatedText).width();
                            var widthPercentage = 100;
                            var keyFrame = '\
                                @keyframes leftright {\
                                    0% {\
                                        transform: translateX(-_WIDTHPERC_%);\
                                    }\
                                    100% {\
                                        transform: translateX(100%);\
                                    }\
                                }';
                            if (widthOverflow > 0)
                                widthPercentage = ($(animatedText)[0].scrollWidth / $(animatedText).width() * 100);

                            animCss["transform"] = "translateX(-" + widthPercentage + "%)";
                            animCss["animation"] = "leftright " + animationTime + "ms linear infinite";

                            if (animationKeyframeStyle)
                                document.head.removeChild(animationKeyframeStyle);
                            animationKeyframeStyle = document.createElement('style');
                            animationKeyframeStyle.type = 'text/css';
                            animationKeyframeStyle.innerHTML = keyFrame.replace(/_WIDTHPERC_/g, widthPercentage);
                            document.head.appendChild(animationKeyframeStyle);
                            break;
                        case 2: //rightleft
                            var widthOverflow = $(animatedText)[0].scrollWidth - $(animatedText).width();
                            var widthPercentage = 100;
                            var keyFrame = '\
                                @keyframes rightleft {\
                                    0% {\
                                        transform: translateX(100%);\
                                    }\
                                    100% {\
                                        transform: translateX(-_WIDTHPERC_%);\
                                    }\
                                }';
                            if (widthOverflow > 0)
                                widthPercentage = ($(animatedText)[0].scrollWidth / $(animatedText).width() * 100);

                            animCss["transform"] = "translateX(100%)";
                            animCss["animation"] = "rightleft " + animationTime + "ms linear infinite";

                            if (animationKeyframeStyle)
                                document.head.removeChild(animationKeyframeStyle);
                            animationKeyframeStyle = document.createElement('style');
                            animationKeyframeStyle.type = 'text/css';
                            animationKeyframeStyle.innerHTML = keyFrame.replace(/_WIDTHPERC_/g, widthPercentage);
                            document.head.appendChild(animationKeyframeStyle);
                            break;
                        case 3: //topbottom
                            animCss["transform"] = "translateY(0)";
                            animCss["animation"] = "topbottom " + animationTime + "ms linear infinite";
                            break;
                        case 4: //bottomtop
                            animCss["transform"] = "translateY(100%)";
                            animCss["animation"] = "bottomtop " + animationTime + "ms linear infinite";
                            break;
                        case 5: //rotateright
                            animCss["animation"] = "rotateright " + animationTime + "ms linear infinite";
                            break;
                        case 6: //rotateleft
                            animCss["animation"] = "rotateleft " + animationTime + "ms linear infinite";
                            break;
                        case 7: //blink
                            animCss["animation"] = "blink " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 8: //scalex
                            animCss["animation"] = "scaleX " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 9: //scaley
                            animCss["animation"] = "scaleY " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 10: //scalexy
                            animCss["animation"] = "scaleXY " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 11: //skewx
                            animCss["animation"] = "skewX " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 12: //skewy
                            animCss["animation"] = "skewY " + animationTime * 2 + "ms linear infinite";
                            break;
                        case 13: //skewxy
                            animCss["animation"] = "skewXY " + animationTime * 2 + "ms linear infinite";
                            break;
                    }
                }
                fastdom.mutate(function () {
                    $(animTextContainer).css(animCss);
                });
            }
        }
    </script>
</div>

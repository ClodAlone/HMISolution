<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96">
  <rect x="2" y="2" width="156" height="92" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="4" y="4" width="152" height="14" rx="2" fill="#e3f2fd"/>
  <text x="12" y="14" font-size="7" font-family="sans-serif" fill="#1565C0" font-weight="bold">Tag</text>
  <text x="60" y="14" font-size="7" font-family="sans-serif" fill="#1565C0" font-weight="bold">Value</text>
  <text x="105" y="14" font-size="7" font-family="sans-serif" fill="#1565C0" font-weight="bold">Status</text>
  <!-- Rows -->
  <line x1="4" y1="32" x2="156" y2="32" stroke="#eee" stroke-width="0.5"/>
  <text x="12" y="27" font-size="6" font-family="sans-serif" fill="#333">Temp_01</text>
  <text x="60" y="27" font-size="6" font-family="sans-serif" fill="#333">23.5 °C</text>
  <text x="105" y="27" font-size="6" font-family="sans-serif" fill="#4CAF50">● OK</text>
  <line x1="4" y1="46" x2="156" y2="46" stroke="#eee" stroke-width="0.5"/>
  <text x="12" y="41" font-size="6" font-family="sans-serif" fill="#333">Press_01</text>
  <text x="60" y="41" font-size="6" font-family="sans-serif" fill="#333">4.2 bar</text>
  <text x="105" y="41" font-size="6" font-family="sans-serif" fill="#4CAF50">● OK</text>
  <line x1="4" y1="60" x2="156" y2="60" stroke="#eee" stroke-width="0.5"/>
  <text x="12" y="55" font-size="6" font-family="sans-serif" fill="#333">Flow_01</text>
  <text x="60" y="55" font-size="6" font-family="sans-serif" fill="#333">12.8 l/m</text>
  <text x="105" y="55" font-size="6" font-family="sans-serif" fill="#f44336">● ALARM</text>
  <line x1="4" y1="74" x2="156" y2="74" stroke="#eee" stroke-width="0.5"/>
  <text x="12" y="69" font-size="6" font-family="sans-serif" fill="#333">Level_01</text>
  <text x="60" y="69" font-size="6" font-family="sans-serif" fill="#333">78 %</text>
  <text x="105" y="69" font-size="6" font-family="sans-serif" fill="#FF9800">● WARN</text>
  <text x="12" y="83" font-size="6" font-family="sans-serif" fill="#333">Motor_01</text>
  <text x="60" y="83" font-size="6" font-family="sans-serif" fill="#333">1480 RPM</text>
  <text x="105" y="83" font-size="6" font-family="sans-serif" fill="#4CAF50">● OK</text>
  <!-- Column separators -->
  <line x1="55" y1="4" x2="55" y2="94" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="100" y1="4" x2="100" y2="94" stroke="#e0e0e0" stroke-width="0.5"/>

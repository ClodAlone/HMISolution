  <line x1="25" y1="65" x2="150" y2="65" stroke="#1a2332" stroke-width="0.8"/>
  <line x1="25" y1="30" x2="150" y2="30" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="25" y1="48" x2="150" y2="48" stroke="#1a2332" stroke-width="0.5"/>
  <!-- Area fill -->
  <polygon points="28,50 40,44 55,48 70,35 85,38 100,28 115,32 130,24 148,30 148,65 28,65"

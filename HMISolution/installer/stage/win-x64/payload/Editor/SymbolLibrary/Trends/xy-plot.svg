            fill="none" stroke="#4af" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="145,55 140,58 130,60 120,55 110,50 100,48 90,52 75,56 60,58 45,60 35,55"
            fill="none" stroke="#4af" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,2"/>

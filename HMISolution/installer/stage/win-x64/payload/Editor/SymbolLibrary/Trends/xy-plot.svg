<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80">
  <rect x="2" y="2" width="156" height="76" rx="4" fill="#0d1117" stroke="#333" stroke-width="1.5"/>
  <!-- Grid -->
  <line x1="25" y1="15" x2="25" y2="65" stroke="#1a2332" stroke-width="0.8"/>
  <line x1="25" y1="65" x2="150" y2="65" stroke="#1a2332" stroke-width="0.8"/>
  <!-- XY plot axes labels -->
  <text x="88" y="74" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#888">Variable X</text>
  <text x="10" y="40" font-size="5" font-family="sans-serif" fill="#888" transform="rotate(-90,10,40)">Var Y</text>
  <!-- Scattered data forming a loop/pattern -->

# docker-compose.yml  –  Build & run HMI release images locally
# Usage:
#   docker compose build                     # build individual images
#   docker compose up -d                     # run individual containers
#   docker compose --profile allinone up -d  # run the all-in-one container
#   docker compose push                      # push to registry (after docker login)

services:

  server:
    image: ghcr.io/clodalone/hmi-server:${TAG:-latest}
    build:
      context: .
      dockerfile: Server/Dockerfile
    ports:
      - "14840:14840"
      - "14841:14841"
    volumes:
      - server-data:/data
    restart: unless-stopped

  servereditor:
    image: ghcr.io/clodalone/hmi-servereditor:${TAG:-latest}
    build:
      context: .
      dockerfile: ServerEditorWeb/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - editor-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  # All-in-One image (includes TimescaleDB, Ollama, ffmpeg, ONNX models)
  # Activate with:  docker compose --profile allinone up -d
  allinone:
    image: ghcr.io/clodalone/hmi-allinone:${TAG:-latest}
    profiles: ["allinone"]
    build:
      context: .
      dockerfile: Dockerfile.allinone
    ports:
      - "14840:14840"
      - "14841:14841"
      - "8080:8080"
      - "8081:8081"
      - "8088:8088"
      - "5432:5432"
      - "11434:11434"
    volumes:
      - allinone-data:/data
      - allinone-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=hmipass
      - OLLAMA_MODEL=mistral
    restart: unless-stopped

volumes:
  server-data:
  editor-data:
  allinone-data:
  allinone-pgdata:
